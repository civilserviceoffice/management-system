<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Space — Civil Service MIS</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function headGuard() {
  try {
    if (sessionStorage.getItem("loggedIn") !== "true" || !sessionStorage.getItem("uid")) {
      sessionStorage.clear();
      sessionStorage.setItem("__redirectReason", "expired");
      window.location.replace("../index.html");
    }
  } catch (e) { window.location.replace("../index.html"); }
})();
</script>
<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#0b5cab; --primary-dark:#073d75; --secondary:#0e7490;
  --text:#172033; --text-soft:#344054; --muted:#6b7280; --muted-light:#98a2b3;
  --border:#e5e7eb; --border-soft:#eef1f5; --white:#fff;
  --danger:#dc2626; --success:#067647; --warning:#b8860b; --bg:#f4f7fb; --bg-soft:#fbfcfe;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-sm:9px; --r-md:13px; --r-lg:20px; --r-full:999px;
  --sidebar-w:272px; --topbar-h:76px;
}
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; }
body {
  font-family:"Inter","Noto Sans Ethiopic",sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),
             var(--bg);
  color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body.ethiopic { font-family:"Noto Sans Ethiopic","Inter",sans-serif; }
img, svg { display:block; max-width:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { line-height:1.25; letter-spacing:-0.02em; font-weight:800; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }

.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main"; min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
body.sidebar-collapsed .app { grid-template-columns:88px 1fr; }

.sidebar { grid-area:sidebar; position:sticky; top:0; height:100vh; width:var(--sidebar-w);
  background:linear-gradient(145deg, #073d75 0%, #0b5cab 55%, #0e7490 100%);
  color:#fff; display:flex; flex-direction:column; overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1); z-index:30; }
body.sidebar-collapsed .sidebar { width:88px; }
.sidebar::before { content:""; position:absolute; width:450px; height:450px; border-radius:50%;
  border:1px solid rgba(255,255,255,.10); right:-220px; top:-150px; pointer-events:none; }
.sidebar::after { content:""; position:absolute; width:320px; height:320px; border-radius:50%;
  border:1px solid rgba(255,255,255,.08); left:-170px; bottom:-150px; pointer-events:none; }
.sidebar__brand { position:relative; z-index:2; display:flex; align-items:center; gap:14px;
  padding:22px; border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h); flex-shrink:0; }
.sidebar__logo { width:46px; height:46px; flex-shrink:0; border-radius:14px;
  background:rgba(255,255,255,.97); box-shadow:0 10px 24px rgba(0,0,0,.18);
  display:grid; place-items:center; padding:5px; }
.sidebar__logo img { width:100%; height:100%; object-fit:contain; border-radius:9px; }
.sidebar__identity { min-width:0; flex:1; opacity:1; transition:opacity .18s ease 60ms; white-space:nowrap; overflow:hidden; }
body.sidebar-collapsed .sidebar__identity { opacity:0; pointer-events:none; }
.sidebar__title { font-size:16px; font-weight:800; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; }
.sidebar__subtitle { font-size:11px; opacity:.72; margin-top:3px; overflow:hidden; text-overflow:ellipsis; }
.sidebar__collapse { position:absolute; right:-13px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; background:#fff; color:var(--primary-dark);
  border:3px solid var(--bg); display:grid; place-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15); z-index:10; cursor:pointer; }
.sidebar__collapse:hover { background:#f0f6ff; }
.sidebar__collapse svg { width:13px; height:13px; stroke:currentColor; stroke-width:2.5;
  fill:none; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s; }
body.sidebar-collapsed .sidebar__collapse svg { transform:rotate(180deg); }
.sidebar__nav { position:relative; z-index:2; flex:1; padding:20px 14px; overflow-y:auto; overflow-x:hidden; }
.sidebar__nav::-webkit-scrollbar { width:5px; }
.sidebar__nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:3px; }
.sidebar__section { font-size:10.5px; font-weight:800; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.45);
  padding:18px 12px 8px; white-space:nowrap; overflow:hidden; transition:all .2s ease; }
.sidebar__section:first-child { padding-top:4px; }
body.sidebar-collapsed .sidebar__section { height:6px; padding:0; opacity:0; margin-top:14px; margin-bottom:6px; }
.nav-item { display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:12px;
  font-size:14px; font-weight:600; color:rgba(255,255,255,.78);
  margin-bottom:3px; transition:background .15s, color .15s;
  white-space:nowrap; cursor:pointer; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.09); color:#fff; }
.nav-item.is-active { background:rgba(255,255,255,.16); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.nav-item.is-active::before { content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:24px; border-radius:0 4px 4px 0;
  background:#58e6a7; box-shadow:0 0 12px rgba(88,230,167,.6); }
.nav-item svg { width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:1.85; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.nav-item__label { flex:1; overflow:hidden; text-overflow:ellipsis; transition:opacity .15s; }
body.sidebar-collapsed .nav-item__label { opacity:0; pointer-events:none; }
body.sidebar-collapsed .nav-item { justify-content:center; padding:12px; }
body.sidebar-collapsed .nav-item:hover::after { content:attr(data-tooltip);
  position:absolute; left:calc(100% + 16px); top:50%; transform:translateY(-50%);
  background:var(--text); color:#fff; padding:7px 12px; border-radius:8px;
  font-size:12px; font-weight:600; white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2); z-index:100; pointer-events:none; animation:fadeIn .12s ease; }
body.sidebar-collapsed .nav-item.is-active::before { left:0; height:28px; border-radius:0 4px 4px 0; }
@keyframes fadeIn { from { opacity:0; transform:translate(-4px,-50%); } to { opacity:1; transform:translate(0,-50%); } }
.sidebar__footer { position:relative; z-index:2; padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.10);
  font-size:11px; color:rgba(255,255,255,.55);
  text-align:center; line-height:1.5; white-space:nowrap; overflow:hidden; }
.sidebar__footer div { transition:opacity .15s; }
body.sidebar-collapsed .sidebar__footer { padding:16px 8px; }
body.sidebar-collapsed .sidebar__footer div { opacity:0; height:0; overflow:hidden; }
body.sidebar-collapsed .sidebar__footer::after { content:"©"; display:block; font-size:18px; color:rgba(255,255,255,.5); line-height:1; }

.topbar { grid-area:topbar; background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 28px;
  position:sticky; top:0; z-index:20; }
.topbar__menu { display:none; width:42px; height:42px; border-radius:12px; color:var(--text);
  align-items:center; justify-content:center; cursor:pointer; }
.topbar__menu:hover { background:var(--border-soft); }
.topbar__spacer { flex:1; }
.topbar__actions { display:flex; align-items:center; gap:8px; }
.icon-btn { width:44px; height:44px; border-radius:13px; display:inline-flex;
  align-items:center; justify-content:center; color:var(--text-soft);
  transition:background .15s; position:relative; cursor:pointer; }
.icon-btn:hover { background:var(--border-soft); }
.icon-btn svg { width:20px; height:20px; stroke:currentColor; stroke-width:1.85; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn__dot { position:absolute; top:10px; right:10px; width:9px; height:9px; border-radius:50%;
  background:var(--danger); border:2px solid #fff; }
.user-btn { display:flex; align-items:center; gap:11px;
  padding:4px 14px 4px 4px; border-radius:var(--r-full);
  background:var(--border-soft); cursor:pointer; transition:background .15s; }
.user-btn:hover { background:#e4e9f1; }
.user-btn__avatar { width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; font-weight:800; font-size:13px;
  display:grid; place-items:center; box-shadow:0 6px 14px rgba(11,92,171,.25); }
.user-btn__meta { text-align:left; line-height:1.2; }
.user-btn__name { font-size:13px; font-weight:700; display:block; }
.user-btn__role { font-size:11px; color:var(--muted); text-transform:capitalize; font-weight:600; }
.dropdown { position:relative; }
.dropdown__panel { position:absolute; right:0; top:calc(100% + 12px);
  background:#fff; border:1px solid var(--border); border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12); min-width:260px; padding:8px; z-index:50; }
.dropdown__header { padding:12px 14px; border-bottom:1px solid var(--border-soft); margin-bottom:6px; }
.dropdown__header strong { display:block; font-size:14px; font-weight:700; }
.dropdown__header span { font-size:12px; color:var(--muted); }
.dropdown__item { display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 14px; border-radius:10px; font-size:14px; font-weight:500;
  color:var(--text-soft); text-align:left; cursor:pointer; }
.dropdown__item:hover { background:var(--border-soft); color:var(--text); }
.dropdown__item svg { width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none; }
.dropdown__divider { height:1px; background:var(--border-soft); margin:6px 0; }
.dropdown__item--danger { color:var(--danger); }

.main { grid-area:main; padding:32px; overflow-x:hidden; }
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
.page-head__title { font-size:32px; font-weight:800; letter-spacing:-1.2px; margin-bottom:6px; }
.page-head__sub { font-size:15px; color:var(--muted); }
.page-head__actions { display:flex; gap:10px; flex-wrap:wrap; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px;
  height:46px; padding:0 20px; border-radius:13px;
  border:1px solid #d9dee7; background:#fff;
  color:var(--text-soft); font-size:14px; font-weight:700;
  white-space:nowrap; cursor:pointer; transition:all .15s; }
.btn:hover { background:var(--bg-soft); border-color:#b9c7d9; }
.btn svg { width:17px; height:17px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.btn--primary { background:linear-gradient(135deg, #0b5cab, #0e7490); border:none; color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22); }
.btn--primary:hover { background:linear-gradient(135deg, #073d75, #0b5cab); transform:translateY(-1px); }
.btn--sm { height:40px; padding:0 16px; font-size:13px; border-radius:11px; }

/* Profile header card */
.profile-card {
  position:relative; overflow:hidden;
  background:linear-gradient(135deg, #0b5cab, #0e7490);
  border-radius:var(--r-lg); padding:32px;
  color:#fff; margin-bottom:24px;
  box-shadow:0 12px 32px rgba(11,92,171,.25);
}
.profile-card::before {
  content:""; position:absolute; width:400px; height:400px; border-radius:50%;
  border:1px solid rgba(255,255,255,.12); right:-180px; top:-180px;
}
.profile-card::after {
  content:""; position:absolute; width:280px; height:280px; border-radius:50%;
  border:1px solid rgba(255,255,255,.08); left:-140px; bottom:-140px;
}
.profile-card__inner {
  position:relative; z-index:2;
  display:flex; align-items:center; gap:24px; flex-wrap:wrap;
}
.profile-card__avatar {
  width:96px; height:96px; border-radius:50%;
  background:rgba(255,255,255,.15);
  border:3px solid rgba(255,255,255,.35);
  color:#fff; font-weight:800; font-size:32px;
  display:grid; place-items:center; flex-shrink:0;
  backdrop-filter:blur(6px);
}
.profile-card__main { flex:1; min-width:0; }
.profile-card__name {
  font-size:28px; font-weight:800; letter-spacing:-1px; line-height:1.15; margin-bottom:6px;
}
.profile-card__meta {
  display:flex; flex-wrap:wrap; gap:16px 24px; margin-top:12px;
  font-size:13.5px; color:rgba(255,255,255,.85);
}
.profile-card__meta-item { display:flex; align-items:center; gap:8px; }
.profile-card__meta-item svg {
  width:15px; height:15px; stroke:rgba(255,255,255,.85);
  stroke-width:2; fill:none; flex-shrink:0;
  stroke-linecap:round; stroke-linejoin:round;
}
.profile-card__badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.profile-card__badge {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:var(--r-full);
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.25);
  font-size:11.5px; font-weight:800;
  letter-spacing:.02em; text-transform:uppercase;
}
.profile-card__id {
  position:absolute; right:24px; top:24px; z-index:2;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.25);
  padding:8px 16px; border-radius:12px;
  font-size:12px; font-weight:700;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:.5px;
}

/* Stats */
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:24px; }
.stat { position:relative; background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); padding:20px; box-shadow:var(--sh-sm);
  overflow:hidden; transition:box-shadow .2s, transform .2s; }
.stat:hover { box-shadow:var(--sh-lg); transform:translateY(-3px); }
.stat::before { content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--c1, var(--primary)); border-radius:var(--r-lg) var(--r-lg) 0 0; }
.stat--blue    { --c1:linear-gradient(90deg, #0b5cab, #0e7490); --ic:#eaf3fc; --ifc:#0b5cab; }
.stat--green   { --c1:linear-gradient(90deg, #19a974, #34c78e); --ic:#e7f7f0; --ifc:#128a5c; }
.stat--gold    { --c1:linear-gradient(90deg, #d4a017, #e8b84b); --ic:#fdf5e0; --ifc:#b8860b; }
.stat--red     { --c1:linear-gradient(90deg, #dc2626, #e74c5c); --ic:#fef3f2; --ifc:#b42318; }
.stat--teal    { --c1:linear-gradient(90deg, #0e7490, #4dd4c4); --ic:#e0f5f7; --ifc:#0e7490; }
.stat--purple  { --c1:linear-gradient(90deg, #6d28d9, #a78bfa); --ic:#f0eaff; --ifc:#5b21b6; }
.stat__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.stat__label { font-size:12.5px; color:var(--muted); font-weight:600; }
.stat__icon { width:42px; height:42px; border-radius:12px; background:var(--ic); color:var(--ifc);
  display:grid; place-items:center; flex-shrink:0; }
.stat__icon svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.stat__value { font-size:28px; font-weight:800; letter-spacing:-1px; line-height:1; }
.stat__value.loading { color:transparent;
  background:linear-gradient(90deg, #eef1f5 25%, #f8fafc 50%, #eef1f5 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
  border-radius:8px; width:50%; min-height:28px; }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
.stat__delta { font-size:11.5px; color:var(--muted); margin-top:8px; }

/* Grids */
.grid-2 { display:grid; grid-template-columns:1.5fr 1fr; gap:22px; margin-bottom:24px; }
.grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:24px; }
@media (max-width:1100px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }

.card { background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--sh-sm); overflow:hidden; }
.card__head { display:flex; align-items:center; justify-content:space-between;
  padding:22px 24px; border-bottom:1px solid var(--border-soft); gap:16px; flex-wrap:wrap; }
.card__title { font-size:16px; font-weight:800; letter-spacing:-.3px; }
.card__sub { font-size:12.5px; color:var(--muted); margin-top:3px; }
.card__body { padding:24px; }
.card__body--flush { padding:0; }

/* Leave balance */
.balance-card {
  background:#fff; border:1px solid var(--border); border-radius:var(--r-lg);
  padding:22px; box-shadow:var(--sh-sm); position:relative; overflow:hidden;
}
.balance-card__label { font-size:12.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--muted); margin-bottom:12px; }
.balance-card__value {
  font-size:34px; font-weight:800; letter-spacing:-1.2px; line-height:1;
  margin-bottom:6px;
}
.balance-card__value span { font-size:16px; color:var(--muted); font-weight:600; margin-left:4px; }
.balance-card__bar {
  height:6px; background:var(--border-soft); border-radius:999px;
  overflow:hidden; margin-top:14px;
}
.balance-card__bar-fill {
  height:100%; background:linear-gradient(90deg, #0b5cab, #0e7490);
  border-radius:999px; transition:width .6s ease;
}
.balance-card--gold .balance-card__bar-fill { background:linear-gradient(90deg, #d4a017, #e8b84b); }
.balance-card--rose .balance-card__bar-fill { background:linear-gradient(90deg, #dc2626, #e74c5c); }
.balance-card--green .balance-card__bar-fill { background:linear-gradient(90deg, #19a974, #34c78e); }
.balance-card__meta { font-size:12px; color:var(--muted); margin-top:10px; }

/* List */
.list { list-style:none; }
.list__item { display:flex; align-items:center; gap:14px;
  padding:15px 24px; border-bottom:1px solid var(--border-soft); }
.list__item:last-child { border-bottom:none; }
.list__item:hover { background:var(--bg-soft); }
.list__icon {
  width:42px; height:42px; border-radius:12px;
  display:grid; place-items:center; flex-shrink:0;
}
.list__icon svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.list__icon--green { background:#ecfdf3; color:#067647; }
.list__icon--gold  { background:#fdf5e0; color:#b8860b; }
.list__icon--red   { background:#fef3f2; color:#b42318; }
.list__icon--blue  { background:#eaf3fc; color:#0b5cab; }
.list__icon--gray  { background:var(--border-soft); color:var(--text-soft); }
.list__main { flex:1; min-width:0; }
.list__title { font-weight:700; font-size:14px; }
.list__meta { font-size:12.5px; color:var(--muted); margin-top:2px; }
.list-empty { padding:40px 24px; text-align:center; color:var(--muted); font-size:13.5px; }
.list-empty svg { width:42px; height:42px; margin:0 auto 12px; stroke:#cbd5e1; stroke-width:1.5; fill:none; }

.tag { display:inline-flex; align-items:center; gap:5px;
  padding:4px 11px; border-radius:var(--r-full);
  font-size:11.5px; font-weight:800;
  letter-spacing:.01em; text-transform:uppercase; }
.tag--green { background:#ecfdf3; color:#067647; }
.tag--red { background:#fef3f2; color:#b42318; }
.tag--gold { background:#fdf5e0; color:#b8860b; }
.tag--blue { background:#eaf3fc; color:#0b5cab; }
.tag--gray { background:var(--border-soft); color:var(--text-soft); }

/* Payslip card */
.payslip-card {
  background:linear-gradient(135deg, #f8fbff, #fff);
  border:1px solid var(--border); border-radius:var(--r-lg);
  padding:24px; box-shadow:var(--sh-sm);
}
.payslip-card__period {
  font-size:12.5px; color:var(--muted); font-weight:700;
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;
}
.payslip-card__amount {
  font-size:38px; font-weight:800; letter-spacing:-1.4px; line-height:1;
  color:var(--text); margin-bottom:8px;
}
.payslip-card__amount span { font-size:16px; color:var(--muted); font-weight:600; margin-left:6px; }
.payslip-card__rows { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
.payslip-card__row {
  display:flex; justify-content:space-between; font-size:13.5px;
  padding:8px 0; border-bottom:1px solid var(--border-soft);
}
.payslip-card__row:last-child { border-bottom:none; }
.payslip-card__row strong { font-weight:700; }
.payslip-card__row--total { padding-top:14px; margin-top:6px; border-top:2px solid var(--border-soft); }
.payslip-card__row--total span:last-child { color:var(--primary-dark); font-size:16px; }

/* Quick actions */
.quick { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; }
.quick__item {

}
.quick__item:hover { border-color:#bdd7f2; transform:translateY(-3px); box-shadow:var(--sh-md); }
.quick__icon {
  width:44px; height:44px; border-radius:12px;

}
.quick__icon svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.quick__label { font-size:13px; font-weight:700; }

/* Overlay */
.overlay { display:none; position:fixed; inset:0; background:rgba(13,21,32,.45); z-index:25; }
body.sidebar-open .overlay { display:block; }

/* Notice banner */
.notice {
  display:flex; gap:14px; padding:16px 20px;

  background:linear-gradient(135deg, #eaf3fc, #fff);
  border:1px solid #bdd7f2; color:var(--primary-dark);

}
.notice svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2;
  fill:none; flex-shrink:0; margin-top:2px;
  stroke-linecap:round; stroke-linejoin:round; }
.notice strong { font-weight:800; }

@media (max-width:900px) {

    transform:translateX(-100%); transition:transform .28s; z-index:40; }

  body.sidebar-collapsed .nav-item__label { opacity:1; pointer-events:auto; }
  body.sidebar-collapsed .nav-item { justify-content:flex-start; padding:11px 13px; }
  body.sidebar-collapsed .sidebar__section { height:auto; padding:18px 12px 8px; opacity:1; }
  body.sidebar-collapsed .sidebar__footer div { opacity:1; height:auto; }
  body.sidebar-collapsed .sidebar__footer::after { display:none; }
  .sidebar__collapse { display:none; }
  .topbar__menu { display:inline-flex; }
  .user-btn__meta { display:none; }
  .user-btn { padding:4px; }
  .main { padding:20px; }
  .page-head__title { font-size:26px; letter-spacing:-1px; }

  .stat { padding:16px; }

  .profile-card__id { position:static; display:inline-block; margin-top:12px; }
}
@media (max-width:520px) {
  .page-head__actions { width:100%; }

}

const app = initializeApp({

const auth = getAuth(app);

/* ============================================================
   GUARD
   ============================================================ */
const INDEX_URL = "../index.html";
let GUARD_PASSED = false;

function kick(reason) {
  if (kick.done) return;
  kick.done = true;
  console.warn("[guard] blocked:", reason);
  try {
    sessionStorage.clear();
    if (reason === "expired") sessionStorage.setItem("__redirectReason", "expired");
  } catch (e) {}
  signOut(auth).catch(() => {}).finally(() => window.location.replace(INDEX_URL));
  setTimeout(() => window.location.replace(INDEX_URL), 800);
}
(function preCheck() {
  let ok = false;
  try { ok = sessionStorage.getItem("loggedIn") === "true" && !!sessionStorage.getItem("uid"); } catch (e) {}
  if (!ok) kick("no-session");
})();
window.addEventListener("storage", (e) => { if (e.key === "loggedIn" && e.newValue !== "true") kick("cross-tab"); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (kick.done) return;
  if (!auth.currentUser || sessionStorage.getItem("loggedIn") !== "true") kick("hidden-expired");
});
setInterval(() => { if (kick.done) return; if (!auth.currentUser) kick("heartbeat"); }, 60000);
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("#logout-btn");
  if (!btn) return;
  e.preventDefault();
  try { sessionStorage.clear(); } catch (err) {}
  try { await signOut(auth); } catch (err) {}
  window.location.replace(INDEX_URL);
});

/* ============================================================

/* ============================================================
   NAV — employee sees only personal items
   ============================================================ */
const NAV = [
  { section:"My Work", items:[
    { key:"my-space",   label:"My Space",      href:"my-space.html",   icon:"grid",      active:true },
    { key:"attendance", label:"My Attendance", href:"attendance.html", icon:"clock" },

];

const initials = (n) => (n || "?").split(/\s+/).slice(0,2).map((s) => s[0]).join("").toUpperCase();
const roleLabel = (r) => (r || "").replace(/_/g," ").replace(/\b\w/g, (c) => c.toUpperCase());
const escapeHtml = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fullName = (e) => [e.firstName, e.middleName, e.lastName].filter(Boolean).join(" ") || e.email || e.empId || "Employee";

/* ============================================================
   RENDER — SIDEBAR / USER
   ============================================================ */
function renderSidebar() {
  const nav = document.getElementById("sidebar-nav");
  nav.innerHTML = "";
  for (const group of NAV) {
    const sec = document.createElement("div");
    sec.className = "sidebar__section";
    sec.textContent = group.section;
    nav.appendChild(sec);
    for (const item of group.items) {
      const a = document.createElement("a");
      a.className = "nav-item" + (item.active ? " is-active" : "");
      a.href = item.href;
      a.setAttribute("data-tooltip", item.label);
      a.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[item.icon]}</svg>
                     <span class="nav-item__label">${item.label}</span>`;
      nav.appendChild(a);
    }
  }
}

function renderUser() {
  document.getElementById("user-avatar").textContent = initials(S.name);
  document.getElementById("user-name").textContent = S.name;
  document.getElementById("user-role").textContent = roleLabel(S.role);
  document.getElementById("dd-name").textContent = S.name;
  document.getElementById("dd-email").textContent = S.email;
}

/* ============================================================
   HELPERS
   ============================================================ */
function today() { return new Date().toISOString().slice(0,10); }
function thisMonth() { return new Date().toISOString().slice(0,7); }
function thisYear() { return new Date().getFullYear(); }

function formatDate(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
}

function formatTime(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d)) return "—";
  return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
}

function formatMoney(n, currency = "ETB") {
  if (n == null || isNaN(n)) return "—";
  return new Intl.NumberFormat("en-ET", { style:"currency", currency, minimumFractionDigits:2 }).format(n);
}

async function count(q) {
  try {
    const snap = await getCountFromServer(q);
    return snap.data().count;
  } catch (e) { console.warn("[count]", e.code, e.message); return 0; }
}

/* ============================================================
   DATA LOADERS — all scoped to this employee
   ============================================================ */
async function loadMonthStats() {
  const set = (id, v) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("loading");
    el.textContent = v;
  };
  const empId = S.empId;
  if (!empId) {
    set("s-present", "—"); set("s-late", "—"); set("s-absent", "—"); set("s-leave", "—");
    return;
  }

  const month = thisMonth();
  const base = collection(db, "attendance", month, "records");

  try {
    const [p, l, a, lv] = await Promise.all([
      count(query(base, where("empId", "==", empId), where("status", "in", ["present","field"]))),
      count(query(base, where("empId", "==", empId), where("status", "==", "late"))),
      count(query(base, where("empId", "==", empId), where("status", "==", "absent"))),
      count(query(base, where("empId", "==", empId), where("status", "==", "leave")))
    ]);
    set("s-present", p);
    set("s-late", l);
    set("s-absent", a);
    set("s-leave", lv);
  } catch (e) {
    console.warn("[month stats]", e.code, e.message);
    set("s-present", 0); set("s-late", 0); set("s-absent", 0); set("s-leave", 0);
  }
}

async function loadLeaveBalance() {
  const empId = S.empId;
  const year = thisYear();
  const docId = empId + "_" + year;

  const setBalance = (prefix, data) => {
    const el = document.getElementById(prefix);
    const barEl = document.getElementById("bar-" + prefix.split("-")[1]);
    const metaEl = document.getElementById("meta-" + prefix.split("-")[1]);
    if (!el) return;
    el.classList.remove("loading");
    const remaining = data?.remaining ?? 0;
    const entitled = data?.entitled ?? 0;
    el.innerHTML = `${remaining}<span>/ ${entitled} days</span>`;
    const pct = entitled > 0 ? Math.min(100, Math.round(((entitled - remaining) / entitled) * 100)) : 0;
    if (barEl) barEl.style.width = pct + "%";
    if (metaEl) metaEl.textContent = `${data?.used ?? 0} used · ${data?.carriedOver ?? 0} carried over`;
  };

  try {
    const snap = await getDoc(doc(db, "leave", "balances", docId));
    if (snap.exists()) {
      const d = snap.data();
      setBalance("b-annual", d.annual || {});
      setBalance("b-sick",   d.sick   || {});
      setBalance("b-mat",    d.maternity || d.paternity || {});
    } else {
      // Fallback defaults so the UI is never empty
      setBalance("b-annual", { entitled: 20, used: 0, carriedOver: 0, remaining: 20 });
      setBalance("b-sick",   { entitled: 14, used: 0, carriedOver: 0, remaining: 14 });
      setBalance("b-mat",    { entitled: 120, used: 0, carriedOver: 0, remaining: 120 });
    }
  } catch (e) {
    console.warn("[leave balance]", e.code, e.message);
    // don't leave UI blank
    setBalance("b-annual", { entitled: 20, used: 0, remaining: 20 });
    setBalance("b-sick",   { entitled: 14, used: 0, remaining: 14 });
    setBalance("b-mat",    { entitled: 120, used: 0, remaining: 120 });
  }
}

async function loadLeaveRequests() {
  const host = document.getElementById("leave-list");
  const empId = S.empId;
  if (!empId) {
    host.innerHTML = `<li class="list-empty">No employee record linked.</li>`;
    return;
  }
  try {
    const q = query(
      collection(db, "leaveRequests"),
      where("empId", "==", empId),
      orderBy("appliedAt", "desc"),
      limit(5)
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      host.innerHTML = `
        <li class="list-empty">
          <svg viewBox="0 0 24 24">${ICONS.inbox}</svg>
          <div>You haven't submitted any leave requests yet.</div>
        </li>`;
      return;
    }
    const statusIcon = {
      pending: "clock", approved: "check", rejected: "x", cancelled: "x"
    };
    const statusClass = {
      pending: "list__icon--gold", approved: "list__icon--green",
      rejected: "list__icon--red", cancelled: "list__icon--gray"
    };
    host.innerHTML = snap.docs.map((d) => {
      const r = d.data();
      const status = r.status || "pending";
      return `
        <li class="list__item">
          <div class="list__icon ${statusClass[status] || "list__icon--gray"}">
            <svg viewBox="0 0 24 24">${ICONS[statusIcon[status] || "clock"]}</svg>
          </div>
          <div class="list__main">
            <div class="list__title">${escapeHtml(r.typeId || r.type || "Leave")}</div>
            <div class="list__meta">
              ${r.days || "—"} days · ${escapeHtml(r.from || "—")} → ${escapeHtml(r.to || "—")}
              · applied ${formatDate(r.appliedAt)}
            </div>
          </div>
          <span class="tag tag--${status === "approved" ? "green" : status === "rejected" ? "red" : "gold"}">
            ${escapeHtml(status)}
          </span>
        </li>
      `;
    }).join("");
  } catch (e) {
    console.warn("[my leave]", e.code, e.message);
    host.innerHTML = `<li class="list-empty">Could not load leave requests.</li>`;
  }
}

async function loadLatestPayslip() {
  const periodEl = document.getElementById("payslip-period");
  const bodyEl = document.getElementById("payslip-body");
  const empId = S.empId;
  if (!empId) {
    bodyEl.innerHTML = `<div class="list-empty" style="padding:20px 0">No employee record linked.</div>`;
    return;
  }

  // Try the current month first, then last 3 months
  const months = [];
  const d = new Date();
  for (let i = 0; i < 4; i++) {
    const dd = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push(dd.toISOString().slice(0,7));
  }

  let found = null;
  for (const m of months) {
    try {
      const snap = await getDoc(doc(db, "payroll", m, "slips", empId));
      if (snap.exists()) { found = { month: m, data: snap.data() }; break; }
    } catch (e) { /* try next */ }
  }

  if (!found) {
    if (periodEl) periodEl.textContent = "No payslip yet";
    bodyEl.innerHTML = `
      <div class="list-empty" style="padding:24px 0">
        <svg viewBox="0 0 24 24">${ICONS.wallet}</svg>
        <div>No payslip has been issued to you yet.</div>
      </div>`;
    return;
  }

  const d2 = found.data;
  if (periodEl) periodEl.textContent = found.month;

  bodyEl.innerHTML = `
    <div class="payslip-card">
      <div class="payslip-card__period">${escapeHtml(found.month)}</div>
      <div class="payslip-card__amount">
        ${formatMoney(d2.net || 0)}<span>net</span>
      </div>
      <div class="payslip-card__rows">
        <div class="payslip-card__row">
          <span>Basic</span>
          <strong>${formatMoney(d2.basic || 0)}</strong>
        </div>
        <div class="payslip-card__row">
          <span>Allowances</span>
          <strong>${formatMoney(
            (d2.allowances?.housing || 0) +
            (d2.allowances?.transport || 0) +
            (d2.allowances?.hardship || 0)
          )}</strong>
        </div>
        <div class="payslip-card__row">
          <span>Overtime</span>
          <strong>${formatMoney(d2.overtime || 0)}</strong>
        </div>
        <div class="payslip-card__row">
          <span>Gross</span>
          <strong>${formatMoney(d2.gross || 0)}</strong>
        </div>
        <div class="payslip-card__row">
          <span>Deductions</span>
          <strong style="color:var(--danger)">− ${formatMoney(
            (d2.deductions?.tax || 0) +
            (d2.deductions?.pension || 0) +
            (d2.deductions?.loan || 0) +
            (d2.deductions?.union || 0)
          )}</strong>
        </div>
        <div class="payslip-card__row payslip-card__row--total">
          <span>Net</span>
          <span><strong>${formatMoney(d2.net || 0)}</strong></span>
        </div>
      </div>
    </div>
  `;
}

async function loadAttendance() {
  const host = document.getElementById("attendance-list");
  const empId = S.empId;
  if (!empId) {
    host.innerHTML = `<li class="list-empty">No employee record linked.</li>`;
    return;
  }
  const month = thisMonth();
  try {
    const q = query(
      collection(db, "attendance", month, "records"),
      where("empId", "==", empId),
      orderBy("date", "desc"),
      limit(7)
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      host.innerHTML = `
        <li class="list-empty">
          <svg viewBox="0 0 24 24">${ICONS.inbox}</svg>
          <div>No attendance records this month yet.</div>
        </li>`;
      return;
    }
    const statusIcon = { present:"check", late:"clock", absent:"x", leave:"calendar", holiday:"sun" };
    const statusClass = {
      present:"list__icon--green", late:"list__icon--gold", absent:"list__icon--red",
      leave:"list__icon--blue", holiday:"list__icon--gray"
    };
    host.innerHTML = snap.docs.map((d) => {
      const r = d.data();
      const status = r.status || "present";
      return `
        <li class="list__item">
          <div class="list__icon ${statusClass[status] || "list__icon--gray"}">
            <svg viewBox="0 0 24 24">${ICONS[statusIcon[status] || "check"]}</svg>
          </div>
          <div class="list__main">
            <div class="list__title">${escapeHtml(formatDate(r.date ? new Date(r.date) : null))}</div>
            <div class="list__meta">
              ${r.checkIn ? "In " + formatTime(r.checkIn) : "—"}
              ${r.checkOut ? " · Out " + formatTime(r.checkOut) : ""}
              ${r.minutesLate ? " · " + r.minutesLate + " min late" : ""}
            </div>
          </div>
          <span class="tag tag--${status === "present" ? "green" : status === "late" ? "gold" : status === "absent" ? "red" : "blue"}">
            ${escapeHtml(status)}
          </span>
        </li>
      `;
    }).join("");
  } catch (e) {
    console.warn("[attendance]", e.code, e.message);
    host.innerHTML = `<li class="list-empty">Could not load attendance.</li>`;
  }
}

async function loadNotificationDot() {
  const uid = S.uid;
  try {
    const n = await count(query(
      collection(db, "notifications"),
      where("userId", "==", uid),
      where("read", "==", false)
    ));
    const dot = document.getElementById("notif-dot");
    if (n > 0) dot.classList.remove("hidden");
    else dot.classList.add("hidden");
  } catch (e) { /* silent */ }
}

/* ============================================================

document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.getElementById("sidebar-nav").addEventListener("click", (e) => {
  if (e.target.closest(".nav-item")) document.body.classList.remove("sidebar-open");
});
document.querySelectorAll("[data-dropdown-toggle]").forEach((btn) => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach((p) => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () => {
  document.querySelectorAll("[data-dropdown-panel]").forEach((p) => p.classList.add("hidden"));
});
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") {
    document.body.classList.add("sidebar-collapsed");
  }
} catch (e) {}

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (err) {
    console.warn("[boot]", err.code, err.message);
  }

  /* Load the linked employee document */
  let emp = null;
  if (userDoc?.employeeId) {
    try {
      const es = await getDoc(doc(db, "employees", userDoc.employeeId));
      if (es.exists()) emp = { id: es.id, ...es.data() };
    } catch (e) { console.warn("[boot] employee fetch", e.code, e.message); }
  }
  MY = emp || {};

  /* If the user role is not employee, redirect them to their proper landing page */
  const role = userDoc?.role || "employee";
  if (role !== "employee") {
    // Only employees see this page. Managers/admins/super admins get the dashboard.
    window.location.replace("dashboard.html");
    return;
  }

  S = {
    uid: user.uid,
    role,
    email: user.email || "",
    name: userDoc?.name || emp ? fullName(emp) : user.email?.split("@")[0] || "Employee",
    empId: userDoc?.empId || emp?.empId || "",
    employeeId: userDoc?.employeeId || "",
    officeId: userDoc?.officeId || emp?.officeId || "",
    clusterId: userDoc?.clusterId || emp?.clusterId || ""
  };

  console.log("[my-space] session:", S, "employee:", MY);

  GUARD_PASSED = true;

  renderSidebar();
  renderUser();
  renderPage();

  // Show a notice if their profile is not linked
  const hasEmp = !!MY.id || !!S.empId;
  if (!hasEmp) {
    document.getElementById("main").insertAdjacentHTML("afterbegin", `
      <div class="notice" style="background:linear-gradient(135deg,#fdf5e0,#fff);border-color:#f0dcb0;color:#7a5210">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <strong>Your account is not yet linked to an employee record.</strong>
          Some widgets will show defaults until your administrator links your employee profile.
          Contact your cluster administrator for help.
        </div>
      </div>
    `);
  }

  await Promise.allSettled([
    loadMonthStats(),
    loadLeaveBalance(),
    loadLeaveRequests(),
    loadLatestPayslip(),
    loadAttendance(),
    loadNotificationDot()
  ]);

  console.log("[my-space] data loaded");
});

console.log("[my-space] booted");
</script>
