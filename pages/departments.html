            <div class="field">
              <label class="field__required">Maqaa akaakayyuu</label>
              <input data-field="lastNameOm" value="${escapeHtml(d2.lastNameOm||"")}" placeholder="Baqqalaa">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__required">Gender</label>
              <select data-field="gender">
                <option value="">— Select —</option>
                <option value="M" ${d2.gender==="M"?"selected":""}>Male</option>
                <option value="F" ${d2.gender==="F"?"selected":""}>Female</option>
              </select>
            </div>
            <div class="field">
              <label class="field__required">Date of birth</label>
              <input data-field="dob" type="date" value="${escapeHtml(d2.dob||"")}">
            </div>
          </div>

          <div class="field">
            <label class="field__required">National ID</label>
            <input id="nat-id" data-field="nationalId" value="${escapeHtml(d2.nationalId||"")}"
                   placeholder="ET-1234-5678-90" autocomplete="off" style="font-family:ui-monospace,monospace">
            <p class="field__hint">Must be unique across the entire system.</p>
          </div>
        `,
        validate: (d2) => {
          if (!d2._photo) return "Please upload a profile photo.";
          if (!d2.firstName || d2.firstName.trim().length < 2) return "First name (English) is required.";
          if (!d2.lastName  || d2.lastName.trim().length  < 2) return "Last name (English) is required.";
          if (!d2.firstNameAm || d2.firstNameAm.trim().length < 2) return "Amharic first name is required.";
          if (!d2.lastNameAm  || d2.lastNameAm.trim().length  < 2) return "Amharic last name is required.";
          if (!d2.firstNameOm || d2.firstNameOm.trim().length < 2) return "Oromo first name is required.";
          if (!d2.lastNameOm  || d2.lastNameOm.trim().length  < 2) return "Oromo last name is required.";
          if (!d2.gender) return "Please select a gender.";
          if (!d2.dob)    return "Date of birth is required.";
          const nid = normalizeNationalId(d2.nationalId || "");
          if (!nid || nid.length < 5) return "National ID is required (at least 5 characters).";
          const st = duplicateStatus.nationalId;
          if (!st.ok) {
            if (st.reason === "duplicate") return "This National ID is already registered to another employee.";
            if (st.reason === "too-short") return "National ID looks too short.";
            return "Please wait — checking National ID.";
          }
          return null;
        },
        after: (root, data) => {
          const circle = root.querySelector("#photo-circle");
          const input = root.querySelector("#photo-input");
          const preview = root.querySelector("#photo-preview");
          const initialsEl = root.querySelector("#photo-initials");
          const updateInitials = () => {
            const s = [data.firstName, data.lastName].filter(Boolean).join(" ") || "?";
            initialsEl.textContent = initials(s);
          };
          circle.addEventListener("click", ()=>input.click());
          input.addEventListener("change", async ()=>{
            const f = input.files?.[0];
            if (!f) return;
            if (f.size > 3*1024*1024) { toast("Photo must be under 3 MB", "error"); return; }
            try {
              const dataURL = await fileToDataURL(f);
              data._photo = dataURL;
              preview.src = dataURL;
              circle.classList.add("has-img");
            } catch(e) { toast("Could not read image", "error"); }
          });
          ["firstName","lastName"].forEach(k => {
            const el = root.querySelector(`[data-field="${k}"]`);
            el?.addEventListener("input", ()=>{ data[k] = el.value; updateInitials(); });
          });
          updateInitials();
          setupLiveDuplicate(root, "nat-id", "nationalId", "National ID", (type,status)=>{
            duplicateStatus[type] = status;
          });
        }
      },

      /* 2. CONTACT */
      {
        label: "Contact",
        title: "Contact details",
        render: (d2) => `
          <div class="field-row">
            <div class="field">
              <label class="field__required">Primary phone</label>
              <input id="phone-primary" data-field="phone" value="${escapeHtml(d2.phone||"")}"
                     placeholder="+251 9XX XX XX XX" autocomplete="off">
              <p class="field__hint">Must be unique across the system.</p>
            </div>
            <div class="field">
              <label>Alternate phone</label>
              <input data-field="phoneAlt" value="${escapeHtml(d2.phoneAlt||"")}" placeholder="+251 1XX XX XX XX">
            </div>
          </div>
          <div class="field">
            <label class="field__required">Personal email</label>
            <input data-field="email" type="email" value="${escapeHtml(d2.email||"")}" placeholder="name@example.com">
          </div>
          <div class="field">
            <label class="field__required">Country</label>
            <select data-field="country">
              <option value="ET" ${d2.country==="ET"?"selected":""}>Ethiopia</option>
              <option value="ER" ${d2.country==="ER"?"selected":""}>Eritrea</option>
              <option value="DJ" ${d2.country==="DJ"?"selected":""}>Djibouti</option>
              <option value="SO" ${d2.country==="SO"?"selected":""}>Somalia</option>
              <option value="KE" ${d2.country==="KE"?"selected":""}>Kenya</option>
            </select>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Sub-city / Zone</label>
              <input data-field="subCity" value="${escapeHtml(d2.subCity||"")}" placeholder="Bole">
            </div>
            <div class="field">
              <label>Kebele / Ward</label>
              <input data-field="kebele" value="${escapeHtml(d2.kebele||"")}" placeholder="03">
            </div>
          </div>
        `,
        validate: (d2) => {
          if (!d2.phone) return "Primary phone is required.";
          if (!/^[0-9+\-\s]{7,20}$/.test(d2.phone)) return "Enter a valid phone number.";
          const st = duplicateStatus.phone;
          if (!st.ok) {
            if (st.reason === "duplicate") return "This phone is already registered.";
            if (st.reason === "too-short") return "Phone looks too short.";
            return "Please wait — checking phone.";
          }
          if (!d2.email || !/^\S+@\S+\.\S+$/.test(d2.email)) return "Enter a valid email.";
          return null;
        },
        after: (root, data)=>{
          setupLiveDuplicate(root, "phone-primary", "phone", "phone number", (type,status)=>{
            duplicateStatus[type] = status;
          });
        }
      },

      /* 3. POSITION */
      {
        label: "Position",
        title: "Position & role",
        render: (d2) => `
          <div class="field-row">
            <div class="field">
              <label class="field__required">Position</label>
              <input data-field="position" value="${escapeHtml(d2.position||"")}" placeholder="Accountant">
            </div>
            <div class="field">
              <label>Grade</label>
              <input data-field="grade" value="${escapeHtml(d2.grade||"")}" placeholder="III">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field__required">Hire date</label>
              <input data-field="hireDate" type="date" value="${escapeHtml(d2.hireDate || new Date().toISOString().slice(0,10))}">
            </div>
            <div class="field">
              <label>Employment type</label>
              <select data-field="employmentType">
                <option value="permanent">Permanent</option>
                <option value="contract">Contract</option>
                <option value="temporary">Temporary</option>
                <option value="intern">Intern</option>
              </select>
            </div>
          </div>
          <div class="review">
            <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(cluster.regionCode))}</span></div>
            <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(cluster.name)} (${escapeHtml(cluster.code||"??")})</span></div>
            <div class="review__row"><span class="review__k">Office</span><span class="review__v">${escapeHtml(office.name)} (${escapeHtml(office.code||"??")})</span></div>
            <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(d.name)} (${escapeHtml(d.code)})</span></div>
          </div>`,
        validate: d2 => {
          if (!d2.position || d2.position.trim().length < 2) return "Position is required.";
          if (!d2.hireDate) return "Hire date is required.";
          return null;
        }
      },

      /* 4. LOGIN */
      {
        label: "Login",
        title: "Login credentials",
        render: (d2) => `
          <div class="field">
            <label class="field__required">Login email</label>
            <input data-field="loginEmail" type="email" value="${escapeHtml(d2.loginEmail || d2.email || "")}"
                   placeholder="name@example.com" autocomplete="off">
            <p class="field__hint">This becomes the username they sign in with.</p>
          </div>
          <div class="field">
            <label class="field__required">Password</label>
            <div class="pw-wrap">
              <input data-field="password" id="pw-new" type="password" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="pw-toggle" data-toggle="pw-new">
                <svg viewBox="0 0 24 24">${ICONS.eye}</svg>
              </button>
            </div>
            <div class="pw-meter" id="pw-meter">
              <div class="pw-meter__bars">
                <div class="pw-meter__bar" data-bar="1"></div>
                <div class="pw-meter__bar" data-bar="2"></div>
                <div class="pw-meter__bar" data-bar="3"></div>
                <div class="pw-meter__bar" data-bar="4"></div>
              </div>
              <div class="pw-meter__text" id="pw-meter-text">Enter a password</div>
            </div>
            <div class="pw-rules" id="pw-rules">
              <div class="pw-rule" data-rule="length"><span class="pw-rule__dot"></span><span>At least 8 characters</span></div>
              <div class="pw-rule" data-rule="upper"><span class="pw-rule__dot"></span><span>One uppercase</span></div>
              <div class="pw-rule" data-rule="lower"><span class="pw-rule__dot"></span><span>One lowercase</span></div>
              <div class="pw-rule" data-rule="number"><span class="pw-rule__dot"></span><span>One number</span></div>
              <div class="pw-rule" data-rule="symbol"><span class="pw-rule__dot"></span><span>One symbol</span></div>
            </div>
          </div>
          <div class="field">
            <label class="field__required">Confirm password</label>
            <input data-field="password2" id="pw-confirm" type="password" placeholder="Repeat">
            <p class="field__hint" id="pw-match-hint"></p>
          </div>
        `,
        validate: (d2) => {
          if (!d2.loginEmail || !/^\S+@\S+\.\S+$/.test(d2.loginEmail)) return "Enter a valid login email.";
          const pw = evaluatePassword(d2.password || "");
          if (pw.score < 3) return "Password is too weak.";
          if (d2.password !== d2.password2) return "Passwords do not match.";
          return null;
        },
        after: (root, data) => {
          const pwIn  = root.querySelector("#pw-new");
          const cfm   = root.querySelector("#pw-confirm");
          const meter = root.querySelector("#pw-meter");
          const mTxt  = root.querySelector("#pw-meter-text");
          function renderMeter() {
            const { checks, score, label, klass } = evaluatePassword(pwIn.value);
            meter.querySelectorAll(".pw-meter__bar").forEach(bar => {
              const idx = Number(bar.dataset.bar);
              bar.className = "pw-meter__bar";
              if (idx <= score) bar.classList.add("is-on-" + klass);
            });
            mTxt.textContent = label;
            mTxt.className = "pw-meter__text " + klass;
            root.querySelectorAll(".pw-rule").forEach(rule => {
              rule.classList.toggle("is-ok", !!checks[rule.dataset.rule]);
            });
          }
          function checkMatch() {
            const hint = root.querySelector("#pw-match-hint");
            if (!cfm.value) { hint.textContent = ""; return; }
            if (pwIn.value === cfm.value) { hint.textContent = "✓ Passwords match"; hint.style.color = "#067647"; }
            else { hint.textContent = "✗ Passwords do not match"; hint.style.color = "#dc2626"; }
          }
          pwIn.addEventListener("input", ()=>{ data.password = pwIn.value; renderMeter(); checkMatch(); });
          cfm.addEventListener("input", ()=>{ data.password2 = cfm.value; checkMatch(); });
          root.querySelectorAll(".pw-toggle").forEach(btn => {
            btn.addEventListener("click", ()=>{
              const input = root.querySelector("#" + btn.dataset.toggle);
              const showing = input.type === "text";
              input.type = showing ? "password" : "text";
              btn.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
            });
          });
        }
      },

      /* 5. REVIEW */
      {
        label: "Review",
        title: "Confirm and create",
        render: (d2) => `
          <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px;
                      background:var(--bg-soft);border:1px solid var(--border);border-radius:14px">
            <div class="admin-avatar" style="width:70px;height:70px;font-size:24px">
              ${d2._photo ? `<img src="${d2._photo}" alt="">` : escapeHtml(initials([d2.firstName,d2.lastName].filter(Boolean).join(" ")))}
            </div>
            <div style="min-width:0">
              <div style="font-size:17px;font-weight:800">${escapeHtml([d2.firstName, d2.middleName, d2.lastName].filter(Boolean).join(" "))}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d2.firstNameAm||"")} ${escapeHtml(d2.lastNameAm||"")}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d2.firstNameOm||"")} ${escapeHtml(d2.lastNameOm||"")}</div>
            </div>
          </div>
          <div class="review">
            <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d2.nationalId||"—")}</span></div>
            <div class="review__row"><span class="review__k">Phone</span><span class="review__v">${escapeHtml(d2.phone||"—")}</span></div>
            <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(d2.position||"—")}</span></div>
            <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(d.name)} (${escapeHtml(d.code)})</span></div>
            <div class="review__row"><span class="review__k">Login email</span><span class="review__v">${escapeHtml(d2.loginEmail)}</span></div>
          </div>
          <div class="alert alert--info" style="margin-top:16px">
            <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
            <div>Creates a Firebase Auth account, a <code>users</code> doc with role <strong>employee</strong>, and an <code>employees</code> doc assigned to <strong>${escapeHtml(d.name)}</strong>.</div>
          </div>`
      }
    ],
    onFinish: async (data) => {
      const nameEn = [data.firstName, data.middleName, data.lastName].filter(Boolean).map(s=>s.trim()).join(" ");
      const nameAm = [data.firstNameAm, data.middleNameAm, data.lastNameAm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const nameOm = [data.firstNameOm, data.middleNameOm, data.lastNameOm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const natIdNorm = normalizeNationalId(data.nationalId);
      const phoneNorm = normalizePhone(data.phone);

      const dupNat = await findEmployeeByNationalId(data.nationalId);
      if (dupNat) throw new Error(`National ID is already registered to ${dupNat.nameEn || dupNat.firstName || "another employee"}.`);
      const dupPhone = await findEmployeeByPhone(data.phone);
      if (dupPhone) throw new Error(`Phone is already registered to ${dupPhone.nameEn || dupPhone.firstName || "another employee"}.`);

      const firstWoreda = d.woredaCode || "00";
      const { empId, seq } = await generateEmployeeId({
        regionCode: cluster.regionCode,
        clusterCode: cluster.code,
        woredaCode: firstWoreda,
        officeCode: office.code
      });

      // 1. Auth
      const secName = "empCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, data.loginEmail.trim(), data.password);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: nameEn }); } catch(e) {}
        await signOut(secAuth);
      } finally {
        try { await deleteApp(secApp); } catch(e) {}
      }
      if (!uid) throw new Error("Could not create login account.");

      // 2. Uniqueness
      let natLocked=false, phoneLocked=false;
      try {
        await reserveUnique("nationalId", data.nationalId, natIdNorm, empId, nameEn);
        natLocked = true;
        await reserveUnique("phone", data.phone, phoneNorm, empId, nameEn);
        phoneLocked = true;
      } catch (err) {
        if (natLocked)   await releaseUnique("nationalId", natIdNorm);
        if (phoneLocked) await releaseUnique("phone", phoneNorm);
        throw err;
      }

      // 3. Employee record
      const empRef = doc(collection(db, "employees"));
      try {
        await setDoc(empRef, {
          empId, seq,
          firstName: data.firstName.trim(),
          middleName: data.middleName?.trim() || null,
          lastName: data.lastName.trim(),
          firstNameAm: data.firstNameAm.trim(),
          middleNameAm: data.middleNameAm?.trim() || null,
          lastNameAm: data.lastNameAm.trim(),
          firstNameOm: data.firstNameOm.trim(),
          middleNameOm: data.middleNameOm?.trim() || null,
          lastNameOm: data.lastNameOm.trim(),
          nameEn, nameAm, nameOm,
          fullName: nameEn,
          photoURL: data._photo,
          nationalId: data.nationalId.trim(),
          nationalIdNorm: natIdNorm,
          gender: data.gender,
          dob: data.dob,
          phone: data.phone.trim(),
          phoneNorm,
          phoneAlt: data.phoneAlt?.trim() || null,
          email: data.email.trim(),
          loginEmail: data.loginEmail.trim(),
          country: data.country || "ET",
          subCity: data.subCity?.trim() || null,
          kebele: data.kebele?.trim() || null,
          position: data.position.trim(),
          grade: data.grade?.trim() || null,
          hireDate: data.hireDate,
          employmentType: data.employmentType || "permanent",
          status: "active",
          regionCode: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterCode: cluster.code, clusterName: cluster.name,
          woredaCode: firstWoreda, woredaName: null,
          officeId: office.id, officeCode: office.code, officeName: office.name,
          departmentId: d.id, departmentName: d.name, departmentCode: d.code,
          uid,
          active: true,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (err) {
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }

      // 4. User record
      try {
        await setDoc(doc(db, "users", uid), {
          uid,
          email: data.loginEmail.trim(),
          name: nameEn,
          photoURL: data._photo,
          role: "employee",
          phone: data.phone.trim(),
          personalEmail: data.email.trim(),
          nationalId: data.nationalId.trim(),
          region: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterName: cluster.name,
          officeId: office.id, officeName: office.name,
          departmentId: d.id, departmentName: d.name,
          employeeId: empRef.id,
          empId,
          active: true,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (err) {
        try { await deleteDoc(empRef); } catch(e) {}
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }
    }
  });
}

/* ============================================================
   MANAGE MEMBERS (assign existing)
   ============================================================ */
function openManageEmployeesModal(deptId) {
  const d = DEPARTMENTS.find(x => x.id === deptId);
  if (!d) return;
  if (!canManageDepartmentEmployees(d)) { toast("You cannot manage members here", "error"); return; }

  const officeEmps = EMPLOYEES
    .filter(e => e.officeId === d.officeId)
    .sort((a,b)=>String(fullName(a)).localeCompare(String(fullName(b))));

  const currentIds = new Set(EMPLOYEES.filter(e => e.departmentId === d.id).map(e => e.id));
  const takenElsewhere = new Set();
  EMPLOYEES.forEach(e => {
    if (e.officeId === d.officeId && e.departmentId && e.departmentId !== d.id) takenElsewhere.add(e.id);
  });

  let selected = new Set(currentIds);

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Manage Members</div>
        <div class="modal__sub">${escapeHtml(d.name)} · ${escapeHtml(d.officeName)}</div>
      </div>
      <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>Click to assign or remove. Only employees from this office can be assigned. One department per employee.</div>
      </div>
      <div class="field">
        <label>Search</label>
        <input id="me-search" placeholder="Search by name, ID or position…">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px">
        <strong style="font-size:13px">Employees in this office (${officeEmps.length})</strong>
        <span id="me-count" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div class="wm-list" id="me-list"></div>
    </div>
    <div class="modal__foot">
      <div class="spacer"></div>
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="me-submit">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save Assignment</span>
      </button>
    </div>
  `, { size:"lg" });

  const listEl = document.getElementById("me-list");
  const searchEl = document.getElementById("me-search");
  const countEl = document.getElementById("me-count");
  const submitBtn = document.getElementById("me-submit");

  function renderList() {
    const q = searchEl.value.trim().toLowerCase();
    const list = q
      ? officeEmps.filter(e => {
          const hay = [fullName(e), e.empId, e.position, e.email].filter(Boolean).join(" ").toLowerCase();
          return hay.includes(q);
        })
      : officeEmps;
    countEl.textContent = `${selected.size} selected`;

    if (!list.length) {
      listEl.innerHTML = `<div class="wm-empty">${q?"No matches":"No employees in this office yet."}</div>`;
      return;
    }
    listEl.innerHTML = list.map(e => {
      const on = selected.has(e.id);
      const elsewhere = takenElsewhere.has(e.id) && !currentIds.has(e.id);
      const name = fullName(e);
      return `
        <div class="emp-pick-item ${on?"is-on":""}" data-id="${e.id}" ${elsewhere?'style="opacity:.5"':""}>
          <div class="admin-avatar">
            ${e.photoURL ? `<img src="${escapeHtml(e.photoURL)}" alt="">` : escapeHtml(initials(name))}
          </div>
          <div class="emp-pick-item__main">
            <div class="emp-pick-item__name">${escapeHtml(name)}</div>
            <div class="emp-pick-item__meta">
              ${escapeHtml(e.empId||"")}${e.position?" · "+escapeHtml(e.position):""}
              ${elsewhere?` · <span style="color:#b45309;font-weight:700">in another department</span>`:""}
            </div>
          </div>
          <div class="emp-pick-radio"></div>
        </div>`;
    }).join("");

    listEl.querySelectorAll(".emp-pick-item").forEach(el => {
      const id = el.dataset.id;
      const elsewhere = takenElsewhere.has(id) && !currentIds.has(id);
      el.addEventListener("click", ()=>{
        if (elsewhere) { toast("Already in another department.", "error"); return; }
        if (selected.has(id)) selected.delete(id);
        else selected.add(id);
        renderList();
      });
    });
  }
  searchEl.addEventListener("input", renderList);
  renderList();

  submitBtn.addEventListener("click", async ()=>{
    const spinner = submitBtn.querySelector(".spinner");
    const label = submitBtn.querySelector(".btn-label");
    submitBtn.disabled = true;
    spinner.classList.remove("hidden");
    const old = label.textContent;
    label.textContent = "Saving…";
    try {
      const before = new Set(currentIds);
      const after = new Set(selected);
      const toAdd = [...after].filter(id => !before.has(id));
      const toRemove = [...before].filter(id => !after.has(id));
      const writes = [];
      toAdd.forEach(id => writes.push(updateDoc(doc(db, "employees", id), {
        departmentId: d.id, departmentName: d.name, departmentCode: d.code,
        updatedAt: serverTimestamp()
      })));
      toRemove.forEach(id => writes.push(updateDoc(doc(db, "employees", id), {
        departmentId: null, departmentName: null, departmentCode: null,
        updatedAt: serverTimestamp()
      })));
      await Promise.all(writes);
      toast(`Assigned ${selected.size} member(s) to ${d.name}`, "success");
      closeModal();
    } catch (err) {
      console.error(err);
      toast(err.code + ": " + err.message, "error");
      submitBtn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = old;
    }
  });
}

/* ============================================================
   VIEW DEPARTMENT
   ============================================================ */
function openViewDepartment(deptId) {
  const d = DEPARTMENTS.find(x => x.id === deptId);
  if (!d) return;
  const emps = employeesByDepartment[d.id] || [];
  const head = d.headEmployeeId ? EMPLOYEES.find(e => e.id === d.headEmployeeId) : null;
  const headAvatar = head ? (head.photoURL
    ? `<img src="${escapeHtml(head.photoURL)}" alt="">`
    : escapeHtml(initials(fullName(head)))) : null;

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">${escapeHtml(d.name)}</div>
        <div class="modal__sub">${escapeHtml(d.officeName)} · code ${escapeHtml(d.code||"??")}</div>
      </div>
      <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="review">
        <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(d.regionCode))}</span></div>
        <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(d.clusterName||"—")} (${escapeHtml(d.clusterCode||"??")})</span></div>
        <div class="review__row"><span class="review__k">Office</span><span class="review__v">${escapeHtml(d.officeName||"—")} (${escapeHtml(d.officeCode||"??")})</span></div>
        <div class="review__row"><span class="review__k">Head</span>
          <span class="review__v">${head
            ? `<span style="display:flex;align-items:center;gap:8px">
                 <span class="admin-avatar" style="width:28px;height:28px;font-size:11px">${headAvatar}</span>
                 ${escapeHtml(fullName(head))}
               </span>`
            : "—"}</span>
        </div>
        <div class="review__row"><span class="review__k">Members</span><span class="review__v">${emps.length}</span></div>
        <div class="review__row"><span class="review__k">Status</span><span class="review__v">${d.active===false?"Inactive":"Active"}</span></div>
      </div>

      ${d.description ? `
        <div style="margin-top:16px;padding:14px 16px;background:var(--bg-soft);
                    border:1px solid var(--border);border-radius:12px;
                    font-size:13.5px;line-height:1.6;color:var(--text-soft)">
          ${escapeHtml(d.description)}
        </div>` : ""}

      ${emps.length ? `
        <div style="margin-top:20px">
          <div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
                      color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border-soft);
                      margin-bottom:10px">Members (${emps.length})</div>
          ${emps.slice(0, 20).map(e => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)">
              <div class="admin-avatar">
                ${e.photoURL ? `<img src="${escapeHtml(e.photoURL)}" alt="">` : escapeHtml(initials(fullName(e)))}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:13.5px">${escapeHtml(fullName(e))}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
                  ${escapeHtml(e.empId||"")} · ${escapeHtml(e.position||"—")}
                </div>
              </div>
              ${d.headEmployeeId === e.id ? `<span class="tag tag--gold">Head</span>` : ""}
            </div>`).join("")}
          ${emps.length > 20 ? `<div style="text-align:center;font-size:12.5px;color:var(--muted);padding-top:10px">+ ${emps.length - 20} more</div>` : ""}
        </div>` : ""}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${canAddEmployeeTo(d) ? `
        <button class="btn btn--primary" id="view-add-emp">
          <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg> Add Person
        </button>` : ""}
      ${canManageDepartmentEmployees(d) ? `
        <button class="btn" id="view-manage-emps">
          <svg viewBox="0 0 24 24">${ICONS.users}</svg> Manage Members
        </button>` : ""}
    </div>
  `);

  document.getElementById("view-add-emp")?.addEventListener("click", ()=>{
    closeModal();
    setTimeout(()=>openAddPersonWizard(deptId), 100);
  });
  document.getElementById("view-manage-emps")?.addEventListener("click", ()=>{
    closeModal();
    setTimeout(()=>openManageEmployeesModal(deptId), 100);
  });
}

/* ============================================================
   DELETE
   ============================================================ */
function confirmDeleteDepartment(deptId) {
  const d = DEPARTMENTS.find(x => x.id === deptId);
  if (!d) return;
  if (!canDeleteDepartment(d)) { toast("You cannot delete this department", "error"); return; }

  const emps = employeesByDepartment[d.id] || [];
  if (emps.length) { toast(`Cannot delete — ${emps.length} member(s) still assigned.`, "error"); return; }

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Delete department?</div>
        <div class="modal__sub">This cannot be undone</div>
      </div>
      <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to delete:</div>
          <div style="font-size:15px;font-weight:700">${escapeHtml(d.name)} (${escapeHtml(d.code||"??")})</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(d.officeName||"")}</div>
        </div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--danger" id="confirm-del">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Delete department</span>
      </button>
    </div>
  `);

  document.getElementById("confirm-del").addEventListener("click", async ()=>{
    const btn = document.getElementById("confirm-del");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");
    btn.disabled = true;
    spinner.classList.remove("hidden");
    const old = label.textContent;
    label.textContent = "Deleting…";
    try {
      await deleteDoc(doc(db, "departments", deptId));
      toast("Department deleted", "success");
      closeModal();
    } catch (err) {
      toast(err.code + ": " + err.message, "error");
      btn.disabled = false;
      spinner.classList.remove("hidden");
      label.textContent = old;
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function rebuildIndexes() {
  Object.keys(departmentsByOffice).forEach(k => delete departmentsByOffice[k]);
  Object.keys(employeesByDepartment).forEach(k => delete employeesByDepartment[k]);
  Object.keys(employeesByCluster).forEach(k => delete employeesByCluster[k]);
  Object.keys(usersByUid).forEach(k => delete usersByUid[k]);
  Object.keys(employeesByUid).forEach(k => delete employeesByUid[k]);

  DEPARTMENTS.forEach(d => {
    if (!departmentsByOffice[d.officeId]) departmentsByOffice[d.officeId] = [];
    departmentsByOffice[d.officeId].push(d);
  });
  EMPLOYEES.forEach(e => {
    if (e.departmentId) {
      if (!employeesByDepartment[e.departmentId]) employeesByDepartment[e.departmentId] = [];
      employeesByDepartment[e.departmentId].push(e);
    }
    if (e.clusterId) {
      if (!employeesByCluster[e.clusterId]) employeesByCluster[e.clusterId] = [];
      employeesByCluster[e.clusterId].push(e);
    }
    if (e.uid) employeesByUid[e.uid] = e;
  });
  USERS.forEach(u => { usersByUid[u.id] = u; });
}
function subscribeRegions() {
  if (unsubRegions) unsubRegions();
  unsubRegions = onSnapshot(collection(db, "regions"), (snap)=>{
    customRegions = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err)=>console.warn("[regions]", err.code));
}
function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (!isSuper() && !isHRM() && S.clusterId) q = query(q, where("clusterId","==",S.clusterId));
  unsubClusters = onSnapshot(q, (snap)=>{
    CLUSTERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, (err)=>console.warn("[clusters]", err.code));
}
function subscribeOffices() {
  if (unsubOffices) unsubOffices();
  let q = collection(db, "offices");
  if (!isSuper() && !isHRM() && S.clusterId) q = query(q, where("clusterId","==",S.clusterId));
  unsubOffices = onSnapshot(q, (snap)=>{
    OFFICES = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, (err)=>console.warn("[offices]", err.code));
}
function subscribeDepartments() {
  if (unsubDepartments) unsubDepartments();
  let q = collection(db, "departments");
  if (!isSuper() && !isHRM() && S.clusterId) q = query(q, where("clusterId","==",S.clusterId));
  unsubDepartments = onSnapshot(q, (snap)=>{
    DEPARTMENTS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, (err)=>{
    console.warn("[departments]", err.code);
    document.getElementById("dept-grid").innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <h3>${escapeHtml(err.code)}</h3>
        <p>${escapeHtml(err.message)}</p>
      </div>`;
  });
}
function subscribeEmployees() {
  if (unsubEmployees) unsubEmployees();
  let q = collection(db, "employees");
  if (!isSuper() && !isHRM() && S.clusterId) q = query(q, where("clusterId","==",S.clusterId));
  unsubEmployees = onSnapshot(q, (snap)=>{
    EMPLOYEES = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, (err)=>console.warn("[employees]", err.code));
}
function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  let q = collection(db, "users");
  if (!isSuper() && !isHRM() && S.clusterId) q = query(q, where("clusterId","==",S.clusterId));
  unsubUsers = onSnapshot(q, (snap)=>{
    USERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));

/* ============================================================
   SHELL
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e)=>{
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch(err) {}
});
document.getElementById("menu-toggle").addEventListener("click", ()=>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", ()=>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", ()=>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch(e) {}

window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
  if (STATE.theme === "auto") applyTheme("auto");
});

/* Filters */
let searchTimer;
document.getElementById("search-input").addEventListener("input", (e)=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ searchTerm = e.target.value; renderGrid(); }, 130);
});
document.getElementById("region-filter").addEventListener("change", (e)=>{
  filterRegion = e.target.value;
  filterCluster = ""; filterOffice = "";
  populateFilters(); renderGrid();
});
document.getElementById("cluster-filter").addEventListener("change", (e)=>{
  filterCluster = e.target.value;
  filterOffice = "";
  populateFilters(); renderGrid();
});
document.getElementById("office-filter").addEventListener("change", (e)=>{
  filterOffice = e.target.value;
  renderGrid();
});
document.getElementById("status-filter").addEventListener("change", (e)=>{
  filterStatus = e.target.value;
  renderGrid();
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user)=>{
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
  } catch(e) {}
  if (userDoc && userDoc.active === false) { kick("inactive"); return; }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    officeId: userDoc?.officeId || "",
    clusterId: userDoc?.clusterId || "",
    employeeId: userDoc?.employeeId || "",
    departmentId: userDoc?.departmentId || "",
    empId: userDoc?.empId || ""
  };

  if (!["super_admin","admin","hrm","manager","employee"].includes(S.role)) {
    window.location.replace("dashboard.html");
    return;
  }

  await loadUserSettings(user.uid);

  renderSidebar();
  renderUser();
  render();

  subscribeRegions();
  subscribeClusters();
  subscribeOffices();
  subscribeDepartments();
  subscribeEmployees();
  subscribeUsers();

  console.log("[departments] booted with settings:", {
    theme: STATE.theme, lang: STATE.lang, compact: STATE.compact
  });
});
</script>
