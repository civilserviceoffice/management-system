      text:"Your account is not linked to a cluster. Contact your regional admin." });
  if ((isWoredaCity() || isManager()) && !S.woredaCode)
    msgs.push({ title:"Woreda / City not linked",
      text:"Your account is not linked to a woreda or city. Contact your cluster director." });
  if (isTeamLeader() && !S.departmentId && !S.officeId)
    msgs.push({ title:"Team not linked",
      text:"Your account is not linked to a department or office. Contact your director." });

  if (!msgs.length) { box.innerHTML = ""; return; }
  box.innerHTML = msgs.map(m => `
    <div class="alert alert--warning">
      <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
      <div class="alert__content">
        <div class="alert__title">${escapeHtml(m.title)}</div>
        <div>${escapeHtml(m.text || "")}</div>
      </div>
    </div>
  `).join("");
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats() {
  const list = visiblePlans();
  const mine = myAllocationRows();
  const pending = mine.filter(x => !x.alloc.childPlanId).length;
  const days = isStaff() ? myDaySchedules().length : 0;
  document.getElementById("stats").innerHTML = `
    ${statCard("Total Plans",  list.length, "stat--blue",   "fileText")}
    ${statCard("Active",       list.filter(p => p.status === "active").length, "stat--green",  "clock")}
    ${statCard("My Allocations", mine.length, "stat--violet", "inbox")}
    ${statCard(isStaff() ? "My Working Days" : "Pending Tasks", isStaff() ? days : pending, "stat--gold", isStaff() ? "calendar" : "arrows")}
  `;
}
function statCard(label, value, cls, iconKey) {
  return `<div class="stat ${cls}">
    <div class="stat__head">
      <span class="stat__label">${escapeHtml(label)}</span>
      <span class="stat__icon"><svg viewBox="0 0 24 24">${ICONS[iconKey]}</svg></span>
    </div>
    <div class="stat__value">${value}</div>
  </div>`;
}

/* ============================================================
   MY ALLOCATIONS TABLE (for cluster/woreda/team-lead)
   ============================================================ */
function renderMyAllocationsTable() {
  const rows = myAllocationRows();
  if (!rows.length) return "";

  const pendingCount = rows.filter(r => !r.alloc.childPlanId).length;
  const isClusterScope = rows[0].forLevel === "cluster";
  const isWoredaScope  = rows[0].forLevel === "woreda";
  const isTeamScope    = (isTeamLeader() || isStaff()) && rows[0].forLevel === "staff";
  const scopeName = isClusterScope ? (S.clusterName || "your cluster")
    : isWoredaScope ? (S.woredaName || "your woreda / city")
    : isTeamScope   ? (S.departmentName || S.officeName || "your team")
    : "you";
  const headerIcon = isClusterScope ? ICONS.layers
    : isWoredaScope ? ICONS.pin
    : isTeamScope   ? ICONS.teamLeader
    : ICONS.clipboard;

  let html = '';
  html += '<div class="my-alloc-wrap">';
  html +=   '<div class="my-alloc-head">';
  html +=     '<div class="my-alloc-head__icon"><svg viewBox="0 0 24 24">' + headerIcon + '</svg></div>';
  html +=     '<div class="my-alloc-head__main">';
  html +=       '<div class="my-alloc-head__title">Work allocated to ' + escapeHtml(scopeName) + '</div>';
  html +=       '<div class="my-alloc-head__sub">';
  html +=         rows.length + ' item' + (rows.length === 1 ? '' : 's') + ' received · ';
  html +=         pendingCount + ' still to break down';
  html +=       '</div>';
  html +=     '</div>';
  html +=     '<span class="my-alloc-head__badge">' + rows.length + '</span>';
  html +=   '</div>';

  html +=   '<div class="my-alloc-table-wrap">';
  html +=   '<table class="my-alloc-table">';
  html +=     '<thead><tr>';
  html +=       '<th class="rownum">#</th>';
  html +=       '<th style="min-width:200px">Work</th>';
  html +=       '<th style="width:145px">Load</th>';
  html +=       '<th style="width:120px">Measurement</th>';
  html +=       '<th class="num" style="width:130px">Amount</th>';
  html +=       '<th class="num" style="width:140px">Budget (ETB)</th>';
  html +=       '<th style="min-width:220px">Description</th>';
  html +=       '<th style="width:110px">Status</th>';
  html +=       '<th style="width:150px;text-align:right">Action</th>';
  html +=     '</tr></thead>';
  html +=     '<tbody>';

  rows.forEach((r, i) => {
    const p = r.plan;
    const a = r.alloc;
    const isDone = !!a.childPlanId;
    const isAccepted = !!a.accepted;

    const workName = p.workTypeName || p.title || "Untitled work";

    const loadPct = Number(p.workTypeLoadPercent || 0);
    let dotCls = "custom", loadTxt = p.workTypeLoadLabel || "—";
    if (loadPct) {
      if (loadPct <= 25)       { dotCls = "easy";      loadTxt = "Easy " + loadPct + "%"; }
      else if (loadPct <= 50)  { dotCls = "medium";    loadTxt = "Medium " + loadPct + "%"; }
      else if (loadPct <= 75)  { dotCls = "hard";      loadTxt = "Hard " + loadPct + "%"; }
      else                     { dotCls = "very_hard"; loadTxt = "V.Hard " + loadPct + "%"; }
    }

    let measureTxt = "—";
    if      (p.workTypeMeasure === "number")     measureTxt = "Number";
    else if (p.workTypeMeasure === "time")       measureTxt = "Time";
    else if (p.workTypeMeasure === "money")      measureTxt = "Money";
    else if (p.workTypeMeasure === "percentage") measureTxt = "Percent";
    else if (p.workTypeMeasure === "other")      measureTxt = p.workTypeMeasureOther || "Other";
    else if (p.unit)                             measureTxt = p.unit;

    const amountTxt = fmtNum(a.target) +
      '<span class="unit-mini">' + escapeHtml(p.unit || "") + '</span>';
    const budgetTxt = fmtMoney(a.budget);

    const desc = p.description || "";

    let statusPill;
    if (isDone) {
      statusPill = '<span class="tag tag--green">Split</span>';
    } else if (isAccepted) {
      statusPill = '<span class="tag tag--blue">Accepted</span>';
    } else {
      statusPill = '<span class="tag tag--gold status-clickable" ' +
        'data-accept-id="' + p.id + '" ' +
        'title="Click to accept this allocation">' +
        'Pending' +
        '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
      '</span>';
    }

    const actionBtn = isDone
      ? '<button class="table-action table-action--ghost" data-action="view" data-id="' + p.id + '"><svg viewBox="0 0 24 24">' + ICONS.eye + '</svg> View</button>'
      : '<button class="table-action table-action--gold" data-action="breakdown" data-id="' + p.id + '"><svg viewBox="0 0 24 24">' + ICONS.split + '</svg> Break down</button>';

    html += '<tr>';
    html +=   '<td class="rownum">' + (i + 1) + '</td>';
    html +=   '<td><div class="my-alloc-table__title">' + escapeHtml(workName) + '</div></td>';
    html +=   '<td><span class="load-cell"><span class="load-dot load-dot--' + dotCls + '"></span><span class="load-txt">' + escapeHtml(loadTxt) + '</span></span></td>';
    html +=   '<td>' + escapeHtml(measureTxt) + '</td>';
    html +=   '<td class="num">' + amountTxt + '</td>';
    html +=   '<td class="num">' + budgetTxt + '</td>';
    html +=   '<td>' + (desc
              ? '<div class="my-alloc-table__desc">' + escapeHtml(desc) + '</div>'
              : '<span style="color:var(--muted-light)">—</span>') + '</td>';
    html +=   '<td>' + statusPill + '</td>';
    html +=   '<td style="text-align:right">' + actionBtn + '</td>';
    html += '</tr>';
  });

  html +=     '</tbody>';
  html +=   '</table>';
  html +=   '</div>';
  html += '</div>';
  return html;
}

/* ============================================================
   MY DAILY SCHEDULE (for employees)
   ============================================================ */
function renderMyDailySchedule() {
  const rows = myDaySchedules();
  if (!rows.length) return "";

  /* Group by month-year from the date */
  const byMonth = new Map();
  rows.forEach(r => {
    const m = String(r.date).slice(0,7);
    if (!byMonth.has(m)) byMonth.set(m, []);
    byMonth.get(m).push(r);
  });

  const today = ymd(new Date());

  let html = '';
  html += '<div class="my-schedule">';
  html +=   '<div class="my-schedule__head">';
  html +=     '<div class="my-schedule__head-icon"><svg viewBox="0 0 24 24">' + ICONS.calendar + '</svg></div>';
  html +=     '<div class="my-schedule__head-main">';
  html +=       '<div class="my-schedule__head-title">My Daily Work Schedule</div>';
  html +=       '<div class="my-schedule__head-sub">' + rows.length + ' working day' + (rows.length === 1 ? '' : 's') + ' assigned to you</div>';
  html +=     '</div>';
  html +=   '</div>';
  html +=   '<div class="my-schedule__body">';

  byMonth.forEach((list, ymKey) => {
    list.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const d0 = parseYmd(ymKey + "-01");
    const monthLabel = d0.toLocaleString("en-US", { month: "long", year: "numeric" });

    /* group by week within the month */
    const byWeek = new Map();
    list.forEach(r => {
      const wk = r.week?.fromDate || r.date.slice(0,7);
      if (!byWeek.has(wk)) byWeek.set(wk, []);
      byWeek.get(wk).push(r);
    });

    html += '<div class="my-schedule__period is-open" data-period="' + escapeHtml(ymKey) + '">';
    html +=   '<div class="my-schedule__period-head" data-toggle-period="' + escapeHtml(ymKey) + '">';
    html +=     '<svg class="my-schedule__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' + ICONS.chevron + '</svg>';
    html +=     '<div>';
    html +=       '<div class="my-schedule__period-label">' + escapeHtml(monthLabel) + '</div>';
    html +=       '<div class="my-schedule__period-dates">' + list.length + ' day' + (list.length === 1 ? '' : 's') + '</div>';
    html +=     '</div>';
    html +=     '<span class="my-schedule__period-tag">' + list.length + '</span>';
    html +=   '</div>';
    html +=   '<div class="my-schedule__days">';

    byWeek.forEach((dayList, wkKey) => {
      dayList.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      dayList.forEach(item => {
        const isToday = item.date === today;
        const isPast  = item.date < today;
        const dayLabel = parseYmd(item.date).toLocaleString("en-US", { weekday: "short" });
        const planName = item.plan.workTypeName || item.plan.title || "Work plan";
        html += '<div class="my-schedule__day ' + (isToday ? "is-today" : (isPast ? "is-past" : "")) + '">';
        html +=   '<div class="my-schedule__day-date">' + escapeHtml(fmtDateDisplay(item.date)) + '</div>';
        html +=   '<div class="my-schedule__day-day">' + escapeHtml(dayLabel) + '</div>';
        html +=   '<div class="my-schedule__day-main">' + escapeHtml(planName) + '</div>';
        html +=   '<div class="my-schedule__day-amt">' + fmtNum(item.day.target) + ' <span style="color:var(--muted);font-weight:600">' + escapeHtml(item.plan.unit || "") + '</span></div>';
        html += '</div>';
      });
    });

    html +=   '</div>';
    html += '</div>';
  });

  html +=   '</div>';
  html += '</div>';
  return html;
}

/* ============================================================
   PLAN LIST
   ============================================================ */
function filteredPlans() {
  const q = searchTerm.trim().toLowerCase();
  return visiblePlans().slice().sort((a,b) => {
    const pa = hasPendingAllocation(a) ? 0 : 1;
    const pb = hasPendingAllocation(b) ? 0 : 1;
    if (pa !== pb) return pa - pb;
    const lv = { regional:0, cluster:1, woreda:2, staff:3 };
    const la = lv[a.level] ?? 9, lb = lv[b.level] ?? 9;
    if (la !== lb) return la - lb;
    return (b.updatedAt?.seconds||b.createdAt?.seconds||0) - (a.updatedAt?.seconds||a.createdAt?.seconds||0);
  }).filter(p => {
    if (filterLevel && p.level !== filterLevel) return false;
    if (filterStatus && p.status !== filterStatus) return false;
    if (q) {
      const hay = [p.title, p.workTypeName, p.description, p.sectorName, p.departmentName, p.teamLeaderName,
                   p.clusterName, p.woredaName, p.createdByName]
        .filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function planScopeLine(p) {
  const parts = [];
  if (p.regionCode)  parts.push(regionLabel(p.regionCode));
  if (p.sectorName)  parts.push(p.sectorName);
  if (p.departmentName) parts.push(p.departmentName);
  if (p.clusterName) parts.push(p.clusterName);
  if (p.woredaName)  parts.push(p.woredaName);
  return parts.join(" · ") || "—";
}

function allVisibleSectors() {
  const map = new Map();
  const add = (x) => { if (x && x.id && x.active !== false) map.set(x.id, x); };
  SECTORS.forEach(add);
  DEPARTMENTS.forEach(d => {
    if (d.level === "regional" || d.level === "sector" || d.isSector === true || !d.level) add(d);
  });
  let list = Array.from(map.values());
  if (S?.region && (isRegionalDir() || isRegionalAdmin() || isClusterDir() || isClusterAdmin()
      || isWoredaCity() || isManager() || isTeamLeader())) {
    list = list.filter(s => {
      const rc = String(s.regionCode || s.region || "").trim();
      return !rc || rc === String(S.region).trim();
    });
  }
  for (const p of visiblePlans()) {
    if (p.sectorId && !map.has(p.sectorId)) {
      list.push({ id: p.sectorId, name: p.sectorName || "Unnamed sector", code: p.sectorCode || "" });
    }
  }
  return list;
}

function renderPlans() {
  const host = document.getElementById("plans-container");
  const list = filteredPlans();
  const total = visiblePlans().length;
  const countEl = document.getElementById("count-label");
  if (countEl) countEl.textContent = list.length + " / " + total;

  /* ==========================================================
     SCOPED VIEWERS
     - Employees (pure staff): show their DAILY SCHEDULE first
       and their allocations list.
     - Cluster / Woreda / Manager / Team Leader: show allocations.
     ========================================================== */
  if (isScopedViewer()) {
    const scheduleHtml = isStaff() ? renderMyDailySchedule() : "";
    const tableHtml = renderMyAllocationsTable();

    if (!tableHtml && !scheduleHtml) {
      const emptyMsg = isTeamLeader()
        ? "Once your director splits a plan to your department, it will appear here."
        : isClusterDir() || isClusterAdmin()
          ? "Once your regional director splits a regional plan to your cluster, it will appear here."
          : "Once your director splits a plan to you, it will appear here.";
      host.innerHTML = `
        <div class="empty-state">
          <div class="empty-state__icon">📭</div>
          <div class="empty-state__title">No work allocated to you yet</div>
          <div class="empty-state__text">${emptyMsg}</div>
        </div>`;
      return;
    }
    host.innerHTML = scheduleHtml + tableHtml;

    host.querySelectorAll("[data-toggle-period]").forEach(el => {
      el.addEventListener("click", () => {
        const wrap = el.closest(".my-schedule__period");
        if (wrap) wrap.classList.toggle("is-open");
      });
    });

    host.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const { action, id } = btn.dataset;
        if (action === "view")      openViewPlan(id);
        if (action === "breakdown") {
          const p = PLANS.find(x => x.id === id);
          const mine = p ? findMyPendingAllocation(p) : null;
          if (p && mine) openBreakdownWizard(p, mine.alloc);
        }
      });
    });

    host.querySelectorAll("[data-accept-id]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        acceptMyAllocation(el.dataset.acceptId);
      });
    });

    return;
  }

  /* ==========================================================
     REGIONAL / REGIONAL-ADMIN / SUPER-ADMIN
     ========================================================== */
  const sectorList = allVisibleSectors();

  if (!sectorList.length && !total) {
    host.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">📋</div>
        <div class="empty-state__title">No sectors yet</div>
        <div class="empty-state__text">
          ${canCreateAtMyLevel()
            ? `Create a sector first on the <a href="departments.html" style="color:var(--primary);font-weight:700">Directorates</a> page, then add work plans here.`
            : `Once your director creates a sector and a plan, it will appear here.`}
        </div>
      </div>`;
    return;
  }

  const plansBySector = new Map();
  for (const p of list) {
    const key = p.sectorId || "__nos__";
    if (!plansBySector.has(key)) plansBySector.set(key, []);
    plansBySector.get(key).push(p);
  }

  const rows = [];
  const seen = new Set();
  for (const s of sectorList) {
    rows.push({ sector: s, plans: plansBySector.get(s.id) || [] });
    seen.add(s.id);
  }
  for (const [sid, plans] of plansBySector) {
    if (!seen.has(sid)) {
      rows.push({
        sector: {
          id: sid,
          name: plans[0]?.sectorName || "Other sector",
          code: plans[0]?.sectorCode || "",
          regionCode: plans[0]?.regionCode || ""
        },
        plans
      });
    }
  }

  for (const { sector, plans } of rows) {
    if (plans.some(hasPendingAllocation)) expandedSectors.add("sector:" + sector.id);
  }

  let pageHtml = rows.map(({ sector, plans }) => renderSectorGroup(sector, plans)).join("");
  host.innerHTML = pageHtml;

  host.querySelectorAll("[data-sector-toggle]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-action]")) return;
      const key = el.dataset.sectorToggle;
      if (expandedSectors.has(key)) expandedSectors.delete(key);
      else expandedSectors.add(key);
      renderPlans();
    });
  });

  host.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const { action, id } = btn.dataset;
      if (action === "view")      openViewPlan(id);
      if (action === "edit")      openEditPlan(id);
      if (action === "delete")    confirmDeletePlan(id);
      if (action === "split")     openSplitRegionalPlan(id);
      if (action === "breakdown") {
        const p = PLANS.find(x => x.id === id);
        const mine = p ? findMyPendingAllocation(p) : null;
        if (p && mine) openBreakdownWizard(p, mine.alloc);
      }
    });
  });
}

function renderSectorGroup(sector, plans) {
  const key = "sector:" + sector.id;
  const isOpen = expandedSectors.has(key);
  const region = sector.regionCode ? regionLabel(sector.regionCode) : "";
  const headTitle = [region, sector.name].filter(Boolean).join(" · ") || sector.name || "Unnamed sector";

  const depts = departmentsForSector(sector.id);
  const leaderCount = depts.filter(d => teamLeaderForDepartment(d.id)).length;

  return `
    <div class="sector-group ${isOpen ? "is-open" : ""}" data-sector-group="${escapeHtml(key)}">
      <div class="sector-group__head" data-sector-toggle="${escapeHtml(key)}">
        <div class="sector-group__code">${escapeHtml(sector.code || "??")}</div>
        <div class="sector-group__main">
          <div class="sector-group__name">${escapeHtml(headTitle)}</div>
          <div class="sector-group__meta">
            <span>
              <svg viewBox="0 0 24 24">${ICONS.layers}</svg>
              ${depts.length} department${depts.length === 1 ? "" : "s"}
            </span>
            <span>
              <svg viewBox="0 0 24 24">${ICONS.teamLeader}</svg>
              ${leaderCount}/${depts.length} team leader${depts.length === 1 ? "" : "s"}
            </span>
            <span>
              <svg viewBox="0 0 24 24">${ICONS.fileText}</svg>
              ${plans.length} work plan${plans.length === 1 ? "" : "s"}
            </span>
          </div>
        </div>
        <span class="sector-group__badge">${plans.length}</span>
        <div class="sector-group__chevron">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <div class="sector-group__body">
        <div class="sector-group__section">
          <div class="sector-group__section-title">
            <span>Departments / Directorates</span>
            <span class="count">${depts.length}</span>
          </div>
          ${depts.length
            ? `<div class="dept-list">${depts.map(deptRow).join("")}</div>`
            : `<div class="inline-empty">No departments under this sector yet. Add them on the <a href="departments.html" style="color:var(--primary);font-weight:700">Directorates</a> page.</div>`}
        </div>

        <div class="sector-group__section">
          <div class="sector-group__section-title">
            <span>Work Plans</span>
            <span class="count">${plans.length}</span>
          </div>
          ${plans.length
            ? `<div class="plans-grid">${plans.map(planCard).join("")}</div>`
            : `<div class="inline-empty">No work plans for this sector in ${currentYear} yet.</div>`}
        </div>
      </div>
    </div>`;
}

function deptRow(d) {
  const leader = teamLeaderForDepartment(d.id);
  const levelCls = d.level === "cluster" ? "dept-row__level--cluster" : "dept-row__level--regional";
  const levelLbl = d.level === "cluster" ? "Cluster" : "Regional";
  return `
    <div class="dept-row">
      <div class="dept-row__code">${escapeHtml(d.code || "??")}</div>
      <div class="dept-row__main">
        <div class="dept-row__name">${escapeHtml(d.name || "Untitled department")}</div>
        <div class="dept-row__meta">
          <span class="dept-row__level ${levelCls}">${levelLbl}</span>
          ${leader
            ? `<span class="dept-row__leader">
                 <svg viewBox="0 0 24 24">${ICONS.teamLeader}</svg>
                 Team Leader: ${escapeHtml(leader.name || leader.email || "—")}
               </span>`
            : `<span class="dept-row__leader dept-row__leader--missing">
                 <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
                 No team leader assigned
               </span>`}
        </div>
      </div>
    </div>`;
}

function planCard(p) {
  const status = STATUS_META[p.status] || STATUS_META.draft;
  const allocCount = (p.allocations || []).length;
  const claimed = (p.allocations || []).filter(a => a.childPlanId).length;
  const loadTag = p.workTypeLoadLabel
    ? `<span class="tag ${LOAD_TAGS[p.workTypeLoad] || "tag--gray"}" style="margin-left:6px">${escapeHtml(p.workTypeLoadLabel)}</span>`
    : "";

  const mine = findMyPendingAllocation(p);
  const actionable = !!mine;

  const alertHtml = mine
    ? `<div class="plan-card__alert">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <strong>Action needed:</strong> you were allocated
          <strong>${fmtNum(mine.alloc.target)} ${escapeHtml(p.unit || "")}</strong>
          and <strong>${fmtMoney(mine.alloc.budget)} ETB</strong>.
          Break this down to ${mine.forLevel === "cluster" ? "woredas" : "staff"}.
        </div>
      </div>`
    : "";

  return `
    <article class="plan-card plan-card--${p.level}${actionable ? " plan-card--actionable" : ""}">
      <div class="plan-card__head">
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
            <span class="plan-card__level">${escapeHtml(LEVEL_LABELS[p.level] || p.level)}</span>
            ${loadTag}
          </div>
          <div class="plan-card__title">${escapeHtml(p.workTypeName || p.title || "Untitled plan")}</div>
          <div class="plan-card__scope">
            <svg viewBox="0 0 24 24">${ICONS.pin}</svg>

function canEditPlan(p) {
  if (!p) return false;
  if (isSuper()) return true;
  if (p.createdBy === S.uid) return true;
  if (isRegionalAdmin() && p.regionCode === S.region) return true;
  if (isRegionalDir() && p.sectorId === S.sectorId) return true;
  if ((isClusterDir() || isClusterAdmin()) && p.clusterId === S.clusterId) return true;
  if ((isWoredaCity() || isManager()) && p.woredaCode === S.woredaCode) return true;
  return false;
}
function canDeletePlan(p) { return canEditPlan(p); }

function canSplitRegionalPlan(p) {
  if (!p || p.level !== "regional") return false;
  if ((p.allocations || []).length > 0) return false;
  if (isSuper() || isRegionalAdmin()) return true;
  if (isRegionalDir() && p.sectorId === S.sectorId) return true;
  return false;
}

function render() {
  renderScopeBadge();
  renderGateNotice();
  renderHeadActions();
  renderStats();
  renderPlans();
}

/* ============================================================
   MODAL + WIZARD FRAMEWORK
   ============================================================ */
let escHandler = null;
function openModal(html, { size = "" } = {}) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal ${size ? "modal--" + size : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener("click", (e) => { if (e.target === bd) closeModal(); });
  bd.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  escHandler = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size = "lg" }) {
  const data = JSON.parse(JSON.stringify(initial));
  let idx = 0, busy = false;
  const root = document.createElement("div");
  root.className = "modal-backdrop";
  root.id = "modal-backdrop";
  document.body.appendChild(root);
  escHandler = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  root.addEventListener("click", (e) => { if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll("[data-field]").forEach(el => {
      const k = el.dataset.field;
      if (el.type === "checkbox") data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector("#wizErr");
    if (!el) return;
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.innerHTML = `<svg viewBox="0 0 24 24">${ICONS.alert}</svg><div style="flex:1">${escapeHtml(msg)}</div>`;
    el.style.display = "flex";
  }
  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${escapeHtml(title)}</div>
            ${subtitle ? `<div class="modal__sub">${escapeHtml(subtitle)}</div>` : ""}
          </div>
          <button class="modal__close" data-close aria-label="Close">
            <svg viewBox="0 0 24 24">${ICONS.x}</svg>
          </button>
        </div>
        <div class="steps">
          ${steps.map((s,i) => `
            <div class="step ${i<idx?"is-done":""} ${i===idx?"is-active":""}">
              <span class="step__num">${i<idx?"✓":i+1}</span>
              <span class="step__label">${escapeHtml(s.label)}</span>
            </div>
            ${i<steps.length-1?`<div class="step__line"></div>`:""}
          `).join("")}
        </div>
        <div class="modal__body">
          <div class="step-header">
            <span class="step-header__badge">${idx+1}</span>
            ${escapeHtml(step.title || step.label)}
          </div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>Cancel</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx===0?"disabled":""}>← Back</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
            <span class="btn-label">${idx===steps.length-1?escapeHtml(finishLabel||"Save"):"Next →"}</span>
          </button>
        </div>
      </div>`;
    root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    root.querySelectorAll("[data-field]").forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === "checkbox") el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener("click", () => {
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener("click", async () => {
      const step = steps[idx];
      collect();
      const err = step.validate ? await step.validate(data) : null;
      if (err) { showErr(err); return; }
      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector(".spinner");
        const lbl = btn.querySelector(".btn-label");
        btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Saving…";
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || "Saved successfully", "success");
        } catch (e) {
          console.error(e);
          busy = false;
          btn.disabled = false; sp.classList.add("hidden");
          lbl.textContent = finishLabel || "Save";
          showErr(e?.message || "Something went wrong.");
        }
      } else { idx++; draw(); }
    });
    if (typeof step.after === "function") step.after(root, data, () => { collect(); draw(); });
  }
  draw();
}

/* ============================================================
   ALLOCATION SUM WIDGET
   ============================================================ */
function allocSummary(total, allocations) {
  const sum = allocations.reduce((s,a) => s + num(a.target), 0);
  const sumBudget = allocations.reduce((s,a) => s + num(a.budget), 0);
  const ok = Math.abs(sum - num(total)) < 0.01;
  return `
    <div class="alloc-sum">
      <div class="alloc-sum__item">
        <span class="alloc-sum__label">Total to split</span>
        <span class="alloc-sum__value">${fmtNum(total)}</span>
      </div>
      <div class="alloc-sum__item">
        <span class="alloc-sum__label">Sum allocated</span>
        <span class="alloc-sum__value ${ok?"ok":"bad"}">${fmtNum(sum)}${ok?" ✓":" ✗"}</span>
      </div>
      <div class="alloc-sum__item">
        <span class="alloc-sum__label">Total of Budget</span>
        <span class="alloc-sum__value">${fmtMoney(sumBudget)} ETB</span>
      </div>
    </div>`;
}

/* ============================================================
   ENTRY POINT
   ============================================================ */
async function openPlanCreation() {
  const level = myLevel();
  if (!level) { toast("You cannot create plans", "error"); return; }

  if (level === "regional") {
    try {
      const region = S.region;
      const sectorQ = region
        ? query(collection(db, "sectors"), where("regionCode", "==", region))
        : collection(db, "sectors");
      const deptQ = region
        ? query(collection(db, "departments"), where("regionCode", "==", region))
        : collection(db, "departments");

      const [secSnap, depSnap] = await Promise.all([getDocs(sectorQ), getDocs(deptQ)]);
      SECTORS = secSnap.docs.map(d => ({ id:d.id, ...d.data() }));
      DEPARTMENTS = depSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    } catch (e) {
      try {
        const [s2, d2] = await Promise.all([
          getDocs(collection(db, "sectors")),
          getDocs(collection(db, "departments"))
        ]);
        SECTORS = s2.docs.map(d => ({ id:d.id, ...d.data() }));
        DEPARTMENTS = d2.docs.map(d => ({ id:d.id, ...d.data() }));
      } catch (e2) {
        toast(`Cannot read sectors/departments (${e2.code || e2.message}).`, "error");
        return;
      }
    }
    openRegionalPlanWizard();
  }
  else if (level === "cluster") {
    const pending = pendingAllocations().filter(p => p.forLevel === "cluster");
    if (!pending.length) { toast("No allocation waiting for your cluster.", "error"); return; }
    openBreakdownWizard(pending[0].parent, pending[0].alloc);
  } else if (level === "woreda") {
    const pending = pendingAllocations().filter(p => p.forLevel === "woreda");
    if (!pending.length) { toast("No allocation waiting for your woreda.", "error"); return; }
    openBreakdownWizard(pending[0].parent, pending[0].alloc);
  }
}
