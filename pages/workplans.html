              <select data-field="teamLeaderId" id="leader-select" ${users.length ? "" : "disabled"}>
                <option value="">${users.length ? "— Choose a team leader —" : "No users in this department yet"}</option>
                ${users.map(u => `<option value="${u.id}" ${d.teamLeaderId===u.id?"selected":""}>${escapeHtml(u.name || u.email)} — ${escapeHtml(roleLabel(u.role))}</option>`).join("")}
              </select></div>
            ${chosen ? `<div class="review" style="margin-top:14px">
              <div class="review__row"><span class="review__k">Name</span><span class="review__v">${escapeHtml(chosen.name || chosen.email || "—")}</span></div>
            </div>` : ""}`;
        },
        validate: d => {
          if (!d.departmentId) return "Please go back and select a department.";
          const users = usersForDepartment(d.departmentId);
          if (!users.length) return "This department has no active users yet.";
          if (!d.teamLeaderId) return "Please select a team leader.";
          return null;
        },
        after: (root, data) => {
          const sel = root.querySelector("#leader-select");
          sel?.addEventListener("change", () => { data.teamLeaderId = sel.value; });
        }
      },
      {
        label: "Work Items", title: "Step 4 — List work items",
        render: (d) => renderWorkTypeTable(d),
        validate: d => {
          const list = d.workTypes || [];
          if (!list.length) return "Add at least one work item.";
          for (let i = 0; i < list.length; i++) {
            const w = list[i];
            if (!w.name || w.name.trim().length < 2) return `Row ${i+1}: Work is required.`;
            const p = num(w.loadPercent);
            if (!(p > 0 && p <= 100)) return `Row ${i+1}: Load must be between 1 and 100.`;
            if (!w.measure) return `Row ${i+1}: Choose a measurement.`;
            if (w.measure === "other" && !(w.measureOther || "").trim()) return `Row ${i+1}: Specify a custom measurement.`;
            if (!(num(w.target) > 0)) return `Row ${i+1}: Amount must be > 0.`;
          }
          const sumLoad = list.reduce((s,w) => s + num(w.loadPercent), 0);
          if (Math.abs(sumLoad - 100) > 0.01) return `Load percentages sum to ${fmtNum(sumLoad)}% but must total exactly 100%.`;
          return null;
        },
        after: (root, data, refresh) => {
          const PRESETS = { easy:25, medium:50, hard:75, very_hard:100 };
          function dotClassFor(w) {
            const p = num(w.loadPercent);
            if (p <= 0)   return "custom";
            if (p <= 25)  return "easy";
            if (p <= 50)  return "medium";
            if (p <= 75)  return "hard";
            return "very_hard";
          }
          function recolourDot(root, id) {
            const w = (data.workTypes || []).find(x => x.id === id);
            const dot = root.querySelector('[data-wt-dot="' + id + '"]');
            if (!w || !dot) return;
            dot.className = "worktype-table__dot worktype-table__dot--" + dotClassFor(w);
          }
          root.querySelectorAll("[data-wt-field]").forEach(inp => {
            const handler = () => {
              const id = inp.dataset.wtId;
              const field = inp.dataset.wtField;
              const w = (data.workTypes || []).find(x => x.id === id);
              if (!w) return;
              w[field] = inp.value;
              if (field === "load") {
                const preset = PRESETS[inp.value];
                const wrap = root.querySelector('[data-wt-load-wrap="' + id + '"]');
                const pctInput = wrap ? wrap.querySelector('[data-wt-field="loadPercent"]') : null;
                if (preset != null && pctInput) { pctInput.value = preset; w.loadPercent = preset; }
                recolourDot(root, id);
              }
              if (field === "loadPercent") {
                let p = num(inp.value);
                if (p < 0) p = 0; if (p > 100) p = 100;
                if (String(p) !== inp.value && inp.value !== "") inp.value = p;
                w.loadPercent = inp.value === "" ? "" : p;
                recolourDot(root, id);
              }
              if (field === "measure") {
                const wrap = root.querySelector('[data-wt-measure-wrap="' + id + '"]');
                const other = wrap ? wrap.querySelector('[data-wt-field="measureOther"]') : null;
                const isOther = inp.value === "other";
                if (wrap) wrap.classList.toggle("is-other", isOther);
                if (other) { other.disabled = !isOther; if (!isOther) { other.value = ""; w.measureOther = ""; } }
              }
              refreshWorkTypeTotals(root, data);
            };
            inp.addEventListener("input", handler);
            inp.addEventListener("change", handler);
          });
          root.querySelector("#wt-add-row")?.addEventListener("click", () => {
            data.workTypes = data.workTypes || [];
            const newId = uid();
            data.workTypes.push({ id:newId, name:"", load:"custom", loadPercent:"", measure:"number", measureOther:"", target:"", budget:"", description:"" });
            data.allocationsByWorkType[newId] = makeAllocRows();
            refresh();
          });
          root.querySelectorAll("[data-wt-remove]").forEach(btn => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.wtRemove;
              data.workTypes = (data.workTypes || []).filter(x => x.id !== id);
              delete data.allocationsByWorkType[id];
              refresh();
            });
          });
        }
      },
      {
        label: "Split to Clusters", title: "Step 5 — Split across clusters",
        render: (d) => {
          const list = d.workTypes || [];
          if (!list.length) return `<div class="alert alert--error">No work items to split.</div>`;
          if (!regionClusters.length) {
            return `<div class="alert alert--warning"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div><strong>No clusters exist in ${escapeHtml(regionLabel(S.region))} yet.</strong> Save the plan without splitting; you can split later.</div></div>`;
          }
          return `<div class="alert alert--info"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>For each work item, split amount & budget across every cluster. Sum must equal total.</div></div>
            ${list.map(w => {
              const allocs = d.allocationsByWorkType[w.id] || [];
              const sumT = allocs.reduce((s,a)=>s+num(a.target),0);
              const sumB = allocs.reduce((s,a)=>s+num(a.budget),0);
              const okT = Math.abs(sumT - num(w.target)) < 0.01;
              const okB = Math.abs(sumB - num(w.budget)) < 0.01;
              return `<div style="margin-bottom:24px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff">
                <div style="display:flex;justify-content:space-between;margin-bottom:10px">
                  <div><div style="font-weight:800;font-size:14px">${escapeHtml(w.name)}</div>
                    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">Total: <strong>${fmtNum(w.target)}</strong> · <strong>${fmtMoney(w.budget)} ETB</strong></div>
                  </div>
                  <span class="tag ${okT && okB ? "tag--green" : "tag--gold"}">${okT && okB ? "Balanced" : "Needs attention"}</span>
                </div>
                <table class="alloc-table"><thead><tr><th>Cluster</th><th style="width:130px">Amount</th><th style="width:160px">Budget</th></tr></thead>
                <tbody>${allocs.map((a,i) => `<tr><td><strong>${escapeHtml(a.targetName)}</strong></td>
                  <td><input data-wt="${w.id}" data-alloc-target="${i}" type="number" min="0" step="0.01" value="${escapeHtml(a.target||"")}" placeholder="0"></td>
                  <td><input data-wt="${w.id}" data-alloc-budget="${i}" type="number" min="0" step="1" value="${escapeHtml(a.budget||"")}" placeholder="0"></td></tr>`).join("")}</tbody></table>
                ${allocSummary(w.target, allocs)}
              </div>`;
            }).join("")}`;
        },
        validate: d => {
          if (!regionClusters.length) return null;
          for (const w of (d.workTypes||[])) {
            const allocs = d.allocationsByWorkType[w.id] || [];
            const sumT = allocs.reduce((s,a)=>s+num(a.target),0);
            const sumB = allocs.reduce((s,a)=>s+num(a.budget),0);
            if (Math.abs(sumT - num(w.target)) > 0.01) return `"${w.name}": amounts sum to ${fmtNum(sumT)} but total is ${fmtNum(w.target)}.`;
            if (Math.abs(sumB - num(w.budget)) > 0.01) return `"${w.name}": budgets sum to ${fmtMoney(sumB)} but total is ${fmtMoney(w.budget)}.`;
          }
          return null;
        },
        after: (root, data) => {
          root.querySelectorAll("[data-wt][data-alloc-target]").forEach(inp => {
            inp.addEventListener("input", () => {
              const wtId = inp.dataset.wt;
              data.allocationsByWorkType[wtId][Number(inp.dataset.allocTarget)].target = inp.value;
              const block = inp.closest("div[style*='margin-bottom']");
              if (block) { const w = (data.workTypes||[]).find(x => x.id === wtId); const s = block.querySelector(".alloc-sum"); if (w && s) s.outerHTML = allocSummary(w.target, data.allocationsByWorkType[wtId]); }
            });
          });
          root.querySelectorAll("[data-wt][data-alloc-budget]").forEach(inp => {
            inp.addEventListener("input", () => {
              const wtId = inp.dataset.wt;
              data.allocationsByWorkType[wtId][Number(inp.dataset.allocBudget)].budget = inp.value;
              const block = inp.closest("div[style*='margin-bottom']");
              if (block) { const w = (data.workTypes||[]).find(x => x.id === wtId); const s = block.querySelector(".alloc-sum"); if (w && s) s.outerHTML = allocSummary(w.target, data.allocationsByWorkType[wtId]); }
            });
          });
        }
      },
      {
        label: "Review", title: "Step 6 — Review and create",
        render: (d) => {
          const sel = regionSectors.find(s => s.id === d.sectorId);
          const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
          const leader = USERS.find(u => u.id === d.teamLeaderId);
          const list = d.workTypes || [];
          const totalLoad = list.reduce((s,w) => s + num(w.loadPercent), 0);
          const totalBudget = list.reduce((s,w) => s + num(w.budget), 0);
          return `<div class="review" style="margin-bottom:18px">
            <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sel?.name || "—")}</span></div>
            <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dept?.name || "—")}</span></div>
            <div class="review__row"><span class="review__k">Team Leader</span><span class="review__v">${escapeHtml(leader?.name || leader?.email || "—")}</span></div>
            <div class="review__row"><span class="review__k">Work items</span><span class="review__v">${list.length}</span></div>
            <div class="review__row"><span class="review__k">Total load</span><span class="review__v"><strong>${fmtNum(totalLoad)}%</strong> / 100%</span></div>
            <div class="review__row"><span class="review__k">Total Budget</span><span class="review__v">${fmtMoney(totalBudget)} ETB</span></div>
            <div class="review__row"><span class="review__k">Cluster split</span><span class="review__v">${regionClusters.length ? "Yes — " + regionClusters.length + " clusters" : "No clusters yet"}</span></div>
          </div>`;
        }
      }
    ],
    onFinish: async (d) => {
      const sel = regionSectors.find(s => s.id === d.sectorId);
      if (!sel) throw new Error("Selected sector no longer exists.");
      const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
      if (!dept) throw new Error("Selected department no longer exists.");
      const leader = USERS.find(u => u.id === d.teamLeaderId);
      if (!leader) throw new Error("Selected team leader no longer exists.");
      const list = d.workTypes || [];
      if (!list.length) throw new Error("No work items to save.");
      const sectorName = sel.name || "Unnamed sector";
      const departmentName = dept.name || "Unnamed department";

      function derivedUnit(w) {
        const m = w.measure || "number";
        if (m === "other")      return (w.measureOther || "unit").trim();
        if (m === "number")     return "count";
        if (m === "time")       return "hours";
        if (m === "money")      return "ETB";
        if (m === "percentage") return "%";
        return "unit";
      }
      function loadSummary(w) {
        const p = num(w.loadPercent);
        if (!p) return null;
        if (p <= 25)  return `Easy · ${p}%`;
        if (p <= 50)  return `Medium · ${p}%`;
        if (p <= 75)  return `Hard · ${p}%`;
        return `Very Hard · ${p}%`;
      }
      const yearFrom = currentYear + "-01-01";
      const yearTo   = currentYear + "-12-31";

      for (const w of list) {
        const allocs = regionClusters.length ? (d.allocationsByWorkType[w.id] || []) : [];
        const payload = {
          level: "regional",
          workTypeId: w.id,
          workTypeName: w.name,
          workTypeLoad: w.load || null,
          workTypeLoadPercent: num(w.loadPercent),
          workTypeLoadLabel: loadSummary(w),
          workTypeMeasure: w.measure || null,
          workTypeMeasureOther: w.measure === "other" ? (w.measureOther || null) : null,
          title: `${w.name} — ${sectorName} / ${departmentName} ${currentYear}`,
          description: w.description || null,
          unit: derivedUnit(w),
          target: num(w.target),
          budget: num(w.budget),
          year: currentYear,
          period: "yearly",
          fromDate: yearFrom,
          toDate: yearTo,
          status: "active",
          regionCode: sel.regionCode || sel.region || S.region,
          sectorId: sel.id, sectorName, sectorCode: sel.code || null,
          departmentId: dept.id, departmentName: dept.name || null, departmentCode: dept.code || null,
          teamLeaderId: leader.id, teamLeaderName: leader.name || leader.email || null, teamLeaderRole: leader.role || null,
          allocations: allocs.map(a => ({
            targetType:"cluster", targetId:a.targetId, targetName:a.targetName,
            target: num(a.target), budget: num(a.budget), childPlanId: null
          })),
          createdBy: S.uid, createdByName: S.name, createdByRole: S.role,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        };
        await addDoc(collection(db, "workplans"), payload);
      }
      try {
        await addDoc(collection(db, "notifications"), {
          type:"workplan_regional_created",
          title:`New regional work plan${list.length>1?"s":""}`,
          body:`${S.name} created ${list.length} plan(s) for ${sectorName} / ${departmentName}.`,
          forRoles:["super_admin","regional_admin","cluster_directorate"],
          link:"workplans.html", read:false,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

/* ============================================================
   SPLIT REGIONAL PLAN TO CLUSTERS
   ============================================================ */
function openSplitRegionalPlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (p.level !== "regional") { toast("Only regional plans can be split to clusters.", "error"); return; }
  if ((p.allocations || []).length > 0) { toast("This plan is already split.", "error"); return; }

  const regionClusters = CLUSTERS.filter(c => c.regionCode === (p.regionCode || S.region));
  if (!regionClusters.length) { toast("No clusters exist in this region yet.", "error"); return; }

  openWizard({
    title: "Split to Clusters",
    subtitle: p.workTypeName || p.title || "Regional plan",
    finishLabel: "Send to Clusters",
    successMessage: "Allocation sent to clusters.",
    size: "lg",
    initial: {
      target: p.target, budget: p.budget, unit: p.unit,
      allocations: regionClusters.map(c => ({
        targetType: "cluster", targetId: c.id,
        targetName: c.code ? c.code + " — " + c.name : c.name,
        target: "", budget: ""
      }))
    },
    steps: [{
      label: "Split", title: "Split amount & budget across clusters",
      render: (d) => `<div class="alert alert--info"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>Splitting <strong>${fmtNum(p.target)} ${escapeHtml(p.unit || "")}</strong> and <strong>${fmtMoney(p.budget)} ETB</strong> across ${regionClusters.length} clusters.</div></div>
        <table class="alloc-table"><thead><tr><th>Cluster</th><th style="width:140px">Amount</th><th style="width:160px">Budget</th></tr></thead>
        <tbody>${d.allocations.map((a,i) => `<tr><td><strong>${escapeHtml(a.targetName)}</strong></td>
          <td><input data-alloc-target="${i}" type="number" min="0" step="0.01" value="${escapeHtml(a.target||"")}" placeholder="0"></td>
          <td><input data-alloc-budget="${i}" type="number" min="0" step="1" value="${escapeHtml(a.budget||"")}" placeholder="0"></td></tr>`).join("")}</tbody></table>
        ${allocSummary(d.target, d.allocations)}`,
      validate: d => {
        const sumT = d.allocations.reduce((s,a) => s + num(a.target), 0);
        const sumB = d.allocations.reduce((s,a) => s + num(a.budget), 0);
        if (Math.abs(sumT - num(d.target)) > 0.01) return `Amounts sum to ${fmtNum(sumT)} but total is ${fmtNum(d.target)}.`;
        if (Math.abs(sumB - num(d.budget)) > 0.01) return `Budgets sum to ${fmtMoney(sumB)} but total is ${fmtMoney(d.budget)}.`;
        return null;
      },
      after: (root, data) => {
        root.querySelectorAll("[data-alloc-target]").forEach(inp => {
          inp.addEventListener("input", () => {
            data.allocations[Number(inp.dataset.allocTarget)].target = inp.value;
            const s = root.querySelector(".alloc-sum"); if (s) s.outerHTML = allocSummary(data.target, data.allocations);
          });
        });
        root.querySelectorAll("[data-alloc-budget]").forEach(inp => {
          inp.addEventListener("input", () => {
            data.allocations[Number(inp.dataset.allocBudget)].budget = inp.value;
            const s = root.querySelector(".alloc-sum"); if (s) s.outerHTML = allocSummary(data.target, data.allocations);
          });
        });
      }
    }],
    onFinish: async (d) => {
      const allocs = d.allocations.map(a => ({
        targetType: "cluster", targetId: a.targetId, targetName: a.targetName,
        target: num(a.target), budget: num(a.budget), childPlanId: null
      }));
      await updateDoc(doc(db, "workplans", planId), {
        allocations: allocs, updatedAt: serverTimestamp()
      });
    }
  });
}

/* ============================================================
   BREAKDOWN WIZARD DISPATCH
   ============================================================ */
function openBreakdownWizard(parentPlan, alloc) {
  const level = myLevel();
  if (level === "cluster") return openCascadeBreakdown(parentPlan, alloc, "cluster");
  if (level === "woreda")  return openCascadeBreakdown(parentPlan, alloc, "woreda");
  toast("You cannot break this plan down.", "error");
}

/* ============================================================
   CASCADE BREAKDOWN WIZARD
   Year → 4 Quarters → 3 Months → 4 Weeks (+ Add Week) → 5 Days
   Then assign to Woredas (cluster) or Staff (woreda)
   ============================================================ */
function openCascadeBreakdown(parentPlan, alloc, level) {
  const year = num(parentPlan.year) || new Date().getFullYear();
  const yearFrom = parentPlan.fromDate || (year + "-01-01");
  const yearTo   = parentPlan.toDate   || (year + "-12-31");
  const totalTarget = num(alloc.target);
  const totalBudget = num(alloc.budget);
  const unit = parentPlan.unit || "";

  const isClusterScope = level === "cluster";
  const cluster = CLUSTERS.find(c => c.id === S.clusterId);
  const woredas = isClusterScope ? normalizeWoredas(cluster?.woredas) : [];

  /* ---------- build the cascade data structure ---------- */
  function buildCascade() {
    const quarters = quarterRanges(year).map(q => ({
      label: q.label,
      fromDate: q.fromDate,
      toDate: q.toDate,
      target: 0, budget: 0,
      months: monthRangesForQuarter(q).map(m => ({
        label: m.label, shortLabel: m.shortLabel,
        fromDate: m.fromDate, toDate: m.toDate,
        target: 0, budget: 0,
        weeks: weekRangesForMonth(m).map(w => ({
          label: w.label, isExtra: !!w.isExtra,
          fromDate: w.fromDate, toDate: w.toDate,
          target: 0, budget: 0,
          days: dayRangesForWeek(w).map(d => ({
            label: d.label, shortLabel: d.shortLabel, date: d.date,
            target: 0, budget: 0
          }))
        }))
      }))
    }));

    /* auto-split amounts equal-per-level */
    const qShareT = totalTarget / 4;
    const qShareB = totalBudget / 4;
    quarters.forEach(q => {
      q.target = qShareT; q.budget = qShareB;
      const mShareT = q.target / q.months.length;
      const mShareB = q.budget / q.months.length;
      q.months.forEach(m => {
        m.target = mShareT; m.budget = mShareB;
        const wShareT = m.target / m.weeks.length;
        const wShareB = m.budget / m.weeks.length;
        m.weeks.forEach(w => {
          w.target = wShareT; w.budget = wShareB;
          const dShareT = w.target / w.days.length;
          const dShareB = w.budget / w.days.length;
          w.days.forEach(d => { d.target = dShareT; d.budget = dShareB; });
        });
      });
    });
    return { quarters };
  }

  const data = {
    title: (parentPlan.workTypeName || parentPlan.title || "Work plan") + " — " + (parentPlan.year || year) + " breakdown",
    description: parentPlan.description || "",
    cascade: buildCascade(),
    /* final-step allocation */
    assignTo: isClusterScope ? "woredas" : "staff",
    /* For woreda: staff allocations per day (built later) */
    staffByDay: {}, /* dateKey → { staffId, staffName } */
    /* For cluster: woreda allocations per day (built later) */
    woredaByDay: {} /* dateKey → { woredaCode, woredaName } */
  };

  /* ---------- helpers to recompute totals when the user edits ---------- */
  function recalcFromDays(cascade) {
    cascade.quarters.forEach(q => {
      let qt = 0, qb = 0;
      q.months.forEach(m => {
        let mt = 0, mb = 0;
        m.weeks.forEach(w => {
          let wt = 0, wb = 0;
          w.days.forEach(d => { wt += num(d.target); wb += num(d.budget); });
          w.target = wt; w.budget = wb;
          mt += wt; mb += wb;
        });
        m.target = mt; m.budget = mb;
        qt += mt; qb += mb;
      });
      q.target = qt; q.budget = qb;
    });
  }
  function recalcFromWeeks(cascade) {
    cascade.quarters.forEach(q => {
      let qt = 0, qb = 0;
      q.months.forEach(m => {
        let mt = 0, mb = 0;
        m.weeks.forEach(w => { mt += num(w.target); mb += num(w.budget); });
        m.target = mt; m.budget = mb;
        qt += mt; qb += mb;
      });
      q.target = qt; q.budget = qb;
    });
  }
  function recalcFromMonths(cascade) {
    cascade.quarters.forEach(q => {
      let qt = 0, qb = 0;
      q.months.forEach(m => { qt += num(m.target); qb += num(m.budget); });
      q.target = qt; q.budget = qb;
    });
  }

  /* ---------- render helpers ---------- */
  function cascadeTotalHtml(cascade, label) {
    const sumT = cascade.quarters.reduce((s,q) => s + num(q.target), 0);
    const sumB = cascade.quarters.reduce((s,q) => s + num(q.budget), 0);
    const okT = Math.abs(sumT - totalTarget) < 0.01;
    const okB = Math.abs(sumB - totalBudget) < 0.01;
    return `<div class="cascade-total">
      <div class="cascade-total__item">
        <span class="cascade-total__label">Yearly total</span>
        <span class="cascade-total__value">${fmtNum(totalTarget)} ${escapeHtml(unit)}</span>
      </div>
      <div class="cascade-total__item">
        <span class="cascade-total__label">Sum of ${escapeHtml(label)}</span>
        <span class="cascade-total__value ${okT?"ok":"bad"}">${fmtNum(sumT)} ${okT?"✓":"✗"}</span>
      </div>
      <div class="cascade-total__item">
        <span class="cascade-total__label">Yearly budget</span>
        <span class="cascade-total__value">${fmtMoney(totalBudget)} ETB</span>
      </div>
      <div class="cascade-total__item">
        <span class="cascade-total__label">Sum of ${escapeHtml(label)} budgets</span>
        <span class="cascade-total__value ${okB?"ok":"bad"}">${fmtMoney(sumB)} ETB ${okB?"✓":"✗"}</span>
      </div>
    </div>`;
  }

  function quarterRowHtml(q, qIndex) {
    return `<div class="cascade-row" data-level="q" data-q="${qIndex}">
      <span class="cascade-row__label">${escapeHtml(q.label)}</span>
      <input type="date" data-field="q-from" data-q="${qIndex}" value="${escapeHtml(q.fromDate)}">
      <span class="cascade-row__sep">→</span>
      <input type="date" data-field="q-to" data-q="${qIndex}" value="${escapeHtml(q.toDate)}">
      <input type="number" data-field="q-target" data-q="${qIndex}" value="${escapeHtml(q.target)}" min="0" step="0.01">
      <input type="number" data-field="q-budget" data-q="${qIndex}" value="${escapeHtml(q.budget)}" min="0" step="1">
    </div>`;
  }

  function monthRowHtml(m, qIndex, mIndex) {
    return `<div class="cascade-row" data-level="m" data-q="${qIndex}" data-m="${mIndex}">
      <span class="cascade-row__label">${escapeHtml(m.shortLabel)}</span>
      <input type="date" data-field="m-from" data-q="${qIndex}" data-m="${mIndex}" value="${escapeHtml(m.fromDate)}">
      <span class="cascade-row__sep">→</span>
      <input type="date" data-field="m-to" data-q="${qIndex}" data-m="${mIndex}" value="${escapeHtml(m.toDate)}">
      <input type="number" data-field="m-target" data-q="${qIndex}" data-m="${mIndex}" value="${escapeHtml(m.target)}" min="0" step="0.01">
      <input type="number" data-field="m-budget" data-q="${qIndex}" data-m="${mIndex}" value="${escapeHtml(m.budget)}" min="0" step="1">
    </div>`;
  }

  function weekRowHtml(w, qIndex, mIndex, wIndex) {
    return `<div class="cascade-row" data-level="w" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}">
      <span class="cascade-row__label">${escapeHtml(w.label)}${w.isExtra ? ' <span class="cascade-badge cascade-badge--d" style="font-size:9px">extra</span>' : ''}</span>
      <input type="date" data-field="w-from" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" value="${escapeHtml(w.fromDate)}">
      <span class="cascade-row__sep">→</span>
      <input type="date" data-field="w-to" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" value="${escapeHtml(w.toDate)}">
      <input type="number" data-field="w-target" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" value="${escapeHtml(w.target)}" min="0" step="0.01">
      <input type="number" data-field="w-budget" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" value="${escapeHtml(w.budget)}" min="0" step="1">
    </div>`;
  }

  function dayRowHtml(d, qIndex, mIndex, wIndex, dIndex) {
    return `<div class="cascade-row cascade-row--day" data-level="d" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" data-d="${dIndex}">
      <span class="cascade-row__label">${escapeHtml(d.shortLabel)}</span>
      <input type="date" data-field="d-date" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" data-d="${dIndex}" value="${escapeHtml(d.date)}">
      <span class="cascade-row__sep">•</span>
      <span style="font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace">${escapeHtml(d.date)}</span>
      <input type="number" data-field="d-target" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" data-d="${dIndex}" value="${escapeHtml(d.target)}" min="0" step="0.01">
      <input type="number" data-field="d-budget" data-q="${qIndex}" data-m="${mIndex}" data-w="${wIndex}" data-d="${dIndex}" value="${escapeHtml(d.budget)}" min="0" step="1">
    </div>`;
  }

  /* ---------- step renders ---------- */
  function renderConfirm(d) {
    return `<div class="alert alert--info"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
      <div>You received <strong>${fmtNum(totalTarget)} ${escapeHtml(unit)}</strong> and <strong>${fmtMoney(totalBudget)} ETB</strong>. This wizard splits the yearly allocation into quarters, months, weeks and days. Every level uses date pickers.</div></div>
      <div class="field"><label class="field__required">Breakdown title</label>
        <input data-field="title" value="${escapeHtml(d.title)}"></div>
      <div class="field"><label>Description</label>
        <textarea data-field="description">${escapeHtml(d.description)}</textarea></div>
      <div class="review">
        <div class="review__row"><span class="review__k">Source plan</span><span class="review__v">${escapeHtml(parentPlan.workTypeName || parentPlan.title || "—")}</span></div>
        <div class="review__row"><span class="review__k">Year</span><span class="review__v">${year}</span></div>
        <div class="review__row"><span class="review__k">Year range</span><span class="review__v">${escapeHtml(fmtDateDisplay(yearFrom))} → ${escapeHtml(fmtDateDisplay(yearTo))}</span></div>
        <div class="review__row"><span class="review__k">Your scope</span><span class="review__v">${escapeHtml(isClusterScope ? (S.clusterName || "Cluster") : (S.woredaName || "Woreda / City"))}</span></div>
      </div>`;
  }

  function renderQuarters(d) {
    const c = d.cascade;
    return cascadeTotalHtml(c, "quarters") +
      c.quarters.map((q, i) => `
        <div class="cascade-group">
          <div class="cascade-group__head is-quarter">
            <span class="cascade-badge cascade-badge--q">Quarter</span>
            <div><div class="cascade-group__title">${escapeHtml(q.label)} — ${year}</div>
              <div class="cascade-group__sub">${escapeHtml(q.fromDate)} → ${escapeHtml(q.toDate)}</div></div>
          </div>
          <div class="cascade-group__body">${quarterRowHtml(q, i)}</div>
        </div>`).join("");
  }

  function renderMonths(d) {
    const c = d.cascade;
    return cascadeTotalHtml(c, "quarters") +
      c.quarters.map((q, qi) => `
        <div class="cascade-group">
          <div class="cascade-group__head is-quarter">
            <span class="cascade-badge cascade-badge--q">${escapeHtml(q.label)}</span>
            <div><div class="cascade-group__title">Months of ${escapeHtml(q.label)}</div>
              <div class="cascade-group__sub">${fmtNum(q.target)} ${escapeHtml(unit)} · ${fmtMoney(q.budget)} ETB</div></div>
          </div>
          <div class="cascade-group__body">${q.months.map((m, mi) => monthRowHtml(m, qi, mi)).join("")}</div>
        </div>`).join("");
  }

  function renderWeeks(d) {
    const c = d.cascade;
    let html = cascadeTotalHtml(c, "quarters");
    c.quarters.forEach((q, qi) => {
      q.months.forEach((m, mi) => {
        const wCount = m.weeks.length;
        const canAddWeek = wCount < 6; /* allow up to 6 */
        html += `<div class="cascade-group">
          <div class="cascade-group__head is-month">
            <span class="cascade-badge cascade-badge--m">${escapeHtml(m.shortLabel)}</span>
            <div><div class="cascade-group__title">Weeks of ${escapeHtml(m.shortLabel)}</div>
              <div class="cascade-group__sub">${fmtNum(m.target)} ${escapeHtml(unit)} · ${fmtMoney(m.budget)} ETB</div></div>
          </div>
          <div class="cascade-group__body">
            ${m.weeks.map((w, wi) => weekRowHtml(w, qi, mi, wi)).join("")}
            ${canAddWeek ? `<div class="cascade-actions">
              <button type="button" class="cascade-add-week" data-add-week data-q="${qi}" data-m="${mi}">
                <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Add additional week
              </button>
            </div>` : ""}
          </div>
        </div>`;
      });
    });
    return html;
  }

  function renderDays(d) {
    const c = d.cascade;
    let html = cascadeTotalHtml(c, "quarters");
    c.quarters.forEach((q, qi) => {
      q.months.forEach((m, mi) => {
        m.weeks.forEach((w, wi) => {
          html += `<div class="cascade-group">
            <div class="cascade-group__head is-week">
              <span class="cascade-badge cascade-badge--w">${escapeHtml(w.label)}</span>
              <div><div class="cascade-group__title">${escapeHtml(m.shortLabel)} · ${escapeHtml(w.label)}</div>
                <div class="cascade-group__sub">${escapeHtml(w.fromDate)} → ${escapeHtml(w.toDate)} · ${fmtNum(w.target)} ${escapeHtml(unit)}</div></div>
            </div>
            <div class="cascade-group__body">
              ${w.days.map((dd, di) => dayRowHtml(dd, qi, mi, wi, di)).join("")}
            </div>
          </div>`;
        });
      });
    });
    return html;
  }

  /* ---------- final assignment step ---------- */
  function renderAssign(d) {
    if (isClusterScope) {
      if (!woredas.length) {
        return `<div class="alert alert--warning"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>No woredas / cities exist in your cluster yet. Ask your regional admin to add them.</div></div>`;
      }
      const flat = [];
      d.cascade.quarters.forEach((q, qi) => q.months.forEach((m, mi) => m.weeks.forEach((w, wi) => w.days.forEach((dd, di) => {
        flat.push({ qi, mi, wi, di, day: dd });
      }))));
      return `<div class="alert alert--info"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>Assign each working day to a woreda / city. Leave days you want to keep at cluster level unassigned.</div></div>
        <div style="max-height:420px;overflow-y:auto;padding-right:6px">
          ${flat.map(item => {
            const key = item.day.date;
            const cur = d.woredaByDay[key] || {};
            return `<div class="cascade-row" style="grid-template-columns:150px 1fr 100px">
              <span class="cascade-row__label" style="font-family:ui-monospace,monospace;font-size:11.5px">${escapeHtml(fmtDateDisplay(item.day.date))}</span>
              <select data-woreda-day="${escapeHtml(key)}">
                <option value="">— Keep at cluster —</option>
                ${woredas.map(w => `<option value="${escapeHtml(w.code)}" ${cur.woredaCode===w.code?"selected":""}>${escapeHtml(w.code)} — ${escapeHtml(w.name)}</option>`).join("")}
              </select>
              <span style="font-family:ui-monospace,monospace;font-weight:800;font-size:12px;text-align:right">${fmtNum(item.day.target)} <span style="color:var(--muted);font-weight:600">${escapeHtml(unit)}</span></span>
            </div>`;
          }).join("")}
        </div>`;
    }
    /* Woreda: assign each day to a staff member */
    const staffCandidates = USERS.filter(u =>
      u.woredaCode === S.woredaCode && u.active !== false &&
      ["employee","team_leader","manager","woreda_city"].includes(u.role)
    );
    if (!staffCandidates.length) {
      return `<div class="alert alert--warning"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>No active staff found in your woreda / city yet. Add staff first on the Users & Staff page.</div></div>`;
    }
    const flat = [];
    d.cascade.quarters.forEach((q, qi) => q.months.forEach((m, mi) => m.weeks.forEach((w, wi) => w.days.forEach((dd, di) => {
      flat.push({ qi, mi, wi, di, day: dd });
    }))));
    return `<div class="alert alert--info"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>Assign each working day to a staff member. Once assigned, the employee will see it in their <strong>My Work Plans</strong> page with the exact date and amount.</div></div>
      <div style="max-height:420px;overflow-y:auto;padding-right:6px">
        ${flat.map(item => {
          const key = item.day.date;
          const cur = d.staffByDay[key] || {};
          return `<div class="cascade-row" style="grid-template-columns:150px 1fr 100px">
            <span class="cascade-row__label" style="font-family:ui-monospace,monospace;font-size:11.5px">${escapeHtml(fmtDateDisplay(item.day.date))}</span>
            <select data-staff-day="${escapeHtml(key)}">
              <option value="">— Unassigned —</option>
              ${staffCandidates.map(u => `<option value="${u.id}" ${cur.staffId===u.id?"selected":""}>${escapeHtml(u.name || u.email)} — ${escapeHtml(roleLabel(u.role))}</option>`).join("")}
            </select>
            <span style="font-family:ui-monospace,monospace;font-weight:800;font-size:12px;text-align:right">${fmtNum(item.day.target)} <span style="color:var(--muted);font-weight:600">${escapeHtml(unit)}</span></span>
          </div>`;
        }).join("")}
      </div>`;
  }

  /* ---------- review step ---------- */
  function renderReview(d) {
    const c = d.cascade;
    let totalQ = 0, totalB = 0;
    c.quarters.forEach(q => { totalQ += num(q.target); totalB += num(q.budget); });
    const assignedDays = isClusterScope
      ? Object.values(d.woredaByDay || {}).filter(x => x && x.woredaCode).length
      : Object.values(d.staffByDay  || {}).filter(x => x && x.staffId).length;
    const totalDays = c.quarters.reduce((s,q) =>
      s + q.months.reduce((s2,m) => s2 + m.weeks.reduce((s3,w) => s3 + w.days.length, 0), 0), 0);

    return `<div class="review" style="margin-bottom:18px">
      <div class="review__row"><span class="review__k">Title</span><span class="review__v">${escapeHtml(d.title)}</span></div>
      <div class="review__row"><span class="review__k">Year range</span><span class="review__v">${escapeHtml(fmtDateDisplay(yearFrom))} → ${escapeHtml(fmtDateDisplay(yearTo))}</span></div>
      <div class="review__row"><span class="review__k">Quarters</span><span class="review__v">${c.quarters.length}</span></div>
      <div class="review__row"><span class="review__k">Total quarters amount</span><span class="review__v">${fmtNum(totalQ)} ${escapeHtml(unit)} <span style="color:var(--success)">✓</span></span></div>
      <div class="review__row"><span class="review__k">Total quarters budget</span><span class="review__v">${fmtMoney(totalB)} ETB</span></div>
      <div class="review__row"><span class="review__k">Days in cascade</span><span class="review__v">${totalDays}</span></div>
      <div class="review__row"><span class="review__k">Assigned days</span><span class="review__v">${assignedDays} / ${totalDays} ${assignedDays === totalDays ? '<span style="color:var(--success)">✓</span>' : ''}</span></div>
    </div>
    <div style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px">Quarters</div>
    <div class="review" style="margin-bottom:18px">
      ${c.quarters.map(q => `<div class="review__row">
        <span class="review__k">${escapeHtml(q.label)}</span>
        <span class="review__v">${escapeHtml(q.fromDate)} → ${escapeHtml(q.toDate)} · <strong>${fmtNum(q.target)} ${escapeHtml(unit)}</strong> · ${fmtMoney(q.budget)} ETB</span>
      </div>`).join("")}
    </div>`;
  }

  /* ---------- wizard steps ---------- */
  const steps = [
    { label:"Confirm",       title:"Confirm scope & title",
      render: renderConfirm,
      validate: (d) => {
        if (!d.title || d.title.trim().length < 3) return "Title is required.";
        return null;
      }
    },
    { label:"4 Quarters",    title:"Split the year into 4 quarters",
      render: renderQuarters,
      validate: (d) => {
        const sum = d.cascade.quarters.reduce((s,q) => s + num(q.target), 0);
        if (Math.abs(sum - totalTarget) > 0.01) return `Quarters sum to ${fmtNum(sum)} but yearly total is ${fmtNum(totalTarget)}.`;
        const sumB = d.cascade.quarters.reduce((s,q) => s + num(q.budget), 0);
        if (Math.abs(sumB - totalBudget) > 0.01) return `Quarter budgets sum to ${fmtMoney(sumB)} but yearly budget is ${fmtMoney(totalBudget)}.`;
        for (let i = 0; i < d.cascade.quarters.length; i++) {
          const q = d.cascade.quarters[i];
          if (!q.fromDate || !q.toDate) return `${q.label}: dates are required.`;
          if (q.fromDate > q.toDate) return `${q.label}: start date must be before end date.`;
        }
        return null;
      },
      after: (root, data) => {
        root.querySelectorAll("[data-field='q-target']").forEach(inp => {
          inp.addEventListener("input", () => {
            const qi = Number(inp.dataset.q);
            data.cascade.quarters[qi].target = inp.value;
          });
        });
        root.querySelectorAll("[data-field='q-budget']").forEach(inp => {
          inp.addEventListener("input", () => {
            const qi = Number(inp.dataset.q);
            data.cascade.quarters[qi].budget = inp.value;
          });
        });
        root.querySelectorAll("[data-field='q-from']").forEach(inp => {
          inp.addEventListener("change", () => {
            const qi = Number(inp.dataset.q);
            data.cascade.quarters[qi].fromDate = inp.value;
          });
        });
        root.querySelectorAll("[data-field='q-to']").forEach(inp => {
          inp.addEventListener("change", () => {
            const qi = Number(inp.dataset.q);
            data.cascade.quarters[qi].toDate = inp.value;
          });
        });
      }
    },
    { label:"3 Months",      title:"Split each quarter into 3 months",
      render: renderMonths,
      validate: (d) => {
        for (let qi = 0; qi < d.cascade.quarters.length; qi++) {
          const q = d.cascade.quarters[qi];
          const sum = q.months.reduce((s,m) => s + num(m.target), 0);
          if (Math.abs(sum - num(q.target)) > 0.01) return `${q.label} months sum to ${fmtNum(sum)} but quarter total is ${fmtNum(q.target)}.`;
          for (const m of q.months) {
            if (!m.fromDate || !m.toDate) return `${m.label}: dates required.`;
            if (m.fromDate > m.toDate) return `${m.label}: start must be before end.`;
          }
        }
        return null;
      },
      after: (root, data) => {
        ["m-target","m-budget"].forEach(f => {
          root.querySelectorAll(`[data-field='${f}']`).forEach(inp => {
            inp.addEventListener("input", () => {
              const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m);
              data.cascade.quarters[qi].months[mi][f === "m-target" ? "target" : "budget"] = inp.value;
            });
          });
        });
        ["m-from","m-to"].forEach(f => {
          root.querySelectorAll(`[data-field='${f}']`).forEach(inp => {
            inp.addEventListener("change", () => {
              const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m);
              data.cascade.quarters[qi].months[mi][f === "m-from" ? "fromDate" : "toDate"] = inp.value;
            });
          });
        });
      }
    },
    { label:"4 Weeks",       title:"Split each month into weeks (add extra weeks if needed)",
      render: renderWeeks,
      validate: (d) => {
        for (let qi = 0; qi < d.cascade.quarters.length; qi++) {
          const q = d.cascade.quarters[qi];
          for (let mi = 0; mi < q.months.length; mi++) {
            const m = q.months[mi];
            const sum = m.weeks.reduce((s,w) => s + num(w.target), 0);
            if (Math.abs(sum - num(m.target)) > 0.01) return `${m.shortLabel} weeks sum to ${fmtNum(sum)} but month total is ${fmtNum(m.target)}.`;
            for (const w of m.weeks) {
              if (!w.fromDate || !w.toDate) return `${m.shortLabel} · ${w.label}: dates required.`;
              if (w.fromDate > w.toDate) return `${w.label}: start must be before end.`;
            }
          }
        }
        return null;
      },
      after: (root, data, refresh) => {
        ["w-target","w-budget"].forEach(f => {
          root.querySelectorAll(`[data-field='${f}']`).forEach(inp => {
            inp.addEventListener("input", () => {
              const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m), wi = Number(inp.dataset.w);
              data.cascade.quarters[qi].months[mi].weeks[wi][f === "w-target" ? "target" : "budget"] = inp.value;
            });
          });
        });
        ["w-from","w-to"].forEach(f => {
          root.querySelectorAll(`[data-field='${f}']`).forEach(inp => {
            inp.addEventListener("change", () => {
              const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m), wi = Number(inp.dataset.w);
              data.cascade.quarters[qi].months[mi].weeks[wi][f === "w-from" ? "fromDate" : "toDate"] = inp.value;
            });
          });
        });
        root.querySelectorAll("[data-add-week]").forEach(btn => {
          btn.addEventListener("click", () => {
            const qi = Number(btn.dataset.q), mi = Number(btn.dataset.m);
            const m = data.cascade.quarters[qi].months[mi];
            const last = m.weeks[m.weeks.length - 1];
            const start = addDays(last.toDate, 1);
            const end = addDays(start, 6);
            m.weeks.push({
              label: "Week " + (m.weeks.length + 1),
              isExtra: true,
              fromDate: start,
              toDate: end > m.toDate ? m.toDate : end,
              target: 0, budget: 0,
              days: dayRangesForWeek({ fromDate: start, toDate: end }).map(d => ({
                label: d.label, shortLabel: d.shortLabel, date: d.date,
                target: 0, budget: 0
              }))
            });
            refresh();
          });
        });
      }
    },
    { label:"5 Days",        title:"Split each week into working days",
      render: renderDays,
      validate: (d) => {
        for (const q of d.cascade.quarters) for (const m of q.months) for (const w of m.weeks) {
          const sum = w.days.reduce((s,dd) => s + num(dd.target), 0);
          if (Math.abs(sum - num(w.target)) > 0.01) return `${w.label}: days sum to ${fmtNum(sum)} but week total is ${fmtNum(w.target)}.`;
          for (const dd of w.days) {
            if (!dd.date) return `${w.label} · ${dd.label}: date required.`;
          }
        }
        return null;
      },
      after: (root, data) => {
        ["d-target","d-budget"].forEach(f => {
          root.querySelectorAll(`[data-field='${f}']`).forEach(inp => {
            inp.addEventListener("input", () => {
              const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m),
                    wi = Number(inp.dataset.w), di = Number(inp.dataset.d);
              data.cascade.quarters[qi].months[mi].weeks[wi].days[di][f === "d-target" ? "target" : "budget"] = inp.value;
            });
          });
        });
        root.querySelectorAll("[data-field='d-date']").forEach(inp => {
          inp.addEventListener("change", () => {
            const qi = Number(inp.dataset.q), mi = Number(inp.dataset.m),
                  wi = Number(inp.dataset.w), di = Number(inp.dataset.d);
            data.cascade.quarters[qi].months[mi].weeks[wi].days[di].date = inp.value;
          });
        });
      }
    },
    { label: isClusterScope ? "Assign to Woredas" : "Assign to Staff",
      title: isClusterScope ? "Assign each day to a woreda" : "Assign each day to a staff member",
      render: renderAssign,
      validate: (d) => {
        if (isClusterScope) {
          if (!woredas.length) return "No woredas in this cluster yet. Ask your regional admin to add them.";
        } else {
          const staffCandidates = USERS.filter(u =>
            u.woredaCode === S.woredaCode && u.active !== false &&
            ["employee","team_leader","manager","woreda_city"].includes(u.role)
          );
          if (!staffCandidates.length) return "No active staff found in your woreda. Add staff first.";
        }
        return null;
      },
      after: (root, data) => {
        if (isClusterScope) {
          root.querySelectorAll("[data-woreda-day]").forEach(sel => {
            sel.addEventListener("change", () => {
              const key = sel.dataset.woredaDay;
              const code = sel.value;
              if (!code) {
                delete data.woredaByDay[key];
                return;
              }
              const w = woredas.find(x => x.code === code);
              data.woredaByDay[key] = {
                woredaCode: code,
                woredaName: w ? w.name : code,
                woredaNameFull: w ? (w.code + " — " + w.name) : code
              };
            });
          });
        } else {
          root.querySelectorAll("[data-staff-day]").forEach(sel => {
            sel.addEventListener("change", () => {
              const key = sel.dataset.staffDay;
              const id = sel.value;
              if (!id) {
                delete data.staffByDay[key];
                return;
              }
              const u = USERS.find(x => x.id === id);
              data.staffByDay[key] = {
                staffId: id,
                staffName: u ? (u.name || u.email) : id
              };
            });
          });
        }
      }
    },
    { label:"Review", title:"Review and create the breakdown plan",
      render: renderReview
    }
  ];

  openWizard({
    title: isClusterScope ? "Cluster — Yearly Breakdown" : "Woreda / City — Yearly Breakdown",
    subtitle: `${parentPlan.workTypeName || parentPlan.title || ""} · ${year}`,
    finishLabel: "Create Breakdown Plan",
    successMessage: "Breakdown created — woredas / staff will now see their day allocations.",
    size: "xl",
    initial: data,
    steps,
    onFinish: async (d) => {
      /* Recalc all totals from days to be safe */
      recalcFromDays(d.cascade);

      /* Build the child plan's allocations from the final assignment */
      let allocations = [];

      if (isClusterScope) {
        const byWoreda = new Map();
        d.cascade.quarters.forEach(q => q.months.forEach(m => m.weeks.forEach(w => w.days.forEach(dd => {
          const a = d.woredaByDay[dd.date];
          if (!a || !a.woredaCode) return;
          if (!byWoreda.has(a.woredaCode)) byWoreda.set(a.woredaCode, {
            targetType:"woreda", targetId:a.woredaCode, targetName:a.woredaNameFull || a.woredaName,
            target: 0, budget: 0, days: []
          });
          const entry = byWoreda.get(a.woredaCode);
          entry.target += num(dd.target);
          entry.budget += num(dd.budget);
          entry.days.push({ date: dd.date, target: num(dd.target), budget: num(dd.budget) });
        }))));
        allocations = Array.from(byWoreda.values());
      } else {
        const byStaff = new Map();
        d.cascade.quarters.forEach(q => q.months.forEach(m => m.weeks.forEach(w => w.days.forEach(dd => {
          const a = d.staffByDay[dd.date];
          if (!a || !a.staffId) return;
          if (!byStaff.has(a.staffId)) byStaff.set(a.staffId, {
            targetType:"staff", targetId:a.staffId, targetName:a.staffName,
            target: 0, budget: 0, days: []
          });
          const entry = byStaff.get(a.staffId);
          entry.target += num(dd.target);
          entry.budget += num(dd.budget);
          entry.days.push({ date: dd.date, target: num(dd.target), budget: num(dd.budget) });
        }))));
        allocations = Array.from(byStaff.values());
      }

      /* ★ FIXED: stamp the assignment back into the tree so the
         periodBreakdown is consistent with the flat dayIndex. */
      d.cascade.quarters.forEach(q => q.months.forEach(m => m.weeks.forEach(w => w.days.forEach(dd => {
        const a = isClusterScope ? d.woredaByDay[dd.date] : d.staffByDay[dd.date];
        if (!a) return;
        dd.assignedTo     = isClusterScope ? null : a.staffId;
        dd.assignedToName = isClusterScope ? null : a.staffName;
        dd.woredaCode     = isClusterScope ? a.woredaCode : null;
        dd.woredaName     = isClusterScope ? a.woredaName : null;
      }))));

      /* Flat dayIndex (used by employees to look up their days directly) */
      const dayIndex = [];
      d.cascade.quarters.forEach(q => q.months.forEach(m => m.weeks.forEach(w => w.days.forEach(dd => {
        const a = isClusterScope ? d.woredaByDay[dd.date] : d.staffByDay[dd.date];
        if (!a) return;
        dayIndex.push({
          date: dd.date,
          target: num(dd.target),
          budget: num(dd.budget),
          assignedTo: isClusterScope ? null : a.staffId,
          assignedToName: isClusterScope ? null : a.staffName,
          woredaCode: isClusterScope ? a.woredaCode : null,
          woredaName: isClusterScope ? a.woredaName : null
        });
      }))));

      const payload = {
        level: isClusterScope ? "cluster" : "woreda",
        parentPlanId: parentPlan.id,
        workTypeId: parentPlan.workTypeId || null,
        workTypeName: parentPlan.workTypeName || null,
        workTypeLoad: parentPlan.workTypeLoad || null,
        workTypeLoadPercent: parentPlan.workTypeLoadPercent || null,
        workTypeLoadLabel: parentPlan.workTypeLoadLabel || null,
        workTypeMeasure: parentPlan.workTypeMeasure || null,
        title: d.title.trim(),
        description: (d.description || "").trim() || null,
        unit: parentPlan.unit,
        target: num(alloc.target),
        budget: num(alloc.budget),
        year, period:"yearly", status:"active",
        fromDate: yearFrom, toDate: yearTo,
        regionCode: S.region,
        sectorId: parentPlan.sectorId, sectorName: parentPlan.sectorName || null,
        departmentId: parentPlan.departmentId || null,
        departmentName: parentPlan.departmentName || null,
        teamLeaderId: parentPlan.teamLeaderId || null,
        teamLeaderName: parentPlan.teamLeaderName || null,
        clusterId: S.clusterId, clusterName: cluster?.name || null,
        woredaCode: isClusterScope ? null : S.woredaCode,
        woredaName: isClusterScope ? null : S.woredaName,
        periodBreakdown: d.cascade,
        dayIndex,
        allocations,
        createdBy: S.uid, createdByName: S.name, createdByRole: S.role,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      };

      const ref = await addDoc(collection(db, "workplans"), payload);

      /* Mark the parent allocation as split */
      const parentAllocs = (parentPlan.allocations || []).map(a => {
        if (isClusterScope) {
          if (a.targetType === "cluster" && a.targetId === S.clusterId)
            return Object.assign({}, a, { childPlanId: ref.id });
        } else {
          if (a.targetType === "woreda" && allocMatchesMyWoreda(parentPlan, a))
            return Object.assign({}, a, { childPlanId: ref.id });
        }
        return a;
      });
      await updateDoc(doc(db, "workplans", parentPlan.id), {
        allocations: parentAllocs, updatedAt: serverTimestamp()
      });

      /* Notify */
      try {
        await addDoc(collection(db, "notifications"), {
          type: isClusterScope ? "workplan_split_to_woredas" : "workplan_split_to_staff",
          title: isClusterScope ? "Yearly plan broken down to woredas" : "Yearly plan broken down to staff",
          body: `${S.name} broke down "${parentPlan.workTypeName || parentPlan.title}" into ${d.cascade.quarters.length} quarters, and assigned ${dayIndex.length} working days.`,
          forRoles: isClusterScope ? ["super_admin","regional_admin","cluster_directorate","woreda_city"] : ["super_admin","regional_admin","cluster_directorate","woreda_city","employee"],
          link: "workplans.html", read:false,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

function openViewPlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  const status = STATUS_META[p.status] || STATUS_META.draft;
  const mine = findMyPendingAllocation(p);
  const visibleAllocs = isScopedViewer() ? (mine ? [mine.alloc] : []) : (p.allocations || []);

  /* For pure staff, render the day schedule inside the modal too */
  const staffDays = isStaff() && p.dayIndex
    ? p.dayIndex.filter(d => d.assignedTo === S.uid)
    : [];

  let dayIndexHtml = "";
  if (staffDays.length) {
    dayIndexHtml = `
      <div style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px">My working days</div>
      <table class="alloc-table">
        <thead><tr><th>Date</th><th style="width:120px">Amount</th><th style="width:120px">Budget</th></tr></thead>
        <tbody>
          ${staffDays.map(d => `<tr>
            <td style="font-family:ui-monospace,monospace">${escapeHtml(fmtDateDisplay(d.date))}</td>
            <td style="font-family:ui-monospace,monospace;font-weight:700">${fmtNum(d.target)} ${escapeHtml(p.unit||"")}</td>
            <td style="font-family:ui-monospace,monospace">${fmtMoney(d.budget)} ETB</td>
          </tr>`).join("")}
        </tbody>
      </table>`;
  }

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">${escapeHtml(p.workTypeName || p.title || "Work Plan")}</div>
        <div class="modal__sub">${escapeHtml(planScopeLine(p))}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
        <span class="tag ${status.klass}">${status.label}</span>
        <span class="tag tag--blue">${escapeHtml(LEVEL_LABELS[p.level] || p.level)}</span>
        ${p.workTypeLoadLabel ? `<span class="tag ${LOAD_TAGS[p.workTypeLoad] || "tag--gray"}">${escapeHtml(p.workTypeLoadLabel)}</span>` : ""}
        ${p.period ? `<span class="tag tag--violet">${escapeHtml(PERIOD_LABELS[p.period] || p.period)}</span>` : ""}
      </div>
      ${mine ? `
        <div class="alert alert--warning">
          <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>
            <strong>You have a pending allocation.</strong><br>
            Target: <strong>${fmtNum(mine.alloc.target)} ${escapeHtml(p.unit || "")}</strong>,
            Budget: <strong>${fmtMoney(mine.alloc.budget)} ETB</strong>.
          </div>
        </div>` : ""}
      ${p.description ? `<p style="font-size:13.5px;color:var(--text-soft);line-height:1.65;margin-bottom:18px">${escapeHtml(p.description)}</p>` : ""}
      <div class="review">
        ${p.fromDate || p.toDate ? `<div class="review__row"><span class="review__k">Period range</span><span class="review__v">${escapeHtml(fmtDateDisplay(p.fromDate))} → ${escapeHtml(fmtDateDisplay(p.toDate))}</span></div>` : ""}
        <div class="review__row"><span class="review__k">Year</span><span class="review__v">${p.year||"—"}</span></div>
        <div class="review__row"><span class="review__k">Amount</span><span class="review__v">${fmtNum(p.target)} ${escapeHtml(p.unit||"")}</span></div>
        <div class="review__row"><span class="review__k">Budget</span><span class="review__v">${fmtMoney(p.budget)} ETB</span></div>
        <div class="review__row"><span class="review__k">Created by</span><span class="review__v">${escapeHtml(p.createdByName||"—")}</span></div>
      </div>
      ${visibleAllocs.length ? `
        <table class="alloc-table" style="margin-top:22px">
          <thead><tr>
            <th>Recipient</th>
            <th>Amount</th>
            <th>Budget</th>
            ${!isScopedViewer() ? "<th>Status</th>" : ""}
          </tr></thead>
          <tbody>${visibleAllocs.map(a => `
            <tr>
              <td>${escapeHtml(a.targetName||"—")}</td>
              <td>${fmtNum(a.target)} ${escapeHtml(p.unit||"")}</td>
              <td>${fmtMoney(a.budget)} ETB</td>
              ${!isScopedViewer() ? '<td>' +
                (a.childPlanId
                  ? '<span class="tag tag--green">Split</span>'
                  : a.accepted
                    ? '<span class="tag tag--blue">Accepted</span>'
                    : '<span class="tag tag--gold">Pending</span>') +
                '</td>' : ""}
            </tr>`).join("")}
          </tbody></table>` : ""}
      ${dayIndexHtml}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${mine ? `<button class="btn btn--gold" id="view-breakdown-btn">
        <svg viewBox="0 0 24 24">${ICONS.split}</svg> Break down
      </button>` : ""}
      ${!isScopedViewer() && canEditPlan(p) ? `<button class="btn btn--primary" id="view-edit-btn">
        <svg viewBox="0 0 24 24">${ICONS.edit}</svg> Edit</button>` : ""}
    </div>
  `);
  document.getElementById("view-edit-btn")?.addEventListener("click", () => {
    closeModal(); setTimeout(() => openEditPlan(planId), 100);
  });
  document.getElementById("view-breakdown-btn")?.addEventListener("click", () => {
    if (mine) { closeModal(); setTimeout(() => openBreakdownWizard(p, mine.alloc), 100); }
  });
}
function openEditPlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (!canEditPlan(p)) { toast("You cannot edit this plan", "error"); return; }
  openModal(`
    <div class="modal__head">
      <div><div class="modal__title">Edit Work Plan</div>
        <div class="modal__sub">${escapeHtml(p.workTypeName || p.title)}</div></div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="field"><label>Title</label>
        <input id="ep-title" value="${escapeHtml(p.title||"")}"></div>
      <div class="field"><label>Description</label>
        <textarea id="ep-desc">${escapeHtml(p.description||"")}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Amount</label>
          <input id="ep-target" type="number" min="0" step="0.01" value="${p.target||0}"></div>
        <div class="field"><label>Budget (ETB)</label>
          <input id="ep-budget" type="number" min="0" step="1" value="${p.budget||0}"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="ep-status">
          ${Object.entries(STATUS_META).map(([k,m]) => `<option value="${k}" ${p.status===k?"selected":""}>${m.label}</option>`).join("")}
        </select></div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="ep-submit">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save</span>
      </button>
    </div>
  `);
  document.getElementById("ep-submit").addEventListener("click", async () => {
    const btn = document.getElementById("ep-submit");
    const sp = btn.querySelector(".spinner"), lbl = btn.querySelector(".btn-label");
    btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Saving…";
    try {
      await updateDoc(doc(db, "workplans", planId), {
        title: document.getElementById("ep-title").value.trim(),
        description: document.getElementById("ep-desc").value.trim() || null,
        target: num(document.getElementById("ep-target").value),
        budget: num(document.getElementById("ep-budget").value),
        status: document.getElementById("ep-status").value,
        updatedAt: serverTimestamp()
      });
      toast("Work plan updated","success");
      closeModal();
    } catch (err) {
      toast(err.message||"Failed to save","error");
      btn.disabled = false; sp.classList.add("hidden"); lbl.textContent = "Save";
    }
  });
}
function confirmDeletePlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (!canDeletePlan(p)) { toast("You cannot delete this plan", "error"); return; }
  openModal(`
    <div class="modal__head">
      <div><div class="modal__title">Delete work plan?</div>
        <div class="modal__sub">This cannot be undone</div></div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to delete:</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">${escapeHtml(p.workTypeName || p.title || "Untitled")}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(planScopeLine(p))}</div>
        </div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--danger" id="confirm-del">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Delete</span>
      </button>
    </div>
  `);
  document.getElementById("confirm-del").addEventListener("click", async () => {
    const btn = document.getElementById("confirm-del");
    const sp = btn.querySelector(".spinner"), lbl = btn.querySelector(".btn-label");
    btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Deleting…";
    try {
      await deleteDoc(doc(db, "workplans", planId));
      toast("Work plan removed","success");
      closeModal();
    } catch (err) {
      toast(err.message||"Failed","error");
      btn.disabled = false; sp.classList.add("hidden"); lbl.textContent = "Delete";
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
/* ★ FIXED: do not hard-filter by region for pure staff.
   Region codes are inconsistent across documents ("04" vs "Oromia"),
   and a staff member can only ever see plans directly allocated to
   them, so filtering here just silently hides their work. */
function subscribePlans() {
  if (unsubPlans) unsubPlans();
  let q = collection(db, "workplans");

  const skipRegionFilter = isSuper() || isStaff() || !S?.region;
  if (!skipRegionFilter) {
    q = query(q, where("regionCode", "==", S.region));
  }

  unsubPlans = onSnapshot(q,
    (snap) => {
      PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    },
    (err) => {
      const fallback = onSnapshot(collection(db, "workplans"),
        (snap) => { PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        (e2) => { toast("workplans: " + (e2.code || e2.message), "error"); });
      unsubPlans = fallback;
    });
}
function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  let q = collection(db, "users");
  if (isRegionalAdmin() && S.region) q = query(q, where("region", "==", S.region));
  else if ((isClusterDir() || isClusterAdmin()) && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  else if ((isWoredaCity() || isManager() || isTeamLeader()) && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubUsers = onSnapshot(q, (snap) => {
    USERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[users]", err.code, err.message));
}
function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (S?.region) q = query(q, where("regionCode","==",S.region));
  unsubClusters = onSnapshot(q, (snap) => {
    CLUSTERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[clusters]", err.code, err.message));
}
function subscribeSectors() {
  if (unsubSectors) unsubSectors();
  let q = collection(db, "sectors");
  if (S?.region) q = query(q, where("regionCode", "==", S.region));
  unsubSectors = onSnapshot(q, (snap) => {
    SECTORS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[sectors]", err.code, err.message));
}
function subscribeDepartments() {
  if (unsubDepartments) unsubDepartments();
  let q = collection(db, "departments");
  if (S?.region) q = query(q, where("regionCode", "==", S.region));
  unsubDepartments = onSnapshot(q, (snap) => {
    DEPARTMENTS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[departments]", err.code, err.message));
}

/* ============================================================
   SHELL BINDINGS
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () =>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

let searchTimer;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTerm = e.target.value; renderPlans(); }, 130);
});
document.getElementById("level-filter").addEventListener("change", (e) => {
  filterLevel = e.target.value; renderPlans();
});
document.getElementById("status-filter").addEventListener("change", (e) => {
  filterStatus = e.target.value; renderPlans();
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (e) { console.warn("[user read]", e); }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || userDoc?.fullName || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    region: userDoc?.region || userDoc?.regionCode || "",
    regionCode: userDoc?.regionCode || userDoc?.region || "",
    clusterId: userDoc?.clusterId || "",
    clusterName: userDoc?.clusterName || "",
    woredaCode: userDoc?.woredaCode || "",
    woredaName: userDoc?.woredaName || "",
    sectorId: userDoc?.sectorId || "",
    sectorName: userDoc?.sectorName || "",
    departmentId: userDoc?.departmentId || "",
    departmentName: userDoc?.departmentName || "",
    officeId: userDoc?.officeId || "",
    officeName: userDoc?.officeName || "",
    isDirector: userDoc?.isDirector === true
  };

  const allowed = ["super_admin","regional_admin","directorate","cluster_directorate",
                   "woreda_city","manager","team_leader","admin","employee"];
  if (!allowed.includes(S.role)) { window.location.replace("dashboard.html"); return; }

  renderSidebar();
  renderUser();
  render();

  try { await auth.currentUser?.getIdToken(true); } catch (e) {}
  await new Promise(r => setTimeout(r, 200));

  subscribeClusters();
  subscribeSectors();
  subscribeDepartments();
  subscribeUsers();
  subscribePlans();
});

console.log("[workplans] booted — cascade breakdown wizard ready");
