  openWizard({
    title: "New Regional Work Plan",
    subtitle: `Year ${currentYear} — sector → department → team leader → work items → clusters`,
    finishLabel: "Create Plans",
    successMessage: "Work plan(s) created — cluster directors will now see their allocations.",
    size: "xl",
    initial: {
      sectorId: "",
      departmentId: "",
      teamLeaderId: "",
      workTypes: [],
      allocationsByWorkType: {}
    },
    steps: [
      {
        label: "Sector", title: "Step 1 — Select a sector",
        render: (d) => {
          const sel = regionSectors.find(s => s.id === d.sectorId);
          return `
            <div class="alert alert--info">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>Pick a saved sector. ${regionSectors.length} available for your region.</div>
            </div>
            <div class="field">
              <label class="field__required">Sector</label>
              <select data-field="sectorId" id="sector-select">
                <option value="">— Choose a sector —</option>
                ${regionSectors.map(s => `
                  <option value="${s.id}" ${d.sectorId===s.id?"selected":""}>
                    ${escapeHtml(s.code || "??")} · ${escapeHtml(s.name || "Unnamed")}
                  </option>`).join("")}
              </select>
              <p class="field__hint">
                Manage sectors on the
                <a href="departments.html" style="color:var(--primary);font-weight:700">Sectors</a> page.
              </p>
            </div>
            ${sel ? `
              <div class="review" style="margin-top:14px">
                <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sel.name || "—")}</span></div>
                <div class="review__row"><span class="review__k">Code</span><span class="review__v">${escapeHtml(sel.code || "—")}</span></div>
                <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(sel.regionCode || sel.region))}</span></div>
              </div>` : ""}
          `;
        },
        validate: d => d.sectorId ? null : "Please select a sector.",
        after: (root, data, refresh) => {
          const sel = root.querySelector("#sector-select");
          sel?.addEventListener("change", () => {
            data.sectorId = sel.value;
            data.departmentId = "";
            data.teamLeaderId = "";
            data.workTypes = [];
            data.allocationsByWorkType = {};
            refresh();
          });
        }
      },
      {
        label: "Department", title: "Step 2 — Select a department",
        render: (d) => {
          const sec = regionSectors.find(s => s.id === d.sectorId);
          const depts = departmentsForSector(d.sectorId);
          const selected = depts.find(x => x.id === d.departmentId);
          return `
            <div class="alert alert--info">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>
                Sector: <strong>${escapeHtml(sec?.name || "—")}</strong> ·
                ${depts.length} department${depts.length === 1 ? "" : "s"} available.
              </div>
            </div>

            <div class="field">
              <label class="field__required">Department / Directorate</label>
              <select data-field="departmentId" id="dept-select" ${depts.length ? "" : "disabled"}>
                <option value="">
                  ${depts.length ? "— Choose a department —" : "No departments in this sector yet"}
                </option>
                ${depts.map(x => `
                  <option value="${x.id}" ${d.departmentId===x.id?"selected":""}>
                    ${escapeHtml(x.code || "??")} · ${escapeHtml(x.name || "Unnamed")}
                  </option>`).join("")}
              </select>
              ${!depts.length ? `
                <p class="field__hint" style="color:var(--warning)">
                  ⚠ No departments found under this sector. Add one on the
                  <a href="departments.html" style="color:var(--primary);font-weight:700">Sectors</a> page first.
                </p>` : ""}
            </div>

            ${selected ? `
              <div class="review" style="margin-top:14px">
                <div class="review__row"><span class="review__k">Department</span>
                  <span class="review__v">${escapeHtml(selected.name || "—")}</span></div>
                <div class="review__row"><span class="review__k">Code</span>
                  <span class="review__v">${escapeHtml(selected.code || "—")}</span></div>
                <div class="review__row"><span class="review__k">Level</span>
                  <span class="review__v">${selected.level === "cluster" ? "Cluster" : "Regional"}</span></div>
              </div>` : ""}
          `;
        },
        validate: d => {
          if (!d.sectorId) return "Please go back and select a sector.";
          const depts = departmentsForSector(d.sectorId);
          if (!depts.length) return "This sector has no departments yet. Add one on the Sectors page first.";
          if (!d.departmentId) return "Please select a department.";
          return null;
        },
        after: (root, data, refresh) => {
          const sel = root.querySelector("#dept-select");
          sel?.addEventListener("change", () => {
            data.departmentId = sel.value;
            data.teamLeaderId = "";
            data.workTypes = [];
            data.allocationsByWorkType = {};
            refresh();
          });
        }
      },
      {
        label: "Team Leader", title: "Step 3 — Select a team leader / manager",
        render: (d) => {
          const sec = regionSectors.find(s => s.id === d.sectorId);
          const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
          const users = usersForDepartment(d.departmentId);
          const chosen = users.find(u => u.id === d.teamLeaderId);
          return `
            <div class="alert alert--info">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>
                <strong>${escapeHtml(sec?.name || "—")}</strong> →
                <strong>${escapeHtml(dept?.name || "—")}</strong> ·
                ${users.length} user${users.length === 1 ? "" : "s"} available in this department.
              </div>
            </div>

            <div class="field">
              <label class="field__required">Team Leader / Manager</label>
              <select data-field="teamLeaderId" id="leader-select" ${users.length ? "" : "disabled"}>
                <option value="">
                  ${users.length ? "— Choose a team leader —" : "No users in this department yet"}
                </option>
                ${users.map(u => `
                  <option value="${u.id}" ${d.teamLeaderId===u.id?"selected":""}>
                    ${escapeHtml(u.name || u.email)} — ${escapeHtml(roleLabel(u.role))}${u.position ? " · " + escapeHtml(u.position) : ""}
                  </option>`).join("")}
              </select>
              <p class="field__hint">
                Users are managed on the
                <a href="users.html" style="color:var(--primary);font-weight:700">Users & Staff</a> page.
                Only active users with a placement in this department appear here.
              </p>
              ${!users.length ? `
                <p class="field__hint" style="color:var(--warning)">
                  ⚠ No active users in this department. Assign staff first on Users & Staff.
                </p>` : ""}
            </div>

            ${chosen ? `
              <div class="review" style="margin-top:14px">
                <div class="review__row"><span class="review__k">Name</span>
                  <span class="review__v">${escapeHtml(chosen.name || chosen.email || "—")}</span></div>
                <div class="review__row"><span class="review__k">Role</span>
                  <span class="review__v">${escapeHtml(roleLabel(chosen.role))}</span></div>
                ${chosen.position ? `
                  <div class="review__row"><span class="review__k">Position</span>
                    <span class="review__v">${escapeHtml(chosen.position)}</span></div>` : ""}
                ${chosen.email ? `
                  <div class="review__row"><span class="review__k">Email</span>
                    <span class="review__v">${escapeHtml(chosen.email)}</span></div>` : ""}
              </div>` : ""}
          `;
        },
        validate: d => {
          if (!d.departmentId) return "Please go back and select a department.";
          const users = usersForDepartment(d.departmentId);
          if (!users.length) return "This department has no active users yet. Add staff on the Users & Staff page first.";
          if (!d.teamLeaderId) return "Please select a team leader.";
          return null;
        },
        after: (root, data) => {
          const sel = root.querySelector("#leader-select");
          sel?.addEventListener("change", () => { data.teamLeaderId = sel.value; });
        }
      },
      {
        label: "Work Items", title: "Step 4 — List work items",
        render: (d) => {
          const sec = regionSectors.find(s => s.id === d.sectorId);
          const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
          const leader = USERS.find(u => u.id === d.teamLeaderId);
          return `
            <div class="alert alert--info">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>
                Planning for <strong>${escapeHtml(sec?.name || "—")}</strong>
                → <strong>${escapeHtml(dept?.name || "—")}</strong>
                · Team leader: <strong>${escapeHtml(leader?.name || leader?.email || "—")}</strong>.
                Load percentages across all rows must total <strong>100%</strong>.
              </div>
            </div>
            ${renderWorkTypeTable(d)}
          `;
        },
        validate: d => {
          const list = d.workTypes || [];
          if (!list.length) return "Add at least one work item.";

          for (let i = 0; i < list.length; i++) {
            const w = list[i];
            if (!w.name || w.name.trim().length < 2)
              return `Row ${i+1}: Work is required.`;
            const p = num(w.loadPercent);
            if (!(p > 0 && p <= 100))
              return `Row ${i+1}: Load must be between 1 and 100.`;
            if (!w.measure)
              return `Row ${i+1}: Choose a measurement.`;
            if (w.measure === "other" && !(w.measureOther || "").trim())
              return `Row ${i+1}: Specify a custom measurement.`;
            if (!(num(w.target) > 0))
              return `Row ${i+1}: Amount must be > 0.`;
          }

          const sumLoad = list.reduce((s,w) => s + num(w.loadPercent), 0);
          if (Math.abs(sumLoad - 100) > 0.01) {
            return `Load percentages sum to ${fmtNum(sumLoad)}% but must total exactly 100%.`;
          }
          return null;
        },
        after: (root, data, refresh) => {
          const PRESETS = { easy:25, medium:50, hard:75, very_hard:100 };

          function dotClassFor(w) {
            const p = num(w.loadPercent);
            if (p <= 0)   return "custom";
            if (p <= 25)  return "easy";
            if (p <= 50)  return "medium";
            if (p <= 75)  return "hard";
            return "very_hard";
          }
          function recolourDot(root, id) {
            const w = (data.workTypes || []).find(x => x.id === id);
            const dot = root.querySelector('[data-wt-dot="' + id + '"]');
            if (!w || !dot) return;
            dot.className = "worktype-table__dot worktype-table__dot--" + dotClassFor(w);
          }

          root.querySelectorAll("[data-wt-field]").forEach(inp => {
            const handler = () => {
              const id    = inp.dataset.wtId;
              const field = inp.dataset.wtField;
              const w = (data.workTypes || []).find(x => x.id === id);
              if (!w) return;
              w[field] = inp.value;

              if (field === "load") {
                const preset = PRESETS[inp.value];
                const wrap = root.querySelector('[data-wt-load-wrap="' + id + '"]');
                const pctInput = wrap ? wrap.querySelector('[data-wt-field="loadPercent"]') : null;
                if (preset != null && pctInput) {
                  pctInput.value = preset;
                  w.loadPercent = preset;
                } else if (pctInput && !pctInput.value) {
                  pctInput.focus();
                }
                recolourDot(root, id);
              }

              if (field === "loadPercent") {
                let p = num(inp.value);
                if (p < 0)   p = 0;
                if (p > 100) p = 100;
                if (String(p) !== inp.value && inp.value !== "") inp.value = p;
                w.loadPercent = inp.value === "" ? "" : p;
                recolourDot(root, id);
              }

              if (field === "measure") {
                const wrap = root.querySelector('[data-wt-measure-wrap="' + id + '"]');
                const other = wrap ? wrap.querySelector('[data-wt-field="measureOther"]') : null;
                const isOther = inp.value === "other";
                if (wrap) wrap.classList.toggle("is-other", isOther);
                if (other) {
                  other.disabled = !isOther;
                  if (!isOther) { other.value = ""; w.measureOther = ""; }
                  else if (!other.value) other.focus();
                }
              }

              refreshWorkTypeTotals(root, data);
            };
            inp.addEventListener("input", handler);
            inp.addEventListener("change", handler);
          });

          root.querySelector("#wt-add-row")?.addEventListener("click", () => {
            data.workTypes = data.workTypes || [];
            const newId = uid();
            data.workTypes.push({
              id: newId,
              name: "",
              load: "custom",
              loadPercent: "",
              measure: "number",
              measureOther: "",
              target: "",
              budget: "",
              description: ""
            });
            data.allocationsByWorkType[newId] = makeAllocRows();
            refresh();
          });

          root.querySelectorAll("[data-wt-remove]").forEach(btn => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.wtRemove;
              data.workTypes = (data.workTypes || []).filter(x => x.id !== id);
              delete data.allocationsByWorkType[id];
              refresh();
            });
          });
        }
      },
      {
        label: "Split to Clusters", title: "Step 5 — Split each work item across clusters",
        render: (d) => {
          const list = d.workTypes || [];
          if (!list.length) return `<div class="alert alert--error">No work items to split.</div>`;

          if (!regionClusters.length) {
            return `
              <div class="alert alert--warning">
                <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
                <div>
                  <strong>No clusters exist in ${escapeHtml(regionLabel(S.region))} yet.</strong><br>
                  You can save this regional work plan now without splitting it. Once a regional
                  admin adds clusters to this region, open the plan card and click
                  <strong>Split</strong> to allocate it.
                </div>
              </div>
              <div class="review" style="margin-top:14px">
                <div class="review__row"><span class="review__k">Plan status</span>
                  <span class="review__v">Will be saved as <strong>Regional only</strong> (no cluster split)</span></div>
                <div class="review__row"><span class="review__k">Work items</span>
                  <span class="review__v">${list.length}</span></div>
                <div class="review__row"><span class="review__k">Region</span>
                  <span class="review__v">${escapeHtml(regionLabel(S.region))}</span></div>
              </div>
            `;
          }

          return `
            <div class="alert alert--info">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>For each work item, split amount & budget across every cluster. Sum must equal total.</div>
            </div>
            ${list.map(w => {
              const allocs = d.allocationsByWorkType[w.id] || [];
              const sumT = allocs.reduce((s,a)=>s+num(a.target),0);
              const sumB = allocs.reduce((s,a)=>s+num(a.budget),0);
              const okT = Math.abs(sumT - num(w.target)) < 0.01;
              const okB = Math.abs(sumB - num(w.budget)) < 0.01;
              return `
                <div style="margin-bottom:24px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
                    <div>
                      <div style="font-weight:800;font-size:14px">${escapeHtml(w.name)}</div>
                      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
                        Load: <strong>${fmtNum(w.loadPercent)}%</strong> ·
                        Measurement: <strong>${escapeHtml(w.measure === "other" ? (w.measureOther || "Other") : w.measure)}</strong> ·
                        Total: <strong>${fmtNum(w.target)}</strong> ·
                        <strong>${fmtMoney(w.budget)} ETB</strong>
                      </div>
                    </div>
                    <span class="tag ${okT && okB ? "tag--green" : "tag--gold"}">
                      ${okT && okB ? "Balanced" : "Needs attention"}
                    </span>
                  </div>
                  <table class="alloc-table">
                    <thead><tr><th>Cluster</th><th style="width:130px">Amount</th><th style="width:160px">Budget (ETB)</th></tr></thead>
                    <tbody>
                      ${allocs.map((a,i) => `
                        <tr>
                          <td><strong>${escapeHtml(a.targetName)}</strong></td>
                          <td><input data-wt="${w.id}" data-alloc-target="${i}" type="number" min="0" step="0.01" value="${escapeHtml(a.target||"")}" placeholder="0"></td>
                          <td><input data-wt="${w.id}" data-alloc-budget="${i}" type="number" min="0" step="1" value="${escapeHtml(a.budget||"")}" placeholder="0"></td>
                        </tr>`).join("")}
                    </tbody>
                  </table>
                  ${allocSummary(w.target, allocs)}
                </div>`;
            }).join("")}`;
        },
        validate: d => {
          if (!regionClusters.length) return null;
          for (const w of (d.workTypes||[])) {
            const allocs = d.allocationsByWorkType[w.id] || [];
            const sumT = allocs.reduce((s,a)=>s+num(a.target),0);
            const sumB = allocs.reduce((s,a)=>s+num(a.budget),0);
            if (Math.abs(sumT - num(w.target)) > 0.01) return `"${w.name}": amounts sum to ${fmtNum(sumT)} but total is ${fmtNum(w.target)}.`;
            if (Math.abs(sumB - num(w.budget)) > 0.01) return `"${w.name}": budgets sum to ${fmtMoney(sumB)} but total is ${fmtMoney(w.budget)}.`;
          }
          return null;
        },
        after: (root, data) => {
          root.querySelectorAll("[data-wt][data-alloc-target]").forEach(inp => {
            inp.addEventListener("input", () => {
              const wtId = inp.dataset.wt;
              data.allocationsByWorkType[wtId][Number(inp.dataset.allocTarget)].target = inp.value;
              const block = inp.closest("div[style*='margin-bottom']");
              if (block) {
                const w = (data.workTypes||[]).find(x => x.id === wtId);
                const s = block.querySelector(".alloc-sum");
                if (w && s) s.outerHTML = allocSummary(w.target, data.allocationsByWorkType[wtId]);
              }
            });
          });
          root.querySelectorAll("[data-wt][data-alloc-budget]").forEach(inp => {
            inp.addEventListener("input", () => {
              const wtId = inp.dataset.wt;
              data.allocationsByWorkType[wtId][Number(inp.dataset.allocBudget)].budget = inp.value;
              const block = inp.closest("div[style*='margin-bottom']");
              if (block) {
                const w = (data.workTypes||[]).find(x => x.id === wtId);
                const s = block.querySelector(".alloc-sum");
                if (w && s) s.outerHTML = allocSummary(w.target, data.allocationsByWorkType[wtId]);
              }
            });
          });
        }
      },
      {
        label: "Review", title: "Step 6 — Review and create",
        render: (d) => {
          const sel = regionSectors.find(s => s.id === d.sectorId);
          const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
          const leader = USERS.find(u => u.id === d.teamLeaderId);
          const list = d.workTypes || [];
          const totalLoad = list.reduce((s,w) => s + num(w.loadPercent), 0);
          const totalBudget = list.reduce((s,w) => s + num(w.budget), 0);
          return `
            <div class="review" style="margin-bottom:18px">
              <div class="review__row"><span class="review__k">Sector</span>
                <span class="review__v">${escapeHtml(sel?.name || "—")} (${escapeHtml(sel?.code || "??")})</span></div>
              <div class="review__row"><span class="review__k">Department</span>
                <span class="review__v">${escapeHtml(dept?.name || "—")} (${escapeHtml(dept?.code || "??")})</span></div>
              <div class="review__row"><span class="review__k">Team Leader</span>
                <span class="review__v">${escapeHtml(leader?.name || leader?.email || "—")} — ${escapeHtml(roleLabel(leader?.role || ""))}</span></div>
              <div class="review__row"><span class="review__k">Region</span>
                <span class="review__v">${escapeHtml(regionLabel(S.region))}</span></div>
              <div class="review__row"><span class="review__k">Year</span>
                <span class="review__v">${currentYear}</span></div>
              <div class="review__row"><span class="review__k">Work items</span>
                <span class="review__v">${list.length}</span></div>
              <div class="review__row"><span class="review__k">Total load</span>
                <span class="review__v" style="color:${Math.abs(totalLoad-100)<0.01?"var(--success)":"var(--danger)"}">
                  <strong>${fmtNum(totalLoad)}%</strong> / 100%
                </span></div>
              <div class="review__row"><span class="review__k">Total of Budget</span>
                <span class="review__v"><strong>${fmtMoney(totalBudget)} ETB</strong></span></div>
              <div class="review__row"><span class="review__k">Cluster split</span>
                <span class="review__v">${regionClusters.length ? "Yes — " + regionClusters.length + " clusters" : "No clusters yet — will be saved regional only"}</span></div>
            </div>
            ${list.map(w => `
              <div class="review" style="margin-bottom:12px">
                <div class="review__row"><span class="review__k">Work</span>
                  <span class="review__v"><strong>${escapeHtml(w.name)}</strong></span></div>
                <div class="review__row"><span class="review__k">Load</span>
                  <span class="review__v">${fmtNum(w.loadPercent)}%</span></div>
                <div class="review__row"><span class="review__k">Measurement</span>
                  <span class="review__v">${escapeHtml(w.measure === "other" ? (w.measureOther || "Other") : w.measure)}</span></div>
                <div class="review__row"><span class="review__k">Amount</span>
                  <span class="review__v">${fmtNum(w.target)}</span></div>
                <div class="review__row"><span class="review__k">Budget</span>
                  <span class="review__v">${fmtMoney(w.budget)} ETB</span></div>
                ${w.description ? `<div class="review__row"><span class="review__k">Description</span>
                  <span class="review__v">${escapeHtml(w.description)}</span></div>` : ""}
              </div>`).join("")}`;
        }
      }
    ],
    onFinish: async (d) => {
      const sel = regionSectors.find(s => s.id === d.sectorId);
      if (!sel) throw new Error("Selected sector no longer exists.");
      const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
      if (!dept) throw new Error("Selected department no longer exists.");
      const leader = USERS.find(u => u.id === d.teamLeaderId);
      if (!leader) throw new Error("Selected team leader no longer exists.");
      const list = d.workTypes || [];
      if (!list.length) throw new Error("No work items to save.");
      const sectorName = sel.name || "Unnamed sector";
      const departmentName = dept.name || "Unnamed department";

      function derivedUnit(w) {
        const m = w.measure || "number";
        if (m === "other")      return (w.measureOther || "unit").trim();
        if (m === "number")     return "count";
        if (m === "time")       return "hours";
        if (m === "money")      return "ETB";
        if (m === "percentage") return "%";
        return "unit";
      }
      function loadSummary(w) {
        const p = num(w.loadPercent);
        if (!p) return null;
        if (p <= 25)  return `Easy · ${p}%`;
        if (p <= 50)  return `Medium · ${p}%`;
        if (p <= 75)  return `Hard · ${p}%`;
        return `Very Hard · ${p}%`;
      }

      for (const w of list) {
        const allocs = regionClusters.length
          ? (d.allocationsByWorkType[w.id] || [])
          : [];
        const payload = {
          level: "regional",
          workTypeId: w.id,
          workTypeName: w.name,
          workTypeLoad: w.load || null,
          workTypeLoadPercent: num(w.loadPercent),
          workTypeLoadLabel: loadSummary(w),
          workTypeMeasure: w.measure || null,
          workTypeMeasureOther: w.measure === "other" ? (w.measureOther || null) : null,
          title: `${w.name} — ${sectorName} / ${departmentName} ${currentYear}`,
          description: w.description || null,
          unit: derivedUnit(w),
          target: num(w.target),
          budget: num(w.budget),
          year: currentYear,
          period: "yearly",
          status: "active",
          regionCode: sel.regionCode || sel.region || S.region,
          sectorId: sel.id,
          sectorName,
          sectorCode: sel.code || null,
          departmentId: dept.id,
          departmentName: dept.name || null,
          departmentCode: dept.code || null,
          teamLeaderId: leader.id,

/* ============================================================
   SPLIT REGIONAL PLAN TO CLUSTERS (post-creation)
   ============================================================ */
function openSplitRegionalPlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (p.level !== "regional") { toast("Only regional plans can be split to clusters.", "error"); return; }
  if ((p.allocations || []).length > 0) { toast("This plan is already split.", "error"); return; }

  const regionClusters = CLUSTERS.filter(c => c.regionCode === (p.regionCode || S.region));
  if (!regionClusters.length) {
    toast("No clusters exist in this region yet. Ask a regional admin to add clusters first.", "error");
    return;
  }

  openWizard({
    title: "Split to Clusters",
    subtitle: p.workTypeName || p.title || "Regional plan",
    finishLabel: "Send to Clusters",
    successMessage: "Allocation sent to clusters.",
    size: "lg",
    initial: {
      target: p.target,
      budget: p.budget,
      unit: p.unit,
      allocations: regionClusters.map(c => ({
        targetType: "cluster",
        targetId: c.id,
        targetName: c.code ? c.code + " — " + c.name : c.name,
        target: "",
        budget: ""
      }))
    },
    steps: [
      {
        label: "Split", title: "Split amount & budget across clusters",
        render: (d) => `
          <div class="alert alert--info">
            <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
            <div>
              Splitting <strong>${fmtNum(p.target)} ${escapeHtml(p.unit || "")}</strong>
              and <strong>${fmtMoney(p.budget)} ETB</strong> across
              ${regionClusters.length} cluster${regionClusters.length === 1 ? "" : "s"}.
            </div>
          </div>
          <table class="alloc-table">
            <thead>
              <tr>
                <th>Cluster</th>
                <th style="width:140px">Amount</th>
                <th style="width:160px">Budget (ETB)</th>
              </tr>
            </thead>
            <tbody>
              ${d.allocations.map((a, i) => `
                <tr>
                  <td><strong>${escapeHtml(a.targetName)}</strong></td>
                  <td><input data-alloc-target="${i}" type="number" min="0" step="0.01"
                             value="${escapeHtml(a.target || "")}" placeholder="0"></td>
                  <td><input data-alloc-budget="${i}" type="number" min="0" step="1"
                             value="${escapeHtml(a.budget || "")}" placeholder="0"></td>
                </tr>`).join("")}
            </tbody>
          </table>
          ${allocSummary(d.target, d.allocations)}`,
        validate: d => {
          const sumT = d.allocations.reduce((s,a) => s + num(a.target), 0);
          const sumB = d.allocations.reduce((s,a) => s + num(a.budget), 0);
          if (Math.abs(sumT - num(d.target)) > 0.01)
            return `Amounts sum to ${fmtNum(sumT)} but total is ${fmtNum(d.target)}.`;
          if (Math.abs(sumB - num(d.budget)) > 0.01)
            return `Budgets sum to ${fmtMoney(sumB)} but total is ${fmtMoney(d.budget)}.`;
          return null;
        },
        after: (root, data) => {
          root.querySelectorAll("[data-alloc-target]").forEach(inp => {
            inp.addEventListener("input", () => {
              data.allocations[Number(inp.dataset.allocTarget)].target = inp.value;
              const s = root.querySelector(".alloc-sum");
              if (s) s.outerHTML = allocSummary(data.target, data.allocations);
            });
          });
          root.querySelectorAll("[data-alloc-budget]").forEach(inp => {
            inp.addEventListener("input", () => {
              data.allocations[Number(inp.dataset.allocBudget)].budget = inp.value;
              const s = root.querySelector(".alloc-sum");
              if (s) s.outerHTML = allocSummary(data.target, data.allocations);
            });
          });
        }
      }
    ],
    onFinish: async (d) => {
      const allocs = d.allocations.map(a => ({
        targetType: "cluster",
        targetId: a.targetId,
        targetName: a.targetName,
        target: num(a.target),
        budget: num(a.budget),
        childPlanId: null
      }));
      await updateDoc(doc(db, "workplans", planId), {
        allocations: allocs,
        updatedAt: serverTimestamp()
      });
      try {
        await addDoc(collection(db, "notifications"), {
          type: "workplan_split_to_clusters",
          title: "Work plan split to clusters",
          body: `${S.name} split "${p.workTypeName || p.title}" across ${allocs.length} clusters.`,
          forRoles: ["super_admin", "regional_admin", "cluster_directorate"],
          link: "workplans.html", read: false,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

              <td>${fmtNum(a.target)} ${escapeHtml(p.unit||"")}</td>
              <td>${fmtMoney(a.budget)} ETB</td>
              ${!isScopedViewer() ? '<td>' +
                (a.childPlanId
                  ? '<span class="tag tag--green">Split</span>'
                  : a.accepted
                    ? '<span class="tag tag--blue">Accepted</span>'
                    : '<span class="tag tag--gold">Pending</span>') +
                '</td>' : ""}
            </tr>`).join("")}
          </tbody></table>` : ""}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${mine ? `<button class="btn btn--gold" id="view-breakdown-btn">
        <svg viewBox="0 0 24 24">${ICONS.split}</svg> Break down
      </button>` : ""}
      ${!isScopedViewer() && canEditPlan(p) ? `<button class="btn btn--primary" id="view-edit-btn">
        <svg viewBox="0 0 24 24">${ICONS.edit}</svg> Edit</button>` : ""}
    </div>
  `);
  document.getElementById("view-edit-btn")?.addEventListener("click", () => {
    closeModal(); setTimeout(() => openEditPlan(planId), 100);
  });
  document.getElementById("view-breakdown-btn")?.addEventListener("click", () => {
    if (mine) { closeModal(); setTimeout(() => openBreakdownWizard(p, mine.alloc), 100); }
  });
}
function openEditPlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (!canEditPlan(p)) { toast("You cannot edit this plan", "error"); return; }
  openModal(`
    <div class="modal__head">
      <div><div class="modal__title">Edit Work Plan</div>
        <div class="modal__sub">${escapeHtml(p.workTypeName || p.title)}</div></div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="field"><label>Title</label>
        <input id="ep-title" value="${escapeHtml(p.title||"")}"></div>
      <div class="field"><label>Description</label>
        <textarea id="ep-desc">${escapeHtml(p.description||"")}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Amount</label>
          <input id="ep-target" type="number" min="0" step="0.01" value="${p.target||0}"></div>
        <div class="field"><label>Budget (ETB)</label>
          <input id="ep-budget" type="number" min="0" step="1" value="${p.budget||0}"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="ep-status">
          ${Object.entries(STATUS_META).map(([k,m]) => `<option value="${k}" ${p.status===k?"selected":""}>${m.label}</option>`).join("")}
        </select></div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="ep-submit">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save</span>
      </button>
    </div>
  `);
  document.getElementById("ep-submit").addEventListener("click", async () => {
    const btn = document.getElementById("ep-submit");
    const sp = btn.querySelector(".spinner"), lbl = btn.querySelector(".btn-label");
    btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Saving…";
    try {
      await updateDoc(doc(db, "workplans", planId), {
        title: document.getElementById("ep-title").value.trim(),
        description: document.getElementById("ep-desc").value.trim() || null,
        target: num(document.getElementById("ep-target").value),
        budget: num(document.getElementById("ep-budget").value),
        status: document.getElementById("ep-status").value,
        updatedAt: serverTimestamp()
      });
      toast("Work plan updated","success");
      closeModal();
    } catch (err) {
      toast(err.message||"Failed to save","error");
      btn.disabled = false; sp.classList.add("hidden"); lbl.textContent = "Save";
    }
  });
}
function confirmDeletePlan(planId) {
  const p = PLANS.find(x => x.id === planId);
  if (!p) return;
  if (!canDeletePlan(p)) { toast("You cannot delete this plan", "error"); return; }
  openModal(`
    <div class="modal__head">
      <div><div class="modal__title">Delete work plan?</div>
        <div class="modal__sub">This cannot be undone</div></div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to delete:</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">${escapeHtml(p.workTypeName || p.title || "Untitled")}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(planScopeLine(p))}</div>
        </div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--danger" id="confirm-del">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Delete</span>
      </button>
    </div>
  `);
  document.getElementById("confirm-del").addEventListener("click", async () => {
    const btn = document.getElementById("confirm-del");
    const sp = btn.querySelector(".spinner"), lbl = btn.querySelector(".btn-label");
    btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Deleting…";
    try {
      await deleteDoc(doc(db, "workplans", planId));
      toast("Work plan removed","success");
      closeModal();
    } catch (err) {
      toast(err.message||"Failed","error");
      btn.disabled = false; sp.classList.add("hidden"); lbl.textContent = "Delete";
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function subscribePlans() {
  if (unsubPlans) unsubPlans();
  let q = collection(db, "workplans");
  if (!isSuper() && S?.region) {
    q = query(q, where("regionCode", "==", S.region));
  }
  console.log("[workplans] subscribing plans:", isSuper() ? "all" : ("region=" + S.region));

  unsubPlans = onSnapshot(q,
    (snap) => {
      PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      console.log("[workplans] plans loaded:", PLANS.length,
                  "| visible:", visiblePlans().length,
                  "| mine:", myAllocationRows().length);
      render();
    },
    (err) => {
      console.warn("[workplans] plans subscription failed:", err.code, err.message);
      const fallback = onSnapshot(collection(db, "workplans"),
        (snap) => {
          PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          render();
        },
        (e2) => {
          console.error("[workplans] fallback also failed:", e2.code, e2.message);
          toast("workplans: " + (e2.code || e2.message), "error");
        });
      unsubPlans = fallback;
    });
}

function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  let q = collection(db, "users");
  if (isRegionalAdmin() && S.region) q = query(q, where("region", "==", S.region));
  else if ((isClusterDir() || isClusterAdmin()) && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  else if ((isWoredaCity() || isManager()) && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubUsers = onSnapshot(q, (snap) => {
    USERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[users]", err.code, err.message));
}

function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (S?.region) q = query(q, where("regionCode","==",S.region));
  unsubClusters = onSnapshot(q, (snap) => {
    CLUSTERS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[clusters]", err.code, err.message));
}

function subscribeSectors() {
  if (unsubSectors) unsubSectors();
  let q = collection(db, "sectors");
  if (S?.region) q = query(q, where("regionCode", "==", S.region));
  unsubSectors = onSnapshot(q,
    (snap) => {
      SECTORS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      render();
    },
    (err) => {
      console.warn("[workplans] sectors onSnapshot error:", err.code, err.message);
      const fq = S?.region
        ? query(collection(db, "sectors"), where("regionCode", "==", S.region))
        : collection(db, "sectors");
      getDocs(fq).then(s => {
        SECTORS = s.docs.map(d => ({ id:d.id, ...d.data() }));
        render();
      }).catch(e => console.error("[workplans] fallback failed:", e.code, e.message));
    });
}

function subscribeDepartments() {
  if (unsubDepartments) unsubDepartments();
  let q = collection(db, "departments");
  if (S?.region) q = query(q, where("regionCode", "==", S.region));
  unsubDepartments = onSnapshot(q,
    (snap) => {
      DEPARTMENTS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      render();
    },
    (err) => console.warn("[workplans] departments onSnapshot error:", err.code, err.message));
}

/* ============================================================
   SHELL BINDINGS
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () =>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

let searchTimer;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTerm = e.target.value; renderPlans(); }, 130);
});
document.getElementById("level-filter").addEventListener("change", (e) => {
  filterLevel = e.target.value; renderPlans();
});
document.getElementById("status-filter").addEventListener("change", (e) => {
  filterStatus = e.target.value; renderPlans();
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (e) { console.warn("[user read]", e); }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    region: userDoc?.region || userDoc?.regionCode || "",
    regionCode: userDoc?.regionCode || userDoc?.region || "",
    clusterId: userDoc?.clusterId || "",
    clusterName: userDoc?.clusterName || "",
    woredaCode: userDoc?.woredaCode || "",
    woredaName: userDoc?.woredaName || "",
    sectorId: userDoc?.sectorId || "",
    sectorName: userDoc?.sectorName || "",
    departmentId: userDoc?.departmentId || "",
    officeId: userDoc?.officeId || "",
    isDirector: userDoc?.isDirector === true
  };
  console.log("[workplans] session:", {
    role: S.role, region: S.region,
    clusterId: S.clusterId, woredaCode: S.woredaCode
  });

  const allowed = ["super_admin","regional_admin","directorate","cluster_directorate","woreda_city","manager","admin","employee"];
  if (!allowed.includes(S.role)) { window.location.replace("dashboard.html"); return; }

  renderSidebar();
  renderUser();
  render();

  try { await auth.currentUser?.getIdToken(true); } catch (e) {}
  await new Promise(r => setTimeout(r, 200));

  subscribeClusters();
  subscribeSectors();
  subscribeDepartments();
  subscribeUsers();
  subscribePlans();
});

console.log("[workplans] booted — pending pill clickable, banner removed");
</script>
