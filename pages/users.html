            <div class="field-row field-row--3">
              <div class="field"><label>Full name</label><input data-field="mother_name" value="${escapeHtml(d.mother_name || "")}" placeholder="Almaz Kebede"></div>
              <div class="field"><label>Phone</label><div class="phone-group"><span class="phone-group__cc">+251</span><input data-field="mother_phone" value="${escapeHtml(d.mother_phone || "")}" placeholder="912 345 678" inputmode="numeric"></div></div>
              <div class="field"><label>Status</label><select data-field="mother_status"><option value="">—</option><option value="alive" ${d.mother_status === "alive" ? "selected" : ""}>Alive</option><option value="deceased" ${d.mother_status === "deceased" ? "selected" : ""}>Deceased</option></select></div>
            </div>
          </div>

          <div class="kin-card">
            <div class="kin-card__title"><svg viewBox="0 0 24 24">${ICONS.user}</svg> Spouse</div>
            <div class="field-row field-row--3">
              <div class="field"><label>Full name</label><input data-field="spouse_name" value="${escapeHtml(d.spouse_name || "")}" placeholder="Hanna Tesfaye"></div>
              <div class="field"><label>Phone</label><div class="phone-group"><span class="phone-group__cc">+251</span><input data-field="spouse_phone" value="${escapeHtml(d.spouse_phone || "")}" placeholder="912 345 678" inputmode="numeric"></div></div>
              <div class="field"><label>Marriage date</label><input data-field="spouse_marriageDate" type="date" value="${escapeHtml(d.spouse_marriageDate || "")}"></div>
            </div>
          </div>

          <div class="kin-card">
            <div class="kin-card__title"><svg viewBox="0 0 24 24">${ICONS.alert}</svg> Emergency contact</div>
            <div class="field-row field-row--3">
              <div class="field"><label class="field__required">Full name</label><input data-field="emergency_name" value="${escapeHtml(d.emergency_name || "")}" placeholder="Full name"></div>
              <div class="field"><label class="field__required">Relationship</label><input data-field="emergency_relation" value="${escapeHtml(d.emergency_relation || "")}" placeholder="Brother, Sister…"></div>
              <div class="field"><label class="field__required">Phone</label><div class="phone-group"><span class="phone-group__cc">+251</span><input data-field="emergency_phone" value="${escapeHtml(d.emergency_phone || "")}" placeholder="912 345 678" inputmode="numeric"></div></div>
            </div>
          </div>

          <div class="kin-card">
            <div class="kin-card__title"><svg viewBox="0 0 24 24">${ICONS.users}</svg> Children (comma-separated)</div>
            <div class="field"><label>Names &amp; ages</label>
              <textarea data-field="children" placeholder="Sara (8), Dawit (5), …">${escapeHtml(d.children || "")}</textarea>
            </div>
          </div>
        `,
        validate: (d) => {
          if (!d.emergency_name || d.emergency_name.trim().length < 2) return "Emergency contact name is required.";
          if (!d.emergency_relation || d.emergency_relation.trim().length < 2) return "Emergency contact relationship is required.";
          const ph = normalizePhone(d.emergency_phone || "");
          if (ph.length !== PHONE_LENGTH) return `Emergency contact phone must be exactly ${PHONE_LENGTH} digits.`;
          return null;
        }
      },
      /* ADDRESS */
      {
        label: "Address", title: "Residential address",
        render: (d) => renderAddressFields(d, { prefix: "addr" }),
        validate: (d) => {
          if (!d.addr_country) return "Country is required.";
          if (!d.addr_region) return "Region is required.";
          if (!d.addr_zoneId) return "Cluster / Zone / City is required.";
          return null;
        },
        after: (root, data, refresh) => { wireAddressFields(root, data, { prefix: "addr" }, refresh); }
      },
      /* CONTACT */
      {
        label: "Contact", title: "Contact",
        render: (d) => `
          <div class="field-row">
            <div class="field">
              <label class="field__required">Primary phone</label>
              <div class="phone-group">
                <span class="phone-group__cc">+251</span>
                <input id="phone-primary" data-field="phone" value="${escapeHtml(d.phone || "")}"
                       placeholder="912 345 678" inputmode="numeric" autocomplete="off">
              </div>
              <p class="field__hint">Exactly <strong>9 digits</strong> after +251.</p>
            </div>
            <div class="field">
              <label>Alternate phone</label>
              <div class="phone-group">
                <span class="phone-group__cc">+251</span>
                <input data-field="phoneAlt" value="${escapeHtml(d.phoneAlt || "")}" placeholder="912 345 678" inputmode="numeric">
              </div>
            </div>
          </div>
        `,
        validate: (d) => {
          if (!d.phone) return "Primary phone is required.";
          const ph = normalizePhone(d.phone);
          if (ph.length !== PHONE_LENGTH) return `Phone number must be exactly ${PHONE_LENGTH} digits after the country code (+251).`;
          const st = duplicateStatus.phone;
          if (!st.ok) {
            if (st.reason === "duplicate") return "This phone number is already registered.";
            if (st.reason === "incomplete") return `Phone number must be exactly ${PHONE_LENGTH} digits.`;
            return "Please wait — checking phone number for duplicates.";
          }
          return null;
        },
        after: (root, data) => {
          const phoneInput = root.querySelector("#phone-primary");
          phoneInput?.addEventListener("input", () => {
            let v = phoneInput.value.replace(/\D/g, "");
            if (v.startsWith("251") && v.length > PHONE_LENGTH) v = v.slice(3);
            if (v.startsWith("0")) v = v.slice(1);
            v = v.slice(0, PHONE_LENGTH);
            if (phoneInput.value !== v) phoneInput.value = v;
            data.phone = v;
          });
          setupLiveDuplicate(root, "phone-primary", "phone", "phone number", (type, status) => {
            duplicateStatus[type] = status;
          });
        }
      },
      /* FINGERPRINT (optional) */
      {
        label: "Fingerprint", title: "Register fingerprint (optional)",
        render: (d) => {
          const hasCred = !!d._fingerprintCredentialId;
          const supported = FP_SUPPORTED;
          return `
            <div class="fp-capture ${hasCred ? "is-success" : ""}" id="fp-capture">
              <div class="fp-capture__ring">
                <svg class="fp-capture__icon" viewBox="0 0 24 24">${ICONS.fingerprint}</svg>
              </div>
              <div class="fp-capture__title">
                ${hasCred ? "Fingerprint captured" : "Register fingerprint for this person"}
              </div>
              <div class="fp-capture__msg">
                ${hasCred
                  ? "The fingerprint credential has been registered on this device."
                  : supported
                    ? "Ask the person to place their finger on the sensor."
                    : "Fingerprint capture is not available on this device or browser. You can skip this step."}
              </div>
              ${hasCred ? `
                <div class="fp-capture__badge"><svg viewBox="0 0 24 24">${ICONS.check}</svg> Credential captured</div>
                <button type="button" class="btn btn--sm" id="fp-reset" style="margin-top:14px">
                  <svg viewBox="0 0 24 24">${ICONS.trash}</svg> Remove &amp; re-scan
                </button>
              ` : supported ? `
                <button type="button" class="btn" id="fp-scan" style="margin-top:18px">
                  <svg viewBox="0 0 24 24">${ICONS.fingerprint}</svg> Scan fingerprint
                </button>
              ` : ""}
            </div>`;
        },
        validate: () => null,
        after: (root, data, refresh) => {
          const scanBtn  = root.querySelector("#fp-scan");
          const resetBtn = root.querySelector("#fp-reset");
          const scanEl   = root.querySelector("#fp-capture");
          scanBtn?.addEventListener("click", async () => {
            if (!FP_SUPPORTED) { toast("Fingerprint not supported", "error"); return; }
            const available = await fpIsAvailable();
            if (!available) { toast("No platform biometric available on this device", "error"); return; }
            scanEl.classList.remove("is-success","is-error");
            scanEl.classList.add("is-scanning");
            try {
              const natId = normalizeNationalId(data.nationalId || "");
              const userId = natId || ("u" + Date.now().toString(36));
              const userName = data.email || ("user-" + userId);
              const displayName = [data.firstName, data.lastName].filter(Boolean).join(" ") || userName;
              const reg = await fpRegisterForPerson({ userId, userName, displayName });
              data._fingerprintCredentialId = reg.credentialId;
              data._fingerprintTransports = reg.transports;
              data._fingerprintRpId = reg.rpId;
              toast("Fingerprint captured", "success");
              refresh();
            } catch (err) {
              scanEl.classList.remove("is-scanning");
              scanEl.classList.add("is-error");
              toast(err.name === "NotAllowedError" ? "Scan cancelled" : (err.message || "Scan failed"), "error");
              setTimeout(refresh, 1400);
            }
          });
          resetBtn?.addEventListener("click", () => {
            data._fingerprintCredentialId = null;
            data._fingerprintTransports = null;
            data._fingerprintRpId = null;
            refresh();
          });
        }
      },
      /* PLACEMENT */
      {
        label: "Placement", title: "Sector → Department → Regional / Cluster",
        render: (d) => renderPlacementFields(d, { prefix: "emp" }),
        validate: (d) => validatePlacementFields(d, { prefix: "emp" }),
        after: (root, data, refresh) => wirePlacementFields(root, data, { prefix: "emp" }, refresh)
      },
      /* EMPLOYMENT */
      {
        label: "Employment", title: "Employment & compensation",
        render: (d) => renderEmploymentFields(d, { prefix: "emp" }),
        validate: (d) => validateEmploymentFields(d, { prefix: "emp" }),
        after: () => {}
      },
      /* ROLE */
      {
        label: "Role", title: "Role",
        render: (d) => renderRoleFields(d, { prefix: "emp" }, assignableRoles()),
        validate: (d) => validateRoleFields(d, { prefix: "emp" }),
        after: (root, data) => wireRoleFields(root, data, { prefix: "emp" })
      },
      /* REVIEW */
      {
        label: "Review", title: "Confirm and create person record",
        render: (d) => {
          const hasFp = !!d._fingerprintCredentialId;
          const zone = zonesForRegion(d.addr_region).find(z => z.id === d.addr_zoneId);
          const sector = SECTORS.find(s => s.id === d.emp_sectorId);
          const dep    = DEPARTMENTS.find(x => x.id === d.emp_departmentId);
          const cl     = d.emp_clusterId ? CLUSTERS.find(c => c.id === d.emp_clusterId) : null;
          return `
            <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px">
              <div class="user-avatar" style="width:70px;height:70px;font-size:24px">
                ${d._photo ? `<img src="${d._photo}" alt="">` : escapeHtml(initials([d.firstName, d.lastName].filter(Boolean).join(" ")))}
              </div>
              <div style="min-width:0">
                <div style="font-size:17px;font-weight:800">${escapeHtml([d.firstName, d.middleName, d.lastName].filter(Boolean).join(" "))}</div>
                <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d.firstNameAm || "")} ${escapeHtml(d.lastNameAm || "")}</div>
              </div>
            </div>
            <div class="review-section">Personal</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Gender</span><span class="review__v">${d.gender === "M" ? "Male" : "Female"}</span></div>
              <div class="review__row"><span class="review__k">Date of birth</span><span class="review__v">${escapeHtml(d.dob || "—")}</span></div>
              <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatNationalIdDisplay(d.nationalId) || "—")}</span></div>
            </div>
            <div class="review-section">Address</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(d.addr_region) || "—")}</span></div>
              <div class="review__row"><span class="review__k">Cluster / Zone / City</span><span class="review__v">${escapeHtml(zone ? zone.code + " — " + zone.name : "—")}</span></div>
            </div>
            <div class="review-section">Contact</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Phone</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatPhoneDisplay(d.phone) || "—")}</span></div>
              <div class="review__row"><span class="review__k">Fingerprint</span>
                <span class="review__v">
                  ${hasFp
                    ? `<span class="fp-mini-badge" style="background:#ecfdf3;color:#067647"><svg viewBox="0 0 24 24">${ICONS.check}</svg> REGISTERED</span>`
                    : `<span style="color:var(--muted)">— skipped —</span>`}
                </span>
              </div>
            </div>
            <div class="review-section">Placement</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sector?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dep?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(cl?.name || "—")}</span></div>
            </div>
            <div class="review-section">Employment &amp; pay</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(d.emp_position || "—")}</span></div>
              <div class="review__row"><span class="review__k">Basic salary</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(fmtMoney(d.emp_basicSalary) || "0")} ETB</span></div>
            </div>
            <div class="review-section">Role</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Role</span><span class="review__v"><span class="role-badge role-badge--${d.emp_role}">${escapeHtml(roleLabel(d.emp_role))}</span></span></div>
            </div>
            <div class="alert alert--info" style="margin-top:16px">
              <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg>
              <div>This creates the <strong>person record with everything</strong> — no login yet.<br><br>
                <strong>Step 2</strong> — click <strong>Assign Role &amp; Work Area</strong> to create the login.</div>
            </div>`;
        }
      }
    ],
    onFinish: async (d) => {
      const natIdNorm = normalizeNationalId(d.nationalId);
      const phoneNorm = normalizePhone(d.phone);
      if (natIdNorm.length !== NAT_ID_LENGTH) throw new Error(`National ID must be exactly ${NAT_ID_LENGTH} digits.`);
      if (phoneNorm.length !== PHONE_LENGTH)  throw new Error(`Phone number must be exactly ${PHONE_LENGTH} digits.`);

      const dupNat = await findEmployeeByNationalId(natIdNorm);
      if (dupNat) throw new Error(`National ID is already registered.`);
      const dupPhone = await findEmployeeByPhone(phoneNorm);
      if (dupPhone) throw new Error(`Phone number is already registered.`);

      const nameEn = [d.firstName, d.middleName, d.lastName].filter(Boolean).map(s => s.trim()).join(" ");
      const nameAm = [d.firstNameAm, d.middleNameAm, d.lastNameAm].filter(Boolean).map(s => s.trim()).join(" ") || null;
      const nameOm = [d.firstNameOm, d.middleNameOm, d.lastNameOm].filter(Boolean).map(s => s.trim()).join(" ") || null;
      const phoneDisplay = "+251 " + phoneNorm.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");
      const phoneAltNorm = normalizePhone(d.phoneAlt || "");
      const phoneAltDisplay = phoneAltNorm.length === PHONE_LENGTH
        ? "+251 " + phoneAltNorm.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3")
        : (d.phoneAlt?.trim() || null);

      let natLocked = false, phoneLocked = false;
      try {
        await reserveUnique("nationalId", natIdNorm, natIdNorm, "(pending)", nameEn);
        natLocked = true;
        await reserveUnique("phone", phoneNorm, phoneNorm, "(pending)", nameEn);
        phoneLocked = true;
      } catch (err) {
        if (natLocked) await releaseUnique("nationalId", natIdNorm);
        if (phoneLocked) await releaseUnique("phone", phoneNorm);
        throw err;
      }

      const empRef = doc(collection(db, "employees"));
      const fingerprint = d._fingerprintCredentialId ? {
        credentialId: d._fingerprintCredentialId,
        transports: d._fingerprintTransports || [],
        rpId: d._fingerprintRpId || location.hostname,
        deviceLabel: navigator.platform || "Enrolment device",
        createdAt: Date.now(),
        registeredBy: S.uid,
        registeredByName: S.name
      } : null;
      const fingerprintArray = fingerprint ? [fingerprint] : [];

      const family = {
        father: { name: d.father_name||null, phone: d.father_phone||null, status: d.father_status||null, region: d.father_region||null, woreda: d.father_woreda||null },
        mother: { name: d.mother_name||null, phone: d.mother_phone||null, status: d.mother_status||null, region: d.mother_region||null, woreda: d.mother_woreda||null },
        spouse: { name: d.spouse_name||null, phone: d.spouse_phone||null, marriageDate: d.spouse_marriageDate||null },
        children: (d.children||"").trim() || null,
        emergency: { name: d.emergency_name||null, relation: d.emergency_relation||null, phone: d.emergency_phone||null }
      };
      const address = {
        country: d.addr_country || "ET",
        region: d.addr_region || null,
        zoneId: d.addr_zoneId || null,
        woredaCode: d.addr_woredaCode || null,
        subCity: d.addr_subCity || null,
        kebele: d.addr_kebele || null,
        houseNo: d.addr_houseNo || null,
        street: d.addr_street || null,
        poBox: d.addr_poBox || null
      };

      const placement = buildPlacementPatch(d, { prefix: "emp" });

      try {
        await setDoc(empRef, {
          empId: null, seq: null, uid: null,
          role: d.emp_role,
          status: "pending_login",
          ...placement,
          isDirector: false,
          position: (d.emp_position || "").trim() || null,
          hireDate: d.emp_hireDate || null,
          employmentType: d.emp_employmentType || "permanent",
          basicSalary: Number(d.emp_basicSalary) || 0,
          transportAllowance: Number(d.emp_transportAllowance) || 0,
          housingAllowance: Number(d.emp_housingAllowance) || 0,
          positionAllowance: Number(d.emp_positionAllowance) || 0,
          otherAllowance: Number(d.emp_otherAllowance) || 0,
          financeRole: d.emp_role === "finance" ? (d.emp_financeRole || null) : null,
          hrmRole: d.emp_role === "hrm" ? (d.emp_hrmRole || null) : null,
          firstName: d.firstName.trim(),
          middleName: d.middleName?.trim() || null,
          lastName: d.lastName.trim(),
          firstNameAm: d.firstNameAm.trim(),
          middleNameAm: d.middleNameAm?.trim() || null,
          lastNameAm: d.lastNameAm.trim(),
          firstNameOm: d.firstNameOm.trim(),
          middleNameOm: d.middleNameOm?.trim() || null,
          lastNameOm: d.lastNameOm.trim(),
          nameEn, nameAm, nameOm, fullName: nameEn,
          photoURL: d._photo,
          nationalId: natIdNorm, nationalIdNorm: natIdNorm,
          gender: d.gender, dob: d.dob,
          maritalStatus: d.maritalStatus || null,
          phone: phoneDisplay, phoneNorm, phoneAlt: phoneAltDisplay,
          email: null,
          family, address,
          active: false,
          hasLogin: false,
          fingerprints: fingerprintArray,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (err) {
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }

      try {
        await addDoc(collection(db, "notifications"), {
          type: "person_added",
          title: "New person added (no login yet)",
          body: `${nameEn} was added with placement, employment and role. Assign Role to create their login.`,
          targetEmpId: empRef.id,
          forRoles: ["super_admin","hrm","finance",
                     "regional_admin","regional_hrm","regional_finance",
                     "admin","cluster_hrm","cluster_finance",
                     "woreda_admin","woreda_hrm","woreda_finance"],
          link: "users.html",
          read: false,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

/* ============================================================
   ASSIGN WIZARD — Step 2
   ============================================================ */
function openAssignWizard(preselectedUserId = null) {
  if (!canAssignRoles()) { toast("You cannot assign roles", "error"); return; }

  if (preselectedUserId) {
    const u = USERS.find(x => x.id === preselectedUserId);
    if (!u) { toast("User not found", "error"); return; }
    if (!employeesByUid[u.id] && !employeesById[u.id]) {
      toast("This person has no staff record yet. Use Add Person (Step 1) first.", "error");
      return;
    }
  }

  const preselected = preselectedUserId ? USERS.find(u => u.id === preselectedUserId) : null;

  function suggestLoginEmail(emp) {
    if (!emp) return "";
    const base = (emp.nameEn || [emp.firstName, emp.lastName].filter(Boolean).join(" ") || "user")
      .toLowerCase().replace(/[^a-z0-9]+/g, ".")
      .replace(/^\.+|\.+$/g, "");
    return base ? `${base}@csmis.gov.et` : "user@csmis.gov.et";
  }

  const emailStatus = { ok:false, empty:true };

  function prefillFromEmp(emp) {
    if (!emp) return {};
    return {
      emp_workLevel: emp.clusterId ? "cluster" : "regional",
      emp_clusterLevel: emp.woredaCode ? "woreda" : "cluster",
      emp_sectorId: emp.sectorId || "",
      emp_departmentId: emp.departmentId || "",
      emp_clusterId: emp.clusterId || "",
      emp_woredaCode: emp.woredaCode || "",
      emp_officeId: emp.officeId || "",
      emp_position: emp.position || "",
      emp_hireDate: emp.hireDate || "",
      emp_employmentType: emp.employmentType || "permanent",
      emp_basicSalary: emp.basicSalary || "",
      emp_transportAllowance: emp.transportAllowance || "",
      emp_housingAllowance: emp.housingAllowance || "",
      emp_positionAllowance: emp.positionAllowance || "",
      emp_otherAllowance: emp.otherAllowance || "",
      emp_role: emp.role || "employee",
      emp_financeRole: emp.financeRole || "",
      emp_hrmRole: emp.hrmRole || ""
    };
  }

  const steps = [
    /* SELECT PERSON */
    {
      label: "Select Person", title: "Select a person (already added)",
      render: (d) => {
        const locked = !!preselected;
        const candidates = visibleUsers()
          .filter(u => {
            if (preselected) return u.id === preselected.id;
            if (!employeesByUid[u.id] && !employeesById[u.id]) return false;
            return canAssignTo(u);
          })
          .sort((a, b) => String(a.name || a.email || "").localeCompare(String(b.name || b.email || "")));

        let rows = "";
        for (const u of candidates) {
          const emp = employeesByUid[u.id] || employeesById[u.id];
          const hay = [u.name, u.email, u.nationalId, emp && emp.empId, emp && emp.nationalId].filter(Boolean).join(" ").toLowerCase();
          const isOn = d.selectedUserId === u.id;
          const hasLogin = !!(emp?.uid || u.hasLogin);
          rows += '<div class="user-pick-item ' + (isOn ? "is-on" : "") + '" data-uid="' + u.id + '" data-search="' + escapeHtml(hay) + '">' +
            '<div class="admin-avatar">' + (u.photoURL ? '<img src="' + escapeHtml(u.photoURL) + '" alt="">' : escapeHtml(initials(u.name || u.email))) + '</div>' +
            '<div class="user-pick-item__main">' +
              '<div class="user-pick-item__name">' +
                escapeHtml(u.name || u.email || "User") +
                (hasLogin ? ' <span class="assigned-tag">Has login</span>' : ' <span class="unassigned-tag">No login</span>') +
              '</div>' +
              '<div class="user-pick-item__meta">' + escapeHtml(u.email || "—") + ' &middot; ' + escapeHtml(roleLabel(u.role || "unassigned")) + '</div>' +
            '</div>' +
            '<div class="user-pick-radio"></div>' +
          '</div>';
        }
        return '<div class="alert alert--info"><svg viewBox="0 0 24 24">' + ICONS.alert + '</svg>' +
            '<div>Pick a person <strong>who already has a staff record</strong>. If not listed, use <strong>Add Person</strong> first (Step 1).</div></div>' +
          '<div class="field"><label>Search</label><input id="au-search" placeholder="Search…"></div>' +
          '<div class="field"><label>' + (locked ? "Selected person" : "Available people (" + candidates.length + ")") + '</label>' +
            '<div class="wm-list" id="au-list">' +
              (rows || '<div class="wm-empty">No people with a staff record in your scope. Add a person first.</div>') +
            '</div>' +
          '</div>';
      },
      validate: d => {
        if (!d.selectedUserId) return "Please select a user.";
        const u = USERS.find(x => x.id === d.selectedUserId);
        if (u && !employeesByUid[u.id] && !employeesById[u.id]) return "This person has no staff record. Add them first.";
        return null;
      },
      after: (root, data) => {
        const searchEl = root.querySelector("#au-search");
        const listEl   = root.querySelector("#au-list");
        if (searchEl && listEl) searchEl.addEventListener("input", () => {
          const q = searchEl.value.trim().toLowerCase();
          listEl.querySelectorAll(".user-pick-item").forEach(el => {
            el.style.display = (!q || (el.dataset.search || "").includes(q)) ? "flex" : "none";
          });
        });
        if (!preselected && listEl) {
          listEl.querySelectorAll(".user-pick-item").forEach(el => {
            el.addEventListener("click", () => {
              listEl.querySelectorAll(".user-pick-item").forEach(x => x.classList.remove("is-on"));
              el.classList.add("is-on");
              data.selectedUserId = el.dataset.uid;
              const emp = employeesByUid[el.dataset.uid] || employeesById[el.dataset.uid];
              if (emp && !data.loginEmail) data.loginEmail = emp.loginEmail || suggestLoginEmail(emp);
              Object.assign(data, prefillFromEmp(emp));
            });
          });
        }
        if (preselected) {
          const emp = employeesByUid[preselected.id] || employeesById[preselected.id];
          if (emp && !data.loginEmail) data.loginEmail = emp.loginEmail || suggestLoginEmail(emp);
          Object.assign(data, prefillFromEmp(emp));
        }
      }
    },
    /* LOGIN */
    {
      label: "Login", title: "Create login",
      render: (d) => {
        const u = USERS.find(x => x.id === d.selectedUserId);
        const emp = u ? (employeesByUid[u.id] || employeesById[u.id]) : null;
        const suggested = d.loginEmail || (emp ? suggestLoginEmail(emp) : "");
        const hasLogin = !!(emp?.uid || u?.hasLogin);
        return `
          <div class="alert alert--info">
            <svg viewBox="0 0 24 24">${ICONS.key}</svg>
            <div>${hasLogin
              ? "<strong>This person already has a login.</strong> Changing details here only updates their profile + placement."
              : "The login is created now — this is where the account is made."}
            </div>
          </div>
          <div class="field" id="email-field">
            <label class="field__required">Login email</label>
            <input id="login-email" data-field="loginEmail" type="email" value="${escapeHtml(suggested)}"
                   placeholder="name@csmis.gov.et" autocomplete="off" ${hasLogin ? "readonly" : ""}>
            <p class="field__hint">${hasLogin ? "Email is fixed once the account exists." : "This becomes the username they sign in with."}</p>
          </div>
          ${!hasLogin ? `
            <div class="field">
              <label class="field__required">Password</label>
              <div class="pw-wrap">
                <input data-field="password" id="pw-new" type="password" placeholder="At least 8 characters" autocomplete="new-password">
                <button type="button" class="pw-toggle" data-toggle="pw-new">
                  <svg viewBox="0 0 24 24">${ICONS.eye}</svg>
                </button>
              </div>
              <div class="pw-meter" id="pw-meter">
                <div class="pw-meter__bars">
                  <div class="pw-meter__bar" data-bar="1"></div>
                  <div class="pw-meter__bar" data-bar="2"></div>
                  <div class="pw-meter__bar" data-bar="3"></div>
                  <div class="pw-meter__bar" data-bar="4"></div>
                </div>
                <div class="pw-meter__text" id="pw-meter-text">Enter a password</div>
              </div>
              <div class="pw-rules" id="pw-rules">
                <div class="pw-rule" data-rule="length"><span class="pw-rule__dot"></span><span>At least 8 characters</span></div>
                <div class="pw-rule" data-rule="upper"><span class="pw-rule__dot"></span><span>One uppercase letter</span></div>
                <div class="pw-rule" data-rule="lower"><span class="pw-rule__dot"></span><span>One lowercase letter</span></div>
                <div class="pw-rule" data-rule="number"><span class="pw-rule__dot"></span><span>One number</span></div>
                <div class="pw-rule" data-rule="symbol"><span class="pw-rule__dot"></span><span>One special character</span></div>
              </div>
            </div>
            <div class="field"><label class="field__required">Confirm password</label>
              <input data-field="password2" id="pw-confirm" type="password" placeholder="Repeat the password" autocomplete="new-password">
              <p class="field__hint" id="pw-match-hint"></p></div>
          ` : ""}
        `;
      },
      validate: d => {
        if (!d.selectedUserId) return "Please select a person in the previous step.";
        if (!d.loginEmail || !/^\S+@\S+\.\S+$/.test(d.loginEmail)) return "Enter a valid login email.";
        const u = USERS.find(x => x.id === d.selectedUserId);
        const emp = u ? (employeesByUid[u.id] || employeesById[u.id]) : null;
        const hasLogin = !!(emp?.uid || u?.hasLogin);
        if (!hasLogin) {
          const pw = evaluatePassword(d.password || "");
          if (pw.score < 3) return "Password is too weak. Add uppercase, numbers, or symbols.";
          if (d.password !== d.password2) return "Passwords do not match.";
        }
        if (!emailStatus.ok && !emailStatus.empty) {
          if (emailStatus.reason === "duplicate") return "This login email is already registered to another person.";
          if (emailStatus.reason === "incomplete") return "Enter a valid email address.";
          return "Please wait — checking email.";
        }
        return null;
      },
      after: (root, data) => {
        const emailIn = root.querySelector("#login-email");
        const u = USERS.find(x => x.id === data.selectedUserId);
        const emp = u ? (employeesByUid[u.id] || employeesById[u.id]) : null;
        const hasLogin = !!(emp?.uid || u?.hasLogin);
        if (emailIn && !hasLogin) {
          setupLiveDuplicate(root, "login-email", "email", "email",
            (type, status) => { emailStatus.ok = status.ok; emailStatus.empty = status.empty; emailStatus.reason = status.reason; },
            emp?.id || null);
        } else {
          emailStatus.ok = true; emailStatus.empty = false;
        }
        const pwIn  = root.querySelector("#pw-new");
        const cfm   = root.querySelector("#pw-confirm");
        const meter = root.querySelector("#pw-meter");
        const mTxt  = root.querySelector("#pw-meter-text");
        function renderMeter() {
          if (!pwIn) return;
          const { checks, score, label, klass } = evaluatePassword(pwIn.value);
          meter.querySelectorAll(".pw-meter__bar").forEach(bar => {
            const i = Number(bar.dataset.bar);
            bar.className = "pw-meter__bar";
            if (i <= score) bar.classList.add("is-on-" + klass);
          });
          mTxt.textContent = label;
          mTxt.className = "pw-meter__text " + klass;
          root.querySelectorAll(".pw-rule").forEach(rule => {
            rule.classList.toggle("is-ok", !!checks[rule.dataset.rule]);
          });
        }
        function checkMatch() {
          if (!cfm) return;
          const hint = root.querySelector("#pw-match-hint");
          if (!cfm.value) { hint.textContent = ""; hint.style.color = ""; return; }
          if (pwIn.value === cfm.value) { hint.textContent = "✓ Passwords match"; hint.style.color = "#067647"; }
          else { hint.textContent = "✗ Passwords do not match"; hint.style.color = "#dc2626"; }
        }
        pwIn?.addEventListener("input", () => { data.password = pwIn.value; renderMeter(); checkMatch(); });
        cfm?.addEventListener("input", () => { data.password2 = cfm.value; checkMatch(); });
        root.querySelectorAll(".pw-toggle").forEach(btn => {
          btn.addEventListener("click", () => {
            const input = root.querySelector("#" + btn.dataset.toggle);
            const showing = input.type === "text";
            input.type = showing ? "password" : "text";
            btn.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
          });
        });
      }
    },
    /* PLACEMENT — EDITABLE */
    {
      label: "Placement", title: "Placement (editable)",
      render: (d) => renderPlacementFields(d, { prefix: "emp" }),
      validate: (d) => validatePlacementFields(d, { prefix: "emp" }),
      after: (root, data, refresh) => wirePlacementFields(root, data, { prefix: "emp" }, refresh)
    },
    /* EMPLOYMENT — EDITABLE */
    {
      label: "Employment", title: "Employment & pay (editable)",
      render: (d) => renderEmploymentFields(d, { prefix: "emp" }),
      validate: (d) => validateEmploymentFields(d, { prefix: "emp" }),
      after: () => {}
    },
    /* ROLE — EDITABLE */
    {
      label: "Role", title: "Role (editable)",
      render: (d) => renderRoleFields(d, { prefix: "emp" }, assignableRoles()),
      validate: (d) => validateRoleFields(d, { prefix: "emp" }),
      after: (root, data) => wireRoleFields(root, data, { prefix: "emp" })
    },
    /* REVIEW */
    {
      label: "Review", title: "Review the assignment",
      render: (d) => {
        const u = USERS.find(x => x.id === d.selectedUserId);
        if (!u) return '<div class="alert alert--error">Please go back and select a user.</div>';
        const emp = employeesByUid[u.id] || employeesById[u.id];
        if (!emp) return '<div class="alert alert--error">No employee record.</div>';
        const basic = Number(d.emp_basicSalary || 0);
        const totalAllow = Number(d.emp_transportAllowance || 0) + Number(d.emp_housingAllowance || 0) + Number(d.emp_positionAllowance || 0) + Number(d.emp_otherAllowance || 0);
        const reviewPhoto = u.photoURL || emp.photoURL || null;
        const hasLogin = !!(emp.uid || u.hasLogin);
        const sector = SECTORS.find(s => s.id === d.emp_sectorId);
        const dep = DEPARTMENTS.find(x => x.id === d.emp_departmentId);
        const cl = d.emp_clusterId ? CLUSTERS.find(c => c.id === d.emp_clusterId) : null;
        return `
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px">
            <div class="admin-avatar" style="width:60px;height:60px;font-size:20px">
              ${reviewPhoto ? `<img src="${escapeHtml(reviewPhoto)}" alt="">` : escapeHtml(initials(u.name || u.email))}
            </div>
            <div style="min-width:0"><div style="font-size:16px;font-weight:800">${escapeHtml(u.name || u.email || "User")}</div>
            <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(u.email || "")}</div></div>
            ${hasLogin ? `<span class="tag tag--blue" style="margin-left:auto">Already has login</span>` : ""}
          </div>
          <div class="review-section">Login${hasLogin ? " (existing)" : " (will be created)"}</div>
          <div class="review">
            <div class="review__row"><span class="review__k">Login email</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d.loginEmail || "—")}</span></div>
            ${!hasLogin ? `<div class="review__row"><span class="review__k">Password</span><span class="review__v">•••••••• (set)</span></div>` : ""}
          </div>
          <div class="review-section">Placement (updated)</div>
          <div class="review">
            <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sector?.name || "—")}</span></div>
            <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dep?.name || "—")}</span></div>
            <div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(cl?.name || "—")}</span></div>
            <div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(d.emp_woredaCode || "—")}</span></div>
          </div>
          <div class="review-section">Employment (updated)</div>
          <div class="review">
            <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(d.emp_position || "—")}</span></div>
            <div class="review__row"><span class="review__k">Basic salary</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(fmtMoney(basic) || "0")} ETB</span></div>
            ${totalAllow ? `<div class="review__row"><span class="review__k">Allowances</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(fmtMoney(totalAllow))} ETB</span></div>` : ""}
          </div>
          <div class="review-section">Role (updated)</div>
          <div class="review">
            <div class="review__row"><span class="review__k">Role</span><span class="review__v"><span class="role-badge role-badge--${d.emp_role}">${escapeHtml(roleLabel(d.emp_role))}</span></span></div>
          </div>
        `;
      }
    }
  ];

  openWizard({
    title: "Assign Role & Work Area — Step 2",
    subtitle: "Creates the login and lets you update placement, employment and role.",
    finishLabel: "Save Assignment",
    successMessage: "Assignment saved.",
    size: "xl",
    initial: {
      loginEmail: "", password: "", password2: "",
      selectedUserId: preselectedUserId || ""
    },
    steps,
    onFinish: async (d) => {
      const u = USERS.find(x => x.id === d.selectedUserId);
      if (!u) throw new Error("User no longer exists.");
      const emp = employeesByUid[u.id] || employeesById[u.id];
      if (!emp) throw new Error("This person has no staff record yet. Add them via Add Person (Step 1) first.");

      const placementPatch = buildPlacementPatch(d, { prefix: "emp" });

      let uid = emp.uid || null;
      let justCreatedAuth = false;
      if (!uid) {
        if (!d.loginEmail || !/^\S+@\S+\.\S+$/.test(d.loginEmail)) throw new Error("Valid login email is required.");
        const pw = evaluatePassword(d.password || "");
        if (pw.score < 3) throw new Error("Password is too weak.");
        if (d.password !== d.password2) throw new Error("Passwords do not match.");

        const emailNorm = normalizeEmail(d.loginEmail);
        const existingU = await findUserByEmail(emailNorm);
        if (existingU) throw new Error("This login email is already in use by another account.");
        const existingE = await findEmployeeByEmail(emailNorm, emp.id);
        if (existingE) throw new Error("This login email is already registered to another employee.");

        const secName = "staffCreator_" + Date.now();
        const secApp = initializeApp(firebaseConfig, secName);
        const secAuth = getAuth(secApp);
        try {
          const cred = await createUserWithEmailAndPassword(secAuth, d.loginEmail.trim(), d.password);
          uid = cred.user.uid;
          try { await updateProfile(cred.user, { displayName: emp.nameEn || "" }); } catch (e) {}
          await signOut(secAuth);
          justCreatedAuth = true;
        } catch (err) {
          if (err.code === "auth/email-already-in-use") throw new Error("This login email is already in use by another account.");
          throw err;
        } finally {
          try { await deleteApp(secApp); } catch (e) {}
        }
      }

      let empId = emp.empId, seq = emp.seq;
      if (!empId) {
        const gen = await generateEmployeeId({
          regionCode: placementPatch.regionCode,
          sectorCode: placementPatch.sectorCode,
          clusterCode: placementPatch.clusterCode,
          departmentCode: placementPatch.departmentCode,
          woredaCode: placementPatch.woredaCode
        });
        empId = gen.empId; seq = gen.seq;
      }

      let emailLocked = false;
      const emailNorm = normalizeEmail(d.loginEmail);
      if (!emp.loginEmailNorm || emp.loginEmailNorm !== emailNorm) {
        await reserveUnique("email", emailNorm, emailNorm, empId, emp.nameEn);
        emailLocked = true;
      }

      const userDoc = {
        uid,
        email: d.loginEmail.trim(),
        emailNorm,
        name: emp.nameEn || u.name || "",
        photoURL: emp.photoURL || u.photoURL || null,
        role: d.emp_role,
        region: placementPatch.regionCode, regionCode: placementPatch.regionCode, regionName: placementPatch.regionName,
        sectorId: placementPatch.sectorId, sectorName: placementPatch.sectorName,
        departmentId: placementPatch.departmentId, departmentName: placementPatch.departmentName,
        clusterId: placementPatch.clusterId, clusterName: placementPatch.clusterName,
        woredaCode: placementPatch.woredaCode, woredaName: placementPatch.woredaName,
        officeId: placementPatch.officeId, officeName: placementPatch.officeName,
        isClusterStaff: placementPatch.isClusterStaff,
        empId,
        employeeId: emp.id,
        isDirector: emp.isDirector || false,
        financeRole: d.emp_role === "finance" ? (d.emp_financeRole || null) : null,
        hrmRole: d.emp_role === "hrm" ? (d.emp_hrmRole || null) : null,
        position: (d.emp_position || "").trim() || null,
        phone: emp.phone || null, phoneNorm: emp.phoneNorm || null,
        personalEmail: null,
        nationalId: emp.nationalId || null, nationalIdNorm: emp.nationalIdNorm || null,
        hasFingerprint: (emp.fingerprints || []).length > 0,
        active: true,
        createdAt: justCreatedAuth ? serverTimestamp() : (u.createdAt || serverTimestamp()),
        createdBy: justCreatedAuth ? S.uid : (u.createdBy || S.uid),
        updatedAt: serverTimestamp(),
        updatedBy: S.uid,
        assignedAt: serverTimestamp(),
        assignedBy: S.uid
      };

      try {
        await setDoc(doc(db, "users", uid), userDoc);
      } catch (err) {
        if (emailLocked) await releaseUnique("email", emailNorm);
        throw err;
      }

      const empPatch = {
        uid,
        status: "active",
        active: true,
        hasLogin: true,
        empId, seq,
        loginEmail: d.loginEmail.trim(),
        loginEmailNorm: emailNorm,
        role: d.emp_role,
        ...placementPatch,
        position: (d.emp_position || "").trim() || null,
        hireDate: d.emp_hireDate || null,
        employmentType: d.emp_employmentType || "permanent",
        basicSalary: d.emp_basicSalary === "" ? 0 : Number(d.emp_basicSalary || 0),
        transportAllowance: d.emp_transportAllowance === "" ? 0 : Number(d.emp_transportAllowance || 0),
        housingAllowance: d.emp_housingAllowance === "" ? 0 : Number(d.emp_housingAllowance || 0),
        positionAllowance: d.emp_positionAllowance === "" ? 0 : Number(d.emp_positionAllowance || 0),
        otherAllowance: d.emp_otherAllowance === "" ? 0 : Number(d.emp_otherAllowance || 0),
        financeRole: d.emp_role === "finance" ? (d.emp_financeRole || null) : null,
        hrmRole: d.emp_role === "hrm" ? (d.emp_hrmRole || null) : null,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      };
      await updateDoc(doc(db, "employees", emp.id), empPatch);
    }
  });
}

/* ============================================================
   TRANSFER WIZARD
   ============================================================ */
function openTransferWizard(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) { toast("User not found", "error"); return; }
  if (!canTransferUser(u)) { toast("You cannot transfer this user", "error"); return; }
  const emp = employeesByUid[u.id] || employeesById[u.id];
  if (!emp) { toast("No staff record to transfer", "error"); return; }

  function renderCurrentPlacement(emp, u) {
    const sector = SECTORS.find(s => s.id === emp.sectorId);
    const dep = DEPARTMENTS.find(x => x.id === emp.departmentId);
    const cl = CLUSTERS.find(c => c.id === emp.clusterId);
    const woreda = cl ? normalizeWoredas(cl.woredas).find(w => w.code === emp.woredaCode) : null;
    const region = emp.regionCode || emp.region;
    return `
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.info}</svg>
        <div>Current placement. This is read-only — the new placement comes on the next step.</div>
      </div>
      <div class="review">
        <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(region ? regionLabel(region) : "—")}</span></div>
        <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sector?.name || emp.sectorName || "—")}</span></div>
        <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dep?.name || emp.departmentName || "—")}</span></div>
        <div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(cl?.name || emp.clusterName || "—")}</span></div>
        <div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(woreda?.name || emp.woredaName || "—")}</span></div>
        <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(emp.position || "—")}</span></div>
        <div class="review__row"><span class="review__k">Role</span><span class="review__v"><span class="role-badge role-badge--${emp.role || "employee"}">${escapeHtml(roleLabel(emp.role || "employee"))}</span></span></div>
      </div>
    `;
  }

  const initial = {
    effectiveDate: new Date().toISOString().slice(0,10),
    reason: "",
    note: "",
    emp_workLevel: emp.clusterId ? "cluster" : "regional",
    emp_clusterLevel: emp.woredaCode ? "woreda" : "cluster",
    emp_sectorId: emp.sectorId || "",
    emp_departmentId: emp.departmentId || "",
    emp_clusterId: emp.clusterId || "",
    emp_woredaCode: emp.woredaCode || "",
    emp_officeId: emp.officeId || ""
  };

  openWizard({
    title: "Transfer — " + (u.name || u.email || ""),
    subtitle: (u.empId || emp.empId || "") + " · " + roleLabel(emp.role || "employee"),
    finishLabel: "Confirm Transfer",
    successMessage: "Transfer completed.",
    size: "lg",
    initial,
    steps: [
      {
        label: "Current", title: "Current placement",
        render: (d) => renderCurrentPlacement(emp, u),
        validate: () => null,
        after: () => {}
      },
      {
        label: "New placement", title: "New placement",
        render: (d) => renderPlacementFields(d, { prefix: "emp" }),
        validate: (d) => validatePlacementFields(d, { prefix: "emp" }),
        after: (root, data, refresh) => wirePlacementFields(root, data, { prefix: "emp" }, refresh)
      },
      {
        label: "Reason", title: "Reason & effective date",
        render: (d) => `
          <div class="field"><label class="field__required">Effective date</label>
            <input data-field="effectiveDate" type="date" value="${escapeHtml(d.effectiveDate || "")}">
            <p class="field__hint">The date the transfer takes effect.</p></div>
          <div class="field"><label class="field__required">Reason</label>
            <select data-field="reason">
              <option value="">— Choose reason —</option>
              <option value="reorganization" ${d.reason === "reorganization" ? "selected" : ""}>Reorganization</option>
              <option value="promotion"      ${d.reason === "promotion"      ? "selected" : ""}>Promotion</option>
              <option value="request"        ${d.reason === "request"        ? "selected" : ""}>Employee request</option>
              <option value="performance"    ${d.reason === "performance"    ? "selected" : ""}>Performance / disciplinary</option>
              <option value="business_needs" ${d.reason === "business_needs" ? "selected" : ""}>Business needs</option>
              <option value="other"          ${d.reason === "other"          ? "selected" : ""}>Other</option>
            </select></div>
          <div class="field"><label>Note (optional)</label>
            <textarea data-field="note" placeholder="Additional context, approver name, reference number…">${escapeHtml(d.note || "")}</textarea></div>
          <div class="alert alert--warning">
            <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
            <div>The transfer is <strong>immediate</strong> — the person's placement in employees + users changes right away.</div>
          </div>
        `,
        validate: (d) => {
          if (!d.effectiveDate) return "Effective date is required.";
          if (!d.reason) return "Please select a reason.";
          return null;
        },
        after: () => {}
      },
      {
        label: "Review", title: "Review & confirm",
        render: (d) => {
          const newSector = SECTORS.find(s => s.id === d.emp_sectorId);
          const newDep = DEPARTMENTS.find(x => x.id === d.emp_departmentId);
          const newCl = d.emp_clusterId ? CLUSTERS.find(c => c.id === d.emp_clusterId) : null;
          const curSector = SECTORS.find(s => s.id === emp.sectorId);
          const curDep = DEPARTMENTS.find(x => x.id === emp.departmentId);
          const curCl = CLUSTERS.find(c => c.id === emp.clusterId);
          return `
            <div class="review-section">From</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(curSector?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(curDep?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(curCl?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(emp.woredaCode || "—")}</span></div>
            </div>
            <div class="review-section">To</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(newSector?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(newDep?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(newCl?.name || "—")}</span></div>
              <div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(d.emp_woredaCode || "—")}</span></div>
            </div>
            <div class="review-section">Transfer details</div>
            <div class="review">
              <div class="review__row"><span class="review__k">Effective date</span><span class="review__v">${escapeHtml(d.effectiveDate || "—")}</span></div>
              <div class="review__row"><span class="review__k">Reason</span><span class="review__v">${escapeHtml(d.reason || "—")}</span></div>
              ${d.note ? `<div class="review__row"><span class="review__k">Note</span><span class="review__v">${escapeHtml(d.note)}</span></div>` : ""}
            </div>
            <div class="alert alert--warning">
              <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
              <div>Confirming will write a <strong>transfers</strong> record and update the person's placement in <strong>employees</strong> and <strong>users</strong>.</div>
            </div>
          `;
        }
      }
    ],
    onFinish: async (d) => {
      const newPlacement = buildPlacementPatch(d, { prefix: "emp" });
      const transferRef = doc(collection(db, "transfers"));
      const fromSnapshot = {
        regionCode: emp.regionCode || null,
        sectorId: emp.sectorId || null, sectorName: emp.sectorName || null,
        departmentId: emp.departmentId || null, departmentName: emp.departmentName || null,
        clusterId: emp.clusterId || null, clusterName: emp.clusterName || null,
        woredaCode: emp.woredaCode || null, woredaName: emp.woredaName || null,
        officeId: emp.officeId || null, officeName: emp.officeName || null
      };
      const toSnapshot = {
        regionCode: newPlacement.regionCode,
        sectorId: newPlacement.sectorId, sectorName: newPlacement.sectorName,
        departmentId: newPlacement.departmentId, departmentName: newPlacement.departmentName,
        clusterId: newPlacement.clusterId, clusterName: newPlacement.clusterName,
        woredaCode: newPlacement.woredaCode, woredaName: newPlacement.woredaName,
        officeId: newPlacement.officeId, officeName: newPlacement.officeName
      };

      await setDoc(transferRef, {
        employeeId: emp.id,
        empId: emp.empId || null,
        uid: emp.uid || null,
        nameEn: emp.nameEn || emp.fullName || u.name || null,
        from: fromSnapshot,
        to: toSnapshot,
        reason: d.reason || null,
        note: (d.note || "").trim() || null,
        effectiveDate: d.effectiveDate || null,
        createdAt: serverTimestamp(),
        createdBy: S.uid,
        createdByName: S.name || null,
        status: "applied"
      });

      await updateDoc(doc(db, "employees", emp.id), {
        ...newPlacement,
        lastTransferId: transferRef.id,
        lastTransferAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      });

      const loginUid = emp.uid || null;
      if (loginUid) {
        try {
          await updateDoc(doc(db, "users", loginUid), {
            region: newPlacement.regionCode, regionCode: newPlacement.regionCode, regionName: newPlacement.regionName,
            sectorId: newPlacement.sectorId, sectorName: newPlacement.sectorName,
            departmentId: newPlacement.departmentId, departmentName: newPlacement.departmentName,
            clusterId: newPlacement.clusterId, clusterName: newPlacement.clusterName,
            woredaCode: newPlacement.woredaCode, woredaName: newPlacement.woredaName,
            officeId: newPlacement.officeId, officeName: newPlacement.officeName,
            isClusterStaff: newPlacement.isClusterStaff,
            updatedAt: serverTimestamp(),
            updatedBy: S.uid
          });
        } catch (e) { console.warn("[transfer update users]", e); }
      }

      try {
        await addDoc(collection(db, "notifications"), {
          type: "employee_transferred",
          title: "Employee transferred",
          body: `${emp.nameEn || u.name || ""} transferred to ${newPlacement.clusterName || newPlacement.sectorName || "a new placement"}.`,
          targetEmpId: emp.id,
          forRoles: ["super_admin","hrm","regional_admin","regional_hrm","admin","cluster_hrm","woreda_admin","woreda_hrm"],
          link: "users.html",
          read: false,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

          if (!st.ok) {
            if (st.reason === "duplicate") return "This National ID is registered to another person.";

          </div>
        `,

          if (!d.phone) return "Primary phone is required.";
          const ph = normalizePhone(d.phone);
          if (ph.length !== PHONE_LENGTH) return `Phone number must be exactly ${PHONE_LENGTH} digits.`;
          const st = duplicateStatus.phone;
          if (!st.ok) {
            if (st.reason === "duplicate") return "This phone number is registered to another person.";
            if (st.reason === "incomplete") return `Phone number must be exactly ${PHONE_LENGTH} digits.`;
            return "Please wait — checking phone number.";
          }
          return null;
        },
        after: (root, data) => {
          const phoneInput = root.querySelector("#phone-primary");
          phoneInput?.addEventListener("input", () => {
            let v = phoneInput.value.replace(/\D/g, "");
            if (v.startsWith("251") && v.length > PHONE_LENGTH) v = v.slice(3);
            if (v.startsWith("0")) v = v.slice(1);
            v = v.slice(0, PHONE_LENGTH);
            if (phoneInput.value !== v) phoneInput.value = v;
            data.phone = v;
          });
          setupLiveDuplicate(root, "phone-primary", "phone", "phone number",
            (type, status) => { duplicateStatus[type] = status; }, emp?.id || null);
        }
      },
      {
        label: "Address", title: "Residential address",
        render: (d) => renderAddressFields(d, { prefix: "addr" }),
        validate: () => null,
        after: (root, data, refresh) => wireAddressFields(root, data, { prefix: "addr" }, refresh)
      },
      {
        label: "Placement", title: "Sector → Department → Regional / Cluster",
        render: (d) => renderPlacementFields(d, { prefix: "emp" }),
        validate: (d) => validatePlacementFields(d, { prefix: "emp" }),
        after: (root, data, refresh) => wirePlacementFields(root, data, { prefix: "emp" }, refresh)
      },
      {

        validate: (d) => validateEmploymentFields(d, { prefix: "emp" }),
        after: () => {}
      },
      {

      },
      {
        label: "Review", title: "Review the changes",
        render: (d) => {
          const newName = [d.firstName, d.middleName, d.lastName].filter(Boolean).join(" ");
          return `
            <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px">
              <div class="user-avatar" style="width:70px;height:70px;font-size:24px">
                ${d._photo ? `<img src="${d._photo}" alt="">` : escapeHtml(initials(newName))}
              </div>
              <div style="min-width:0">
                <div style="font-size:17px;font-weight:800">${escapeHtml(newName)}</div>
                <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d.firstNameAm || "")} ${escapeHtml(d.lastNameAm || "")}</div>
              </div>
            </div>
            <div class="review">
              <div class="review__row"><span class="review__k">Gender</span><span class="review__v">${d.gender === "M" ? "Male" : "Female"}</span></div>
              <div class="review__row"><span class="review__k">Date of birth</span><span class="review__v">${escapeHtml(d.dob || "—")}</span></div>
              <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatNationalIdDisplay(d.nationalId) || "—")}</span></div>
              <div class="review__row"><span class="review__k">Phone</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatPhoneDisplay(d.phone) || "—")}</span></div>
              <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(d.emp_position || "—")}</span></div>
              <div class="review__row"><span class="review__k">Basic salary</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">${escapeHtml(fmtMoney(d.emp_basicSalary) || "0")} ETB</span></div>
              <div class="review__row"><span class="review__k">Role</span><span class="review__v"><span class="role-badge role-badge--${d.emp_role}">${escapeHtml(roleLabel(d.emp_role))}</span></span></div>
              ${!isSelf ? `<div class="review__row"><span class="review__k">Active</span><span class="review__v">${d.active ? `<span class="tag tag--green">Active</span>` : `<span class="tag tag--red">Inactive</span>`}</span></div>` : ""}
            </div>
          `;
        }
      }
    ],
    onFinish: async (d) => {
      if (!emp) throw new Error("Employee record not found.");
      const natIdNorm = normalizeNationalId(d.nationalId);
      const phoneNorm = normalizePhone(d.phone);
      if (natIdNorm.length !== NAT_ID_LENGTH) throw new Error(`National ID must be exactly ${NAT_ID_LENGTH} digits.`);
      if (phoneNorm.length !== PHONE_LENGTH)  throw new Error(`Phone number must be exactly ${PHONE_LENGTH} digits.`);

      const oldNatNorm = emp.nationalIdNorm || "";
      const oldPhoneNorm = emp.phoneNorm || "";

      if (natIdNorm !== oldNatNorm) {
        const dup = await findEmployeeByNationalId(natIdNorm, emp.id);
        if (dup) throw new Error("National ID is already registered to another person.");
        await reserveUnique("nationalId", natIdNorm, natIdNorm, emp.empId || emp.id, emp.nameEn || "");
      }
      if (phoneNorm !== oldPhoneNorm) {
        const dup = await findEmployeeByPhone(phoneNorm, emp.id);
        if (dup) {
          if (natIdNorm !== oldNatNorm) await releaseUnique("nationalId", natIdNorm);
          throw new Error("Phone number is already registered to another person.");
        }
        await reserveUnique("phone", phoneNorm, phoneNorm, emp.empId || emp.id, emp.nameEn || "");
      }

      const nameEn = [d.firstName, d.middleName, d.lastName].filter(Boolean).map(s => s.trim()).join(" ");
      const nameAm = [d.firstNameAm, d.middleNameAm, d.lastNameAm].filter(Boolean).map(s => s.trim()).join(" ") || null;
      const nameOm = [d.firstNameOm, d.middleNameOm, d.lastNameOm].filter(Boolean).map(s => s.trim()).join(" ") || null;
      const phoneDisplay = "+251 " + phoneNorm.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");

      const removedIds = new Set(d._removedFingerprintIds || []);
      const finalFingerprints = (d._fingerprints || []).filter(f => !removedIds.has(f.credentialId));
      const placement = buildPlacementPatch(d, { prefix: "emp" });

      const empPatch = {
        firstName: d.firstName.trim(),
        middleName: d.middleName?.trim() || null,
        lastName: d.lastName.trim(),
        firstNameAm: d.firstNameAm.trim(),
        middleNameAm: d.middleNameAm?.trim() || null,
        lastNameAm: d.lastNameAm.trim(),
        firstNameOm: d.firstNameOm.trim(),
        middleNameOm: d.middleNameOm?.trim() || null,
        lastNameOm: d.lastNameOm.trim(),
        nameEn, nameAm, nameOm, fullName: nameEn,
        nationalId: natIdNorm, nationalIdNorm: natIdNorm,
        gender: d.gender, dob: d.dob,
        maritalStatus: d.maritalStatus || null,
        phone: phoneDisplay, phoneNorm,
        ...placement,
        position: (d.emp_position || "").trim() || null,
        hireDate: d.emp_hireDate || null,
        employmentType: d.emp_employmentType || "permanent",
        basicSalary: d.emp_basicSalary === "" ? 0 : Number(d.emp_basicSalary || 0),
        transportAllowance: d.emp_transportAllowance === "" ? 0 : Number(d.emp_transportAllowance || 0),
        housingAllowance: d.emp_housingAllowance === "" ? 0 : Number(d.emp_housingAllowance || 0),
        positionAllowance: d.emp_positionAllowance === "" ? 0 : Number(d.emp_positionAllowance || 0),
        otherAllowance: d.emp_otherAllowance === "" ? 0 : Number(d.emp_otherAllowance || 0),
        role: d.emp_role,
        financeRole: d.emp_role === "finance" ? (d.emp_financeRole || null) : null,
        hrmRole: d.emp_role === "hrm" ? (d.emp_hrmRole || null) : null,
        fingerprints: finalFingerprints,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      };
      if (d._photo && d._photo !== initial._originalPhoto) empPatch.photoURL = d._photo;

      const userPatch = {
        name: nameEn,
        phone: phoneDisplay, phoneNorm,
        nationalId: natIdNorm, nationalIdNorm: natIdNorm,
        role: d.emp_role,
        hasFingerprint: finalFingerprints.length > 0,
        ...placement,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      };
      if (!isSelf) userPatch.active = d.active;
      if (empPatch.photoURL) userPatch.photoURL = empPatch.photoURL;

      try {
        await updateDoc(doc(db, "employees", emp.id), empPatch);
        if (emp.uid) {
          try { await updateDoc(doc(db, "users", emp.uid), userPatch); } catch (e) {}
        }
      } catch (err) {
        if (natIdNorm !== oldNatNorm) await releaseUnique("nationalId", natIdNorm);
        if (phoneNorm !== oldPhoneNorm) await releaseUnique("phone", phoneNorm);
        throw err;
      }

      if (natIdNorm !== oldNatNorm && oldNatNorm) await releaseUnique("nationalId", oldNatNorm);
      if (phoneNorm !== oldPhoneNorm && oldPhoneNorm) await releaseUnique("phone", oldPhoneNorm);
    }
  });
}

/* ============================================================
