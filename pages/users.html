function openViewModal(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  const emp = employeesByUid[u.id] || employeesById[u.id];
  const isSelf = u.id === S.uid || u.uid === S.uid;
  const photo = u.photoURL || emp?.photoURL || null;
  const basic = emp?.basicSalary || 0;
  const trans = emp?.transportAllowance || 0;
  const house = emp?.housingAllowance || 0;
  const pos   = emp?.positionAllowance || 0;
  const oth   = emp?.otherAllowance || 0;
  const gross = Number(basic) + Number(trans) + Number(house) + Number(pos) + Number(oth);
  const dept = DEPARTMENTS.find(d => d.id === emp?.departmentId || d.id === u.departmentId);
  const sector = SECTORS.find(s => s.id === emp?.sectorId || s.id === u.sectorId);
  const fpList = getFingerprintList(emp);
  const hasFp = fpList.length > 0;
  const assigned = isUserAlreadyAssigned(u, emp);
  const hasLogin = !!(emp?.uid || u.hasLogin);
  const family = emp?.family || {};
  const address = emp?.address || {};

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">${escapeHtml(u.name || "User")}</div>
        <div class="modal__sub">${escapeHtml(u.email || "")}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div style="display:flex;align-items:center;gap:20px;padding:20px;background:linear-gradient(135deg,#f8fbff,#fff);border-radius:16px;border:1px solid var(--border);margin-bottom:20px">
        <div class="user-avatar" style="width:72px;height:72px;font-size:26px">
          ${photo ? `<img src="${escapeHtml(photo)}" alt="">` : escapeHtml(initials(u.name || u.email))}
        </div>
        <div style="min-width:0">
          <div style="font-size:20px;font-weight:800;letter-spacing:-.4px">${escapeHtml(u.name || "—")} ${isSelf ? `<span class="you-tag" style="margin-left:6px">You</span>` : ""}</div>
          <div style="font-size:13.5px;color:var(--muted);margin-top:4px">${escapeHtml(u.email || "—")}</div>
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
            <span class="role-badge role-badge--${u.role || "unassigned"}"><svg viewBox="0 0 24 24">${ICONS.shield}</svg> ${escapeHtml(roleLabel(u.role || "unassigned"))}</span>
            <span class="tag ${u.active === false ? "tag--red" : "tag--green"}">${u.active === false ? "Inactive" : "Active"}</span>
            <span class="tag ${assigned ? "tag--green" : "tag--gold"}">${assigned ? "Assigned" : "Unassigned"}</span>
            <span class="tag ${hasLogin ? "tag--blue" : "tag--gold"}">${hasLogin ? "Has login" : "No login"}</span>
            ${hasFp ? `<span class="fp-mini-badge"><svg viewBox="0 0 24 24">${ICONS.fingerprint}</svg> ${fpList.length} FP</span>` : ""}
          </div>
        </div>
      </div>
      ${emp ? `
        <div class="review-section">Personal</div>
        <div class="review">
          <div class="review__row"><span class="review__k">Employee ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(emp.empId || "—")}</span></div>
          <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatNationalIdDisplay(emp.nationalId) || "—")}</span></div>
          <div class="review__row"><span class="review__k">Phone</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatPhoneDisplay(emp.phone) || "—")}</span></div>
        </div>
        <div class="review-section">Family</div>
        <div class="review">
          ${family.father?.name ? `<div class="review__row"><span class="review__k">Father</span><span class="review__v">${escapeHtml(family.father.name)}${family.father.phone ? " · " + escapeHtml(family.father.phone) : ""}</span></div>` : ""}
          ${family.mother?.name ? `<div class="review__row"><span class="review__k">Mother</span><span class="review__v">${escapeHtml(family.mother.name)}${family.mother.phone ? " · " + escapeHtml(family.mother.phone) : ""}</span></div>` : ""}
          ${family.spouse?.name ? `<div class="review__row"><span class="review__k">Spouse</span><span class="review__v">${escapeHtml(family.spouse.name)}${family.spouse.phone ? " · " + escapeHtml(family.spouse.phone) : ""}</span></div>` : ""}
          ${family.children ? `<div class="review__row"><span class="review__k">Children</span><span class="review__v">${escapeHtml(family.children)}</span></div>` : ""}
          ${family.emergency?.name ? `<div class="review__row"><span class="review__k">Emergency contact</span><span class="review__v">${escapeHtml(family.emergency.name)} (${escapeHtml(family.emergency.relation || "—")}) · ${escapeHtml(family.emergency.phone || "—")}</span></div>` : ""}
        </div>
        <div class="review-section">Address</div>
        <div class="review">
          <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(address.region) || "—")}</span></div>
          <div class="review__row"><span class="review__k">Zone / Woreda</span><span class="review__v">${escapeHtml([address.zoneId, address.woredaCode].filter(Boolean).join(" / ") || "—")}</span></div>
          <div class="review__row"><span class="review__k">Sub-city / Kebele</span><span class="review__v">${escapeHtml([address.subCity, address.kebele].filter(Boolean).join(" / ") || "—")}</span></div>
        </div>
        <div class="review-section">Placement &amp; Pay</div>
        <div class="review">
          ${sector ? `<div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sector.name)}</span></div>` : ""}
          ${dept ? `<div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dept.name)}</span></div>` : ""}
          ${emp.clusterName ? `<div class="review__row"><span class="review__k">Cluster / Zone</span><span class="review__v">${escapeHtml(emp.clusterName)}</span></div>` : ""}
          ${emp.woredaName ? `<div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(emp.woredaName)}</span></div>` : ""}
          <div class="review__row"><span class="review__k">Basic salary</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right;font-weight:800">${escapeHtml(fmtMoney(basic) || "0")} ETB</span></div>
          <div class="review__row"><span class="review__k">Gross (est.)</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right;font-weight:800">${escapeHtml(fmtMoney(gross))}</span></div>
        </div>
        ${fpList.length ? `
          <div class="review-section">Fingerprints (${fpList.length})</div>
          <div class="fp-list">
            ${fpList.map((f, i) => `
              <div class="fp-list__item">
                <div class="fp-list__icon"><svg viewBox="0 0 24 24">${ICONS.fingerprint}</svg></div>
                <div class="fp-list__main">
                  <div class="fp-list__name">${escapeHtml(f.deviceLabel || "Device " + (i + 1))}</div>
                  <div class="fp-list__meta">${f.credentialId ? f.credentialId.slice(0, 20) + "…" : "—"}</div>
                </div>
              </div>
            `).join("")}
          </div>
        ` : ""}
      ` : `<div class="alert alert--warning"><svg viewBox="0 0 24 24">${ICONS.alert}</svg><div>No staff record yet. Use <strong>Add Person</strong> first.</div></div>`}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${canTransferUser(u) && emp ? `<button class="btn btn--transfer" id="view-transfer-btn"><svg viewBox="0 0 24 24">${ICONS.transfer}</svg> Transfer</button>` : ""}
      ${canAssignTo(u) && emp && !hasLogin ? `<button class="btn btn--gold" id="view-assign-btn"><svg viewBox="0 0 24 24">${ICONS.userCheck}</svg> Create Login</button>` : ""}
      ${canManageUser(u) ? `<button class="btn btn--primary" id="view-edit-btn"><svg viewBox="0 0 24 24">${ICONS.edit}</svg> Edit</button>` : ""}
    </div>
  `);

  document.getElementById("view-edit-btn")?.addEventListener("click", () => { closeModal(); setTimeout(() => openEditWizard(userId), 100); });
  document.getElementById("view-assign-btn")?.addEventListener("click", () => { closeModal(); setTimeout(() => openAssignWizard(userId), 100); });
  document.getElementById("view-transfer-btn")?.addEventListener("click", () => { closeModal(); setTimeout(() => openTransferWizard(userId), 100); });
}

/* ============================================================
   DELETE — typed-name confirmation + release email lock
   ============================================================ */
function confirmDelete(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  if (!canDeleteUser(u)) { toast("You cannot delete this user", "error"); return; }
  const emp = employeesByUid[u.id] || employeesById[u.id];
  const required = (u.name || u.email || "").trim();

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Delete person — permanently</div>
        <div class="modal__sub">This cannot be undone</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to permanently delete:</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">${escapeHtml(u.name || u.email || "")}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(u.email || "")}</div>
          <ul style="margin-top:10px;padding-left:20px;font-size:12.5px;line-height:1.7">
            <li>The employee record (all personal, family, address, employment & pay data)</li>
            <li>The user account (Firebase Auth record stays but cannot log in)</li>
            <li>Uniqueness locks (National ID, phone, email) — <strong>freed</strong></li>
            <li>The transfer history for this employee</li>
          </ul>
        </div>
      </div>
      <div class="field">
        <label class="field__required">Type the person's full name to confirm</label>
        <input id="del-confirm" placeholder="${escapeHtml(required)}" autocomplete="off">
        <p class="field__hint">Copy exactly: <strong>${escapeHtml(required)}</strong></p>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--danger" id="confirm-del" disabled>
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Delete permanently</span>
      </button>
    </div>
  `);

  const input = document.getElementById("del-confirm");
  const btn = document.getElementById("confirm-del");
  input?.addEventListener("input", () => {
    const ok = (input.value || "").trim().toLowerCase() === required.toLowerCase();
    btn.disabled = !ok;
  });

  btn?.addEventListener("click", async () => {
    if ((input.value || "").trim().toLowerCase() !== required.toLowerCase()) {
      toast("Name does not match. Deletion cancelled.", "error");
      return;
    }
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");
    btn.disabled = true; spinner.classList.remove("hidden");
    const old = label.textContent; label.textContent = "Deleting…";
    try {
      /* 1. Uniqueness locks */
      if (emp?.nationalIdNorm) await releaseUnique("nationalId", emp.nationalIdNorm);
      if (emp?.phoneNorm)      await releaseUnique("phone", emp.phoneNorm);
      const emailNorm = emp?.loginEmailNorm || normalizeEmail(emp?.loginEmail || u.email || "");
      if (emailNorm) await releaseUnique("email", emailNorm);

      /* 2. Transfer history */
      if (emp) {
        try {
          const trSnap = await getDocs(query(collection(db, "transfers"), where("employeeId", "==", emp.id)));
          for (const tDoc of trSnap.docs) await deleteDoc(tDoc.ref);
        } catch (e) {}
      }

      /* 3. Employee doc */
      if (emp) await deleteDoc(doc(db, "employees", emp.id));

      /* 4. User doc */
      const loginUid = emp?.uid || u.uid || (u._isEmployeeOnly ? null : u.id);
      if (loginUid && !u._isEmployeeOnly) {
        try { await deleteDoc(doc(db, "users", loginUid)); } catch (e) {}
      }

      toast("Person permanently deleted", "success");
      closeModal();
    } catch (err) {
      console.error(err);
      toast(err.code + ": " + err.message, "error");
      btn.disabled = false; spinner.classList.add("hidden"); label.textContent = old;
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  unsubUsers = onSnapshot(scopedUsersQuery(), (snap) => {
    const dbUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    /* Merge employee-only records (no login) into USERS */
    const byId = new Map(dbUsers.map(x => [x.id, x]));
    for (const [id, e] of Object.entries(employeesById)) {
      if (e.uid) continue;
      if (byId.has(id)) continue;
      byId.set(id, {
        id, uid: null, email: "", name: e.nameEn || e.fullName || "",
        role: e.role || "unassigned", active: e.active === true, hasLogin: false,
        empId: e.empId || null, regionCode: e.regionCode || null,
        clusterId: e.clusterId || null, woredaCode: e.woredaCode || null,
        photoURL: e.photoURL || null, _isEmployeeOnly: true
      });
    }
    USERS = Array.from(byId.values());
    render();
  }, (err) => {
    console.warn("[users]", err.code, err.message);
    document.getElementById("users-tbody").innerHTML =
      `<tr><td colspan="8" style="text-align:center;padding:48px 20px;color:var(--danger)">Could not load: ${escapeHtml(err.code || "")} — ${escapeHtml(err.message || "")}</td></tr>`;
  });
}
function subscribeEmployees() {
  if (unsubEmployees) unsubEmployees();
  unsubEmployees = onSnapshot(scopedEmployeesQuery(), (snap) => {
    employeesById = {};
    employeesByUid = {};
    snap.forEach(d => {
      const data = { id: d.id, ...d.data() };
      employeesById[d.id] = data;
      if (data.uid) employeesByUid[data.uid] = data;
    });
    subscribeUsers();
    if (S && !S.photoURL) {
      const mine = employeesByUid[S.uid];
      if (mine?.photoURL) { S.photoURL = mine.photoURL; renderUser(); }
    }
  }, (err) => console.warn("[employees]", err.code, err.message));
}
function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  const lvl = scope();
  let q = collection(db, "clusters");
  if (lvl === "region" && S.regionCode) q = query(q, where("regionCode", "==", S.regionCode));
  else if (lvl === "cluster" && S.clusterId) q = query(q, where("__name__", "==", S.clusterId));
  unsubClusters = onSnapshot(q, (snap) => {
    CLUSTERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[clusters]", err.code, err.message));
}
function subscribeOffices() {
  if (unsubOffices) unsubOffices();
  const lvl = scope();
  let q = collection(db, "offices");
  if (lvl === "region" && S.regionCode) q = query(q, where("regionCode", "==", S.regionCode));
  else if (lvl === "cluster" && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  else if (lvl === "woreda" && S.woredaCode) q = query(q, where("woredaCode", "==", S.woredaCode));
  unsubOffices = onSnapshot(q, (snap) => {
    OFFICES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }, (err) => console.warn("[offices]", err.code, err.message));
}
function subscribeDepartments() {
  if (unsubDepartments) unsubDepartments();
  const lvl = scope();
  let q = collection(db, "departments");
  if (lvl === "region" && S.regionCode) q = query(q, where("regionCode", "==", S.regionCode));
  else if (lvl === "cluster" && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubDepartments = onSnapshot(q, (snap) => {
    DEPARTMENTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[departments]", err.code, err.message));
}
function subscribeSectors() {
  if (unsubSectors) unsubSectors();
  unsubSectors = onSnapshot(collection(db, "sectors"), (snap) => {
    SECTORS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[sectors]", err.code, err.message));
}

/* ============================================================
   SHELL
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () =>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

let searchTimer;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTerm = e.target.value; renderTable(); }, 130);
});
document.getElementById("role-filter").addEventListener("change", (e) => { filterRole = e.target.value; renderTable(); });
document.getElementById("status-filter").addEventListener("change", (e) => { filterStatus = e.target.value; renderTable(); });

/* Language switch listener (from Settings page in another tab) */
window.addEventListener("storage", (e) => {
  if (e.key === "cs.language") {
    localizeStaticDom();
    renderSidebar();
    renderUser();
    renderScopeBadge();
    renderHeadActions();
    renderStats();
    renderTable();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (e) { console.warn("[user read]", e); }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    region: userDoc?.region || userDoc?.regionCode || "",
    regionCode: userDoc?.regionCode || userDoc?.region || "",
    regionName: userDoc?.regionName || "",
    clusterId: userDoc?.clusterId || "",
    clusterName: userDoc?.clusterName || "",
    woredaCode: userDoc?.woredaCode || "",
    woredaName: userDoc?.woredaName || "",
    officeId: userDoc?.officeId || "",
    officeName: userDoc?.officeName || "",
    departmentId: userDoc?.departmentId || "",
    departmentName: userDoc?.departmentName || "",
    empId: userDoc?.empId || ""
  };

  /* Roles that don't have "users" in their ROLE_NAV don't belong on this page. */
  if (!USERS_PAGE_ROLES.has(S.role)) {
    console.log("[users] role not permitted on this page, redirecting:", S.role);
    window.location.replace("dashboard.html");
    return;
  }

  localizeStaticDom();
  renderSidebar();
  renderUser();
  render();

  subscribeClusters();
  subscribeOffices();
  subscribeDepartments();
  subscribeSectors();
  subscribeUsers();
  subscribeEmployees();
});

console.log("[users] booted — i18n + assign editable + transfer wizard + typed-name delete + email uniqueness + last-super-admin protection + role-scoped nav.");
</script>
