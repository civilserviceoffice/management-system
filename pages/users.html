        const selectedCluster = CLUSTERS.find(c => c.id === d.clusterId);
        const woredas = selectedCluster ? normalizeWoredas(selectedCluster.woredas) : [];
        const isWoredaStaff = isCluster && d.clusterLevel === "woreda";

        const RR = twoDigits(selectedSector ? (selectedSector.regionCode || selectedSector.region || S.region) : S.region);
        const SS = twoDigits(selectedSector && selectedSector.code);
        const CC = twoDigits(isCluster && selectedCluster ? selectedCluster.code : "00");
        const DD = twoDigits(selectedDept && selectedDept.code);
        const WW = twoDigits(isWoredaStaff ? d.woredaCode : "00");

        let html = '';

        html += '<div class="alert alert--info"><svg viewBox="0 0 24 24">' + ICONS.alert + '</svg>' +
          '<div>Pick a <strong>Sector</strong>, a <strong>Department</strong>, then a <strong>Regional</strong> or <strong>Cluster</strong> placement.' +
          (isCluster
            ? ' Cluster staff stop at the cluster; woreda/city staff continue one more level.'
            : '') +
          '</div></div>';

        /* 1. Sector */
        html += '<div class="field"><label class="field__required">1. Sector</label>' +
          '<select data-field="sectorId" id="wiz-sector"' + (regionSectors.length ? "" : " disabled") + '>' +
            sectorOptionsHtml(d.sectorId) +
          '</select>';
        if (!regionSectors.length) {
          html += '<p class="field__hint" style="color:var(--warning)">' +
            '&warning; No sectors found. Add one on the ' +
            '<a href="departments.html" style="color:var(--primary);font-weight:700">Sectors</a> page first.' +
          '</p>';
        }
        html += '</div>';

        /* 2. Department */
        html += '<div class="field"><label class="field__required">2. Department / Directorate</label>' +
          '<select data-field="departmentId" id="wiz-dept"' + (deptList.length ? "" : " disabled") + '>' +
            departmentOptionsHtml(d.sectorId, d.departmentId) +
          '</select>';
        if (selectedDept) {
          html += '<p class="field__hint">Level: <strong>' +
            (selectedDept.level === "cluster" ? "Cluster" : "Regional") +
            '</strong></p>';
        }
        html += '</div>';

        /* 3. Regional / Cluster */
        html += '<div class="field"><label class="field__required">3. Placement level</label>' +
          '<div style="display:flex;gap:8px">' +
            '<button type="button" class="placement-btn' + (!isCluster ? ' is-on' : '') + '" data-level="regional" style="flex:1">' +
              '<span class="placement-btn__icon"><svg viewBox="0 0 24 24">' + ICONS.pin + '</svg></span>' +
              '<span class="placement-btn__label">Regional</span>' +
              '<span class="placement-btn__hint">Region HQ</span>' +
            '</button>' +
            '<button type="button" class="placement-btn' + (isCluster ? ' is-on' : '') + '" data-level="cluster" style="flex:1">' +
              '<span class="placement-btn__icon"><svg viewBox="0 0 24 24">' + ICONS.layers + '</svg></span>' +
              '<span class="placement-btn__label">Cluster</span>' +
              '<span class="placement-btn__hint">Cluster office</span>' +
            '</button>' +
          '</div>' +
        '</div>';

        if (isCluster) {
          html += '<div class="field"><label class="field__required">4. Cluster</label>' +
            '<select data-field="clusterId" id="wiz-cluster">' + clusterOptionsHtml(d.clusterId) + '</select>' +
          '</div>';

          html += '<div class="field"><label class="field__required">5. Where does this person work?</label>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" class="placement-btn' + (d.clusterLevel !== "woreda" ? ' is-on' : '') + '" data-cluster-level="cluster" style="flex:1">' +
                '<span class="placement-btn__icon"><svg viewBox="0 0 24 24">' + ICONS.briefcase + '</svg></span>' +
                '<span class="placement-btn__label">Cluster staff</span>' +
                '<span class="placement-btn__hint">Works at the cluster office</span>' +
              '</button>' +
              '<button type="button" class="placement-btn' + (d.clusterLevel === "woreda" ? ' is-on' : '') + '" data-cluster-level="woreda" style="flex:1">' +
                '<span class="placement-btn__icon"><svg viewBox="0 0 24 24">' + ICONS.pin + '</svg></span>' +
                '<span class="placement-btn__label">Woreda / City staff</span>' +
                '<span class="placement-btn__hint">Assigned to a woreda or city</span>' +
              '</button>' +
            '</div>' +
          '</div>';

          if (isWoredaStaff) {
            html += '<div class="field"><label class="field__required">6. Woreda / City</label>' +
              '<select data-field="woredaCode" id="wiz-woreda"' + (woredas.length ? "" : " disabled") + '>' +
                woredaOptionsHtml(d.clusterId, d.woredaCode) +
              '</select>' +
              (woredas.length
                ? ''
                : '<p class="field__hint" style="color:var(--warning)">' +
                    '&warning; No woredas / cities registered in this cluster yet.' +
                  '</p>') +
            '</div>';

            html += '<div class="field"><label>7. Office <span style="color:var(--muted);font-weight:600">(optional)</span></label>' +
              '<select data-field="officeId" id="wiz-office">' +
                '<option value="">— Optional — choose an office —</option>' +
                OFFICES.filter(o => o.clusterId === d.clusterId).map(o =>
                  '<option value="' + o.id + '"' + (d.officeId === o.id ? " selected" : "") + '>' +
                    escapeHtml(o.code || "??") + ' &middot; ' + escapeHtml(o.name || "Unnamed") +
                  '</option>'
                ).join("") +
              '</select>' +
            '</div>';
          }
        }

        html += '<div class="id-preview" style="margin-top:16px">' +
          '<div class="id-preview__lbl">Employee ID preview</div>' +
          '<div class="id-preview__val">' +
            escapeHtml(RR) + '-' + escapeHtml(SS) + escapeHtml(CC) + escapeHtml(DD) + escapeHtml(WW) + '-00000001' +
          '</div>' +
          '<div class="id-preview__parts">' +
            '<span class="part">Region <code>' + escapeHtml(RR) + '</code></span>' +
            '<span class="part">Sector <code>' + escapeHtml(SS) + '</code></span>' +
            '<span class="part">Cluster <code>' + escapeHtml(CC) + '</code></span>' +
            '<span class="part">Department <code>' + escapeHtml(DD) + '</code></span>' +
            '<span class="part">Woreda <code>' + escapeHtml(WW) + '</code></span>' +
          '</div>' +
        '</div>';

        return html;
      },
      validate: (d) => {
        if (!d.sectorId)     return "Please select a sector.";
        if (!d.departmentId) return "Please select a department.";
        if (d.workLevel === "cluster") {
          if (!d.clusterId)  return "Please select a cluster.";
          if (d.clusterLevel === "woreda" && !d.woredaCode) return "Please select a woreda / city.";
        }
        return null;
      },
      after: (root, data, refresh) => {
        const secSel = root.querySelector("#wiz-sector");
        if (secSel) secSel.addEventListener("change", () => {
          data.sectorId = secSel.value;
          data.departmentId = "";
          refresh();
        });

        const deptSel = root.querySelector("#wiz-dept");
        if (deptSel) deptSel.addEventListener("change", () => {
          data.departmentId = deptSel.value;
        });

        root.querySelectorAll("[data-level]").forEach(btn => {
          btn.addEventListener("click", () => {
            data.workLevel = btn.dataset.level;
            if (data.workLevel === "regional") {
              data.clusterId = "";
              data.clusterLevel = "cluster";
              data.woredaCode = "";
              data.officeId = "";
            } else {
              if (!data.clusterLevel) data.clusterLevel = "cluster";
            }
            refresh();
          });
        });

        const clSel = root.querySelector("#wiz-cluster");
        if (clSel) clSel.addEventListener("change", () => {
          data.clusterId = clSel.value;
          data.woredaCode = "";
          data.officeId = "";
          refresh();
        });

        root.querySelectorAll("[data-cluster-level]").forEach(btn => {
          btn.addEventListener("click", () => {
            data.clusterLevel = btn.dataset.clusterLevel;
            if (data.clusterLevel === "cluster") {
              data.woredaCode = "";
              data.officeId = "";
            }
            refresh();
          });
        });

        const woSel = root.querySelector("#wiz-woreda");
        if (woSel) woSel.addEventListener("change", () => {
          data.woredaCode = woSel.value;
          data.officeId = "";
          refresh();
        });

        const ofSel = root.querySelector("#wiz-office");
        if (ofSel) ofSel.addEventListener("change", () => { data.officeId = ofSel.value; });
      }
    },

    /* ---------- 3. ROLE & PAY ---------- */
    {
      label: "Role & Pay",
      title: "Choose role and compensation",
      render: (d) => {
        const roleOpts = roleOptions.map(r =>
          '<option value="' + r + '"' + (d.role === r ? " selected" : "") + '>' + escapeHtml(roleLabel(r)) + '</option>'
        ).join("");

        return '<div class="field"><label class="field__required">Role</label>' +
            '<select data-field="role" id="assign-role-sel">' + roleOpts + '</select>' +
          '</div>' +
          '<div class="field hidden" id="assign-financeField"><label>Finance sub-role</label>' +
            '<select data-field="financeRole">' +
              FINANCE_SUBROLES.map(f => '<option value="' + f.key + '">' + f.label + '</option>').join("") +
            '</select>' +
          '</div>' +
          '<div class="field hidden" id="assign-hrmField"><label>HRM sub-role</label>' +
            '<select data-field="hrmRole">' +
              HRM_SUBROLES.map(h => '<option value="' + h.key + '">' + h.label + '</option>').join("") +
            '</select>' +
          '</div>' +
          '<div class="field"><label>Position title</label>' +
            '<input data-field="position" value="' + escapeHtml(d.position || "") + '" placeholder="e.g. Accountant">' +
          '</div>' +
          '<div class="field-row">' +
            '<div class="field"><label>Hire date</label>' +
              '<input data-field="hireDate" type="date" value="' + escapeHtml(d.hireDate || "") + '">' +
            '</div>' +
            '<div class="field"><label>Employment type</label>' +
              '<select data-field="employmentType">' +
                '<option value="permanent"' + (d.employmentType === "permanent" ? " selected" : "") + '>Permanent</option>' +
                '<option value="contract"' + (d.employmentType === "contract" ? " selected" : "") + '>Contract</option>' +
                '<option value="temporary"' + (d.employmentType === "temporary" ? " selected" : "") + '>Temporary</option>' +
                '<option value="intern"' + (d.employmentType === "intern" ? " selected" : "") + '>Intern</option>' +
              '</select>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:8px;padding-top:20px;border-top:1px solid var(--border-soft)">' +
            '<div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px">Compensation (ETB)</div>' +
            '<div class="field-row">' +
              '<div class="field"><label class="field__required">Basic salary</label>' +
                '<input data-field="basicSalary" type="number" step="0.01" min="0" value="' + escapeHtml(d.basicSalary || "") + '" placeholder="0.00">' +
                '<p class="field__hint">Required for payroll.</p>' +
              '</div>' +
              '<div class="field"><label>Transport allowance</label>' +
                '<input data-field="transportAllowance" type="number" step="0.01" min="0" value="' + escapeHtml(d.transportAllowance || "") + '" placeholder="0.00">' +
              '</div>' +
            '</div>' +
            '<div class="field-row">' +
              '<div class="field"><label>Housing allowance</label>' +
                '<input data-field="housingAllowance" type="number" step="0.01" min="0" value="' + escapeHtml(d.housingAllowance || "") + '" placeholder="0.00">' +
              '</div>' +
              '<div class="field"><label>Position allowance</label>' +
                '<input data-field="positionAllowance" type="number" step="0.01" min="0" value="' + escapeHtml(d.positionAllowance || "") + '" placeholder="0.00">' +
              '</div>' +
            '</div>' +
            '<div class="field"><label>Other allowance</label>' +
              '<input data-field="otherAllowance" type="number" step="0.01" min="0" value="' + escapeHtml(d.otherAllowance || "") + '" placeholder="0.00">' +
            '</div>' +
          '</div>';
      },
      validate: (d) => {
        if (!d.role) return "Please select a role.";
        if (d.role === "finance" && !d.financeRole) return "Choose a finance sub-role.";
        if (d.role === "hrm" && !d.hrmRole) return "Choose an HRM sub-role.";
        if (!(Number(d.basicSalary) > 0)) return "Basic salary is required (must be greater than 0).";
        return null;
      },
      after: (root, data) => {
        const roleSel = root.querySelector("#assign-role-sel");
        const finField = root.querySelector("#assign-financeField");
        const hrmField = root.querySelector("#assign-hrmField");
        if (!roleSel) return;
        const updateSub = () => {
          const r = roleSel.value;
          if (finField) finField.classList.toggle("hidden", r !== "finance");
          if (hrmField) hrmField.classList.toggle("hidden", r !== "hrm");
          data.role = r;
        };
        updateSub();
        roleSel.addEventListener("change", updateSub);
      }
    },

    /* ---------- 4. REVIEW ---------- */
    {
      label: "Review",
      title: "Review the assignment",
      render: (d) => {
        const u = USERS.find(x => x.id === d.selectedUserId);
        if (!u) return '<div class="alert alert--error">Please go back and select a user.</div>';

        const selectedSector = SECTORS.find(s => s.id === d.sectorId) || getRegionSectors(S.region).find(s => s.id === d.sectorId);
        const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
        const isCluster = d.workLevel === "cluster";
        const isWoredaStaff = isCluster && d.clusterLevel === "woreda";
        const cl = isCluster ? CLUSTERS.find(c => c.id === d.clusterId) : null;
        const woreda = (isWoredaStaff && cl)
          ? normalizeWoredas(cl.woredas).find(w => w.code === d.woredaCode)
          : null;
        const office = (isWoredaStaff && d.officeId)
          ? OFFICES.find(o => o.id === d.officeId)
          : null;

        const RR = twoDigits(selectedSector ? (selectedSector.regionCode || selectedSector.region || S.region) : S.region);
        const SS = twoDigits(selectedSector && selectedSector.code);
        const CC = twoDigits(isCluster && cl ? cl.code : "00");
        const DD = twoDigits(dept && dept.code);
        const WW = twoDigits(isWoredaStaff ? d.woredaCode : "00");

        const basic = Number(d.basicSalary || 0);
        const totalAllow = Number(d.transportAllowance || 0) + Number(d.housingAllowance || 0) +
                           Number(d.positionAllowance || 0) + Number(d.otherAllowance || 0);

        const isReassign = isUserAlreadyAssigned(u, employeesByUid[u.id]);

        let html = '';

        html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;' +
                'background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid var(--border);border-radius:14px">' +
          '<div class="admin-avatar" style="width:60px;height:60px;font-size:20px">' +
            (u.photoURL ? '<img src="' + escapeHtml(u.photoURL) + '" alt="">' : escapeHtml(initials(u.name || u.email))) +
          '</div>' +
          '<div style="min-width:0">' +
            '<div style="font-size:16px;font-weight:800">' + escapeHtml(u.name || u.email || "User") + '</div>' +
            '<div style="font-size:12.5px;color:var(--muted);margin-top:2px">' + escapeHtml(u.email || "") + '</div>' +
          '</div>' +
          (isReassign ? '<span class="tag tag--gold" style="margin-left:auto;flex-shrink:0">Transfer</span>' : '') +
        '</div>';

        if (isReassign) {
          html += '<div class="alert alert--warning"><svg viewBox="0 0 24 24">' + ICONS.alert + '</svg>' +
            '<div>This is a <strong>transfer</strong>. Clearance <strong>' + escapeHtml(d.reassign_clearanceNumber || "—") +
            '</strong>, letter <strong>' + escapeHtml(d.reassign_letterNumber || "—") +
            '</strong> dated <strong>' + escapeHtml(d.reassign_letterDate || "—") +
            '</strong> will be recorded. A <strong>new Employee ID</strong> will be issued below.</div></div>';
        }

        html += '<div class="id-preview" style="margin-bottom:18px">' +
          '<div class="id-preview__lbl">' + (isReassign ? "New Employee ID (after transfer)" : "Employee ID that will be generated") + '</div>' +
          '<div class="id-preview__val">' +
            escapeHtml(RR) + '-' + escapeHtml(SS) + escapeHtml(CC) + escapeHtml(DD) + escapeHtml(WW) + '-00000001' +
          '</div>' +
          '<div class="id-preview__parts">' +
            '<span class="part">Region <code>' + escapeHtml(RR) + '</code></span>' +
            '<span class="part">Sector <code>' + escapeHtml(SS) + '</code></span>' +
            '<span class="part">Cluster <code>' + escapeHtml(CC) + '</code></span>' +
            '<span class="part">Department <code>' + escapeHtml(DD) + '</code></span>' +
            '<span class="part">Woreda <code>' + escapeHtml(WW) + '</code></span>' +
            '<span class="part">Sequence <code>00000001 &rarr; 99999999</code></span>' +
          '</div>' +
        '</div>';

        html += '<div class="review">';
        if (selectedSector) html += '<div class="review__row"><span class="review__k">Sector</span><span class="review__v">' +
          escapeHtml(selectedSector.name) + ' (' + escapeHtml(selectedSector.code || "??") + ')</span></div>';
        if (dept) html += '<div class="review__row"><span class="review__k">Department</span><span class="review__v">' +
          escapeHtml(dept.name) + ' (' + escapeHtml(dept.code || "??") + ')</span></div>';
        html += '<div class="review__row"><span class="review__k">Level</span><span class="review__v">' +
          '<span class="tag tag--blue">' + (isCluster ? "Cluster" : "Regional") + '</span>' +
          (isCluster ? ' <span class="tag tag--violet">' + (isWoredaStaff ? "Woreda / City staff" : "Cluster staff") + '</span>' : '') +
          '</span></div>';
        if (isCluster && cl) html += '<div class="review__row"><span class="review__k">Cluster</span><span class="review__v">' +
          escapeHtml(cl.name) + ' (' + escapeHtml(cl.code || "??") + ')</span></div>';
        if (isWoredaStaff && woreda) html += '<div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">' +
          escapeHtml(woreda.name) + ' (' + escapeHtml(d.woredaCode || "??") + ')</span></div>';
        if (office) html += '<div class="review__row"><span class="review__k">Office</span><span class="review__v">' +
          escapeHtml(office.name) + ' (' + escapeHtml(office.code || "??") + ')</span></div>';
        if (d.position)  html += '<div class="review__row"><span class="review__k">Position</span><span class="review__v">' + escapeHtml(d.position) + '</span></div>';
        if (d.hireDate)  html += '<div class="review__row"><span class="review__k">Hire date</span><span class="review__v">' + escapeHtml(d.hireDate) + '</span></div>';
        html += '</div>';

        html += '<div style="height:16px"></div>';

        html += '<div class="review">' +
          '<div class="review__row"><span class="review__k">Role</span><span class="review__v">' +
            '<span class="role-badge role-badge--' + d.role + '">' +
              '<svg viewBox="0 0 24 24">' + ICONS.shield + '</svg>' +
              escapeHtml(roleLabel(d.role)) +
            '</span>' +
          '</span></div>' +
          '<div class="review__row"><span class="review__k">Basic salary</span>' +
            '<span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">' +
              escapeHtml(fmtMoney(basic) || "0") + ' ETB' +
            '</span>' +
          '</div>' +
          (totalAllow
            ? '<div class="review__row"><span class="review__k">Allowances</span>' +
                '<span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">' +
                  escapeHtml(fmtMoney(totalAllow)) + ' ETB' +
                '</span></div>'
            : "") +
        '</div>';

        return html;
      }
    }
  ];

  /* If preselected user is already assigned, add the reassign step up front */
  if (preselected && isUserAlreadyAssigned(preselected, employeesByUid[preselected.id])) {
    steps.splice(1, 0, reassignStep);
  }

  openWizard({
    title: "Assign Role & Work Area",
    subtitle: "Pick a person, then walk down the organisation tree",
    finishLabel: "Save Assignment",
    successMessage: "Role and work area saved.",
    size: "lg",
    initial: {
      selectedUserId: preselectedUserId || "",
      sectorId: "",
      departmentId: "",
      workLevel: "regional",
      clusterLevel: "cluster",
      clusterId: "",
      woredaCode: "",
      officeId: "",
      role: "employee",
      position: "",
      hireDate: new Date().toISOString().slice(0, 10),
      employmentType: "permanent",
      basicSalary: "",
      transportAllowance: "",
      housingAllowance: "",
      positionAllowance: "",
      otherAllowance: "",
      /* reassign fields */
      reassign_confirmed: null,
      reassign_clearanceNumber: "",
      reassign_letterNumber: "",
      reassign_letterDate: "",
      reassign_clearanceFileData: null,
      reassign_clearanceFileName: ""
    },
    steps,
    onFinish: async (d) => {
      const u = USERS.find(x => x.id === d.selectedUserId);
      if (!u) throw new Error("User no longer exists.");
      const emp = employeesByUid[u.id];

      const selectedSector = SECTORS.find(s => s.id === d.sectorId);
      if (!selectedSector) throw new Error("Selected sector no longer exists.");
      const dept = DEPARTMENTS.find(x => x.id === d.departmentId);
      if (!dept) throw new Error("Selected department no longer exists.");

      const isCluster = d.workLevel === "cluster";
      const isWoredaStaff = isCluster && d.clusterLevel === "woreda";
      const cl = isCluster ? CLUSTERS.find(c => c.id === d.clusterId) : null;
      if (isCluster && !cl) throw new Error("Selected cluster no longer exists.");

      const regionCode = selectedSector.regionCode || selectedSector.region || S.region;
      const regionNameStr = regionName(regionCode);
      const sectorCode = selectedSector.code || "00";
      const departmentCode = dept.code || "00";
      const clusterCode = isCluster && cl ? (cl.code || "00") : "00";
      const woredaCode  = isWoredaStaff ? (d.woredaCode || "00") : "00";

      /* ---- Was this a re-assignment? ---- */
      const isReassign = isUserAlreadyAssigned(u, emp);
      const previousEmpId = emp?.empId || u.empId || null;

      if (isReassign && d.reassign_confirmed !== true) {
        throw new Error("Re-assignment requires confirmation and clearance documents.");
      }

      /* ---- Generate new employee ID (new codes → new ID) ---- */
      const { empId, seq } = await generateEmployeeId({
        regionCode, sectorCode, clusterCode, departmentCode, woredaCode
      });

      const woredaNameStr = isWoredaStaff && cl
        ? (normalizeWoredas(cl.woredas).find(w => w.code === d.woredaCode)?.name || "")
        : "";
      const office = isWoredaStaff && d.officeId ? OFFICES.find(o => o.id === d.officeId) : null;

      /* ---- Save transfer history BEFORE overwriting ---- */
      let historyRefId = null;
      if (isReassign) {
        try {
          const prevSector = SECTORS.find(s => s.id === u.sectorId);
          const prevDept   = DEPARTMENTS.find(x => x.id === u.departmentId);
          const prevCl     = CLUSTERS.find(c => c.id === u.clusterId);
          const prevRef = await addDoc(collection(db, "transferHistory"), {
            userId: u.id,
            userName: u.name || "",
            userEmail: u.email || "",
            previousEmpId,
            previousRole: u.role || null,
            previousPlacement: {
              regionCode: u.regionCode || u.region || null,
              sectorId:   u.sectorId || null,   sectorName: prevSector?.name || u.sectorName || null,
              departmentId: u.departmentId || null, departmentName: prevDept?.name || u.departmentName || null,
              clusterId:  u.clusterId || null,  clusterName: prevCl?.name || u.clusterName || null,
              woredaCode: u.woredaCode || null, woredaName: u.woredaName || null,
              officeId:   u.officeId || null,   officeName: u.officeName || null
            },
            previousSalary: {
              basicSalary: Number(emp?.basicSalary || 0),
              transportAllowance: Number(emp?.transportAllowance || 0),
              housingAllowance: Number(emp?.housingAllowance || 0),
              positionAllowance: Number(emp?.positionAllowance || 0),
              otherAllowance: Number(emp?.otherAllowance || 0)
            },
            newPlacement: {
              regionCode,
              sectorId: selectedSector.id, sectorName: selectedSector.name || null,
              departmentId: dept.id, departmentName: dept.name || null,
              clusterId: isCluster && cl ? cl.id : null,
              clusterName: isCluster && cl ? (cl.name || null) : null,
              woredaCode: isWoredaStaff ? d.woredaCode : null,
              woredaName: isWoredaStaff ? woredaNameStr : null,
              officeId: office ? office.id : null,
              officeName: office ? (office.name || null) : null
            },
            newRole: d.role,
            newEmpId: empId,
            clearanceNumber: (d.reassign_clearanceNumber || "").trim(),
            letterNumber: (d.reassign_letterNumber || "").trim(),
            letterDate: d.reassign_letterDate || null,
            clearanceFileData: d.reassign_clearanceFileData || null,
            clearanceFileName: d.reassign_clearanceFileName || null,
            transferredBy: S.uid,
            transferredByName: S.name,
            transferredAt: serverTimestamp()
          });
          historyRefId = prevRef.id;
        } catch (e) {
          console.warn("[transferHistory]", e.code, e.message);
          /* Not fatal — the transfer still proceeds */
        }
      }

      /* ---- Update user doc ---- */
      const userPatch = {
        role: d.role,
        region: regionCode, regionCode, regionName: regionNameStr,
        sectorId: selectedSector.id, sectorName: selectedSector.name || null,
        departmentId: dept.id, departmentName: dept.name || null,
        clusterId: isCluster && cl ? cl.id : null,
        clusterName: isCluster && cl ? (cl.name || null) : null,
        woredaCode: isWoredaStaff ? d.woredaCode : null,
        woredaName: isWoredaStaff ? woredaNameStr : null,
        officeId: office ? office.id : null,
        officeName: office ? (office.name || null) : null,
        isClusterStaff: isCluster && !isWoredaStaff,
        empId,
        isDirector: false,
        financeRole: d.role === "finance" ? (d.financeRole || null) : null,
        hrmRole: d.role === "hrm" ? (d.hrmRole || null) : null,
        position: (d.position || "").trim() || null,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid,
        assignedAt: serverTimestamp(),
        assignedBy: S.uid
      };
      if (isReassign) {
        userPatch.previousEmpId = previousEmpId;
        userPatch.lastTransferAt = serverTimestamp();
        userPatch.lastTransferBy = S.uid;
        userPatch.lastClearanceNumber = (d.reassign_clearanceNumber || "").trim();
        userPatch.lastLetterNumber = (d.reassign_letterNumber || "").trim();
        if (historyRefId) userPatch.lastTransferHistoryId = historyRefId;
      }
      await updateDoc(doc(db, "users", u.id), userPatch);

      /* ---- Update employee doc ---- */
      if (emp) {
        const empPatch = {
          role: d.role,
          empId, seq,
          regionCode, regionName: regionNameStr,
          sectorId: selectedSector.id, sectorCode, sectorName: selectedSector.name || null,
          departmentId: dept.id, departmentCode, departmentName: dept.name || null,
          clusterId: isCluster && cl ? cl.id : null,
          clusterCode: clusterCode,
          clusterName: isCluster && cl ? (cl.name || null) : null,
          woredaCode: isWoredaStaff ? d.woredaCode : null,
          woredaName: isWoredaStaff ? woredaNameStr : null,
          officeId: office ? office.id : null,
          officeCode: office ? (office.code || null) : null,
          officeName: office ? (office.name || null) : null,
          isClusterStaff: isCluster && !isWoredaStaff,
          isDirector: false,
          position: (d.position || "").trim() || null,
          hireDate: d.hireDate || null,
          employmentType: d.employmentType || "permanent",
          status: "active",
          basicSalary: Number(d.basicSalary) || 0,
          transportAllowance: Number(d.transportAllowance) || 0,
          housingAllowance: Number(d.housingAllowance) || 0,
          positionAllowance: Number(d.positionAllowance) || 0,
          otherAllowance: Number(d.otherAllowance) || 0,
          updatedAt: serverTimestamp(),
          updatedBy: S.uid
        };
        if (isReassign) {
          empPatch.previousEmpId = previousEmpId;
          empPatch.lastTransferAt = serverTimestamp();
        }
        await updateDoc(doc(db, "employees", emp.id), empPatch);
      }

      /* ---- Notification ---- */
      try {
        await addDoc(collection(db, "notifications"), {
          type: isReassign ? "user_transferred" : "role_assigned",
          title: isReassign ? "User transferred" : "Role assigned",
          body: isReassign
            ? `${u.name || u.email} transferred from ${previousEmpId || "—"} to ${empId}. Clearance ${d.reassign_clearanceNumber}.`
            : `${u.name || u.email} is now ${roleLabel(d.role)}. Employee ID: ${empId}`,
          targetUid: u.id,
          forRoles: ["super_admin", "regional_admin", "hrm"],
          link: "users.html",
          read: false,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (e) {}
    }
  });
}

/* ============================================================
   VIEW MODAL
   ============================================================ */
function openViewModal(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  const emp = employeesByUid[u.id];
  const isSelf = u.id === S.uid;
  const photo = u.photoURL || emp?.photoURL || null;
  const basic = emp?.basicSalary || 0;
  const trans = emp?.transportAllowance || 0;
  const house = emp?.housingAllowance || 0;
  const pos   = emp?.positionAllowance || 0;
  const oth   = emp?.otherAllowance || 0;
  const gross = Number(basic) + Number(trans) + Number(house) + Number(pos) + Number(oth);
  const dept = DEPARTMENTS.find(d => d.id === emp?.departmentId || d.id === u.departmentId);
  const sector = SECTORS.find(s => s.id === emp?.sectorId || s.id === u.sectorId);

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">${escapeHtml(u.name || "User")}</div>
        <div class="modal__sub">${escapeHtml(u.email || "")}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div style="display:flex;align-items:center;gap:20px;padding:20px;background:linear-gradient(135deg,#f8fbff,#fff);border-radius:16px;border:1px solid var(--border);margin-bottom:20px">
        <div class="user-avatar" style="width:72px;height:72px;font-size:26px">
          ${photo ? `<img src="${escapeHtml(photo)}" alt="">` : escapeHtml(initials(u.name || u.email))}
        </div>
        <div style="min-width:0">
          <div style="font-size:20px;font-weight:800;letter-spacing:-.4px">
            ${escapeHtml(u.name || "—")}
            ${isSelf ? `<span class="you-tag" style="margin-left:6px">You</span>` : ""}
          </div>
          <div style="font-size:13.5px;color:var(--muted);margin-top:4px">${escapeHtml(u.email || "")}</div>
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
            <span class="role-badge role-badge--${u.role || "unassigned"}">
              <svg viewBox="0 0 24 24">${ICONS.shield}</svg>
              ${escapeHtml(roleLabel(u.role || "unassigned"))}
            </span>
            ${emp?.isDirector || u.isDirector ? `<span class="tag tag--violet">Director</span>` : ""}
            <span class="tag ${u.active === false ? "tag--red" : "tag--green"}">
              ${u.active === false ? "Inactive" : "Active"}
            </span>
          </div>
        </div>
      </div>

      ${emp ? `
        <div class="review">
          <div class="review__row"><span class="review__k">Employee ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(emp.empId || "—")}</span></div>
          ${u.previousEmpId ? `<div class="review__row"><span class="review__k">Previous ID</span><span class="review__v" style="font-family:ui-monospace,monospace;color:var(--muted)">${escapeHtml(u.previousEmpId)}</span></div>` : ""}
          <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatNationalIdDisplay(emp.nationalId) || "—")}</span></div>
          <div class="review__row"><span class="review__k">Phone</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(formatPhoneDisplay(emp.phone) || "—")}</span></div>
          ${emp.position ? `<div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(emp.position)}</span></div>` : ""}
          ${sector ? `<div class="review__row"><span class="review__k">Sector</span><span class="review__v">${escapeHtml(sector.name)} (${escapeHtml(sector.code || "??")})</span></div>` : ""}
          ${dept ? `<div class="review__row"><span class="review__k">Department</span><span class="review__v">${escapeHtml(dept.name)} (${escapeHtml(dept.code || "??")})</span></div>` : ""}
          ${emp.clusterName ? `<div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(emp.clusterName)}</span></div>` : ""}
          ${emp.woredaName ? `<div class="review__row"><span class="review__k">Woreda / City</span><span class="review__v">${escapeHtml(emp.woredaName)}</span></div>` : ""}
          ${emp.officeName ? `<div class="review__row"><span class="review__k">Office</span><span class="review__v">${escapeHtml(emp.officeName)}</span></div>` : ""}
          ${emp.hireDate ? `<div class="review__row"><span class="review__k">Hire date</span><span class="review__v">${escapeHtml(emp.hireDate)}</span></div>` : ""}
        </div>

        ${basic || trans || house || pos || oth ? `
          <div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border-soft);margin:22px 0 12px">Compensation (ETB)</div>
          <div class="review">
            <div class="review__row"><span class="review__k">Basic salary</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right;font-weight:800">${escapeHtml(fmtMoney(basic) || "0")}</span></div>
            ${trans ? `<div class="review__row"><span class="review__k">Transport allowance</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">${escapeHtml(fmtMoney(trans))}</span></div>` : ""}
            ${house ? `<div class="review__row"><span class="review__k">Housing allowance</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">${escapeHtml(fmtMoney(house))}</span></div>` : ""}
            ${pos   ? `<div class="review__row"><span class="review__k">Position allowance</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">${escapeHtml(fmtMoney(pos))}</span></div>` : ""}
            ${oth   ? `<div class="review__row"><span class="review__k">Other allowance</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right">${escapeHtml(fmtMoney(oth))}</span></div>` : ""}
            <div class="review__row"><span class="review__k">Gross (est.)</span><span class="review__v" style="font-family:ui-monospace,monospace;text-align:right;font-weight:800">${escapeHtml(fmtMoney(gross))}</span></div>
          </div>
        ` : ""}
      ` : `
        <div class="alert alert--warning">
          <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>This user has no linked employee record.</div>
        </div>
      `}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${canAssignTo(u) ? `
        <button class="btn btn--gold" id="view-assign-btn">
          <svg viewBox="0 0 24 24">${ICONS.userCheck}</svg> ${isUserAlreadyAssigned(u, emp) ? "Transfer" : "Assign"}
        </button>` : ""}
      ${canManageUser(u) ? `
        <button class="btn btn--primary" id="view-edit-btn">
          <svg viewBox="0 0 24 24">${ICONS.edit}</svg> Edit
        </button>` : ""}
    </div>
  `);

  document.getElementById("view-edit-btn")?.addEventListener("click", () => { closeModal(); setTimeout(() => openEditModal(userId), 100); });
  document.getElementById("view-assign-btn")?.addEventListener("click", () => { closeModal(); setTimeout(() => openAssignWizard(userId), 100); });
}

/* ============================================================
   EDIT MODAL
   ============================================================ */
function openEditModal(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  if (!canManageUser(u)) { toast("You cannot edit this user", "error"); return; }
  const emp = employeesByUid[u.id];
  const isSelf = u.id === S.uid;
  const currentPhoneNorm = normalizePhone(emp?.phone || u.phone || "");

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Edit person</div>
        <div class="modal__sub">${escapeHtml(u.name || u.email || "")}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div id="eu-error" class="alert alert--error" style="display:none">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div id="eu-error-msg" style="flex:1"></div>
      </div>

      <div class="field-row">
        <div class="field"><label>Full name</label>
          <input id="eu-name" value="${escapeHtml(u.name || "")}" autocomplete="off"></div>
        <div class="field"><label>Phone</label>
          <div class="phone-group">
            <span class="phone-group__cc">+251</span>
            <input id="eu-phone" value="${escapeHtml(currentPhoneNorm)}"
                   placeholder="912 345 678" inputmode="numeric" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="field"><label>Login email</label>
        <input value="${escapeHtml(u.email || "")}" disabled></div>

      ${emp ? `
        <div class="field-row">
          <div class="field"><label>Position</label>
            <input id="eu-position" value="${escapeHtml(emp.position || "")}"></div>
          <div class="field"><label>Hire date</label>
            <input id="eu-hireDate" type="date" value="${escapeHtml(emp.hireDate || "")}"></div>
        </div>

        <div style="margin-top:8px;padding-top:20px;border-top:1px solid var(--border-soft)">
          <div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border-soft);margin-bottom:14px">Compensation (ETB)</div>
          <div class="field-row">
            <div class="field"><label>Basic salary</label>
              <input id="eu-basicSalary" type="number" step="0.01" min="0"
                     value="${emp.basicSalary || ""}" placeholder="0.00"></div>
            <div class="field"><label>Transport allowance</label>
              <input id="eu-transportAllowance" type="number" step="0.01" min="0"
                     value="${emp.transportAllowance || ""}" placeholder="0.00"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Housing allowance</label>
              <input id="eu-housingAllowance" type="number" step="0.01" min="0"
                     value="${emp.housingAllowance || ""}" placeholder="0.00"></div>
            <div class="field"><label>Position allowance</label>
              <input id="eu-positionAllowance" type="number" step="0.01" min="0"
                     value="${emp.positionAllowance || ""}" placeholder="0.00"></div>
          </div>
          <div class="field"><label>Other allowance</label>
            <input id="eu-otherAllowance" type="number" step="0.01" min="0"
                   value="${emp.otherAllowance || ""}" placeholder="0.00"></div>
        </div>
      ` : ""}

      ${!isSelf ? `
        <label style="display:inline-flex;align-items:center;gap:10px;font-size:13.5px;
                      color:var(--text-soft);font-weight:500;cursor:pointer;user-select:none;margin-top:8px">
          <input type="checkbox" id="eu-active" ${u.active !== false ? "checked" : ""}
                 style="width:18px;height:18px;accent-color:var(--primary)">
          <span>Active (can sign in)</span>
        </label>
      ` : ""}

      <div class="alert alert--info" style="margin-top:18px;margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.userCheck}</svg>
        <div>To change this person's <strong>role / work area</strong>, use the <strong>Assign / Transfer</strong> action.</div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="eu-submit">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save changes</span>
      </button>
    </div>
  `);

  const euPhone = document.getElementById("eu-phone");
  euPhone?.addEventListener("input", () => {
    let v = euPhone.value.replace(/\D/g, "");
    if (v.startsWith("251") && v.length > PHONE_LENGTH) v = v.slice(3);
    if (v.startsWith("0")) v = v.slice(1);
    v = v.slice(0, PHONE_LENGTH);
    if (euPhone.value !== v) euPhone.value = v;
  });

  document.getElementById("eu-submit").addEventListener("click", async () => {
    const errBox = document.getElementById("eu-error");
    const errMsg = document.getElementById("eu-error-msg");
    const btn = document.getElementById("eu-submit");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");
    errBox.style.display = "none";

    const name  = document.getElementById("eu-name").value.trim();
    const phoneRaw = document.getElementById("eu-phone").value.trim();
    const phoneNorm = normalizePhone(phoneRaw);

    if (name.length < 2) { errBox.style.display = "flex"; errMsg.textContent = "Name must be at least 2 characters."; return; }
    if (phoneNorm && phoneNorm.length !== PHONE_LENGTH) { errBox.style.display = "flex"; errMsg.textContent = `Phone number must be exactly ${PHONE_LENGTH} digits after +251.`; return; }

    if (emp && phoneNorm !== (emp.phoneNorm || "")) {
      const dup = await findEmployeeByPhone(phoneNorm);
      if (dup && dup.id !== emp.id) {
        errBox.style.display = "flex";
        errMsg.textContent = `Phone already registered to ${dup.nameEn || dup.firstName || "another employee"}.`;
        return;
      }
    }

    const phoneDisplay = phoneNorm.length === PHONE_LENGTH
      ? "+251 " + phoneNorm.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3")
      : null;

    const userPatch = { name, updatedAt: serverTimestamp(), updatedBy: S.uid };
    if (phoneDisplay) { userPatch.phone = phoneDisplay; userPatch.phoneNorm = phoneNorm; }

    const activeEl = document.getElementById("eu-active");
    if (activeEl && !isSelf) userPatch.active = activeEl.checked;

    const empPatch = { updatedAt: serverTimestamp() };
    const posEl  = document.getElementById("eu-position");
    const hireEl = document.getElementById("eu-hireDate");
    if (posEl)  empPatch.position = posEl.value.trim();
    if (hireEl) empPatch.hireDate = hireEl.value;
    if (phoneDisplay) { empPatch.phone = phoneDisplay; empPatch.phoneNorm = phoneNorm; }

    const basicEl  = document.getElementById("eu-basicSalary");
    const transEl  = document.getElementById("eu-transportAllowance");
    const houseEl  = document.getElementById("eu-housingAllowance");
    const posAllEl = document.getElementById("eu-positionAllowance");
    const otherEl  = document.getElementById("eu-otherAllowance");
    if (basicEl)  empPatch.basicSalary        = basicEl.value === "" ? 0 : Number(basicEl.value);
    if (transEl)  empPatch.transportAllowance = transEl.value === "" ? 0 : Number(transEl.value);
    if (houseEl)  empPatch.housingAllowance   = houseEl.value === "" ? 0 : Number(houseEl.value);
    if (posAllEl) empPatch.positionAllowance  = posAllEl.value === "" ? 0 : Number(posAllEl.value);
    if (otherEl)  empPatch.otherAllowance     = otherEl.value === "" ? 0 : Number(otherEl.value);

    btn.disabled = true; spinner.classList.remove("hidden");
    const old = label.textContent; label.textContent = "Saving…";

    try {
      await updateDoc(doc(db, "users", userId), userPatch);
      if (emp) await updateDoc(doc(db, "employees", emp.id), empPatch);
      toast("Person updated", "success");
      closeModal();
    } catch (err) {
      console.error(err);
      errBox.style.display = "flex";
      errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || "")}`;
      btn.disabled = false; spinner.classList.add("hidden"); label.textContent = old;
    }
  });
}

/* ============================================================
   DELETE
   ============================================================ */
function confirmDelete(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  if (!canDeleteUser(u)) { toast("You cannot delete this user", "error"); return; }
  const emp = employeesByUid[u.id];

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Delete person?</div>
        <div class="modal__sub">This cannot be undone</div>
      </div>
      <button class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to delete:</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">${escapeHtml(u.name || u.email || "")}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(u.email || "")}</div>
        </div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--danger" id="confirm-del">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Delete person</span>
      </button>
    </div>
  `);

  document.getElementById("confirm-del").addEventListener("click", async () => {
    const btn = document.getElementById("confirm-del");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");
    btn.disabled = true; spinner.classList.remove("hidden");
    const old = label.textContent; label.textContent = "Deleting…";

    try {
      if (emp?.nationalIdNorm) await releaseUnique("nationalId", emp.nationalIdNorm);
      if (emp?.phoneNorm)      await releaseUnique("phone", emp.phoneNorm);
      if (emp) await deleteDoc(doc(db, "employees", emp.id));
      await deleteDoc(doc(db, "users", userId));
      toast("Person removed", "success");
      closeModal();
    } catch (err) {
      console.error(err);
      toast(err.code + ": " + err.message, "error");
      btn.disabled = false; spinner.classList.add("hidden"); label.textContent = old;
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  let q = collection(db, "users");
  if (isRegionalAdmin() && S.region) q = query(q, where("region", "==", S.region));
  else if (isAdmin() && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubUsers = onSnapshot(q, (snap) => {
    USERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    subscribeEmployees();
    render();
  }, (err) => {
    console.warn("[users]", err.code, err.message);
    document.getElementById("users-tbody").innerHTML =
      `<tr><td colspan="8" style="text-align:center;padding:48px 20px;color:var(--danger)">
        Could not load: ${escapeHtml(err.code || "")} — ${escapeHtml(err.message || "")}
      </td></tr>`;
  });
}

function subscribeEmployees() {
  let q = collection(db, "employees");
  if (isRegionalAdmin() && S.region) q = query(q, where("regionCode", "==", S.region));
  else if (isAdmin() && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  onSnapshot(q, (snap) => {
    employeesById = {};
    employeesByUid = {};
    snap.forEach(d => {
      const data = { id: d.id, ...d.data() };
      employeesById[d.id] = data;
      if (data.uid) employeesByUid[data.uid] = data;
    });
    renderTable();
    if (S && !S.photoURL) {
      const mine = employeesByUid[S.uid];
      if (mine?.photoURL) { S.photoURL = mine.photoURL; renderUser(); }
    }
  }, (err) => console.warn("[employees]", err.code, err.message));
}

function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (isRegionalAdmin() && S.region) q = query(q, where("regionCode", "==", S.region));
  else if (isAdmin() && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubClusters = onSnapshot(q, (snap) => {
    CLUSTERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[clusters]", err.code, err.message));
}

function subscribeOffices() {
  if (unsubOffices) unsubOffices();
  let q = collection(db, "offices");
  if (isRegionalAdmin() && S.region) q = query(q, where("regionCode", "==", S.region));
  else if (isAdmin() && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubOffices = onSnapshot(q, (snap) => {
    OFFICES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }, (err) => console.warn("[offices]", err.code, err.message));
}

function subscribeDepartments() {
  if (unsubDepartments) unsubDepartments();
  let q = collection(db, "departments");
  if (isRegionalAdmin() && S.region) q = query(q, where("regionCode", "==", S.region));
  else if (isAdmin() && S.clusterId) q = query(q, where("clusterId", "==", S.clusterId));
  unsubDepartments = onSnapshot(q, (snap) => {
    DEPARTMENTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[departments]", err.code, err.message));
}

function subscribeSectors() {
  if (unsubSectors) unsubSectors();
  const q = collection(db, "sectors");
  unsubSectors = onSnapshot(q, (snap) => {
    SECTORS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[sectors]", err.code, err.message));
}

/* ============================================================
   SHELL
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () =>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

let searchTimer;
document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTerm = e.target.value; renderTable(); }, 130);
});
document.getElementById("role-filter").addEventListener("change", (e) => {
  filterRole = e.target.value; renderTable();
});
document.getElementById("status-filter").addEventListener("change", (e) => {
  filterStatus = e.target.value; renderTable();
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (e) { console.warn("[user read]", e); }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    region: userDoc?.region || userDoc?.regionCode || "",
    regionCode: userDoc?.regionCode || userDoc?.region || "",
    clusterId: userDoc?.clusterId || "",
    officeId: userDoc?.officeId || ""
  };

  if (!["super_admin","regional_admin","admin","hrm"].includes(S.role)) {
    window.location.replace("dashboard.html");
    return;
  }

  renderSidebar();
  renderUser();
  render();

  subscribeClusters();
  subscribeOffices();
  subscribeDepartments();
  subscribeSectors();
  subscribeUsers();
});

console.log("[users] booted — assign wizard now supports transfer with clearance documents");
</script>
