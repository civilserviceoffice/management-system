<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offices &amp; Clusters — Civil Service MIS</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>

      window.location.replace("../index.html");
    }

<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js",
    "firebase/storage":   "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js"
  }
}
</script>
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#0b5cab; --primary-dark:#073d75; --secondary:#0e7490;
  --text:#172033; --text-soft:#344054; --muted:#6b7280; --muted-light:#98a2b3;
  --border:#e5e7eb; --border-soft:#eef1f5; --white:#fff;
  --danger:#dc2626; --success:#067647; --warning:#b8860b; --bg:#f4f7fb; --bg-soft:#fbfcfe;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-sm:9px; --r-md:13px; --r-lg:20px; --r-full:999px;
  --sidebar-w:272px; --topbar-h:76px;
}
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; }
body {
  font-family:"Inter","Noto Sans Ethiopic",sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),
             var(--bg);
  color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body.ethiopic { font-family:"Noto Sans Ethiopic","Inter",sans-serif; }
img, svg { display:block; max-width:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { line-height:1.25; letter-spacing:-0.02em; font-weight:800; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }

.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main"; min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
body.sidebar-collapsed .app { grid-template-columns:88px 1fr; }

.sidebar { grid-area:sidebar; position:sticky; top:0; height:100vh; width:var(--sidebar-w);
  background:linear-gradient(145deg, #073d75 0%, #0b5cab 55%, #0e7490 100%);
  color:#fff; display:flex; flex-direction:column; overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1); z-index:30; }
body.sidebar-collapsed .sidebar { width:88px; }
.sidebar::before { content:""; position:absolute; width:450px; height:450px; border-radius:50%;
  border:1px solid rgba(255,255,255,.10); right:-220px; top:-150px; pointer-events:none; }
.sidebar::after { content:""; position:absolute; width:320px; height:320px; border-radius:50%;
  border:1px solid rgba(255,255,255,.08); left:-170px; bottom:-150px; pointer-events:none; }
.sidebar__brand { position:relative; z-index:2; display:flex; align-items:center; gap:14px;
  padding:22px; border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h); flex-shrink:0; }
.sidebar__logo { width:46px; height:46px; flex-shrink:0; border-radius:14px;
  background:rgba(255,255,255,.97); box-shadow:0 10px 24px rgba(0,0,0,.18);
  display:grid; place-items:center; padding:5px; }
.sidebar__logo img { width:100%; height:100%; object-fit:contain; border-radius:9px; }
.sidebar__identity { min-width:0; flex:1; opacity:1; transition:opacity .18s ease 60ms; white-space:nowrap; overflow:hidden; }
body.sidebar-collapsed .sidebar__identity { opacity:0; pointer-events:none; }
.sidebar__title { font-size:16px; font-weight:800; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; }
.sidebar__subtitle { font-size:11px; opacity:.72; margin-top:3px; overflow:hidden; text-overflow:ellipsis; }
.sidebar__collapse { position:absolute; right:-13px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; background:#fff; color:var(--primary-dark);
  border:3px solid var(--bg); display:grid; place-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15); z-index:10; cursor:pointer; }
.sidebar__collapse:hover { background:#f0f6ff; }
.sidebar__collapse svg { width:13px; height:13px; stroke:currentColor; stroke-width:2.5;
  fill:none; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s; }
body.sidebar-collapsed .sidebar__collapse svg { transform:rotate(180deg); }
.sidebar__nav { position:relative; z-index:2; flex:1; padding:20px 14px; overflow-y:auto; overflow-x:hidden; }
.sidebar__nav::-webkit-scrollbar { width:5px; }
.sidebar__nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:3px; }
.sidebar__section { font-size:10.5px; font-weight:800; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.45);
  padding:18px 12px 8px; white-space:nowrap; overflow:hidden; transition:all .2s ease; }
.sidebar__section:first-child { padding-top:4px; }
body.sidebar-collapsed .sidebar__section { height:6px; padding:0; opacity:0; margin-top:14px; margin-bottom:6px; }
.nav-item { display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:12px;
  font-size:14px; font-weight:600; color:rgba(255,255,255,.78);
  margin-bottom:3px; transition:background .15s, color .15s;
  white-space:nowrap; cursor:pointer; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.09); color:#fff; }
.nav-item.is-active { background:rgba(255,255,255,.16); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.nav-item.is-active::before { content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:24px; border-radius:0 4px 4px 0;
  background:#58e6a7; box-shadow:0 0 12px rgba(88,230,167,.6); }
.nav-item svg { width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:1.85; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.nav-item__label { flex:1; overflow:hidden; text-overflow:ellipsis; transition:opacity .15s; }
body.sidebar-collapsed .nav-item__label { opacity:0; pointer-events:none; }
body.sidebar-collapsed .nav-item { justify-content:center; padding:12px; }
body.sidebar-collapsed .nav-item:hover::after { content:attr(data-tooltip);
  position:absolute; left:calc(100% + 16px); top:50%; transform:translateY(-50%);
  background:var(--text); color:#fff; padding:7px 12px; border-radius:8px;
  font-size:12px; font-weight:600; white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2); z-index:100; pointer-events:none; animation:fadeIn .12s ease; }
body.sidebar-collapsed .nav-item.is-active::before { left:0; height:28px; border-radius:0 4px 4px 0; }
@keyframes fadeIn { from { opacity:0; transform:translate(-4px,-50%); } to { opacity:1; transform:translate(0,-50%); } }
.sidebar__footer { position:relative; z-index:2; padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.10);
  font-size:11px; color:rgba(255,255,255,.55);
  text-align:center; line-height:1.5; white-space:nowrap; overflow:hidden; }
.sidebar__footer div { transition:opacity .15s; }
body.sidebar-collapsed .sidebar__footer { padding:16px 8px; }
body.sidebar-collapsed .sidebar__footer div { opacity:0; height:0; overflow:hidden; }
body.sidebar-collapsed .sidebar__footer::after { content:"©"; display:block; font-size:18px; color:rgba(255,255,255,.5); line-height:1; }

.topbar { grid-area:topbar; background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 28px;
  position:sticky; top:0; z-index:20; }
.topbar__menu { display:none; width:42px; height:42px; border-radius:12px; color:var(--text);
  align-items:center; justify-content:center; cursor:pointer; }
.topbar__menu:hover { background:var(--border-soft); }
.topbar__spacer { flex:1; }
.topbar__actions { display:flex; align-items:center; gap:8px; }
.icon-btn { width:44px; height:44px; border-radius:13px; display:inline-flex;
  align-items:center; justify-content:center; color:var(--text-soft);
  transition:background .15s; cursor:pointer; }
.icon-btn:hover { background:var(--border-soft); }
.icon-btn svg { width:20px; height:20px; stroke:currentColor; stroke-width:1.85; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.user-btn { display:flex; align-items:center; gap:11px;
  padding:4px 14px 4px 4px; border-radius:var(--r-full);
  background:var(--border-soft); cursor:pointer; transition:background .15s; }
.user-btn:hover { background:#e4e9f1; }
.user-btn__avatar { width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; font-weight:800; font-size:13px;
  display:grid; place-items:center; box-shadow:0 6px 14px rgba(11,92,171,.25); }
.user-btn__meta { text-align:left; line-height:1.2; }
.user-btn__name { font-size:13px; font-weight:700; display:block; }
.user-btn__role { font-size:11px; color:var(--muted); text-transform:capitalize; font-weight:600; }
.dropdown { position:relative; }
.dropdown__panel { position:absolute; right:0; top:calc(100% + 12px);
  background:#fff; border:1px solid var(--border); border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12); min-width:260px; padding:8px; z-index:50; }
.dropdown__header { padding:12px 14px; border-bottom:1px solid var(--border-soft); margin-bottom:6px; }
.dropdown__header strong { display:block; font-size:14px; font-weight:700; }
.dropdown__header span { font-size:12px; color:var(--muted); }
.dropdown__item { display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 14px; border-radius:10px; font-size:14px; font-weight:500;
  color:var(--text-soft); text-align:left; cursor:pointer; }
.dropdown__item:hover { background:var(--border-soft); color:var(--text); }
.dropdown__item svg { width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none; }
.dropdown__divider { height:1px; background:var(--border-soft); margin:6px 0; }
.dropdown__item--danger { color:var(--danger); }

.diag-banner { display:none; margin-bottom:20px; padding:14px 18px;
  border-radius:12px; border:1px solid #fecdca;
  background:linear-gradient(135deg, #fef3f2, #fff);
  color:#7d1c26; font-size:13px; line-height:1.6; }
.diag-banner.show { display:block; }
.diag-banner.ok { border-color:#abefc6; background:linear-gradient(135deg, #ecfdf3, #fff); color:#067647; }
.diag-banner strong { font-weight:800; }
.diag-banner code { background:rgba(0,0,0,.06); padding:1px 6px; border-radius:4px;
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; font-weight:600; }

.main { grid-area:main; padding:32px; overflow-x:hidden; }
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
.page-head__title { font-size:32px; font-weight:800; letter-spacing:-1.2px; margin-bottom:6px; }
.page-head__sub { font-size:15px; color:var(--muted); }
.page-head__actions { display:flex; gap:10px; flex-wrap:wrap; }
.scope-badge { display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:linear-gradient(135deg, #eaf3fc, #fff);
  border:1px solid #bdd7f2; color:var(--primary-dark);
  font-size:12.5px; font-weight:700; margin-top:8px; }
.scope-badge svg { width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none; }
.scope-badge--super { background:linear-gradient(135deg, #f0eaff, #fff); border-color:#ddd2fb; color:#5b21b6; }
.scope-badge--manager { background:linear-gradient(135deg, #ecfdf3, #fff); border-color:#abefc6; color:#067647; }
.scope-badge--employee { background:linear-gradient(135deg, #fdf5e0, #fff); border-color:#f0dcb0; color:#b8860b; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px;
  height:46px; padding:0 20px; border-radius:13px;
  border:1px solid #d9dee7; background:#fff;
  color:var(--text-soft); font-size:14px; font-weight:700;
  white-space:nowrap; cursor:pointer; transition:all .15s; }
.btn:hover { background:var(--bg-soft); border-color:#b9c7d9; }
.btn svg { width:17px; height:17px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.btn--primary { background:linear-gradient(135deg, #0b5cab, #0e7490); border:none; color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22); }
.btn--primary:hover { background:linear-gradient(135deg, #073d75, #0b5cab); transform:translateY(-1px); }
.btn--danger { color:var(--danger); }
.btn--danger:hover { background:#fef3f2; border-color:#f0a5ab; }
.btn--sm { height:38px; padding:0 14px; font-size:13px; border-radius:10px; }
.btn--sm svg { width:15px; height:15px; }
.btn--icon { width:38px; padding:0; }
.btn:disabled { opacity:.55; pointer-events:none; }

.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
.stat { position:relative; background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); padding:20px; box-shadow:var(--sh-sm);
  overflow:hidden; transition:box-shadow .2s, transform .2s; }
.stat:hover { box-shadow:var(--sh-lg); transform:translateY(-3px); }
.stat::before { content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--c1, var(--primary)); border-radius:var(--r-lg) var(--r-lg) 0 0; }
.stat--blue    { --c1:linear-gradient(90deg, #0b5cab, #0e7490); --ic:#eaf3fc; --ifc:#0b5cab; }
.stat--green   { --c1:linear-gradient(90deg, #19a974, #34c78e); --ic:#e7f7f0; --ifc:#128a5c; }
.stat--gold    { --c1:linear-gradient(90deg, #d4a017, #e8b84b); --ic:#fdf5e0; --ifc:#b8860b; }
.stat--purple  { --c1:linear-gradient(90deg, #6d28d9, #a78bfa); --ic:#f0eaff; --ifc:#5b21b6; }
.stat__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.stat__label { font-size:12.5px; color:var(--muted); font-weight:600; }
.stat__icon { width:42px; height:42px; border-radius:12px; background:var(--ic); color:var(--ifc);
  display:grid; place-items:center; }
.stat__icon svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; }
.stat__value { font-size:28px; font-weight:800; letter-spacing:-1px; line-height:1; }
.stat__value.loading { color:transparent;
  background:linear-gradient(90deg, #eef1f5 25%, #f8fafc 50%, #eef1f5 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
  border-radius:8px; width:50%; min-height:28px; }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

.offices-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:20px; }
.office-card { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden;
  box-shadow:var(--sh-sm); transition:box-shadow .2s, transform .2s, border-color .2s;
  display:flex; flex-direction:column; }
.office-card:hover { box-shadow:var(--sh-lg); transform:translateY(-3px); border-color:#bdd7f2; }
.office-card__head { padding:22px; background:linear-gradient(135deg, #f8fbff, #fff);
  border-bottom:1px solid var(--border-soft); display:flex; gap:16px; align-items:flex-start; }
.office-card__crest { width:56px; height:56px; flex-shrink:0; border-radius:16px;
  background:linear-gradient(135deg, #0b5cab, #0e7490);
  color:#fff; display:grid; place-items:center;
  font-weight:800; font-size:18px; letter-spacing:-.5px;
  box-shadow:0 8px 20px rgba(11,92,171,.25); }
.office-card__identity { flex:1; min-width:0; }
.office-card__name { font-size:17px; font-weight:800; letter-spacing:-.3px; line-height:1.25; margin-bottom:4px; }
.office-card__name-sub { font-size:12.5px; color:var(--muted); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.office-card__meta { display:flex; gap:6px; flex-wrap:wrap; }

.tag { display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--r-full);
  font-size:11px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
.tag--region    { background:#f0eaff; color:#5b21b6; }
.tag--ministry  { background:#f0eaff; color:#5b21b6; }
.tag--bureau    { background:#eaf3fc; color:#0b5cab; }
.tag--agency    { background:#e0f5f7; color:#0e7490; }
.tag--authority { background:#fdf5e0; color:#b8860b; }
.tag--commission{ background:#ecfdf3; color:#128a5c; }
.tag--office    { background:var(--border-soft); color:var(--text-soft); }
.tag--green { background:#ecfdf3; color:#067647; }
.tag--red { background:#fef3f2; color:#b42318; }
.tag--gold { background:#fdf5e0; color:#b8860b; }
.tag--gray { background:var(--border-soft); color:var(--text-soft); }
.tag--code { background:#0d1520; color:#e4eef9; font-family:ui-monospace,monospace; letter-spacing:1px; }

.office-card__body { padding:18px 22px; flex:1; }
.office-row { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-soft); padding:6px 0; }
.office-row svg { width:15px; height:15px; flex-shrink:0; stroke:var(--muted); stroke-width:2; fill:none; }
.office-divider { height:1px; background:var(--border-soft); margin:12px 0; }
.office-admins-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.office-admins-label { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--text-soft); }
.office-admins-label svg { width:14px; height:14px; stroke:var(--primary); stroke-width:2.2; fill:none; }
.office-admins-count { font-size:11px; font-weight:800; background:var(--border-soft); color:var(--text-soft); padding:2px 8px; border-radius:999px; }
.no-clusters { font-size:12.5px; color:var(--muted); font-style:italic; padding:8px 0; }

.cluster-chip__code { width:32px; height:32px; border-radius:50%;
  background:#5b21b6; color:#fff; font-size:11px; font-weight:800;
  display:grid; place-items:center; font-family:ui-monospace,monospace; letter-spacing:.5px; }
.cluster-chip__main { flex:1; min-width:0; }
.cluster-chip__name { font-weight:700; font-size:13px; }
.cluster-chip__meta { font-size:11px; color:var(--muted); margin-top:2px; }

.empty { grid-column:1 / -1; padding:80px 40px; text-align:center;
  background:#fff; border:2px dashed var(--border); border-radius:var(--r-lg); }
.empty svg { width:64px; height:64px; margin:0 auto 20px; stroke:#cbd5e1; stroke-width:1.2; fill:none; }
.empty h3 { font-size:20px; font-weight:800; color:var(--text); margin-bottom:8px; }
.empty p { font-size:14.5px; color:var(--muted); margin-bottom:24px; }

.modal-backdrop { position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.55);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:grid; place-items:center; padding:24px; animation:fadeIn .18s ease; overflow-y:auto; }
.modal { background:#fff; border-radius:var(--r-xl); box-shadow:0 30px 60px rgba(20,40,70,.12);
  width:100%; max-width:600px; max-height:92vh; display:flex; flex-direction:column;
  animation:modalUp .22s cubic-bezier(.4,0,.2,1); margin:auto; }
@keyframes modalUp { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.modal--lg { max-width:820px; }
.modal--xl { max-width:1080px; }
.modal__head { padding:28px 32px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:space-between; gap:16px; }
.modal__title { font-size:21px; font-weight:800; letter-spacing:-.4px; }
.modal__sub { font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
.modal__close { width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  color:var(--muted); transition:background .15s; cursor:pointer; flex-shrink:0; }
.modal__close:hover { background:var(--border-soft); color:var(--text); }
.modal__close svg { width:18px; height:18px; stroke:currentColor; stroke-width:2.2; fill:none; }

   ============================================================ */
function toast(msg, type = "success") {
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast toast--" + type;
  const icon = type === "error" ? ICONS.alert : ICONS.check;
  el.innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 4200);
  setTimeout(() => el.remove(), 4600);
}

/* ============================================================
   HELPERS
   ============================================================ */
function twoDigits(v, fallback = "00") {
  if (v == null) return fallback;
  const s = String(v).replace(/\D/g, "");
  if (!s) return fallback;
  return s.length >= 2 ? s.slice(0, 2) : s.padStart(2, "0");
}

function normalizeWoredas(list) {
  return (list || []).map((w) => {
    if (typeof w === "string") return { code: "", name: w };
    return { code: w.code || "", name: w.name || "" };
  });
}

function normalizeNationalId(v) {
  return String(v || "").trim().toUpperCase().replace(/[\s-]/g, "");
}
function normalizePhone(v) {
  let s = String(v || "").replace(/\D/g, "");
  if (s.startsWith("251")) s = s.slice(3);
  if (s.startsWith("0"))   s = s.slice(1);
  return s;
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   EMPLOYEE ID GENERATOR
   Format: RR-CCWWOO NNNN → 04-0612080001
   ============================================================ */
async function generateEmployeeId({ regionCode, clusterCode, woredaCode, officeCode }) {
  const RR = twoDigits(regionCode);
  const CC = twoDigits(clusterCode);
  const WW = twoDigits(woredaCode);
  const OO = twoDigits(officeCode);
  const counterKey = `${RR}-${CC}${WW}${OO}`;
  const counterRef = doc(db, "counters", "employeeIds");

  const next = await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const data = snap.exists() ? snap.data() : {};
    const current = Number(data[counterKey] || 0);
    const value = current + 1;
    tx.set(counterRef, { [counterKey]: value }, { merge: true });
    return value;
  });

  const seq = String(next).padStart(4, "0");
  return `${RR}-${CC}${WW}${OO}${seq}`;
}

/* ============================================================
   DUPLICATE CHECKS
   ============================================================ */
async function findEmployeeByNationalId(nationalId) {
  const norm = normalizeNationalId(nationalId);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(
      collection(db, "employees"),
      where("nationalIdNorm", "==", norm),
      limit(1)
    ));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function findEmployeeByPhone(phone) {
  const norm = normalizePhone(phone);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(
      collection(db, "employees"),
      where("phoneNorm", "==", norm),
      limit(1)
    ));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function reserveUnique(type, value, norm, employeeId, empId, name) {
  const docRef = doc(db, "uniqueness", `${type}_${norm}`);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(docRef);
    if (snap.exists()) {
      const d = snap.data();
      throw Object.assign(new Error(
        `This ${type === "nationalId" ? "National ID" : "phone number"} is already registered` +
        (d.empId ? ` (employee ${d.empId})` : "")
      ), { code: "duplicate", conflicting: d });
    }
    tx.set(docRef, {
      type, value, norm, employeeId, empId,
      name: name || null,
      createdAt: serverTimestamp()
    });
  });
}
async function releaseUnique(type, norm) {
  try { await deleteDoc(doc(db, "uniqueness", `${type}_${norm}`)); } catch (e) {}
}

/* ============================================================
   PHOTO UPLOAD
   ============================================================ */
async function uploadEmployeePhoto(file, empId) {
  if (!file) return null;
  if (file.size > 3 * 1024 * 1024) throw new Error("Photo must be under 3 MB");
  const safeId = empId.replace(/[^A-Za-z0-9-]/g, "_");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `employees/${safeId}/photo.${ext}`;
  const ref = storageRef(storage, path);
  await uploadBytes(ref, file, { contentType: file.type || "image/jpeg" });
  return await getDownloadURL(ref);
}

/* ============================================================
   MODAL FRAMEWORK
   ============================================================ */
let escHandler = null;
function openModal(html, { size = "" } = {}) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal ${size ? "modal--" + size : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener("click", (e) => { if (e.target === bd) closeModal(); });
  bd.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  escHandler = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

async function saveOffice(officeId) {
  const nameEl = document.getElementById("of-name");
  const regionEl = document.getElementById("of-region");
  const codeEl = document.getElementById("of-officeCode");
  const errBox = document.getElementById("office-error");
  const errMsg = document.getElementById("office-error-msg");
  const btn = document.getElementById("of-submit");
  const spinner = btn.querySelector(".spinner");
  const label = btn.querySelector(".btn-label");

  const name = nameEl.value.trim();
  const region = regionEl.value;
  const codeDigits = codeEl.value.replace(/\D/g, "").slice(0, 2);

  if (!name) { nameEl.setAttribute("aria-invalid","true"); nameEl.focus();
    errBox.classList.remove("hidden"); errMsg.textContent = "Name is required"; return; }
  nameEl.removeAttribute("aria-invalid");
  if (!region) { regionEl.setAttribute("aria-invalid","true"); regionEl.focus();
    errBox.classList.remove("hidden"); errMsg.textContent = "Region is required"; return; }
  regionEl.removeAttribute("aria-invalid");
  if (codeDigits.length !== 2) { codeEl.setAttribute("aria-invalid","true"); codeEl.focus();
    errBox.classList.remove("hidden"); errMsg.textContent = "Office code must be 2 digits"; return; }
  codeEl.removeAttribute("aria-invalid");
  errBox.classList.add("hidden");

  btn.disabled = true;
  spinner.classList.remove("hidden");
  const oldLabel = label.textContent;
  label.textContent = "Saving…";

  const data = {
    name,
    nameAm: document.getElementById("of-nameAm").value.trim() || null,
    nameOm: document.getElementById("of-nameOm").value.trim() || null,
    code: document.getElementById("of-code").value.trim().toUpperCase() || null,
    officeCode: codeDigits,
    type: document.getElementById("of-type").value,
    region,
    regionName: regionName(region),
    phone: document.getElementById("of-phone").value.trim() || null,
    email: document.getElementById("of-email").value.trim() || null,
    active: document.getElementById("of-active").checked,
    updatedAt: serverTimestamp()
  };

  try {
    if (officeId) {
      await updateDoc(doc(db, "offices", officeId), data);
      toast("Office updated", "success");
    } else {
      data.createdAt = serverTimestamp();
      data.createdBy = S.uid;
      await setDoc(doc(collection(db, "offices")), data);
      toast("Office created", "success");
    }
    closeModal();
  } catch (err) {
    errBox.classList.remove("hidden");
    errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || "")}`;
    btn.disabled = false;
    spinner.classList.add("hidden");
    label.textContent = oldLabel;
  }
}

  if (!o || !c) return;
  if (!canManageWoredas(c)) {

  openModal(`

        <div class="modal__title">Woredas / Cities</div>
        <div class="modal__sub">

        </div>
      </div>

      </button>
    </div>

    <div class="modal__body">
      <div class="alert alert--info" style="padding:20px 24px;margin-bottom:24px">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div style="flex:1">
          <div style="font-weight:800;margin-bottom:6px">How woreda codes work</div>
          <div style="color:#0b5cab;font-size:13.5px;line-height:1.55">
            Each woreda/city needs a <strong>2-digit code</strong>. It becomes part of every employee ID created in that woreda.
          </div>
          <div style="margin-top:14px;padding:16px 20px;border-radius:12px;background:#fff;border:1px solid #bdd7f2;
                      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:800;
                      color:#0b5cab;letter-spacing:3px;text-align:center">
            ${escapeHtml(o.region || "04")}-${escapeHtml(c.code || "06")}<u style="color:#d4a017;text-decoration-thickness:3px">12</u>${escapeHtml(o.officeCode || "08")}-0001
          </div>
          <div style="margin-top:10px;font-size:12px;color:#5c6b85;text-align:center">
            region · cluster · <strong style="color:#b8860b">woreda</strong> · office · sequence
          </div>
        </div>
      </div>

      <div id="wm-rows" style="display:flex;flex-direction:column;gap:12px"></div>

      <button type="button" class="btn" id="wm-add"
              style="width:100%;border-style:dashed;border-width:2px;margin-top:18px;
                     height:54px;color:var(--primary);border-color:#bdd7f2;
                     background:linear-gradient(135deg,#eaf3fc,#fff)">
        <svg viewBox="0 0 24 24">${ICONS.plus}</svg>
        <span style="font-weight:800">Add another woreda / city</span>
      </button>
    </div>

    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="wm-save">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save woredas</span>
      </button>
    </div>
  `, { size: "lg" });

  const rowsHost = document.getElementById("wm-rows");

  const makeRow = (w = { code: "", name: "" }) => {
    const row = document.createElement("div");
    row.className = "wm-row";
    row.innerHTML = `
      <div style="position:relative;flex-shrink:0">
        <input class="wm-code" type="text" inputmode="numeric" maxlength="2"
               value="${escapeHtml(w.code)}" placeholder="00"
               style="width:84px;height:54px;padding:0 10px;
                      border:2px solid #d9dee7;border-radius:12px;
                      background:linear-gradient(135deg,#eaf3fc,#f4f8fd);
                      font-family:ui-monospace,Menlo,Consolas,monospace;
                      letter-spacing:3px;text-align:center;
                      font-size:22px;font-weight:800;color:#0b5cab;
                      transition:border-color .15s, box-shadow .15s">
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <input class="wm-name" type="text" value="${escapeHtml(w.name)}"
               placeholder="Bole, Yeka, Adama…"
               style="width:100%;height:54px;padding:0 16px;
                      border:1px solid #d9dee7;border-radius:12px;
                      background:#fbfcfe;font-size:15px;font-weight:500">
      </div>
      <button type="button" class="wm-del btn btn--icon btn--danger"
              style="height:54px;width:54px;padding:0;flex-shrink:0;border-radius:12px"
              aria-label="Remove this woreda">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round">
          ${ICONS.trash}
        </svg>
      </button>
    `;

    row.querySelector(".wm-del").addEventListener("click", () => row.remove());

    const codeInput = row.querySelector(".wm-code");
    const nameInput = row.querySelector(".wm-name");

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 2);
      codeInput.style.borderColor = codeInput.value.length === 2 ? "#1a4d8a" : "#d9dee7";
    });
    codeInput.addEventListener("focus", () => {
      codeInput.style.borderColor = "#70a8d9";
      codeInput.style.boxShadow = "0 0 0 4px rgba(11,92,171,.08)";
    });
    codeInput.addEventListener("blur", () => {
      codeInput.style.boxShadow = "none";
      codeInput.style.borderColor = codeInput.value.length === 2 ? "#1a4d8a" : "#d9dee7";
    });

    nameInput.addEventListener("focus", () => {
      nameInput.style.borderColor = "#70a8d9";
      nameInput.style.background = "#fff";
      nameInput.style.boxShadow = "0 0 0 4px rgba(11,92,171,.08)";
    });
    nameInput.addEventListener("blur", () => {
      nameInput.style.boxShadow = "none";
      nameInput.style.borderColor = "#d9dee7";
      nameInput.style.background = "#fbfcfe";
    });

    rowsHost.appendChild(row);
  };

  if (woredas.length) woredas.forEach(makeRow);
  else makeRow();

  document.getElementById("wm-add").addEventListener("click", () => makeRow());

  document.getElementById("wm-save").addEventListener("click", async () => {
    const btn = document.getElementById("wm-save");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");

    const rows = Array.from(rowsHost.querySelectorAll(".wm-row"));
    const parsed = [];
    const seen = new Set();

    for (const r of rows) {
      const code = r.querySelector(".wm-code").value.replace(/\D/g, "").slice(0, 2);
      const name = r.querySelector(".wm-name").value.trim();
      if (!code && !name) continue;
      if (code.length !== 2) {
        toast(`Each woreda needs a 2-digit code (got "${code || "—"}")`, "error");
        r.querySelector(".wm-code").focus();
        return;
      }
      if (!name) {
        toast("Each woreda needs a name", "error");
        r.querySelector(".wm-name").focus();
        return;
      }
      if (seen.has(code)) {
        toast(`Duplicate woreda code "${code}"`, "error");
        r.querySelector(".wm-code").focus();
        return;
      }
      seen.add(code);
      parsed.push({ code, name });
    }

    if (!parsed.length) {
      toast("Add at least one woreda", "error");
      return;
    }

    btn.disabled = true;
    spinner.classList.remove("hidden");
    const old = label.textContent;
    label.textContent = "Saving…";

    try {
      await updateDoc(doc(db, "clusters", clusterId), {
        woredas: parsed,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      });
      toast(`${parsed.length} woreda${parsed.length !== 1 ? "s" : ""} saved`, "success");
      closeModal();
    } catch (err) {
      toast((err.code || "") + ": " + (err.message || ""), "error");
      btn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = old;
    }
  });
}

  const canAdd = canAddAdminTo(c);
  const list = adminsByCluster[clusterId] || [];

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Administrators</div>
        <div class="modal__sub">${escapeHtml(c.name)} — ${escapeHtml(o.name)}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>
    <div class="modal__body">
      ${list.length ? `
        <ul class="admin-list">
          ${list.map((a) => `
            <li class="admin-list__item">
              <div class="admin-list__avatar ${a.active === false ? "admin-list__avatar--inactive" : ""}">
                ${initials(a.name || a.email)}
              </div>
              <div class="admin-list__main">
                <div class="admin-list__name">${escapeHtml(a.name || "—")}</div>
                <div class="admin-list__email">
                  ${escapeHtml(a.email || a.id)}
                  ${a.empId ? ` · ${escapeHtml(a.empId)}` : ""}
                </div>
              </div>
              <div class="admin-list__actions">
                ${a.id !== S.uid ? `<button class="btn btn--sm" data-toggle-admin="${a.id}" data-active="${a.active !== false}">
                  ${a.active === false ? "Activate" : "Deactivate"}
                </button>` : ""}
                ${a.id !== S.uid ? `<button class="btn btn--sm btn--icon btn--danger" data-remove-admin="${a.id}">
                  <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
                </button>` : ""}
              </div>
            </li>
          `).join("")}
        </ul>
      ` : `<div class="no-clusters" style="padding:40px 0;text-align:center">No administrators yet.</div>`}
    </div>
    <div class="modal__foot">
      <button class="btn" data-close>Close</button>
      ${canAdd ? `<button class="btn btn--primary" id="modal-add-admin">
        <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg> Add Admin
      </button>` : ""}
    </div>
  `);

  document.getElementById("modal-add-admin")?.addEventListener("click", () => {
    closeModal();
    setTimeout(() => openAddAdminModal(officeId, clusterId), 100);
  });

  document.querySelectorAll("[data-toggle-admin]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const uid = btn.dataset.toggleAdmin;
      const active = btn.dataset.active === "true";
      if (uid === S.uid) { toast("Cannot modify yourself", "error"); return; }
      try {
        await updateDoc(doc(db, "users", uid), { active: !active });
        toast(active ? "Deactivated" : "Activated", "success");
        closeModal();
      } catch (err) { toast(err.code + ": " + err.message, "error"); }
    });
  });
  document.querySelectorAll("[data-remove-admin]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const uid = btn.dataset.removeAdmin;
      if (uid === S.uid) { toast("Cannot remove yourself", "error"); return; }
      if (!confirm("Remove this administrator?")) return;
      try {
        await deleteDoc(doc(db, "users", uid));
        toast("Removed", "success");
        closeModal();
      } catch (err) { toast(err.code + ": " + err.message, "error"); }
    });
  });
}

/* ============================================================
   ADD ADMIN — existing employee only, points to Add Employee for new
   ============================================================ */
function openAddAdminModal(officeId, clusterId) {
  const o = offices.find((x) => x.id === officeId);
  const c = clusters.find((x) => x.id === clusterId);
  if (!o || !c) return;
  if (!canAddAdminTo(c)) { toast("You cannot add admins here", "error"); return; }

  const oEmployees = employeesByCluster[clusterId] || [];

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Add Administrator</div>
        <div class="modal__sub">${escapeHtml(c.name)} — ${escapeHtml(o.name)}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>

    <div class="modal__body">
      <div id="aa-error" class="alert alert--error hidden">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div id="aa-error-msg" style="flex:1"></div>
      </div>

      ${!oEmployees.length ? `
        <div class="alert alert--info">
          <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
          <div>
            No employees in this cluster yet. Use the <strong>Employee</strong> button to add one first —
            it will create the login and the employee record together.
          </div>
        </div>
      ` : `
        <div class="field">
          <label>Search employees</label>
          <input id="aa-search" placeholder="Search by name or ID">
        </div>
        <div class="field">
          <label>Select from ${oEmployees.length} employee${oEmployees.length !== 1 ? "s" : ""}</label>
          <div id="aa-emp-list" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg-soft)"></div>
        </div>
        <div id="aa-selected" class="hidden"></div>
        <div id="aa-existing-fields" class="hidden">
          <div class="field">
            <label for="aa-password" class="field__required">Login password</label>
            <div class="field__group">
              <input id="aa-password" type="password" placeholder="••••••••">
              <button type="button" class="field__toggle" id="aa-toggle-pw">
                <svg viewBox="0 0 24 24">${ICONS.eye}</svg>
              </button>
            </div>
            <p class="field__hint">The employee's email becomes their login.</p>
          </div>
        </div>
      `}
    </div>

    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      ${oEmployees.length ? `
        <button class="btn btn--primary" id="aa-submit">
          <span class="spinner hidden"></span>
          <span class="btn-label">Create Admin</span>
        </button>
      ` : ""}
    </div>
  `, { size: "lg" });

  if (!oEmployees.length) return;

  const picker = document.getElementById("aa-emp-list");
  const searchEl = document.getElementById("aa-search");
  const selectedBox = document.getElementById("aa-selected");
  const existingFields = document.getElementById("aa-existing-fields");
  let selectedEmp = null;

  const renderEmployees = (term) => {
    const s = (term || "").trim().toLowerCase();
    const filtered = oEmployees.filter((e) => {
      if (!s) return true;
      const hay = [e.firstName, e.lastName, e.empId, e.email, e.position].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(s);
    });
    if (!filtered.length) {
      picker.innerHTML = `<div style="padding:32px;text-align:center;color:var(--muted);font-size:13px">No matches</div>`;
      return;
    }
    picker.innerHTML = filtered.map((e) => `
      <div class="aa-emp-item" data-emp-id="${e.id}"
           style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border-soft)">
        <div class="admin-list__avatar" style="width:38px;height:38px;font-size:12px">${initials(fullName(e))}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${escapeHtml(fullName(e))}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">
            ${e.empId ? escapeHtml(e.empId) + " · " : ""}
            ${e.position ? escapeHtml(e.position) + " · " : ""}
            ${e.email ? escapeHtml(e.email) : ""}
          </div>
        </div>
      </div>
    `).join("");

    picker.querySelectorAll("[data-emp-id]").forEach((item) => {
      item.addEventListener("click", () => {
        const e = filtered.find((x) => x.id === item.dataset.empId);
        if (!e) return;
        selectedEmp = e;
        picker.querySelectorAll("[data-emp-id]").forEach((x) => x.style.background = "");
        item.style.background = "#eaf3fc";
        selectedBox.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
                      background:linear-gradient(135deg,#eaf3fc,#fff);border:1px solid #bdd7f2;margin-bottom:18px">
            <div class="admin-list__avatar">${initials(fullName(e))}</div>
            <div style="flex:1">
              <div style="font-weight:700">${escapeHtml(fullName(e))}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(e.email || "(no email)")}</div>
            </div>
          </div>`;
        selectedBox.classList.remove("hidden");
        existingFields.classList.remove("hidden");
      });
    });
  };
  renderEmployees("");
  searchEl.addEventListener("input", () => renderEmployees(searchEl.value));

  document.getElementById("aa-toggle-pw")?.addEventListener("click", (e) => {
    const inp = document.getElementById("aa-password");
    const showing = inp.type === "text";
    inp.type = showing ? "password" : "text";
    e.currentTarget.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
  });

  document.getElementById("aa-submit").addEventListener("click", async () => {
    const errBox = document.getElementById("aa-error");
    const errMsg = document.getElementById("aa-error-msg");
    const btn = document.getElementById("aa-submit");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");

    errBox.classList.add("hidden");
    if (!selectedEmp) { errBox.classList.remove("hidden"); errMsg.textContent = "Select an employee first."; return; }
    const pw = document.getElementById("aa-password").value;
    if (!pw || pw.length < 6) { errBox.classList.remove("hidden"); errMsg.textContent = "Password must be 6+ chars."; return; }
    if (!selectedEmp.email) { errBox.classList.remove("hidden"); errMsg.textContent = "Employee has no email."; return; }

    btn.disabled = true;
    spinner.classList.remove("hidden");
    const old = label.textContent;
    label.textContent = "Creating…";
    try {
      const secName = "adminCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, selectedEmp.email, pw);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: fullName(selectedEmp) }); } catch (e) {}
        await signOut(secAuth);
      } finally { try { await deleteApp(secApp); } catch (e) {} }

      try { await updateDoc(doc(db, "employees", selectedEmp.id), { uid, updatedAt: serverTimestamp() }); } catch (e) {}

      await setDoc(doc(db, "users", uid), {
        email: selectedEmp.email,
        name: fullName(selectedEmp),
        role: "admin",
        officeId: o.id,
        officeName: o.name || null,
        clusterId: c.id,
        clusterName: c.name || null,
        region: o.region || null,
        regionName: o.regionName || null,
        employeeId: selectedEmp.id,
        empId: selectedEmp.empId || null,
        active: true,
        scope: { teamId: null, departmentId: null },
        createdAt: serverTimestamp(),
        createdBy: S.uid
      });
      toast("Administrator created", "success");
      closeModal();
    } catch (err) {
      errBox.classList.remove("hidden");
      errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || String(err))}`;
      btn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = old;
    }
  });
}

function switchTab(t) {
  document.querySelectorAll("[data-emf-tab]").forEach((b) =>
    b.classList.toggle("is-active", b.dataset.emfTab === t)
  );
  document.querySelectorAll("[data-emf-panel]").forEach((p) =>
    p.classList.toggle("hidden", p.dataset.emfPanel !== t)
  );
}

function wireAddEmployeeForm(office, cluster) {
  document.querySelectorAll("[data-emf-tab]").forEach((btn) => {
    btn.addEventListener("click", () => switchTab(btn.dataset.emfTab));
  });

  const photoWrap = document.getElementById("emp-photo-wrap");
  const photoInput = document.getElementById("emp-photo-input");
  const photoPreview = document.getElementById("emp-photo-preview");
  const photoInitials = document.getElementById("emp-photo-initials");
  const triggerPicker = () => photoInput.click();
  photoWrap.addEventListener("click", triggerPicker);
  document.getElementById("emp-photo-btn").addEventListener("click", triggerPicker);

  photoInput.addEventListener("change", async () => {
    const f = photoInput.files?.[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) { toast("Photo must be under 3 MB", "error"); return; }
    EMF.photo = f;
    try {
      const dataUrl = await fileToDataURL(f);
      photoPreview.src = dataUrl;
      photoPreview.style.display = "block";
      photoInitials.style.display = "none";
    } catch (e) {}
  });

  const bindField = (id, key, event = "input") => {
    const el = document.getElementById("emf-" + id);
    if (!el) return;
    el.addEventListener(event, () => {
      EMF[key] = el.value;
      updateNamePreview();
    });
  };

  ["firstName","middleName","lastName",
   "firstNameAm","middleNameAm","lastNameAm",
   "firstNameOm","middleNameOm","lastNameOm"].forEach((k) => bindField(k, k));

  bindField("nationalId", "nationalId");
  bindField("dob", "dob", "change");
  bindField("phone", "phone");
  bindField("phoneAlt", "phoneAlt");
  bindField("email", "email");
  bindField("subCity", "subCity");
  bindField("kebele", "kebele");
  bindField("houseNo", "houseNo");
  bindField("street", "street");
  bindField("position", "position");
  bindField("grade", "grade");
  bindField("step", "step");
  bindField("hireDate", "hireDate", "change");
  bindField("loginEmail", "loginEmail");
  bindField("password", "password");
  bindField("password2", "password2");
  bindField("emgName", "emgName");
  bindField("emgRelation", "emgRelation");
  bindField("emgPhone", "emgPhone");
  bindField("gender", "gender", "change");
  bindField("maritalStatus", "maritalStatus", "change");
  bindField("employmentType", "employmentType", "change");
  bindField("status", "status", "change");
  bindField("country", "country", "change");
  bindField("region", "region", "change");

  const emgName = document.getElementById("emf-emgName");
  if (emgName) emgName.addEventListener("input", () => EMF.emergency.name = emgName.value);
  const emgRel = document.getElementById("emf-emgRelation");
  if (emgRel) emgRel.addEventListener("input", () => EMF.emergency.relation = emgRel.value);
  const emgPhone = document.getElementById("emf-emgPhone");
  if (emgPhone) emgPhone.addEventListener("input", () => EMF.emergency.phone = emgPhone.value);

  document.getElementById("emf-toggle-pw")?.addEventListener("click", (e) => {
    const inp = document.getElementById("emf-password");
    const showing = inp.type === "text";
    inp.type = showing ? "password" : "text";
    e.currentTarget.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
  });

  const regionSel = document.getElementById("emf-region");
  const clusterSel = document.getElementById("emf-clusterId");
  const woredaSel = document.getElementById("emf-woredaCode");

  const populateClusters = () => {
    const r = regionSel.value;
    const list = clusters.filter((x) => x.region === r);
    clusterSel.innerHTML = `<option value="">—</option>` +
      list.map((x) => `<option value="${x.id}" ${x.id === cluster.id ? "selected" : ""}>${escapeHtml(x.code)} — ${escapeHtml(x.name)}</option>`).join("");
    if (list.find((x) => x.id === cluster.id)) clusterSel.value = cluster.id;
    EMF.clusterId = clusterSel.value;
    populateWoredas();
  };

  const populateWoredas = () => {
    const cid = clusterSel.value;
    const c = clusters.find((x) => x.id === cid);
    const ws = normalizeWoredas(c?.woredas);
    woredaSel.innerHTML = `<option value="">—</option>` +
      ws.map((w) => `<option value="${escapeHtml(w.code)}" data-name="${escapeHtml(w.name)}">${escapeHtml(w.code)} — ${escapeHtml(w.name)}</option>`).join("");
    EMF.woredaCode = "";
    updateIdPreview();
  };

  regionSel.addEventListener("change", populateClusters);
  clusterSel.addEventListener("change", () => { EMF.clusterId = clusterSel.value; populateWoredas(); });
  woredaSel.addEventListener("change", () => {
    EMF.woredaCode = woredaSel.value;
    const opt = woredaSel.selectedOptions[0];
    EMF.woredaName = opt?.dataset?.name || "";
    updateIdPreview();
  });

  populateClusters();

  function updateNamePreview() {
    const en = [EMF.firstName, EMF.middleName, EMF.lastName].filter(Boolean).join(" ");
    const am = [EMF.firstNameAm, EMF.middleNameAm, EMF.lastNameAm].filter(Boolean).join(" ");
    const om = [EMF.firstNameOm, EMF.middleNameOm, EMF.lastNameOm].filter(Boolean).join(" ");
    document.getElementById("emp-name-en").textContent = en || "—";
    document.getElementById("emp-name-am").textContent = am || "—";
    document.getElementById("emp-name-om").textContent = om || "—";
    const ini = (en || am || om || "?").split(/\s+/).slice(0,2).map((s) => s[0]).join("").toUpperCase();
    if (photoInitials) photoInitials.textContent = ini || "?";
  }

  function updateIdPreview() {
    const RR = (regionSel.value || "??").replace(/\D/g,"").slice(0,2).padStart(2,"0");
    const c = clusters.find((x) => x.id === clusterSel.value);
    const CC = ((c?.code) || "??").toString().slice(0,2).padStart(2,"0");
    const WW = (woredaSel.value || "??").toString().slice(0,2).padStart(2,"0");
    const OO = (office.officeCode || "??").toString().slice(0,2);
    const preview = `${RR}-${CC}${WW}${OO}????`;
    const a = document.getElementById("emf-id-preview");
    const b = document.getElementById("emf-id-footer");
    if (a) a.textContent = preview;
    if (b) b.textContent = "ID: " + preview;
  }
  updateNamePreview();
  updateIdPreview();

  const natIdEl = document.getElementById("emf-nationalId");
  const phoneEl = document.getElementById("emf-phone");

  const setupLiveCheck = (inputEl, type, label) => {
    if (!inputEl) return;
    let errEl = inputEl.parentElement.querySelector(".dup-error");
    if (!errEl) {
      errEl = document.createElement("p");
      errEl.className = "field__error dup-error";
      errEl.style.display = "none";
      inputEl.parentElement.appendChild(errEl);
    }
    let icon = inputEl.parentElement.querySelector(".dup-check-icon");
    if (!icon) {
      icon = document.createElement("span");
      icon.className = "dup-check-icon";
      inputEl.parentElement.style.position = "relative";
      inputEl.style.paddingRight = "40px";
      inputEl.parentElement.appendChild(icon);
    }
    let timer = null;
    const run = async () => {
      const raw = inputEl.value.trim();
      if (!raw) {
        errEl.style.display = "none";
        inputEl.removeAttribute("aria-invalid");
        icon.textContent = "";
        return;
      }
      icon.textContent = "…";
      icon.style.color = "var(--muted-light)";
      const existing = type === "nationalId"
        ? await findEmployeeByNationalId(raw)
        : await findEmployeeByPhone(raw);
      if (existing) {
        inputEl.setAttribute("aria-invalid", "true");
        errEl.style.display = "block";
        errEl.innerHTML = `⚠ This ${label} is already registered to ` +
          `<strong>${escapeHtml(existing.nameEn || existing.firstName || "another employee")}</strong>` +
          (existing.empId ? ` (${escapeHtml(existing.empId)})` : "") + ".";
        icon.textContent = "✗";
        icon.style.color = "var(--danger)";
      } else {
        inputEl.removeAttribute("aria-invalid");
        errEl.style.display = "none";
        icon.textContent = "✓";
        icon.style.color = "var(--success)";
      }
    };
    inputEl.addEventListener("blur", run);
    inputEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 350); });
  };
  setupLiveCheck(natIdEl, "nationalId", "National ID");
  setupLiveCheck(phoneEl, "phone", "phone number");

  document.getElementById("emf-submit").addEventListener("click", () => submitAddEmployee(office, cluster));
  document.getElementById("emp-form").addEventListener("submit", (e) => {
    e.preventDefault();
    submitAddEmployee(office, cluster);
  });
}

async function submitAddEmployee(office, cluster) {
  const errBox = document.getElementById("emf-error");
  const errMsg = document.getElementById("emf-error-msg");
  const btn = document.getElementById("emf-submit");
  const spinner = btn.querySelector(".spinner");
  const label = btn.querySelector(".btn-label");

  const showError = (msg, tab) => {
    errBox.style.display = "flex";
    errMsg.textContent = msg;
    if (tab) switchTab(tab);
    btn.disabled = false;
    spinner.classList.add("hidden");
    label.textContent = "Create Employee";
  };

  errBox.style.display = "none";

  if (!EMF.firstName || !EMF.lastName) return showError("First and last name (English) required.", "personal");
  if (!EMF.nationalId) return showError("National ID required.", "personal");
  if (!EMF.gender) return showError("Gender required.", "personal");
  if (!EMF.dob) return showError("Date of birth required.", "personal");
  if (!EMF.region) return showError("Region required.", "address");
  if (!EMF.clusterId) return showError("Cluster required.", "address");
  if (!EMF.woredaCode) return showError("Woreda required.", "address");
  if (!EMF.phone) return showError("Primary phone required.", "address");
  if (!EMF.email) return showError("Email required.", "address");
  if (!EMF.position) return showError("Position required.", "employment");
  if (!EMF.hireDate) return showError("Hire date required.", "employment");

  const loginEmail = (EMF.loginEmail || EMF.email).trim();
  if (!loginEmail) return showError("Login email required.", "account");
  if (!EMF.password || EMF.password.length < 6) return showError("Password must be 6+ chars.", "account");
  if (EMF.password !== EMF.password2) return showError("Passwords do not match.", "account");

  btn.disabled = true;
  spinner.classList.remove("hidden");
  const oldLabel = label.textContent;
  label.textContent = "Checking…";

  try {
    const byNat = await findEmployeeByNationalId(EMF.nationalId);
    if (byNat) {
      throw Object.assign(new Error(
        `National ID ${EMF.nationalId} already belongs to ${byNat.nameEn || byNat.firstName || "another employee"}` +
        (byNat.empId ? ` (${byNat.empId})` : "")
      ), { code: "duplicate", tab: "personal" });
    }
    const byPhone = await findEmployeeByPhone(EMF.phone);
    if (byPhone) {
      throw Object.assign(new Error(
        `Phone ${EMF.phone} already belongs to ${byPhone.nameEn || byPhone.firstName || "another employee"}` +
        (byPhone.empId ? ` (${byPhone.empId})` : "")
      ), { code: "duplicate", tab: "address" });
    }

    label.textContent = "Creating…";

    const empId = await generateEmployeeId({
      regionCode: office.region,
      clusterCode: cluster.code,
      woredaCode: EMF.woredaCode,
      officeCode: office.officeCode
    });
    console.log("[employee] generated:", empId);

    const secName = "empCreator_" + Date.now();
    const secApp = initializeApp(firebaseConfig, secName);
    const secAuth = getAuth(secApp);
    let uid = null;
    try {
      const cred = await createUserWithEmailAndPassword(secAuth, loginEmail, EMF.password);
      uid = cred.user.uid;
      try { await updateProfile(cred.user, { displayName: [EMF.firstName, EMF.middleName, EMF.lastName].filter(Boolean).join(" ") }); } catch (e) {}
      await signOut(secAuth);
    } finally { try { await deleteApp(secApp); } catch (e) {} }

    let photoURL = null;
    if (EMF.photo) {
      try { photoURL = await uploadEmployeePhoto(EMF.photo, empId); }
      catch (e) { console.warn("[photo]", e); }
    }

    const natIdNorm = normalizeNationalId(EMF.nationalId);
    const phoneNorm = normalizePhone(EMF.phone);
    const nameForLock = [EMF.firstName, EMF.middleName, EMF.lastName].filter(Boolean).join(" ");

    await reserveUnique("nationalId", EMF.nationalId, natIdNorm, "pending", empId, nameForLock);
    try {
      await reserveUnique("phone", EMF.phone, phoneNorm, "pending", empId, nameForLock);
    } catch (e) {
      await releaseUnique("nationalId", natIdNorm);
      throw e;
    }

    const empRef = doc(collection(db, "employees"));
    const nameEn = [EMF.firstName, EMF.middleName, EMF.lastName].filter(Boolean).join(" ");
    const nameAm = [EMF.firstNameAm, EMF.middleNameAm, EMF.lastNameAm].filter(Boolean).join(" ") || null;
    const nameOm = [EMF.firstNameOm, EMF.middleNameOm, EMF.lastNameOm].filter(Boolean).join(" ") || null;

    await setDoc(empRef, {
      empId,
      regionCode: office.region,
      clusterCode: cluster.code,
      woredaCode: EMF.woredaCode,
      woredaName: EMF.woredaName,
      officeCode: office.officeCode,

      firstName: EMF.firstName,
      middleName: EMF.middleName || null,
      lastName: EMF.lastName,
      firstNameAm: EMF.firstNameAm || null,
      middleNameAm: EMF.middleNameAm || null,
      lastNameAm: EMF.lastNameAm || null,
      firstNameOm: EMF.firstNameOm || null,
      middleNameOm: EMF.middleNameOm || null,
      lastNameOm: EMF.lastNameOm || null,
      nameEn, nameAm, nameOm,

      photoURL,
      nationalId: EMF.nationalId,
      nationalIdNorm: natIdNorm,
      gender: EMF.gender,
      dob: EMF.dob,
      maritalStatus: EMF.maritalStatus || null,

      phone: EMF.phone,
      phoneNorm,
      phoneAlt: EMF.phoneAlt || null,
      email: EMF.email,
      loginEmail,

      country: EMF.country || "ET",
      countryName: COUNTRIES.find((x) => x.code === (EMF.country || "ET"))?.name || "Ethiopia",
      region: office.region || EMF.region,
      regionName: regionLabel(office.region || EMF.region),
      clusterId: cluster.id,
      clusterName: cluster.name || null,
      subCity: EMF.subCity || null,
      kebele: EMF.kebele || null,
      houseNo: EMF.houseNo || null,
      street: EMF.street || null,
      address: [EMF.subCity, EMF.kebele, EMF.houseNo, EMF.street].filter(Boolean).join(", ") || null,

      position: EMF.position,
      grade: EMF.grade || null,
      step: EMF.step ? Number(EMF.step) : null,
      hireDate: EMF.hireDate,
      employmentType: EMF.employmentType || "permanent",
      status: EMF.status || "active",

      officeId: office.id,
      officeName: office.name || null,

      emergency: {
        name: EMF.emergency.name || null,
        relation: EMF.emergency.relation || null,
        phone: EMF.emergency.phone || null
      },

      uid,
      active: true,
      createdAt: serverTimestamp(),
      createdBy: S.uid
    });

    await setDoc(doc(db, "users", uid), {
      email: loginEmail,
      name: nameEn,
      role: "employee",
      officeId: office.id,
      officeName: office.name || null,
      clusterId: cluster.id,
      clusterName: cluster.name || null,
      region: office.region || null,
      regionName: office.regionName || null,
      employeeId: empRef.id,
      empId,
      active: true,
      scope: { teamId: null, departmentId: null },
      createdAt: serverTimestamp(),
      createdBy: S.uid
    });

    toast(`Employee ${empId} created`, "success");
    closeModal();

  } catch (err) {
    console.error("[add employee]", err);
    try {
      if (EMF.nationalId) await releaseUnique("nationalId", normalizeNationalId(EMF.nationalId));
      if (EMF.phone) await releaseUnique("phone", normalizePhone(EMF.phone));
    } catch (e) {}
    showError(
      (err.code ? err.code + ": " : "") + (err.message || String(err)),
      err.tab
    );
  }
}

function rebuildIndexes() {
  clustersByOffice = {};
  clusters.forEach((c) => {
    if (!c.officeId) return;
    if (!clustersByOffice[c.officeId]) clustersByOffice[c.officeId] = [];
    clustersByOffice[c.officeId].push(c);
  });
  adminsByCluster = {};
  admins.forEach((a) => {
    if (!a.clusterId) return;
    if (!adminsByCluster[a.clusterId]) adminsByCluster[a.clusterId] = [];
    adminsByCluster[a.clusterId].push(a);
  });
  employeesByCluster = {};
  employees.forEach((e) => {
    if (!e.clusterId) return;
    if (!employeesByCluster[e.clusterId]) employeesByCluster[e.clusterId] = [];
    employeesByCluster[e.clusterId].push(e);
  });
}

function subscribeOffices() {
  if (unsubOffices) unsubOffices();
  if (S.role !== "super_admin" && S.officeId) {
    unsubOffices = onSnapshot(doc(db, "offices", S.officeId), (snap) => {
      offices = snap.exists() ? [{ id: snap.id, ...snap.data() }] : [];
      renderStats(); renderOffices();
    }, (err) => console.warn("[offices]", err.code, err.message));
  } else {
    unsubOffices = onSnapshot(
      query(collection(db, "offices"), orderBy("createdAt", "desc")),
      (snap) => {
        offices = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderStats(); renderOffices();
      },
      (err) => {
        console.error("[offices]", err.code, err.message);
        document.getElementById("offices-grid").innerHTML =
          `<div class="empty"><svg viewBox="0 0 24 24">${ICONS.alert}</svg>
            <h3>${escapeHtml(err.code)}</h3><p>${escapeHtml(err.message || "")}</p></div>`;
      }
    );
  }
}

function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (S.role !== "super_admin" && S.clusterId) {
    q = query(q, where("clusterId", "==", S.clusterId));
  } else if (S.role !== "super_admin" && S.officeId) {
    q = query(q, where("officeId", "==", S.officeId));
  }
  unsubClusters = onSnapshot(q, (snap) => {
    clusters = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    rebuildIndexes(); renderStats(); renderOffices();
  }, (err) => console.warn("[clusters]", err.code, err.message));
}

function subscribeAdmins() {
  if (unsubAdmins) unsubAdmins();
  let q = query(collection(db, "users"), where("role", "==", "admin"));
  if (S.role !== "super_admin" && S.clusterId) {
    q = query(collection(db, "users"), where("role", "==", "admin"), where("clusterId", "==", S.clusterId));
  }
  unsubAdmins = onSnapshot(q, (snap) => {
    admins = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    rebuildIndexes(); renderStats(); renderOffices();
  }, (err) => console.warn("[admins]", err.code, err.message));
}

function subscribeEmployees() {
  if (unsubEmployees) unsubEmployees();
  let q = collection(db, "employees");
  if (S.role !== "super_admin" && S.clusterId) {
    q = query(q, where("clusterId", "==", S.clusterId));
  } else if (S.role !== "super_admin" && S.officeId) {
    q = query(q, where("officeId", "==", S.officeId));
  }
  unsubEmployees = onSnapshot(q, (snap) => {
    employees = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    rebuildIndexes(); renderStats(); renderOffices();
  }, (err) => console.warn("[employees]", err.code, err.message));
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.getElementById("sidebar-nav").addEventListener("click", (e) => {
  if (e.target.closest(".nav-item")) document.body.classList.remove("sidebar-open");
});
document.querySelectorAll("[data-dropdown-toggle]").forEach((btn) => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach((p) => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () => {
  document.querySelectorAll("[data-dropdown-panel]").forEach((p) => p.classList.add("hidden"));
});
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

/* ============================================================
   BANNER
   ============================================================ */
function showBanner(html, isOk = false) {
  const b = document.getElementById("diag-banner");
  b.className = "diag-banner show" + (isOk ? " ok" : "");
  b.innerHTML = html;
}

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null, readError = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
    if (userDoc && userDoc.active === false) { kick("inactive"); return; }
  } catch (err) { readError = err; }

  let clusterName = null;
  if (userDoc?.clusterId) {
    try {
      const cs = await getDoc(doc(db, "clusters", userDoc.clusterId));
      if (cs.exists()) clusterName = cs.data().name;
    } catch (e) {}
  }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    officeId: userDoc?.officeId || "",
    clusterId: userDoc?.clusterId || "",
    clusterName
  };

  GUARD_PASSED = true;

  if (S.role !== "super_admin" && S.role !== "admin") {
    if (!readError) { window.location.replace("dashboard.html"); return; }
  }

  console.log("[offices] session:", S);

  renderSidebar();
  renderUser();
  renderScopeBadge();
  renderHeadActions();
  renderStats();

  if (readError || !userDoc) {
    showBanner(`<strong>⚠ Cannot read your user profile.</strong> Ensure <code>users/${escapeHtml(user.uid)}</code> exists with role and active=true.`);
  } else if (userDoc.active !== true) {
    showBanner(`<strong>⚠ Your user profile has active=false.</strong> Set <code>active</code> to boolean <strong>true</strong>.`);
  } else {
    showBanner(`<strong>✓ Signed in as ${escapeHtml(roleLabel(S.role))}</strong>`, true);
    setTimeout(() => document.getElementById("diag-banner")?.classList.remove("show"), 4000);
  }

  subscribeOffices();
  subscribeClusters();
  subscribeAdmins();
  subscribeEmployees();
});

console.log("[offices] booted");
</script>
