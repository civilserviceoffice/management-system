<script>
(function headGuard() {
  try {
    if (sessionStorage.getItem("loggedIn") !== "true" || !sessionStorage.getItem("uid")) {
      sessionStorage.clear();
      sessionStorage.setItem("__redirectReason", "expired");
      window.location.replace("../index.html");
    }
  } catch (e) { window.location.replace("../index.html"); }
})();
(function preTheme() {
  try {
    const t = localStorage.getItem("cs.theme") || "light";
    if (t === "dark") document.documentElement.classList.add("theme-dark");
    else if (t === "auto" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.classList.add("theme-dark");
    }
    if (localStorage.getItem("cs.compact") === "true") document.documentElement.classList.add("compact-mode");
    const lang = localStorage.getItem("cs.language") || "en";
    document.documentElement.setAttribute("data-lang", lang);
    if (lang === "am") document.documentElement.setAttribute("data-ethiopic", "true");
    if (lang === "om") document.documentElement.setAttribute("data-lang", "om");
  } catch (e) {}
})();
</script>

<style>

.dropdown__divider { height:1px; background:var(--border-soft); margin:6px 0; }

.main { grid-area:main; padding:var(--pad-main); overflow-x:hidden; }

.scope-badge { display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:linear-gradient(135deg, #eaf3fc, #fff);

.scope-badge svg { width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px;

.btn:hover { background:var(--bg-soft); border-color:#b9c7d9; }

.btn--primary { background:linear-gradient(135deg, #0b5cab, #0e7490); border:none; color:#fff;

function currentLang() {
  try { return localStorage.getItem("cs.language") || "en"; }
  catch (e) { return "en"; }
}
function t(key, fallback) {
  const lang = currentLang();
  const dict = I18N[lang] || I18N.en;
  return dict[key] || I18N.en[key] || fallback || key;
}

function localizeStaticDom() {
  document.documentElement.setAttribute("data-lang", currentLang());
  document.documentElement.lang = currentLang();
  if (currentLang() === "am") document.documentElement.setAttribute("data-ethiopic", "true");
  else document.documentElement.removeAttribute("data-ethiopic");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    const txt = t(key, el.textContent);
    if (txt) el.textContent = txt;
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder, el.placeholder);
  });
  document.title = t("page.title") + " — Civil Service MIS";

  const label = document.getElementById("lang-btn-label");
  if (label) label.textContent = currentLang().toUpperCase();
  document.querySelectorAll("#lang-panel [data-lang]").forEach(btn => {
    btn.classList.toggle("is-on", btn.dataset.lang === currentLang());
  });
}

const STATE = { lang:"en", theme:"light", compact:false };
function applyTheme(theme) {
  STATE.theme = theme;
  document.documentElement.classList.remove("theme-dark");
  document.body.classList.remove("theme-dark");
  let dark = false;
  if (theme === "dark") dark = true;
  else if (theme === "auto") dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) {
    document.documentElement.classList.add("theme-dark");
    document.body.classList.add("theme-dark");
  }
  try { localStorage.setItem("cs.theme", theme); } catch(e) {}
}
function applyCompact(on) {
  STATE.compact = !!on;
  document.documentElement.classList.toggle("compact-mode", !!on);
  try { localStorage.setItem("cs.compact", on ? "true" : "false"); } catch(e) {}
}
function applyLanguage(lang) {
  STATE.lang = lang || "en";
  document.documentElement.setAttribute("data-lang", STATE.lang);
  document.documentElement.lang = STATE.lang;
  if (STATE.lang === "am") document.documentElement.setAttribute("data-ethiopic","true");
  else document.documentElement.removeAttribute("data-ethiopic");
  try { localStorage.setItem("cs.language", STATE.lang); } catch(e) {}
  localizeStaticDom();
  if (S) {
    renderSidebar();
    renderUser();
    renderScopeBadge();
    renderHeadActions();
    renderStats();
    renderRegions();
  }
}
async function loadUserSettings(uid) {
  try {
    const snap = await getDoc(doc(db, "settings", uid));
    if (snap.exists()) Object.assign(STATE, snap.data());
  } catch(e) {}
  try {
    if (!STATE.theme) STATE.theme = localStorage.getItem("cs.theme") || "light";
    if (STATE.compact == null) STATE.compact = localStorage.getItem("cs.compact") === "true";
    if (!STATE.lang) STATE.lang = localStorage.getItem("cs.language") || "en";
  } catch(e) {}
  applyTheme(STATE.theme);
  applyCompact(STATE.compact);
  applyLanguage(STATE.lang);
}

function kick(reason) {
  if (kick.done) return;
  kick.done = true;
  try { sessionStorage.clear(); if (reason==="expired") sessionStorage.setItem("__redirectReason","expired"); } catch(e) {}
  signOut(auth).catch(()=>{}).finally(()=>window.location.replace(INDEX_URL));
  setTimeout(()=>window.location.replace(INDEX_URL), 800);
}
(function preCheck() {
  let ok = false;
  try { ok = sessionStorage.getItem("loggedIn")==="true" && !!sessionStorage.getItem("uid"); } catch(e) {}
  if (!ok) kick("no-session");
})();
window.addEventListener("storage", (e)=>{ if (e.key==="loggedIn" && e.newValue!=="true") kick("cross-tab"); });
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState!=="visible") return;
  if (kick.done) return;
  if (!auth.currentUser || sessionStorage.getItem("loggedIn")!=="true") kick("hidden-expired");
});
setInterval(()=>{ if (kick.done) return; if (!auth.currentUser) kick("heartbeat"); }, 60000);
document.addEventListener("click", async (e)=>{
  const btn = e.target.closest("#logout-btn");
  if (!btn) return;
  e.preventDefault();
  try { sessionStorage.clear(); } catch(err) {}
  try { await signOut(auth); } catch(err) {}
  window.location.replace(INDEX_URL);
});

function allRegions() {
  const map = new Map();
  REGIONS.forEach(r => map.set(r.code, { ...r, builtin: true }));
  const builtinCodes = new Set(REGIONS.map(x => x.code));
  customRegions.forEach(r => {
    const existing = map.get(r.code);
    const isBuiltin = builtinCodes.has(r.code) || !!existing?.builtin;
    map.set(r.code, { ...(existing || {}), ...r, builtin: isBuiltin });
  });
  return Array.from(map.values()).sort((a,b) => String(a.code).localeCompare(String(b.code)));
}
function dateNumeric(ts) {
  if (!ts) return "—";
  let d;
  if (typeof ts?.toDate === "function") d = ts.toDate();
  else d = new Date(ts);
  if (!d || isNaN(d.getTime())) return "—";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}${m}${day}`;
}

const escapeHtml = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = (n) => (n || "?").split(/\s+/).slice(0,2).map(s => s[0]).join("").toUpperCase();
const hasAccess = (item, role) => item.roles.includes("*") || item.roles.includes(role);
const twoDigits = (v, fb="00") => {
  if (v == null) return fb;
  const s = String(v).replace(/\D/g,"");
  if (!s) return fb;
  return s.length >= 2 ? s.slice(0,2) : s.padStart(2,"0");
};
const normalizeWoredas = (list) => (list || []).map(w =>
  typeof w === "string" ? { code:"", name:w } : { code:w.code||"", name:w.name||"" });
const normalizeNationalId = (v) => String(v||"").trim().toUpperCase().replace(/[\s-]/g,"");
const normalizePhone = (v) => {
  let s = String(v||"").replace(/\D/g,"");
  if (s.startsWith("251")) s = s.slice(3);
  if (s.startsWith("0"))   s = s.slice(1);
  return s;
};
const fullName = (e) => e.fullName || [e.firstName, e.lastName].filter(Boolean).join(" ") || e.nameEn || e.email || "Employee";
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function toast(msg, type="success") {
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast toast--" + type;
  const icon = type === "error" ? ICONS.alert : ICONS.check;
  el.innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; }, 4200);
  setTimeout(()=>el.remove(), 4600);
}

/* ============================================================

   ============================================================ */
const buildEmpId = (r,c,w,o,seq) =>
  `${twoDigits(r)}-${twoDigits(c)}${twoDigits(w)}${twoDigits(o)}${String(seq).padStart(4,"0")}`;

async function generateEmployeeId({ regionCode, clusterCode, woredaCode, officeCode }) {
  const RR = twoDigits(regionCode), CC = twoDigits(clusterCode);
  const WW = twoDigits(woredaCode), OO = twoDigits(officeCode);
  const key = `${RR}-${CC}${WW}${OO}`;
  const ref = doc(db, "counters", "employeeIds");
  const next = await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const data = snap.exists() ? snap.data() : {};
    const cur = Number(data[key] || 0);
    const v = cur + 1;
    tx.set(ref, { [key]: v }, { merge: true });
    return v;
  });
  return { empId: buildEmpId(RR,CC,WW,OO,next), seq: next };
}

async function findEmployeeByNationalId(natId) {
  const norm = normalizeNationalId(natId);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(collection(db, "employees"), where("nationalIdNorm","==",norm), limit(1)));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function findEmployeeByPhone(phone) {
  const norm = normalizePhone(phone);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(collection(db, "employees"), where("phoneNorm","==",norm), limit(1)));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function reserveUnique(type, value, norm, empId, name) {
  const ref = doc(db, "uniqueness", `${type}_${norm}`);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (snap.exists()) {
      const d = snap.data();
      throw Object.assign(new Error(
        `This ${type === "nationalId" ? "National ID" : "phone number"} is already registered` +
        (d.empId ? ` (employee ${d.empId})` : "")
      ), { code:"duplicate" });
    }
    tx.set(ref, { type, value, norm, empId, name: name||null, createdAt: serverTimestamp() });
  });
}
async function releaseUnique(type, norm) {
  try { await deleteDoc(doc(db, "uniqueness", `${type}_${norm}`)); } catch(e) {}
}

/* ============================================================
   PASSWORD STRENGTH
   ============================================================ */
function evaluatePassword(pw) {
  const checks = {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw)
  };
  const passed = Object.values(checks).filter(Boolean).length;
  let score = 0;
  if (pw.length === 0) score = 0;
  else if (passed <= 2) score = 1;
  else if (passed === 3) score = 2;
  else if (passed === 4) score = 3;
  else score = 4;
  const labels = [t("pw.enter"), t("pw.weak"), t("pw.fair"), t("pw.good"), t("pw.strong")];
  const classes = ["","weak","fair","good","strong"];
  return { checks, passed, score, label: labels[score], klass: classes[score] };
}

const isSuper = () => S?.role === "super_admin";
const isRegionalAdmin = () => S?.role === "regional_admin";
const isClusterAdmin = () => S?.role === "admin";
const isHRM = () => S?.role === "hrm";
const myClusterId = () => S?.clusterId || null;
const myRegionCode = () => S?.region || S?.regionCode || null;

function regionalAdminsFor(regionCode) { return regionalAdminsByRegion[regionCode] || []; }
function hasRegionalAdmin(regionCode) { return regionalAdminsFor(regionCode).length > 0; }
function directoratesFor(regionCode) { return departmentsByRegion[regionCode] || []; }

function visibleRegions() {
  if (isSuper() || isHRM()) return allRegions();
  if (isRegionalAdmin()) {
    const r = allRegions().find(x => x.code === myRegionCode());
    return r ? [r] : [];
  }
  if (isClusterAdmin()) {
    const c = clusters.find(x => x.id === myClusterId());
    if (!c) return [];
    const r = allRegions().find(x => x.code === c.regionCode);
    return r ? [r] : [];
  }
  return [];
}
function visibleClusters() {
  if (isSuper() || isHRM()) return clusters;
  if (isRegionalAdmin()) return clusters.filter(c => c.regionCode === myRegionCode());
  if (isClusterAdmin()) return clusters.filter(c => c.id === myClusterId());
  return [];
}
function visibleOffices() {
  if (isSuper() || isHRM()) return offices;
  const ids = new Set(visibleClusters().map(c => c.id));
  return offices.filter(o => ids.has(o.clusterId));
}
function visibleEmployees() {
  if (isSuper() || isHRM()) return employees;
  const ids = new Set(visibleClusters().map(c => c.id));
  return employees.filter(e => ids.has(e.clusterId));
}

const canCreateRegion        = () => isSuper();
const canDeleteRegion        = () => isSuper();
const canAssignRegionalAdmin = () => isSuper();
const canCreateDirectorate   = (rc) => isSuper() || (isRegionalAdmin() && myRegionCode() === rc);
const canCreateCluster = (rc) => {
  if (!hasRegionalAdmin(rc)) return false;
  if (isSuper()) return true;
  if (isRegionalAdmin() && myRegionCode() === rc) return true;
  return false;
};
const canCreateOffice = (c) => {
  if (!c) return false;
  if (isSuper()) return true;
  if (isRegionalAdmin() && c.regionCode === myRegionCode()) return true;
  return isClusterAdmin() && c.id === myClusterId();
};
const canManageWoredas = (c) => {
  if (!c) return false;
  if (isSuper()) return true;
  if (isRegionalAdmin() && c.regionCode === myRegionCode()) return true;
  return isClusterAdmin() && c.id === myClusterId();
};
const canManageAdmins = (c) => isSuper() && !!c;
const canAddPeopleTo = (office) => {
  if (!office) return false;
  if (isSuper() || isHRM()) return true;
  if (isRegionalAdmin()) {
    const c = clusters.find(x => x.id === office.clusterId);
    return c?.regionCode === myRegionCode();
  }
  return isClusterAdmin() && office.clusterId === myClusterId();
};

  const deptCount = regs.reduce((n,r) =>
    n + directoratesFor(r.code).length
      + clusters.filter(c => c.regionCode === r.code)
                .reduce((m,c) => m + (departmentsByCluster[c.id]||[]).length, 0), 0);

  document.getElementById("stats").innerHTML = `
    ${statCard(t("stat.regions"),     regs.length,        "stat--violet", "pin")}
    ${statCard(t("stat.regAdmins"),   regionalAdminCount, "stat--gold",   "shield")}
    ${statCard(t("stat.directorates"), deptCount,         "stat--teal",   "org")}
    ${statCard(t("stat.clusters"),    cl.length,          "stat--blue",   "cluster")}
    ${statCard(t("stat.offices"),     of.length,          "stat--pink",   "building")}
    ${statCard(t("stat.employees"),   em.length,          "stat--green",  "users")}
    ${statCard(t("stat.woredas"),     woredaCount,        "stat--gold",   "pin")}
  `;
}
function statCard(label, value, cls, iconKey) {

function wireRegionEvents(host) {
  host.querySelectorAll("[data-action]").forEach(el => {
    const action = el.dataset.action;
    if (action === "toggle-cluster") {
      el.addEventListener("click", (e) => {
        if (e.target.closest("button[data-action]:not([data-action='toggle-cluster'])")) return;
        const cid = el.dataset.cid;
        const block = host.querySelector(`[data-cluster="${cid}"]`);
        if (!block) return;
        const body = block.querySelector(".cluster-block__body");
        const isOpen = !body.hasAttribute("hidden");
        if (isOpen) body.setAttribute("hidden", "");
        else body.removeAttribute("hidden");
      });
      return;
    }
    el.addEventListener("click", () => {
      const { action, region, cid, wid, uid } = el.dataset;
      if (action === "view-region")            openRegionDetailsModal(region);
      if (action === "edit-region")            openEditRegionModal(region);
      if (action === "delete-region")          deleteRegion(region);
      if (action === "upload-region-logo")     openRegionLogoUpload(region);
      if (action === "add-regional-admin")     openAddRegionalAdminChooser(region);
      if (action === "edit-regional-admin")    openEditRegionalAdmin(uid, region);
      if (action === "remove-regional-admin")  confirmRemoveRegionalAdmin(uid, region);
      if (action === "manage-regional-admins") openRegionalAdminsModal(region);
      if (action === "add-directorate")        openDirectorateModal(region);
      if (action === "add-cluster")            openClusterModal(null, region);
      if (action === "edit-cluster")           openClusterModal(cid);
      if (action === "delete-cluster")         confirmDeleteCluster(cid);
      if (action === "manage-woredas")         openWoredaModal(cid);
      if (action === "remove-woreda")          removeWoredaFromCluster(cid, wid);
      if (action === "manage-offices")         openOfficesModal(cid, wid);
      if (action === "manage-admins")          openClusterAdminsModal(cid);
      if (action === "remove-admin")           confirmRemoveAdmin(uid, cid);
    });
  });
}

/* ============================================================
   MODAL FRAMEWORK
   ============================================================ */
let escHandler = null;
function openModal(html, { size="" } = {}) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal ${size?"modal--"+size:""}" role="dialog">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener("click", (e)=>{ if (e.target === bd) closeModal(); });
  bd.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  escHandler = (e)=>{ if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

/* ============================================================
   WIZARD
   ============================================================ */
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size="lg" }) {
  const data = { ...initial };
  let idx = 0, busy = false;
  const root = document.createElement("div");
  root.className = "modal-backdrop";
  root.id = "modal-backdrop";
  document.body.appendChild(root);
  escHandler = (e)=>{ if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  root.addEventListener("click", (e)=>{ if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll("[data-field]").forEach(el => {
      const k = el.dataset.field;
      if (el.type === "checkbox") data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector("#wizErr");
    if (!el) return;
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.textContent = msg; el.style.display = "flex";
  }

  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${escapeHtml(title)}</div>
            ${subtitle ? `<div class="modal__sub">${escapeHtml(subtitle)}</div>` : ""}
          </div>
          <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
        </div>
        <div class="steps">
          ${steps.map((s,i)=>`
            <div class="step ${i<idx?"is-done":""} ${i===idx?"is-active":""}">
              <span class="step__num">${i<idx?"✓":i+1}</span>
              <span class="step__label">${escapeHtml(s.label)}</span>
            </div>
            ${i < steps.length-1 ? `<div class="step__line"></div>` : ""}
          `).join("")}
        </div>
        <div class="modal__body">
          <div class="step-header">
            <span class="step-header__badge">${idx+1}</span>
            ${escapeHtml(step.title || step.label)}
          </div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>${escapeHtml(t("action.cancel"))}</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx===0?"disabled":""}>${escapeHtml(t("action.back"))}</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
            <span class="btn-label">${idx===steps.length-1?escapeHtml(finishLabel||t("action.save")):escapeHtml(t("action.next"))}</span>
          </button>
        </div>
      </div>`;
    root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    root.querySelectorAll("[data-field]").forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === "checkbox") el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener("click", ()=>{
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener("click", async ()=>{
      const step = steps[idx];
      collect();
      const err = step.validate ? await step.validate(data) : null;
      if (err) { showErr(err); return; }
      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector(".spinner");
        const lbl = btn.querySelector(".btn-label");
        btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = t("action.saving");
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || t("action.done"), "success");
        } catch (e) {
          console.error(e);
          busy = false;
          btn.disabled = false; sp.classList.add("hidden");
          lbl.textContent = finishLabel || t("action.save");
          showErr(e?.message || "Something went wrong.");
        }
      } else { idx++; draw(); }
    });
    if (typeof step.after === "function") step.after(root, data, ()=>{ collect(); draw(); });
  }
  draw();
}

/* ============================================================
   LIVE DUPLICATE CHECK
   ============================================================ */
function setupLiveDuplicate(root, inputId, type, label, onStatusChange) {
  const input = root.querySelector("#" + inputId);
  if (!input) return;
  const wrap = input.closest(".field");
  if (!wrap) return;
  input.classList.add("has-check");
  let icon = wrap.querySelector(".dup-check");
  if (!icon) { icon = document.createElement("span"); icon.className = "dup-check"; wrap.appendChild(icon); }
  let err = wrap.querySelector(".field__error");
  if (!err) { err = document.createElement("div"); err.className = "field__error"; wrap.appendChild(err); }

  let timer = null;
  const clearUI = () => { icon.textContent=""; icon.style.color=""; err.classList.remove("show"); input.removeAttribute("aria-invalid"); };

  const run = async () => {
    const raw = input.value.trim();
    if (!raw) { clearUI(); onStatusChange(type, { ok:true, empty:true }); return; }
    if (type === "nationalId" && normalizeNationalId(raw).length < 5) { clearUI(); onStatusChange(type, { ok:false, empty:false, reason:"too-short" }); return; }
    if (type === "phone" && normalizePhone(raw).length < 9) { clearUI(); onStatusChange(type, { ok:false, empty:false, reason:"too-short" }); return; }
    icon.textContent = "…"; icon.style.color = "var(--muted-light)";
    const existing = type === "nationalId" ? await findEmployeeByNationalId(raw) : await findEmployeeByPhone(raw);
    if (existing) {
      input.setAttribute("aria-invalid","true"); err.classList.add("show");
      err.innerHTML = `⚠ ${escapeHtml(existing.nameEn||existing.firstName||"another employee")}` +
        (existing.empId ? ` (${escapeHtml(existing.empId)})` : "") + `.`;
      icon.textContent = "✗"; icon.style.color = "var(--danger)";
      onStatusChange(type, { ok:false, empty:false, reason:"duplicate", existing });
    } else {
      input.removeAttribute("aria-invalid"); err.classList.remove("show");
      icon.textContent = "✓"; icon.style.color = "var(--success)";
      onStatusChange(type, { ok:true, empty:false });
    }
  };
  input.addEventListener("blur", run);
  input.addEventListener("input", ()=>{ clearTimeout(timer); timer = setTimeout(run, 400); });
}

        en: r.en || "",
        am: r.am || "",
        om: r.om || "",
        logoURL: dataURL,

    } catch (err) {
      console.error(err);
      toast(err.message || t("msg.couldNotSave"), "error");
    }
  };

/* ============================================================
   OFFICE FORM
   ============================================================ */
function openOfficeForm(clusterId, woredaCode, officeId=null) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  const w = normalizeWoredas(c.woredas).find(x => x.code === woredaCode);
  if (!w) { toast(t("msg.woredaNotFound"), "error"); return; }
  const editing = !!officeId;
  const o = editing ? offices.find(x => x.id === officeId) : {};
  if (!canCreateOffice(c)) { toast(t("msg.notAllowed"), "error"); return; }

  openWizard({
    title: editing ? t("office.edit.title") : t("office.add.title"),
    subtitle: `${escapeHtml(c.name)} → ${escapeHtml(w.name)} (${escapeHtml(w.code)})`,
    finishLabel: editing ? t("action.save") : t("action.create"),
    successMessage: editing ? t("office.edit.success") : t("office.add.success"),
    initial: { name: o.name||"", code: o.code||"" },
    steps: [{
      label: t("action.create"), title: editing ? t("office.edit.title") : t("office.add.title"),
      render: (d) => `
        <div class="field"><label class="field__required">${escapeHtml(t("office.name"))}</label>
          <input data-field="name" value="${escapeHtml(d.name||"")}" placeholder="${escapeHtml(t("office.namePlaceholder"))}"></div>
        <div class="field"><label class="field__required">${escapeHtml(t("office.code"))}</label>
          <input data-field="code" maxlength="2" value="${escapeHtml(d.code||"")}"
                 placeholder="${escapeHtml(t("office.codePlaceholder"))}" inputmode="numeric"
                 style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
          <p class="field__hint">${escapeHtml(t("office.codeHint"))} ${escapeHtml(w.code)}.</p></div>
        <div class="review" style="margin-top:16px">
          <div class="review__row"><span class="review__k">${escapeHtml(t("chain.region"))}</span><span class="review__v">${escapeHtml(regionLabel(c.regionCode))}</span></div>
          <div class="review__row"><span class="review__k">${escapeHtml(t("chain.cluster"))}</span><span class="review__v">${escapeHtml(c.name)} (${escapeHtml(c.code||"??")})</span></div>
          <div class="review__row"><span class="review__k">${escapeHtml(t("chain.woreda"))}</span><span class="review__v">${escapeHtml(w.name)} (${escapeHtml(w.code)})</span></div>
        </div>`,
      validate: d => {
        if (!d.name || d.name.trim().length < 2) return t("office.nameRequired");
        if (!/^\d{2}$/.test(d.code || "")) return t("office.codeInvalid");
        const dup = offices.some(x => x.clusterId === c.id && x.woredaCode === w.code && x.code === d.code && x.id !== officeId);
        if (dup) return `${d.code} ${t("office.codeExists")} ${w.code}.`;
        return null;
      }
    }],
    onFinish: async (d) => {
      const payload = {
        name: d.name.trim(), code: d.code,
        clusterId: c.id, clusterCode: c.code, clusterName: c.name,
        regionCode: c.regionCode, regionName: regionName(c.regionCode),
        woredaCode: w.code, woredaName: w.name,
        updatedAt: serverTimestamp()
      };
      if (editing) await updateDoc(doc(db, "offices", officeId), payload);
      else {
        payload.createdAt = serverTimestamp();
        payload.createdBy = S.uid;
        const ref = doc(collection(db, "offices"));
        await setDoc(ref, { ...payload, officeId: ref.id });
      }
    }
  });
}

async function deleteOfficeConfirm(officeId) {
  if (!isSuper()) { toast(t("msg.onlySuperDeleteOffices"), "error"); return; }
  const o = offices.find(x => x.id === officeId);
  if (!o) return;
  const empCount = (employeesByOffice[officeId] || []).length;
  if (empCount) { toast(`${t("office.delete.inUse")} (${empCount})`, "error"); return; }
  if (!confirm(`${t("office.delete.confirm")} "${o.name}" (${o.code})?`)) return;
  try {
    await deleteDoc(doc(db, "offices", officeId));
    toast(t("office.deleted"), "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

            <div class="review__row"><span class="review__k">${escapeHtml(t("person.phone"))}</span><span class="review__v">${escapeHtml(d2.phone||"—")}</span></div>
            <div class="review__row"><span class="review__k">${escapeHtml(t("person.position"))}</span><span class="review__v">${escapeHtml(d2.position||"—")}</span></div>
            <div class="review__row"><span class="review__k">${escapeHtml(t("person.office"))}</span><span class="review__v">${escapeHtml(office.name)} (${escapeHtml(office.code||"??")})</span></div>
            <div class="review__row"><span class="review__k">${escapeHtml(t("person.loginEmail"))}</span><span class="review__v">${escapeHtml(d2.loginEmail)}</span></div>
          </div>`
      }
    ],
    onFinish: async (data) => {
      const nameEn = [data.firstName, data.middleName, data.lastName].filter(Boolean).map(s=>s.trim()).join(" ");
      const nameAm = [data.firstNameAm, data.middleNameAm, data.lastNameAm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const nameOm = [data.firstNameOm, data.middleNameOm, data.lastNameOm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const natIdNorm = normalizeNationalId(data.nationalId);
      const phoneNorm = normalizePhone(data.phone);

      const dupNat = await findEmployeeByNationalId(data.nationalId);
      if (dupNat) throw new Error(t("val.duplicateNatId"));
      const dupPhone = await findEmployeeByPhone(data.phone);
      if (dupPhone) throw new Error(t("val.duplicatePhone"));

      const { empId, seq } = await generateEmployeeId({
        regionCode: cluster.regionCode,
        clusterCode: cluster.code,
        woredaCode: office.woredaCode || "00",
        officeCode: office.code
      });

      const secName = "empCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, data.loginEmail.trim(), data.password);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: nameEn }); } catch(e) {}
        await signOut(secAuth);
      } finally {
        try { await deleteApp(secApp); } catch(e) {}
      }
      if (!uid) throw new Error(t("msg.noLogin"));

      let natLocked = false, phoneLocked = false;
      try {
        await reserveUnique("nationalId", data.nationalId, natIdNorm, empId, nameEn);
        natLocked = true;
        await reserveUnique("phone", data.phone, phoneNorm, empId, nameEn);
        phoneLocked = true;
      } catch (err) {
        if (natLocked)   await releaseUnique("nationalId", natIdNorm);
        if (phoneLocked) await releaseUnique("phone", phoneNorm);
        throw err;
      }

      const dep = departments.find(x => x.id === data.departmentId);
      const empRef = doc(collection(db, "employees"));
      try {
        await setDoc(empRef, {
          empId, seq,
          firstName: data.firstName.trim(),
          middleName: data.middleName?.trim() || null,
          lastName: data.lastName.trim(),
          firstNameAm: data.firstNameAm.trim(),
          middleNameAm: data.middleNameAm?.trim() || null,
          lastNameAm: data.lastNameAm.trim(),
          firstNameOm: data.firstNameOm.trim(),
          middleNameOm: data.middleNameOm?.trim() || null,
          lastNameOm: data.lastNameOm.trim(),
          nameEn, nameAm, nameOm, fullName: nameEn,
          photoURL: data._photo,
          nationalId: data.nationalId.trim(), nationalIdNorm: natIdNorm,
          gender: data.gender, dob: data.dob,
          phone: data.phone.trim(), phoneNorm,
          phoneAlt: data.phoneAlt?.trim() || null,
          email: data.email.trim(), loginEmail: data.loginEmail.trim(),
          country: data.country || "ET",
          subCity: data.subCity?.trim() || null,
          kebele: data.kebele?.trim() || null,
          position: data.position.trim(),
          grade: data.grade?.trim() || null,
          hireDate: data.hireDate,
          employmentType: data.employmentType || "permanent",
          status: "active",
          regionCode: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterCode: cluster.code, clusterName: cluster.name,
          woredaCode: office.woredaCode || null, woredaName: office.woredaName || null,
          officeId: office.id, officeCode: office.code, officeName: office.name,
          departmentId: dep?.id || null,
          departmentName: dep?.name || null,
          departmentCode: dep?.code || null,
          uid, active: true,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch (err) {
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }

      try {
        await setDoc(doc(db, "users", uid), {
          uid,
          email: data.loginEmail.trim(),
          name: nameEn,
          photoURL: data._photo,
          role: "employee",
          phone: data.phone.trim(),
          personalEmail: data.email.trim(),
          nationalId: data.nationalId.trim(),
          region: cluster.regionCode, regionCode: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterName: cluster.name,
          woredaCode: office.woredaCode || null, woredaName: office.woredaName || null,
          officeId: office.id, officeName: office.name,
          departmentId: dep?.id || null, departmentName: dep?.name || null,
          employeeId: empRef.id,
          empId,
          active: true,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch (err) {
        try { await deleteDoc(empRef); } catch(e) {}
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }
    }
  });
}

function openWoredaModal(clusterId) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!canManageWoredas(c)) { toast(t("msg.notAllowed"), "error"); return; }
  const woredas = normalizeWoredas(c.woredas);

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">${escapeHtml(t("woreda.title"))}</div>
        <div class="modal__sub">${escapeHtml(c.name)} · ${escapeHtml(t("woreda.sub"))} ${escapeHtml(c.code || "??")}</div>
      </div>
      <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>${escapeHtml(t("woreda.info"))}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <input id="wm-code" maxlength="2" placeholder="12" inputmode="numeric"
               style="width:90px;height:48px;padding:0 12px;border:2px solid var(--border);border-radius:11px;background:var(--bg-soft);
                      font-family:ui-monospace,monospace;letter-spacing:3px;text-align:center;font-size:18px;font-weight:800;color:var(--primary-dark)">
        <input id="wm-name" placeholder="${escapeHtml(t("woreda.namePlaceholder"))}"
               style="flex:1;min-width:150px;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg-soft);font-size:14px">
        <button class="btn btn--primary" id="wm-add-btn">
          <svg viewBox="0 0 24 24">${ICONS.plus}</svg> ${escapeHtml(t("woreda.add"))}
        </button>
      </div>
      <div class="wm-list" id="wm-list"></div>
    </div>
    <div class="modal__foot">
      <div class="spacer"></div>
      <button class="btn" data-close>${escapeHtml(t("action.done"))}</button>
    </div>
  `, { size:"lg" });

  const listEl = document.getElementById("wm-list");
  const codeEl = document.getElementById("wm-code");
  const nameEl = document.getElementById("wm-name");

  function drawList() {
    if (!woredas.length) { listEl.innerHTML = `<div class="wm-empty">${escapeHtml(t("woreda.none"))}</div>`; return; }
    listEl.innerHTML = woredas.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)))
      .map(w => `
        <div class="wm-item">
          <span class="wm-item__code">${escapeHtml(w.code)}</span>
          <span class="wm-item__name">${escapeHtml(w.name)}</span>
          <button class="btn btn--sm btn--danger" data-wid="${escapeHtml(w.code)}">
            <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
          </button>
        </div>`).join("");
    listEl.querySelectorAll("[data-wid]").forEach(btn => {
      btn.addEventListener("click", ()=>removeLocal(btn.dataset.wid));
    });
  }
  async function persist() {
    await updateDoc(doc(db, "clusters", c.id), { woredas, updatedAt: serverTimestamp(), updatedBy: S.uid });
  }
  async function addLocal() {
    const code = codeEl.value.replace(/\D/g,"").slice(0,2);
    const name = nameEl.value.trim();
    if (!/^\d{2}$/.test(code)) { toast(t("woreda.codeInvalid"), "error"); codeEl.focus(); return; }
    if (name.length < 2) { toast(t("woreda.nameRequired"), "error"); nameEl.focus(); return; }
    if (woredas.some(w=>w.code===code)) { toast(`${code} ${t("woreda.codeExists")}`, "error"); codeEl.focus(); return; }
    woredas.push({ code, name });
    try {
      await persist();
      toast(`"${name}" ${t("woreda.added")}`, "success");
      codeEl.value=""; nameEl.value=""; codeEl.focus();
      drawList();
    } catch (err) { woredas.pop(); toast(err.code + ": " + err.message, "error"); }
  }
  async function removeLocal(code) {
    const idx = woredas.findIndex(w => w.code === code);
    if (idx < 0) return;
    const inUse = (officesByWoreda[`${c.id}:${code}`] || []).length;
    if (inUse) { toast(`${t("woreda.inUse")} ${code}`, "error"); return; }
    if (!confirm(`${t("woreda.removeConfirm")} "${woredas[idx].name}" (${code})?`)) return;
    const removed = woredas.splice(idx, 1)[0];
    try { await persist(); toast(t("woreda.removed"), "success"); drawList(); }
    catch (err) { woredas.splice(idx, 0, removed); toast(err.code + ": " + err.message, "error"); }
  }
  document.getElementById("wm-add-btn").addEventListener("click", addLocal);
  nameEl.addEventListener("keydown", (e)=>{ if (e.key==="Enter") addLocal(); });
  codeEl.addEventListener("keydown", (e)=>{ if (e.key==="Enter") nameEl.focus(); });
  drawList();
}
async function removeWoredaFromCluster(clusterId, code) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c || !canManageWoredas(c)) { toast(t("msg.notAllowed"), "error"); return; }
  const list = normalizeWoredas(c.woredas);
  const idx = list.findIndex(w=>w.code===code);
  if (idx < 0) return;
  const inUse = (officesByWoreda[`${clusterId}:${code}`] || []).length;
  if (inUse) { toast(`${t("woreda.inUse")} ${code}`, "error"); return; }
  if (!confirm(`${t("woreda.removeConfirm")} "${list[idx].name}" (${code})?`)) return;
  list.splice(idx, 1);
  try {
    await updateDoc(doc(db, "clusters", clusterId), { woredas: list, updatedAt: serverTimestamp() });
    toast(t("woreda.removed"), "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

      selectedId = uid;
      selectedEl.classList.remove("hidden");
      selectedEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;

    const old = label.textContent;

        clusterName: c.name || null,

      setTimeout(()=>openClusterAdminsModal(c.id), 120);

      console.error(err);
      errBox.style.display = "flex";
      errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || "")}`;
      submitBtn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = old;
    }
  });
}

async function confirmRemoveAdmin(uid, clusterId) {

  const c = clusters.find(x => x.id === clusterId);

async function deleteRegion(regionCode) {
  if (!canDeleteRegion()) { toast(t("msg.onlySuperDeleteRegions"), "error"); return; }
  const r = allRegions().find(x => x.code === regionCode);
  if (!r || r.builtin) { toast(t("msg.builtinDelete"), "error"); return; }
  if ((clustersByRegion[regionCode] || []).length) { toast(t("msg.clustersFirst"), "error"); return; }
  if (directoratesFor(regionCode).length) { toast(t("msg.directoratesFirst"), "error"); return; }
  if (regionalAdminsFor(regionCode).length) { toast(t("msg.adminsFirst"), "error"); return; }
  if (!confirm(`${t("msg.deleteRegionConfirm")} "${r.en}" (${r.code})?`)) return;
  try { await deleteDoc(doc(db, "regions", regionCode)); toast(t("msg.regionDeleted"), "success"); }
  catch (err) { toast(err.code + ": " + err.message, "error"); }
}
function openClusterModal(clusterId=null, preRegion=null) {
  const editing = !!clusterId;
  const c = editing ? clusters.find(x => x.id === clusterId) : {};
  const regionCode = editing ? c.regionCode : preRegion;

  if (!editing && !canCreateCluster(regionCode)) {
    if (!hasRegionalAdmin(regionCode)) {
      toast(t("msg.regionBlocked"), "error");
    } else {
      toast(t("msg.notAllowed"), "error");
    }
    return;
  }
  if (editing && !isSuper() && !(isRegionalAdmin() && c.regionCode === myRegionCode())) {
    toast(t("msg.notAllowed"), "error");
    return;
  }

  openWizard({
    title: editing ? t("cluster.edit.title") : t("cluster.add.title"),
    finishLabel: editing ? t("action.save") : t("action.create"),
    successMessage: editing ? t("cluster.edit.success") : t("cluster.add.success"),
    initial: { regionCode: regionCode || "", name: c.name || "", code: c.code || "" },

      {

              ${allRegions().map(r => `
                <option value="${r.code}" ${d.regionCode===r.code?"selected":""}>

            </select>
          </div>`,

      {

          <div class="field">
            <label class="field__required">${escapeHtml(t("cluster.add.name"))}</label>
            <input data-field="name" value="${escapeHtml(d.name||"")}">
          </div>
          <div class="field">
            <label class="field__required">${escapeHtml(t("cluster.add.code"))}</label>
            <input data-field="code" maxlength="2" value="${escapeHtml(d.code||"")}"
                   placeholder="06" inputmode="numeric"
                   style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
          </div>`,
        validate: d => {
          if (!d.name || d.name.trim().length < 2) return t("cluster.add.nameRequired");
          if (!/^\d{2}$/.test(d.code||"")) return t("cluster.add.codeInvalid");
          const dup = clusters.some(x => x.regionCode === d.regionCode && x.code === d.code && x.id !== clusterId);

      if (editing) await updateDoc(doc(db, "clusters", clusterId), payload);

        const ref = doc(collection(db, "clusters"));
        await setDoc(ref, { ...payload, clusterId: ref.id });

function rebuildIndexes() {
  Object.keys(clustersByRegion).forEach(k => delete clustersByRegion[k]);
  Object.keys(officesByCluster).forEach(k => delete officesByCluster[k]);
  Object.keys(officesByWoreda).forEach(k => delete officesByWoreda[k]);
  Object.keys(employeesByOffice).forEach(k => delete employeesByOffice[k]);
  Object.keys(employeesByCluster).forEach(k => delete employeesByCluster[k]);
  Object.keys(employeesByDepartment).forEach(k => delete employeesByDepartment[k]);
  Object.keys(adminsByCluster).forEach(k => delete adminsByCluster[k]);
  Object.keys(regionalAdminsByRegion).forEach(k => delete regionalAdminsByRegion[k]);
  Object.keys(departmentsByRegion).forEach(k => delete departmentsByRegion[k]);
  Object.keys(departmentsByCluster).forEach(k => delete departmentsByCluster[k]);
  Object.keys(workPlansByDepartment).forEach(k => delete workPlansByDepartment[k]);

  clusters.forEach(c => {
    if (!clustersByRegion[c.regionCode]) clustersByRegion[c.regionCode] = [];
    clustersByRegion[c.regionCode].push(c);
  });
  offices.forEach(o => {
    if (!officesByCluster[o.clusterId]) officesByCluster[o.clusterId] = [];
    officesByCluster[o.clusterId].push(o);
    if (o.woredaCode) {
      const k = `${o.clusterId}:${o.woredaCode}`;
      if (!officesByWoreda[k]) officesByWoreda[k] = [];
      officesByWoreda[k].push(o);
    }
  });
  employees.forEach(e => {
    if (e.officeId) {
      if (!employeesByOffice[e.officeId]) employeesByOffice[e.officeId] = [];
      employeesByOffice[e.officeId].push(e);
    }
    if (e.clusterId) {
      if (!employeesByCluster[e.clusterId]) employeesByCluster[e.clusterId] = [];
      employeesByCluster[e.clusterId].push(e);
    }
    if (e.departmentId) {
      if (!employeesByDepartment[e.departmentId]) employeesByDepartment[e.departmentId] = [];
      employeesByDepartment[e.departmentId].push(e);
    }
  });
  users.forEach(u => {
    if (u.role === "admin" && u.clusterId && u.active !== false) {
      if (!adminsByCluster[u.clusterId]) adminsByCluster[u.clusterId] = [];
      adminsByCluster[u.clusterId].push(u);
    }
    if (u.role === "regional_admin" && u.active !== false) {
      const rc = u.region || u.regionCode;
      if (rc) {
        if (!regionalAdminsByRegion[rc]) regionalAdminsByRegion[rc] = [];
        regionalAdminsByRegion[rc].push(u);
      }
    }
  });
  departments.forEach(d => {
    if (d.level === "cluster" && d.clusterId) {
      if (!departmentsByCluster[d.clusterId]) departmentsByCluster[d.clusterId] = [];
      departmentsByCluster[d.clusterId].push(d);
    }
    if (d.regionCode) {
      if (!departmentsByRegion[d.regionCode]) departmentsByRegion[d.regionCode] = [];
      departmentsByRegion[d.regionCode].push(d);
    }
  });
  workPlans.forEach(p => {
    if (p.departmentId) {
      if (!workPlansByDepartment[p.departmentId]) workPlansByDepartment[p.departmentId] = [];
      workPlansByDepartment[p.departmentId].push(p);
    }
  });
}

function subscribeRegions() {
  if (unsubRegions) unsubRegions();
  unsubRegions = onSnapshot(collection(db, "regions"), (snap)=>{
    customRegions = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn("[regions]", err.code));
}

function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (isRegionalAdmin() && myRegionCode()) q = query(q, where("regionCode","==",myRegionCode()));
  else if (isClusterAdmin() && myClusterId()) q = query(q, where("clusterId","==",myClusterId()));
  unsubClusters = onSnapshot(q, (snap)=>{
    clusters = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, err => console.warn("[clusters]", err.code));
}

/* ============================================================
   SHELL
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e)=>{
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch(err) {}
});
document.getElementById("menu-toggle").addEventListener("click", ()=>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", ()=>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", ()=>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch(e) {}

/* Language switcher */
const langBtn = document.getElementById("lang-btn");
const langPanel = document.getElementById("lang-panel");
langBtn?.addEventListener("click", (e)=>{
  e.stopPropagation();
  langPanel.classList.toggle("hidden");
});
document.querySelectorAll("#lang-panel [data-lang]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    applyLanguage(btn.dataset.lang);
    try { if (S?.uid) setDoc(doc(db, "settings", S.uid), { lang: btn.dataset.lang }, { merge: true }); } catch(e) {}
    langPanel.classList.add("hidden");
  });
});
document.addEventListener("click", ()=> langPanel?.classList.add("hidden"));

window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
  if (STATE.theme === "auto") applyTheme("auto");
});

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user)=>{
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
  } catch(e) {}
  if (userDoc && userDoc.active === false) { kick("inactive"); return; }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    officeId: userDoc?.officeId || "",
    clusterId: userDoc?.clusterId || "",
    region: userDoc?.region || userDoc?.regionCode || "",
    regionCode: userDoc?.regionCode || userDoc?.region || ""
  };

  if (!["super_admin","regional_admin","admin","hrm"].includes(S.role)) {
    window.location.replace("dashboard.html");
    return;
  }

  await loadUserSettings(user.uid);

  localizeStaticDom();
  renderSidebar();
  renderUser();
  render();

  subscribeRegions();
  subscribeClusters();
  subscribeOffices();
  subscribeDepartments();
  subscribeEmployees();
  subscribeUsers();

  console.log("[offices] booted — EN/AM/OM i18n, Regional HR Admin, logo upload, users.html redirect");
});
</script>
