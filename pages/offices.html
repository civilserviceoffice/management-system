function openRegionModal() {
  if (!canCreateRegion()) { toast("Only super admins", "error"); return; }
  openWizard({
    title: "Add Region",
    finishLabel: "Create Region",
    successMessage: "Region created",
    initial: { code:"", en:"", am:"" },
    steps: [{
      label: "Details",
      title: "Region details",
      render: (d) => `
        <div class="field">
          <label class="field__required">Region code (2 digits)</label>
          <input data-field="code" maxlength="2" value="${escapeHtml(d.code||"")}"
                 placeholder="16" inputmode="numeric"
                 style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
        </div>
        <div class="field">
          <label class="field__required">Region name (English)</label>
          <input data-field="en" value="${escapeHtml(d.en||"")}">
        </div>
        <div class="field">
          <label>Region name (Amharic)</label>
          <input data-field="am" value="${escapeHtml(d.am||"")}" style="font-family:'Noto Sans Ethiopic',sans-serif">
        </div>`,
      validate: (d) => {
        if (!/^\d{2}$/.test(d.code||"")) return "Region code must be 2 digits.";
        if (!d.en || d.en.trim().length < 2) return "Region name is required.";
        if (allRegions().some(r => r.code === d.code)) return `Region code ${d.code} already exists.`;
        return null;
      }
    }],
    onFinish: async (d) => {
      await setDoc(doc(db, "regions", d.code), {
        code: d.code, en: d.en.trim(), am: d.am?.trim()||"",
        createdAt: serverTimestamp(), createdBy: S.uid
      });
    }
  });
}
async function deleteRegion(regionCode) {
  if (!isSuper()) { toast("Only super admins", "error"); return; }
  const r = allRegions().find(x => x.code === regionCode);
  if (!r || r.builtin) { toast("Built-in regions cannot be deleted.", "error"); return; }
  if ((clustersByRegion[regionCode] || []).length) { toast("Remove clusters first.", "error"); return; }
  if (!confirm(`Delete region "${r.en}" (${r.code})?`)) return;
  try { await deleteDoc(doc(db, "regions", regionCode)); toast("Region deleted", "success"); }
  catch (err) { toast(err.code + ": " + err.message, "error"); }
}
function openClusterModal(clusterId=null, preRegion=null) {
  const editing = !!clusterId;
  if (!editing && !canCreateCluster()) { toast("Only super admins", "error"); return; }
  const c = editing ? clusters.find(x => x.id === clusterId) : {};
  openWizard({
    title: editing ? "Edit Cluster" : "Create Cluster",
    finishLabel: editing ? "Save Changes" : "Create Cluster",
    successMessage: editing ? "Cluster updated" : "Cluster created",
    initial: { regionCode: c.regionCode || preRegion || "", name: c.name || "", code: c.code || "" },
    steps: [
      {
        label: "Region",
        title: "Select the region",
        render: (d) => `
          <div class="field">
            <label class="field__required">Region</label>
            <select data-field="regionCode">
              <option value="">— Choose a region —</option>
              ${allRegions().map(r => `
                <option value="${r.code}" ${d.regionCode===r.code?"selected":""}>
                  ${r.code} · ${escapeHtml(r.en)}${r.builtin?"":" (custom)"}
                </option>`).join("")}
            </select>
          </div>`,
        validate: d => d.regionCode ? null : "Please select a region."
      },
      {
        label: "Details",
        title: "Cluster details",
        render: (d) => `
          <div class="field">
            <label class="field__required">Cluster name</label>
            <input data-field="name" value="${escapeHtml(d.name||"")}" placeholder="e.g. North Shewa Cluster">
          </div>
          <div class="field">
            <label class="field__required">Cluster code (2 digits)</label>
            <input data-field="code" maxlength="2" value="${escapeHtml(d.code||"")}"
                   placeholder="06" inputmode="numeric"
                   style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
          </div>`,
        validate: d => {
          if (!d.name || d.name.trim().length < 2) return "Cluster name required.";
          if (!/^\d{2}$/.test(d.code||"")) return "Cluster code must be 2 digits.";
          const dup = clusters.some(x => x.regionCode === d.regionCode && x.code === d.code && x.id !== clusterId);
          if (dup) return `Cluster code ${d.code} already exists in ${regionName(d.regionCode)}.`;
          return null;
        }
      }
    ],
    onFinish: async (d) => {
      const payload = {
        name: d.name.trim(), code: d.code,
        regionCode: d.regionCode, regionName: regionName(d.regionCode),
        updatedAt: serverTimestamp()
      };
      if (editing) await updateDoc(doc(db, "clusters", clusterId), payload);
      else {
        payload.woredas = [];
        payload.createdAt = serverTimestamp();
        payload.createdBy = S.uid;
        const ref = doc(collection(db, "clusters"));
        await setDoc(ref, { ...payload, clusterId: ref.id });
      }
    }
  });
}
async function confirmDeleteCluster(clusterId) {
  if (!isSuper()) { toast("Only super admins", "error"); return; }
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  if ((officesByCluster[clusterId] || []).length) { toast("Remove offices first.", "error"); return; }
  if ((adminsByCluster[clusterId] || []).length) { toast("Remove admins first.", "error"); return; }
  if (!confirm(`Delete cluster "${c.name}" (${c.code})?`)) return;
  try { await deleteDoc(doc(db, "clusters", clusterId)); toast("Cluster deleted", "success"); }
  catch (err) { toast(err.code + ": " + err.message, "error"); }
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function rebuildIndexes() {
  Object.keys(clustersByRegion).forEach(k => delete clustersByRegion[k]);
  Object.keys(officesByCluster).forEach(k => delete officesByCluster[k]);
  Object.keys(officesByWoreda).forEach(k => delete officesByWoreda[k]);
  Object.keys(employeesByOffice).forEach(k => delete employeesByOffice[k]);
  Object.keys(employeesByCluster).forEach(k => delete employeesByCluster[k]);
  Object.keys(adminsByCluster).forEach(k => delete adminsByCluster[k]);

  clusters.forEach(c => {
    if (!clustersByRegion[c.regionCode]) clustersByRegion[c.regionCode] = [];
    clustersByRegion[c.regionCode].push(c);
  });
  offices.forEach(o => {
    if (!officesByCluster[o.clusterId]) officesByCluster[o.clusterId] = [];
    officesByCluster[o.clusterId].push(o);
    if (o.woredaCode) {
      const key = `${o.clusterId}:${o.woredaCode}`;
      if (!officesByWoreda[key]) officesByWoreda[key] = [];
      officesByWoreda[key].push(o);
    }
  });
  employees.forEach(e => {
    if (e.officeId) {
      if (!employeesByOffice[e.officeId]) employeesByOffice[e.officeId] = [];
      employeesByOffice[e.officeId].push(e);
    }
    if (e.clusterId) {
      if (!employeesByCluster[e.clusterId]) employeesByCluster[e.clusterId] = [];
      employeesByCluster[e.clusterId].push(e);
    }
  });
  users.forEach(u => {
    if (u.role === "admin" && u.clusterId) {
      if (!adminsByCluster[u.clusterId]) adminsByCluster[u.clusterId] = [];
      adminsByCluster[u.clusterId].push(u);
    }
  });
}
function subscribeRegions() {

  unsubRegions = onSnapshot(collection(db, "regions"), (snap)=>{
    customRegions = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, (err)=>console.warn("[regions]", err.code));
}

    rebuildIndexes(); render();

}

  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach(btn => {
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user)=>{
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
  } catch(e) {}
  if (userDoc && userDoc.active === false) { kick("inactive"); return; }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    photoURL: userDoc?.photoURL || null,
    officeId: userDoc?.officeId || "",
    clusterId: userDoc?.clusterId || ""
  };

  if (!["super_admin","admin","hrm"].includes(S.role)) {
    window.location.replace("dashboard.html");
    return;
  }

  await loadUserSettings(user.uid);

  renderSidebar();
  renderUser();
  render();

  subscribeRegions();
  subscribeClusters();
  subscribeOffices();
  subscribeDepartments();
  subscribeEmployees();
  subscribeUsers();

  console.log("[offices] booted with settings:", {
    theme: STATE.theme, lang: STATE.lang, compact: STATE.compact
  });
});
