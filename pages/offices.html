<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offices &amp; Clusters — Civil Service MIS</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function headGuard() {
  try {
    if (sessionStorage.getItem("loggedIn") !== "true" || !sessionStorage.getItem("uid")) {
      sessionStorage.clear();
      sessionStorage.setItem("__redirectReason", "expired");
      window.location.replace("../index.html");
    }
  } catch (e) { window.location.replace("../index.html"); }
})();
(function preTheme() {
  try {
    const t = localStorage.getItem("cs.theme") || "light";
    if (t === "dark") document.documentElement.classList.add("theme-dark");
    else if (t === "auto" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.classList.add("theme-dark");
    }
    if (localStorage.getItem("cs.compact") === "true") document.documentElement.classList.add("compact-mode");
    const lang = localStorage.getItem("cs.language") || "en";
    document.documentElement.setAttribute("data-lang", lang);
    if (lang === "am") document.documentElement.setAttribute("data-ethiopic", "true");
  } catch (e) {}
})();
</script>
<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#0b5cab; --primary-dark:#073d75; --secondary:#0e7490;
  --text:#172033; --text-soft:#344054; --muted:#6b7280; --muted-light:#98a2b3;
  --border:#e5e7eb; --border-soft:#eef1f5;
  --danger:#dc2626; --success:#067647; --warning:#b8860b; --bg:#f4f7fb; --bg-soft:#fbfcfe;
  --card-bg:#ffffff;
  --violet:#5b21b6; --violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px; --r-lg:20px; --r-full:999px;
  --sidebar-w:272px; --topbar-h:76px; --pad-main:32px;
}
html.theme-dark, body.theme-dark {
  --text:#e4e8f0; --text-soft:#c5cdd9; --muted:#94a3b8; --muted-light:#64748b;
  --border:#1e293b; --border-soft:#1a2433; --bg:#0b1220; --bg-soft:#111a2c;
  --card-bg:#0f172a; color-scheme: dark;
}
html.theme-dark .main, body.theme-dark .main { background:#0b1220; }
html.theme-dark .sidebar, body.theme-dark .sidebar { background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c); }
html.theme-dark .topbar, body.theme-dark .topbar { background:rgba(15,23,42,.85); border-bottom-color:#1e293b; }
html.theme-dark .card, body.theme-dark .card,
html.theme-dark .region-card, body.theme-dark .region-card,
html.theme-dark .cluster-block, body.theme-dark .cluster-block,
html.theme-dark .stat, body.theme-dark .stat { background:#0f172a; border-color:#1e293b; }
html.theme-dark .cluster-block { background:#111a2c; }
html.theme-dark .cluster-block:hover { background:#0f172a; }
html.theme-dark .region-card__head { background:#0b1220; border-bottom-color:#1e293b; }
html.theme-dark .modal { background:#0f172a; }
html.theme-dark .modal__head { border-bottom-color:#1e293b; }
html.theme-dark .modal__foot { border-top-color:#1e293b; background:#111a2c; }
html.theme-dark .field input, html.theme-dark .field select, html.theme-dark .field textarea { background:#111a2c; border-color:#1e293b; color:#e4e8f0; }
html.theme-dark .steps { background:#111a2c; border-bottom-color:#1e293b; }
html.theme-dark .step__num { background:#1a2433; color:#64748b; }
html.theme-dark .step__line { background:#1e293b; }
html.theme-dark .review { background:#111a2c; border-color:#1e293b; }
html.theme-dark .review__row { border-bottom-color:#1a2433; }
html.theme-dark .wm-list { border-color:#1e293b; }
html.theme-dark .wm-item, html.theme-dark .admin-item, html.theme-dark .office-item { border-bottom-color:#1a2433; }
html.theme-dark .user-pick-item, html.theme-dark .emp-pick-item { border-bottom-color:#1a2433; }
html.theme-dark .user-pick-item:hover, html.theme-dark .emp-pick-item:hover { background:#1a2433; }
html.theme-dark .user-pick-item.is-on, html.theme-dark .emp-pick-item.is-on { background:#1e3a5f; }
html.theme-dark .dropdown__panel { background:#0f172a; border-color:#1e293b; }
html.theme-dark .dropdown__item:hover { background:#1a2433; }
html.theme-dark .btn { background:#1a2433; border-color:#1e293b; color:#c5cdd9; }
html.theme-dark .btn:hover { background:#1e293b; }
html.theme-dark .btn--primary { background:linear-gradient(135deg,#0b5cab,#0e7490); color:#fff; border:none; }
html.theme-dark .scope-badge { background:linear-gradient(135deg,#1a2433,#0f172a); border-color:#1e293b; color:#c5cdd9; }
html.theme-dark .scope-badge--super { background:linear-gradient(135deg,#2a1e4a,#0f172a); border-color:#3d2a5f; color:#c4b5fd; }
html.theme-dark .scope-badge--cluster { background:linear-gradient(135deg,#1a3a2a,#0f172a); border-color:#2a5f3d; color:#6ee7b7; }
html.theme-dark .photo-upload { background:#111a2c; border-color:#1e293b; }
html.theme-dark .photo-upload__circle { border-color:#0f172a; }
html.theme-dark .empty { background:#0f172a; }
html.theme-dark .wm-item__code { background:#1a2433; color:#c5cdd9; }

html.compact-mode { --pad-main:18px; --topbar-h:60px; }
html.compact-mode .region-card__head { padding:14px 18px; }
html.compact-mode .cluster-block { padding:10px 12px; margin:6px 4px; }
html.compact-mode .stat { padding:16px; }
html[data-ethiopic="true"] body { font-family:"Noto Sans Ethiopic","Inter",sans-serif; }

html, body { height:100%; }
body {
  font-family:"Inter","Noto Sans Ethiopic",sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),
             var(--bg);
  color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img, svg { display:block; max-width:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { line-height:1.25; letter-spacing:-0.02em; font-weight:800; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }

.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main"; min-height:100vh; }
body.sidebar-collapsed .app { grid-template-columns:88px 1fr; }
.sidebar { grid-area:sidebar; position:sticky; top:0; height:100vh; width:var(--sidebar-w);
  background:linear-gradient(145deg, #073d75 0%, #0b5cab 55%, #0e7490 100%);
  color:#fff; display:flex; flex-direction:column; overflow:hidden; z-index:30; }
body.sidebar-collapsed .sidebar { width:88px; }
.sidebar__brand { position:relative; z-index:2; display:flex; align-items:center; gap:14px;
  padding:22px; border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h); flex-shrink:0; }
.sidebar__logo { width:46px; height:46px; flex-shrink:0; border-radius:14px;
  background:rgba(255,255,255,.97); display:grid; place-items:center; padding:5px; }
.sidebar__logo img { width:100%; height:100%; object-fit:contain; border-radius:9px; }
.sidebar__identity { min-width:0; flex:1; opacity:1; white-space:nowrap; overflow:hidden; }
body.sidebar-collapsed .sidebar__identity { opacity:0; pointer-events:none; }
.sidebar__title { font-size:16px; font-weight:800; }
.sidebar__subtitle { font-size:11px; opacity:.72; margin-top:3px; }
.sidebar__collapse { position:absolute; right:-13px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; background:#fff; color:var(--primary-dark);
  border:3px solid var(--bg); display:grid; place-items:center; cursor:pointer; z-index:10; }
.sidebar__collapse svg { width:13px; height:13px; stroke:currentColor; stroke-width:2.5; fill:none; transition:transform .25s; }
body.sidebar-collapsed .sidebar__collapse svg { transform:rotate(180deg); }
.sidebar__nav { position:relative; z-index:2; flex:1; padding:20px 14px; overflow-y:auto; }
.sidebar__section { font-size:10.5px; font-weight:800; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.45);
  padding:18px 12px 8px; white-space:nowrap; }
body.sidebar-collapsed .sidebar__section { height:6px; padding:0; opacity:0; margin-top:14px; margin-bottom:6px; }
.nav-item { display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:12px;
  font-size:14px; font-weight:600; color:rgba(255,255,255,.78);
  margin-bottom:3px; transition:.15s; white-space:nowrap; cursor:pointer; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.09); color:#fff; }
.nav-item.is-active { background:rgba(255,255,255,.16); color:#fff; }
.nav-item.is-active::before { content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:24px; border-radius:0 4px 4px 0; background:#58e6a7; }
.nav-item svg { width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:1.85; fill:none; }
.nav-item__label { flex:1; overflow:hidden; }
body.sidebar-collapsed .nav-item { justify-content:center; padding:12px; }
body.sidebar-collapsed .nav-item__label { display:none; }
.sidebar__footer { position:relative; z-index:2; padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.10);
  font-size:11px; color:rgba(255,255,255,.55); text-align:center; }

.topbar { grid-area:topbar; background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 28px;
  position:sticky; top:0; z-index:20; }
.topbar__menu { display:none; width:42px; height:42px; border-radius:12px; color:var(--text);
  align-items:center; justify-content:center; cursor:pointer; }
.topbar__spacer { flex:1; }
.user-btn { display:flex; align-items:center; gap:11px;
  padding:4px 14px 4px 4px; border-radius:var(--r-full);
  background:var(--border-soft); cursor:pointer; transition:background .15s; }
.user-btn__avatar { width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; font-weight:800; font-size:13px;
  display:grid; place-items:center; overflow:hidden; position:relative; }
.user-btn__avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.user-btn__name { font-size:13px; font-weight:700; display:block; }
.user-btn__role { font-size:11px; color:var(--muted); font-weight:600; }
.dropdown { position:relative; }
.dropdown__panel { position:absolute; right:0; top:calc(100% + 12px);
  background:var(--card-bg); border:1px solid var(--border); border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12); min-width:260px; padding:8px; z-index:50; }
.dropdown__header { padding:12px 14px; border-bottom:1px solid var(--border-soft); margin-bottom:6px; }
.dropdown__header strong { display:block; font-size:14px; font-weight:700; }
.dropdown__header span { font-size:12px; color:var(--muted); }
.dropdown__item { display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 14px; border-radius:10px; font-size:14px; font-weight:500;
  color:var(--text-soft); text-align:left; cursor:pointer; }
.dropdown__item:hover { background:var(--border-soft); color:var(--text); }
.dropdown__item svg { width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none; }
.dropdown__divider { height:1px; background:var(--border-soft); margin:6px 0; }
.dropdown__item--danger { color:var(--danger); }

.main { grid-area:main; padding:var(--pad-main); overflow-x:hidden; }
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
.page-head__title { font-size:32px; font-weight:800; letter-spacing:-1.2px; margin-bottom:6px; }
.page-head__sub { font-size:15px; color:var(--muted); }
.page-head__actions { display:flex; gap:10px; flex-wrap:wrap; }
.scope-badge { display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:linear-gradient(135deg, #eaf3fc, #fff);
  border:1px solid #bdd7f2; color:var(--primary-dark);
  font-size:12.5px; font-weight:700; margin-top:8px; }
.scope-badge svg { width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none; }
.scope-badge--super { background:linear-gradient(135deg,#f0eaff,#fff); border-color:#ddd2fb; color:#5b21b6; }
.scope-badge--cluster { background:linear-gradient(135deg,#ecfdf3,#fff); border-color:#abefc6; color:#067647; }

.chain { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:16px 22px; margin-bottom:24px; box-shadow:var(--sh-sm); font-size:13px; font-weight:700; }
.chain__node { padding:6px 14px; border-radius:999px; background:var(--border-soft); color:var(--text-soft); }
.chain__node.hi { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
.chain__arrow { color:#cbd5e1; font-weight:400; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px;
  height:46px; padding:0 20px; border-radius:13px;
  border:1px solid #d9dee7; background:var(--card-bg);
  color:var(--text-soft); font-size:14px; font-weight:700; cursor:pointer; }
.btn:hover { background:var(--bg-soft); border-color:#b9c7d9; }
.btn svg { width:17px; height:17px; stroke:currentColor; stroke-width:2.2; fill:none; }
.btn--primary { background:linear-gradient(135deg, #0b5cab, #0e7490); border:none; color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22); }
.btn--primary:hover { background:linear-gradient(135deg, #073d75, #0b5cab); }
.btn--danger { color:var(--danger); }
.btn--danger:hover { background:#fef3f2; border-color:#f0a5ab; }
.btn--sm { height:38px; padding:0 14px; font-size:13px; border-radius:10px; }
.btn--sm svg { width:15px; height:15px; }
.btn--xs { height:32px; padding:0 10px; font-size:12px; border-radius:8px; gap:6px; }
.btn--xs svg { width:13px; height:13px; }
.btn--icon { width:38px; padding:0; }
.btn:disabled { opacity:.55; pointer-events:none; }

.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:24px; }
.stat { position:relative; background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:18px; box-shadow:var(--sh-sm); overflow:hidden; }
.stat::before { content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--c1, var(--primary)); }
.stat--blue { --c1:linear-gradient(90deg,#0b5cab,#0e7490); --ic:#eaf3fc; --ifc:#0b5cab; }
.stat--green { --c1:linear-gradient(90deg,#19a974,#34c78e); --ic:#e7f7f0; --ifc:#128a5c; }
.stat--gold { --c1:linear-gradient(90deg,#d4a017,#e8b84b); --ic:#fdf5e0; --ifc:#b8860b; }
.stat--violet { --c1:linear-gradient(90deg,#6d28d9,#a78bfa); --ic:#f0eaff; --ifc:#5b21b6; }
.stat--teal { --c1:linear-gradient(90deg,#0e7490,#4dd4c4); --ic:#e0f5f7; --ifc:#0e7490; }
.stat--pink { --c1:linear-gradient(90deg,#db2777,#f472b6); --ic:#fdeef5; --ifc:#be185d; }
.stat__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
.stat__label { font-size:12.5px; color:var(--muted); font-weight:600; }
.stat__icon { width:40px; height:40px; border-radius:12px; background:var(--ic); color:var(--ifc);
  display:grid; place-items:center; }
.stat__icon svg { width:19px; height:19px; stroke:currentColor; stroke-width:2.2; fill:none; }
.stat__value { font-size:26px; font-weight:800; letter-spacing:-1px; line-height:1; }

.regions-grid { display:flex; flex-direction:column; gap:20px; }
.region-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--sh-sm); }
.region-card--builtin { border-left:4px solid var(--primary); }
.region-card--custom  { border-left:4px solid var(--violet); }
.region-card__head { display:flex; gap:16px; align-items:flex-start; padding:20px 24px;
  background:var(--bg-soft); border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.region-card__crest { width:58px; height:58px; flex-shrink:0; border-radius:16px;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; display:grid; place-items:center;
  font-weight:800; font-size:20px; font-family:ui-monospace,monospace; }
.region-card__crest--custom { background:linear-gradient(135deg, #6d28d9, #8b5cf6); }
.region-card__identity { flex:1; min-width:0; }
.region-card__name { font-size:19px; font-weight:800; margin-bottom:4px; }
.region-card__name-am { font-size:13px; color:var(--muted); margin-bottom:8px;
  font-family:'Noto Sans Ethiopic',sans-serif; }
.region-card__meta { display:flex; gap:6px; flex-wrap:wrap; }
.region-card__actions { display:flex; gap:8px; flex-wrap:wrap; }
.region-card__body { padding:8px 12px 14px; }

.cluster-block { border-radius:14px; border:1px solid var(--border-soft); background:var(--bg-soft);
  padding:14px 16px; margin:10px 6px; transition:.15s; }
.cluster-block:hover { border-color:#c9d8ec; background:var(--card-bg); }
.cluster-block__top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.cluster-block__id { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.cluster-block__code { font-family:ui-monospace,monospace; font-weight:800; font-size:13px;
  background:var(--violet-soft); color:var(--violet); padding:6px 10px; border-radius:9px;
  letter-spacing:1.5px; flex-shrink:0; }
.cluster-block__name { font-weight:700; font-size:14.5px; }
.cluster-block__meta { font-size:12px; color:var(--muted); margin-top:2px; }
.cluster-block__actions { display:flex; gap:6px; flex-wrap:wrap; }

.woreda-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.woreda-pill { display:inline-flex; align-items:center; gap:6px;
  padding:4px 11px; border-radius:999px;
  background:var(--violet-soft); border:1px solid #ddd2fb;
  font-size:11.5px; color:var(--violet); font-weight:700; }
.woreda-pill__code { font-family:ui-monospace,monospace; opacity:.75; font-size:10.5px; }
.woreda-pill__x { border:0; background:rgba(109,40,217,.14); color:var(--violet);
  width:15px; height:15px; border-radius:50%; display:grid; place-items:center;
  font-size:10px; line-height:1; padding:0; cursor:pointer; }
.woreda-pill__x:hover { background:var(--danger); color:#fff; }
.no-woredas { font-size:12.5px; color:var(--muted-light); font-style:italic; }

.tag { display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--r-full);
  font-size:11px; font-weight:800; text-transform:uppercase; }
.tag--region { background:var(--violet-soft); color:var(--violet); }
.tag--custom { background:#fdf5e0; color:#b8860b; }
.tag--gray { background:var(--border-soft); color:var(--text-soft); }
.tag--green { background:#ecfdf3; color:#067647; }
.tag--red { background:#fef3f2; color:#b42318; }
.tag--gold { background:#fdf5e0; color:#b8860b; }
.tag--blue { background:#eaf3fc; color:#0b5cab; }

.empty { padding:70px 40px; text-align:center; background:var(--card-bg);
  border:2px dashed var(--border); border-radius:var(--r-lg); }
.empty svg { width:60px; height:60px; margin:0 auto 18px; stroke:#cbd5e1; stroke-width:1.2; fill:none; }
.empty h3 { font-size:20px; font-weight:800; margin-bottom:8px; }
.empty p { font-size:14.5px; color:var(--muted); margin-bottom:22px; }

.modal-backdrop { position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.55);
  backdrop-filter:blur(6px); display:grid; place-items:center; padding:24px; overflow-y:auto; }
.modal { background:var(--card-bg); border-radius:var(--r-lg); box-shadow:0 30px 60px rgba(20,40,70,.12);
  width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; margin:auto; }
.modal--lg { max-width:880px; }
.modal__head { padding:24px 28px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.modal__title { font-size:20px; font-weight:800; }

function applyTheme(theme) {
  STATE.theme = theme;
  document.documentElement.classList.remove("theme-dark");
  document.body.classList.remove("theme-dark");
  let dark = false;
  if (theme === "dark") dark = true;
  else if (theme === "auto") dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) {
    document.documentElement.classList.add("theme-dark");

}

}

  try {

const escapeHtml = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = (n) => (n || "?").split(/\s+/).slice(0,2).map(s => s[0]).join("").toUpperCase();
const hasAccess = (item, role) => item.roles.includes("*") || item.roles.includes(role);
const twoDigits = (v, fb="00") => {
  if (v == null) return fb;
  const s = String(v).replace(/\D/g,"");
  if (!s) return fb;
  return s.length >= 2 ? s.slice(0,2) : s.padStart(2,"0");
};
const normalizeWoredas = (list) => (list || []).map(w =>
  typeof w === "string" ? { code:"", name:w } : { code:w.code||"", name:w.name||"" });
const normalizeNationalId = (v) => String(v||"").trim().toUpperCase().replace(/[\s-]/g,"");
const normalizePhone = (v) => {
  let s = String(v||"").replace(/\D/g,"");
  if (s.startsWith("251")) s = s.slice(3);
  if (s.startsWith("0"))   s = s.slice(1);
  return s;
};
const fullName = (e) => e.fullName || [e.firstName, e.lastName].filter(Boolean).join(" ") || e.nameEn || e.email || "Employee";
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const buildEmpId = (r,c,w,o,seq) =>
  `${twoDigits(r)}-${twoDigits(c)}${twoDigits(w)}${twoDigits(o)}${String(seq).padStart(4,"0")}`;

async function generateEmployeeId({ regionCode, clusterCode, woredaCode, officeCode }) {
  const RR = twoDigits(regionCode), CC = twoDigits(clusterCode);
  const WW = twoDigits(woredaCode), OO = twoDigits(officeCode);
  const key = `${RR}-${CC}${WW}${OO}`;
  const ref = doc(db, "counters", "employeeIds");
  const next = await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const data = snap.exists() ? snap.data() : {};
    const cur = Number(data[key] || 0);
    const v = cur + 1;
    tx.set(ref, { [key]: v }, { merge: true });
    return v;
  });
  return { empId: buildEmpId(RR,CC,WW,OO,next), seq: next };
}

async function findEmployeeByNationalId(natId) {
  const norm = normalizeNationalId(natId);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(
      collection(db, "employees"),
      where("nationalIdNorm", "==", norm),
      limit(1)
    ));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function findEmployeeByPhone(phone) {
  const norm = normalizePhone(phone);
  if (!norm) return null;
  try {
    const snap = await getDocs(query(
      collection(db, "employees"),
      where("phoneNorm", "==", norm),
      limit(1)
    ));
    if (snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  } catch (e) { return null; }
}
async function reserveUnique(type, value, norm, empId, name) {
  const ref = doc(db, "uniqueness", `${type}_${norm}`);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    if (snap.exists()) {
      const d = snap.data();
      throw Object.assign(new Error(
        `This ${type === "nationalId" ? "National ID" : "phone number"} is already registered` +
        (d.empId ? ` (employee ${d.empId})` : "")
      ), { code:"duplicate" });
    }
    tx.set(ref, { type, value, norm, empId, name: name||null, createdAt: serverTimestamp() });
  });
}
async function releaseUnique(type, norm) {
  try { await deleteDoc(doc(db, "uniqueness", `${type}_${norm}`)); } catch(e) {}
}

/* ============================================================
   PASSWORD STRENGTH
   ============================================================ */
function evaluatePassword(pw) {
  const checks = {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
    symbol: /[^A-Za-z0-9]/.test(pw)
  };
  const passed = Object.values(checks).filter(Boolean).length;
  let score = 0;
  if (pw.length === 0) score = 0;
  else if (passed <= 2) score = 1;
  else if (passed === 3) score = 2;
  else if (passed === 4) score = 3;
  else score = 4;
  const labels = ["Enter a password","Weak","Fair","Good","Strong"];
  const classes = ["","weak","fair","good","strong"];
  return { checks, passed, score, label: labels[score], klass: classes[score] };
}

    || { code: regionCode, en: regionCode, am:"", builtin:false };

  const officeCount = regionClusters.reduce((n,c)=> n + (officesByCluster[c.id]?.length||0), 0);

  const crestCls = r.builtin ? "" : "region-card__crest--custom";
  return `

      <div class="region-card__head">

        <div class="region-card__identity">

        <div class="region-card__actions">

            <button class="btn btn--sm btn--primary"

              <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Add Cluster
            </button>` : ""}
          ${isSuper() && !r.builtin ? `
            <button class="btn btn--sm btn--danger"

      <div class="region-card__body">
        ${regionClusters.length
          ? regionClusters.map(renderClusterBlock).join("")
          : `<div class="wm-empty" style="border:0;padding:24px">
               ${canCreateCluster()
                 ? `No clusters in this region yet — click <strong>Add Cluster</strong> to create one.`
                 : `No clusters in this region yet.`}
             </div>`}
      </div>
    </article>`;
}
function renderClusterBlock(c) {

/* ============================================================
   MODAL FRAMEWORK
   ============================================================ */
let escHandler = null;
function openModal(html, { size="" } = {}) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal ${size?"modal--"+size:""}" role="dialog">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener("click", (e)=>{ if (e.target === bd) closeModal(); });
  bd.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  escHandler = (e)=>{ if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

/* ============================================================
   WIZARD
   ============================================================ */
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size="lg" }) {
  const data = { ...initial };
  let idx = 0, busy = false;
  const root = document.createElement("div");
  root.className = "modal-backdrop";
  root.id = "modal-backdrop";
  document.body.appendChild(root);
  escHandler = (e)=>{ if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  root.addEventListener("click", (e)=>{ if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll("[data-field]").forEach(el => {
      const k = el.dataset.field;
      if (el.type === "checkbox") data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector("#wizErr");
    if (!el) return;
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.textContent = msg; el.style.display = "flex";
  }

  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${escapeHtml(title)}</div>
            ${subtitle ? `<div class="modal__sub">${escapeHtml(subtitle)}</div>` : ""}
          </div>
          <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
        </div>
        <div class="steps">
          ${steps.map((s,i)=>`
            <div class="step ${i<idx?"is-done":""} ${i===idx?"is-active":""}">
              <span class="step__num">${i<idx?"✓":i+1}</span>
              <span class="step__label">${escapeHtml(s.label)}</span>
            </div>
            ${i < steps.length-1 ? `<div class="step__line"></div>` : ""}
          `).join("")}
        </div>
        <div class="modal__body">
          <div class="step-header">
            <span class="step-header__badge">${idx+1}</span>
            ${escapeHtml(step.title || step.label)}
          </div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-close>Cancel</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx===0?"disabled":""}>← Back</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
            <span class="btn-label">${idx===steps.length-1?escapeHtml(finishLabel||"Save"):"Next →"}</span>
          </button>
        </div>
      </div>`;
    root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    root.querySelectorAll("[data-field]").forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === "checkbox") el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener("click", ()=>{
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener("click", async ()=>{
      const step = steps[idx];
      collect();
      const err = step.validate ? await step.validate(data) : null;
      if (err) { showErr(err); return; }
      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector(".spinner");
        const lbl = btn.querySelector(".btn-label");
        btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Saving…";
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || "Saved successfully", "success");
        } catch (e) {
          console.error(e);
          busy = false;
          btn.disabled = false; sp.classList.add("hidden");
          lbl.textContent = finishLabel || "Save";
          showErr(e?.message || "Something went wrong.");
        }
      } else { idx++; draw(); }
    });
    if (typeof step.after === "function") step.after(root, data, ()=>{ collect(); draw(); });
  }
  draw();
}

/* ============================================================
   LIVE DUPLICATE CHECK
   ============================================================ */
function setupLiveDuplicate(root, inputId, type, label, onStatusChange) {
  const input = root.querySelector("#" + inputId);
  if (!input) return;
  const wrap = input.closest(".field");
  if (!wrap) return;
  input.classList.add("has-check");
  let icon = wrap.querySelector(".dup-check");
  if (!icon) { icon = document.createElement("span"); icon.className = "dup-check"; wrap.appendChild(icon); }
  let err = wrap.querySelector(".field__error");
  if (!err) { err = document.createElement("div"); err.className = "field__error"; wrap.appendChild(err); }
  let timer = null;
  const run = async () => {
    const raw = input.value.trim();
    if (!raw) {
      icon.textContent=""; err.classList.remove("show"); input.removeAttribute("aria-invalid");
      onStatusChange(type, { ok:true, empty:true }); return;
    }
    if (type === "nationalId" && raw.length < 5) {
      icon.textContent=""; err.classList.remove("show");
      onStatusChange(type, { ok:false, empty:false, reason:"too-short" }); return;
    }
    if (type === "phone" && normalizePhone(raw).length < 9) {
      icon.textContent=""; err.classList.remove("show");
      onStatusChange(type, { ok:false, empty:false, reason:"too-short" }); return;
    }
    icon.textContent="…"; icon.style.color = "var(--muted-light)";
    const existing = type === "nationalId"
      ? await findEmployeeByNationalId(raw)
      : await findEmployeeByPhone(raw);
    if (existing) {
      input.setAttribute("aria-invalid","true");
      err.classList.add("show");
      err.innerHTML = `⚠ This ${label} is already registered to <strong>${escapeHtml(existing.nameEn||existing.firstName||"another employee")}</strong>` +
        (existing.empId ? ` (${escapeHtml(existing.empId)})` : "") + `.`;
      icon.textContent="✗"; icon.style.color = "var(--danger)";
      onStatusChange(type, { ok:false, empty:false, reason:"duplicate", existing });
    } else {
      input.removeAttribute("aria-invalid"); err.classList.remove("show");
      icon.textContent="✓"; icon.style.color = "var(--success)";
      onStatusChange(type, { ok:true, empty:false });
    }
  };
  input.addEventListener("blur", run);
  input.addEventListener("input", ()=>{ clearTimeout(timer); timer = setTimeout(run, 400); });
}

    countEl.textContent = `${list.length} total`;
    if (!list.length) { listEl.innerHTML = `<div class="wm-empty">No offices in this woreda yet.</div>`; return; }

    listEl.innerHTML = list.map(o => {
      const emps = employeesByOffice[o.id] || [];
      const avatars = emps.slice(0, 4).map(e => e.photoURL
        ? `<span class="admin-avatar" style="width:30px;height:30px;font-size:11px;border:2px solid var(--card-bg);margin-left:-8px"><img src="${escapeHtml(e.photoURL)}" alt=""></span>`
        : `<span class="admin-avatar" style="width:30px;height:30px;font-size:10px;border:2px solid var(--card-bg);margin-left:-8px">${escapeHtml(initials(fullName(e)))}</span>`
      ).join("");
      const rest = emps.length > 4 ? `<span style="font-size:11px;color:var(--muted);margin-left:6px">+${emps.length-4}</span>` : "";

      return `
        <div class="office-item" style="flex-wrap:wrap">
          <span class="office-item__code">${escapeHtml(o.code || "??")}</span>
          <div style="flex:1;min-width:0">
            <div class="office-item__name">${escapeHtml(o.name || "—")}</div>

          </div>
          <div style="display:flex;align-items:center;${emps.length?'margin-right:8px':''}">
            ${avatars}
            ${rest}

          <div style="display:flex;gap:6px;flex-wrap:wrap">

              <button class="btn btn--sm btn--xs btn--primary" data-add-emp="${o.id}">
                <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg> Add Person
              </button>` : ""}
            ${canAddPeopleTo(o) ? `
              <button class="btn btn--sm btn--xs" data-view-emps="${o.id}">
                <svg viewBox="0 0 24 24">${ICONS.users}</svg> Members${emps.length ? ` (${emps.length})` : ""}

    listEl.querySelectorAll("[data-edit]").forEach(b =>
      b.addEventListener("click", ()=>openOfficeForm(c.id, selectedWoreda, b.dataset.edit)));
    listEl.querySelectorAll("[data-del]").forEach(b =>
      b.addEventListener("click", ()=>deleteOfficeConfirm(b.dataset.del)));

  woredaSel.addEventListener("change", ()=>{ selectedWoreda = woredaSel.value; drawList(); });
  document.getElementById("of-add")?.addEventListener("click", ()=>openOfficeForm(c.id, selectedWoreda, null));

/* ============================================================
   OFFICE FORM
   ============================================================ */
function openOfficeForm(clusterId, woredaCode, officeId=null) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  const w = normalizeWoredas(c.woredas).find(x => x.code === woredaCode);
  if (!w) { toast("Woreda not found.", "error"); return; }
  const editing = !!officeId;
  const o = editing ? offices.find(x => x.id === officeId) : {};
  const allowed = isSuper() || (isClusterAdmin() && c.id === myClusterId());
  if (!allowed) { toast("Not allowed", "error"); return; }

  openWizard({
    title: editing ? "Edit Office" : "Add Office",
    subtitle: `${escapeHtml(c.name)} → ${escapeHtml(w.name)} (${escapeHtml(w.code)})`,
    finishLabel: editing ? "Save Changes" : "Create Office",
    successMessage: editing ? "Office updated" : "Office created",
    initial: { name: o.name||"", code: o.code||"" },
    steps: [{
      label: "Details",
      title: "Office details",
      render: (d) => `
        <div class="field">
          <label class="field__required">Office name</label>
          <input data-field="name" value="${escapeHtml(d.name||"")}" placeholder="e.g. Fitche City Office">
        </div>
        <div class="field">
          <label class="field__required">Office code (2 digits)</label>
          <input data-field="code" maxlength="2" value="${escapeHtml(d.code||"")}"
                 placeholder="08" inputmode="numeric"
                 style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
          <p class="field__hint">Unique inside woreda ${escapeHtml(w.code)}.</p>
        </div>
        <div class="review" style="margin-top:16px">
          <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(c.regionCode))}</span></div>
          <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(c.name)} (${escapeHtml(c.code||"??")})</span></div>
          <div class="review__row"><span class="review__k">Woreda</span><span class="review__v">${escapeHtml(w.name)} (${escapeHtml(w.code)})</span></div>
          <div class="review__row"><span class="review__k">ID segment</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(c.regionCode||"??")}-${escapeHtml(c.code||"??")}${escapeHtml(w.code)}<b style="color:#d4a017">${escapeHtml(d.code||"??")}</b>····</span></div>
        </div>`,
      validate: d => {
        if (!d.name || d.name.trim().length < 2) return "Office name must be at least 2 characters.";
        if (!/^\d{2}$/.test(d.code || "")) return "Office code must be exactly 2 digits.";
        const dup = offices.some(x => x.clusterId === c.id && x.woredaCode === w.code && x.code === d.code && x.id !== officeId);
        if (dup) return `Office code ${d.code} already exists in woreda ${w.code}.`;
        return null;
      }
    }],
    onFinish: async (d) => {
      const payload = {
        name: d.name.trim(), code: d.code,
        clusterId: c.id, clusterCode: c.code, clusterName: c.name,
        regionCode: c.regionCode, regionName: regionName(c.regionCode),
        woredaCode: w.code, woredaName: w.name,
        updatedAt: serverTimestamp()
      };
      if (editing) await updateDoc(doc(db, "offices", officeId), payload);
      else {
        payload.createdAt = serverTimestamp();
        payload.createdBy = S.uid;
        const ref = doc(collection(db, "offices"));
        await setDoc(ref, { ...payload, officeId: ref.id });
      }
    }
  });
}

async function deleteOfficeConfirm(officeId) {
  if (!isSuper()) { toast("Only super admins can delete offices", "error"); return; }
  const o = offices.find(x => x.id === officeId);
  if (!o) return;
  const empCount = (employeesByOffice[officeId] || []).length;
  if (empCount) { toast(`Cannot delete — ${empCount} employee(s) still belong to this office.`, "error"); return; }
  if (!confirm(`Delete office "${o.name}" (${o.code})?`)) return;
  try {
    await deleteDoc(doc(db, "offices", officeId));
    toast("Office deleted", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

          const st = duplicateStatus.phone;

      /* 3. POSITION */

              <div class="review__row"><span class="review__k">Woreda</span><span class="review__v">${escapeHtml(office.woredaName||"—")} (${escapeHtml(office.woredaCode||"??")})</span></div>

            </div>`;
        },

          if (!d2.position || d2.position.trim().length < 2) return "Position is required.";
          if (!d2.hireDate) return "Hire date is required.";

      },

      /* 4. LOGIN */
      {
        label: "Login",
        title: "Login credentials",
        render: (d2) => `
          <div class="field">
            <label class="field__required">Login email</label>
            <input data-field="loginEmail" type="email" value="${escapeHtml(d2.loginEmail || d2.email || "")}"
                   placeholder="name@example.com" autocomplete="off">
            <p class="field__hint">This becomes the username they sign in with.</p>
          </div>
          <div class="field">
            <label class="field__required">Password</label>
            <div class="pw-wrap">
              <input data-field="password" id="pw-new" type="password" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="pw-toggle" data-toggle="pw-new">
                <svg viewBox="0 0 24 24">${ICONS.eye}</svg>
              </button>
            </div>
            <div class="pw-meter" id="pw-meter">
              <div class="pw-meter__bars">
                <div class="pw-meter__bar" data-bar="1"></div>
                <div class="pw-meter__bar" data-bar="2"></div>
                <div class="pw-meter__bar" data-bar="3"></div>
                <div class="pw-meter__bar" data-bar="4"></div>
              </div>
              <div class="pw-meter__text" id="pw-meter-text">Enter a password</div>
            </div>
            <div class="pw-rules" id="pw-rules">
              <div class="pw-rule" data-rule="length"><span class="pw-rule__dot"></span><span>At least 8 characters</span></div>
              <div class="pw-rule" data-rule="upper"><span class="pw-rule__dot"></span><span>One uppercase</span></div>
              <div class="pw-rule" data-rule="lower"><span class="pw-rule__dot"></span><span>One lowercase</span></div>
              <div class="pw-rule" data-rule="number"><span class="pw-rule__dot"></span><span>One number</span></div>
              <div class="pw-rule" data-rule="symbol"><span class="pw-rule__dot"></span><span>One symbol</span></div>
            </div>
          </div>
          <div class="field">
            <label class="field__required">Confirm password</label>
            <input data-field="password2" id="pw-confirm" type="password" placeholder="Repeat">
            <p class="field__hint" id="pw-match-hint"></p>
          </div>
        `,
        validate: (d2) => {
          if (!d2.loginEmail || !/^\S+@\S+\.\S+$/.test(d2.loginEmail)) return "Enter a valid login email.";
          const pw = evaluatePassword(d2.password || "");
          if (pw.score < 3) return "Password is too weak.";
          if (d2.password !== d2.password2) return "Passwords do not match.";
          return null;
        },
        after: (root, data) => {
          const pwIn = root.querySelector("#pw-new");
          const cfm = root.querySelector("#pw-confirm");
          const meter = root.querySelector("#pw-meter");
          const mTxt = root.querySelector("#pw-meter-text");
          function renderMeter() {
            const { checks, score, label, klass } = evaluatePassword(pwIn.value);
            meter.querySelectorAll(".pw-meter__bar").forEach(bar => {
              const idx = Number(bar.dataset.bar);
              bar.className = "pw-meter__bar";
              if (idx <= score) bar.classList.add("is-on-" + klass);
            });
            mTxt.textContent = label;
            mTxt.className = "pw-meter__text " + klass;
            root.querySelectorAll(".pw-rule").forEach(rule => {
              rule.classList.toggle("is-ok", !!checks[rule.dataset.rule]);
            });
          }
          function checkMatch() {
            const hint = root.querySelector("#pw-match-hint");
            if (!cfm.value) { hint.textContent = ""; return; }
            if (pwIn.value === cfm.value) { hint.textContent = "✓ Passwords match"; hint.style.color = "#067647"; }
            else { hint.textContent = "✗ Passwords do not match"; hint.style.color = "#dc2626"; }
          }
          pwIn.addEventListener("input", ()=>{ data.password = pwIn.value; renderMeter(); checkMatch(); });
          cfm.addEventListener("input", ()=>{ data.password2 = cfm.value; checkMatch(); });
          root.querySelectorAll(".pw-toggle").forEach(btn => {
            btn.addEventListener("click", ()=>{
              const input = root.querySelector("#" + btn.dataset.toggle);
              const showing = input.type === "text";
              input.type = showing ? "password" : "text";
              btn.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
            });
          });
        }
      },

      /* 5. REVIEW */
      {
        label: "Review",
        title: "Confirm and create",
        render: (d2) => `
          <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:16px;
                      background:var(--bg-soft);border:1px solid var(--border);border-radius:14px">
            <div class="admin-avatar" style="width:70px;height:70px;font-size:24px">
              ${d2._photo ? `<img src="${d2._photo}" alt="">` : escapeHtml(initials([d2.firstName,d2.lastName].filter(Boolean).join(" ")))}
            </div>
            <div style="min-width:0">
              <div style="font-size:17px;font-weight:800">${escapeHtml([d2.firstName, d2.middleName, d2.lastName].filter(Boolean).join(" "))}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d2.firstNameAm||"")} ${escapeHtml(d2.lastNameAm||"")}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:2px">${escapeHtml(d2.firstNameOm||"")} ${escapeHtml(d2.lastNameOm||"")}</div>
            </div>
          </div>
          <div class="review">
            <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d2.nationalId||"—")}</span></div>
            <div class="review__row"><span class="review__k">Phone</span><span class="review__v">${escapeHtml(d2.phone||"—")}</span></div>
            <div class="review__row"><span class="review__k">Position</span><span class="review__v">${escapeHtml(d2.position||"—")}</span></div>
            <div class="review__row"><span class="review__k">Office</span><span class="review__v">${escapeHtml(office.name)} (${escapeHtml(office.code||"??")})</span></div>
            <div class="review__row"><span class="review__k">Login email</span><span class="review__v">${escapeHtml(d2.loginEmail)}</span></div>
          </div>
          <div class="alert alert--info" style="margin-top:16px">
            <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
            <div>Creates a Firebase Auth login, a <code>users</code> doc with role <strong>employee</strong>, and an <code>employees</code> doc assigned to <strong>${escapeHtml(office.name)}</strong>.</div>
          </div>`
      }
    ],
    onFinish: async (data) => {
      const nameEn = [data.firstName, data.middleName, data.lastName].filter(Boolean).map(s=>s.trim()).join(" ");
      const nameAm = [data.firstNameAm, data.middleNameAm, data.lastNameAm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const nameOm = [data.firstNameOm, data.middleNameOm, data.lastNameOm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const natIdNorm = normalizeNationalId(data.nationalId);
      const phoneNorm = normalizePhone(data.phone);

      const dupNat = await findEmployeeByNationalId(data.nationalId);
      if (dupNat) throw new Error(`National ID is already registered to ${dupNat.nameEn || dupNat.firstName || "another employee"}.`);
      const dupPhone = await findEmployeeByPhone(data.phone);
      if (dupPhone) throw new Error(`Phone is already registered to ${dupPhone.nameEn || dupPhone.firstName || "another employee"}.`);

      const { empId, seq } = await generateEmployeeId({
        regionCode: cluster.regionCode,
        clusterCode: cluster.code,
        woredaCode: office.woredaCode || "00",
        officeCode: office.code
      });

      // 1. Create Auth
      const secName = "empCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, data.loginEmail.trim(), data.password);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: nameEn }); } catch(e) {}
        await signOut(secAuth);
      } finally {
        try { await deleteApp(secApp); } catch(e) {}
      }
      if (!uid) throw new Error("Could not create login account.");

      // 2. Uniqueness locks
      let natLocked = false, phoneLocked = false;
      try {
        await reserveUnique("nationalId", data.nationalId, natIdNorm, empId, nameEn);
        natLocked = true;
        await reserveUnique("phone", data.phone, phoneNorm, empId, nameEn);
        phoneLocked = true;
      } catch (err) {
        if (natLocked)   await releaseUnique("nationalId", natIdNorm);
        if (phoneLocked) await releaseUnique("phone", phoneNorm);
        throw err;
      }

      // 3. Employee record
      const dep = departments.find(x => x.id === data.departmentId);
      const empRef = doc(collection(db, "employees"));
      try {
        await setDoc(empRef, {
          empId, seq,
          firstName: data.firstName.trim(),
          middleName: data.middleName?.trim() || null,
          lastName: data.lastName.trim(),
          firstNameAm: data.firstNameAm.trim(),
          middleNameAm: data.middleNameAm?.trim() || null,
          lastNameAm: data.lastNameAm.trim(),
          firstNameOm: data.firstNameOm.trim(),
          middleNameOm: data.middleNameOm?.trim() || null,
          lastNameOm: data.lastNameOm.trim(),
          nameEn, nameAm, nameOm,
          fullName: nameEn,
          photoURL: data._photo,
          nationalId: data.nationalId.trim(),
          nationalIdNorm: natIdNorm,
          gender: data.gender,
          dob: data.dob,
          phone: data.phone.trim(),
          phoneNorm,
          phoneAlt: data.phoneAlt?.trim() || null,
          email: data.email.trim(),
          loginEmail: data.loginEmail.trim(),
          country: data.country || "ET",
          subCity: data.subCity?.trim() || null,
          kebele: data.kebele?.trim() || null,
          position: data.position.trim(),
          grade: data.grade?.trim() || null,
          hireDate: data.hireDate,
          employmentType: data.employmentType || "permanent",
          status: "active",
          regionCode: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterCode: cluster.code, clusterName: cluster.name,
          woredaCode: office.woredaCode || null, woredaName: office.woredaName || null,
          officeId: office.id, officeCode: office.code, officeName: office.name,
          departmentId: dep?.id || null,
          departmentName: dep?.name || null,
          departmentCode: dep?.code || null,
          uid,
          active: true,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (err) {
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }

      // 4. User record
      try {
        await setDoc(doc(db, "users", uid), {
          uid,
          email: data.loginEmail.trim(),
          name: nameEn,
          photoURL: data._photo,
          role: "employee",
          phone: data.phone.trim(),
          personalEmail: data.email.trim(),
          nationalId: data.nationalId.trim(),
          region: cluster.regionCode, regionName: regionName(cluster.regionCode),
          clusterId: cluster.id, clusterName: cluster.name,
          officeId: office.id, officeName: office.name,
          departmentId: dep?.id || null, departmentName: dep?.name || null,
          employeeId: empRef.id,
          empId,
          active: true,
          createdAt: serverTimestamp(),
          createdBy: S.uid
        });
      } catch (err) {
        try { await deleteDoc(empRef); } catch(e) {}
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw err;
      }
    }
  });
}

function openWoredaModal(clusterId) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!canManageWoredas(c)) { toast("Only this cluster's administrator can manage woredas.", "error"); return; }
  const woredas = normalizeWoredas(c.woredas);

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Woredas / Cities</div>
        <div class="modal__sub">${escapeHtml(c.name)} · code ${escapeHtml(c.code || "??")} · region ${escapeHtml(c.regionCode || "??")}</div>
      </div>
      <button class="modal__close" data-close><svg viewBox="0 0 24 24">${ICONS.x}</svg></button>
    </div>
    <div class="modal__body">
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>Each woreda / city needs a <strong>2-digit code</strong>. It becomes the 3rd and 4th digits of every employee ID created for an office inside it.</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <input id="wm-code" maxlength="2" placeholder="12" inputmode="numeric"
               style="width:90px;height:48px;padding:0 12px;border:2px solid var(--border);border-radius:11px;background:var(--bg-soft);
                      font-family:ui-monospace,monospace;letter-spacing:3px;text-align:center;font-size:18px;font-weight:800;color:var(--primary-dark)">
        <input id="wm-name" placeholder="Woreda / city name"
               style="flex:1;min-width:150px;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg-soft);font-size:14px">
        <button class="btn btn--primary" id="wm-add-btn">
          <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Add
        </button>
      </div>
      <div class="wm-list" id="wm-list"></div>
    </div>
    <div class="modal__foot">
      <div class="spacer"></div>
      <button class="btn" data-close>Done</button>
    </div>
  `, { size:"lg" });

  const listEl = document.getElementById("wm-list");
  const codeEl = document.getElementById("wm-code");
  const nameEl = document.getElementById("wm-name");

  function drawList() {
    if (!woredas.length) { listEl.innerHTML = `<div class="wm-empty">No woredas yet for this cluster.</div>`; return; }
    listEl.innerHTML = woredas.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)))
      .map(w => `
        <div class="wm-item">
          <span class="wm-item__code">${escapeHtml(w.code)}</span>
          <span class="wm-item__name">${escapeHtml(w.name)}</span>
          <button class="btn btn--sm btn--danger" data-wid="${escapeHtml(w.code)}">
            <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
          </button>
        </div>`).join("");
    listEl.querySelectorAll("[data-wid]").forEach(btn => {
      btn.addEventListener("click", ()=>removeLocal(btn.dataset.wid));
    });
  }
  async function persist() {
    await updateDoc(doc(db, "clusters", c.id), { woredas, updatedAt: serverTimestamp(), updatedBy: S.uid });
  }
  async function addLocal() {
    const code = codeEl.value.replace(/\D/g,"").slice(0,2);
    const name = nameEl.value.trim();
    if (!/^\d{2}$/.test(code)) { toast("Woreda code must be exactly 2 digits", "error"); codeEl.focus(); return; }
    if (name.length < 2) { toast("Woreda name is required", "error"); nameEl.focus(); return; }
    if (woredas.some(w=>w.code===code)) { toast(`Woreda code ${code} already exists`, "error"); codeEl.focus(); return; }
    woredas.push({ code, name });
    try {
      await persist();
      toast(`Woreda "${name}" added`, "success");
      codeEl.value=""; nameEl.value=""; codeEl.focus();
      drawList();
    } catch (err) { woredas.pop(); toast(err.code + ": " + err.message, "error"); }
  }
  async function removeLocal(code) {
    const idx = woredas.findIndex(w => w.code === code);
    if (idx < 0) return;
    const inUse = (officesByWoreda[`${c.id}:${code}`] || []).length;
    if (inUse) { toast(`Cannot remove — ${inUse} office(s) still use woreda ${code}.`, "error"); return; }
    if (!confirm(`Remove woreda "${woredas[idx].name}" (${code})?`)) return;
    const removed = woredas.splice(idx, 1)[0];
    try { await persist(); toast("Woreda removed", "success"); drawList(); }
    catch (err) { woredas.splice(idx, 0, removed); toast(err.code + ": " + err.message, "error"); }
  }
  document.getElementById("wm-add-btn").addEventListener("click", addLocal);
  nameEl.addEventListener("keydown", (e)=>{ if (e.key==="Enter") addLocal(); });
  codeEl.addEventListener("keydown", (e)=>{ if (e.key==="Enter") nameEl.focus(); });
  drawList();
}
async function removeWoredaFromCluster(clusterId, code) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c || !canManageWoredas(c)) { toast("Not allowed", "error"); return; }
  const list = normalizeWoredas(c.woredas);
  const idx = list.findIndex(w=>w.code===code);
  if (idx < 0) return;
  const inUse = (officesByWoreda[`${clusterId}:${code}`] || []).length;
  if (inUse) { toast(`Cannot remove — ${inUse} office(s) still use woreda ${code}.`, "error"); return; }
  if (!confirm(`Remove woreda "${list[idx].name}" (${code})?`)) return;
  list.splice(idx, 1);
  try {
    await updateDoc(doc(db, "clusters", clusterId), { woredas: list, updatedAt: serverTimestamp() });
    toast("Woreda removed", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

        `,
        validate: (d2) => {
          if (!d2._photo) return "Please upload a profile photo.";
          if (!d2.firstName || d2.firstName.trim().length < 2) return "First name required.";
          if (!d2.lastName || d2.lastName.trim().length < 2) return "Last name required.";
          if (!d2.firstNameAm || d2.firstNameAm.trim().length < 2) return "Amharic first name required.";
          if (!d2.lastNameAm || d2.lastNameAm.trim().length < 2) return "Amharic last name required.";
          if (!d2.firstNameOm || d2.firstNameOm.trim().length < 2) return "Oromo first name required.";

          if (!d2.gender) return "Gender required.";
          if (!d2.dob) return "Date of birth required.";
          const nid = normalizeNationalId(d2.nationalId||"");
          if (!nid || nid.length < 5) return "National ID required.";
          const st = duplicateStatus.nationalId;
          if (!st.ok) {
            if (st.reason === "duplicate") return "This National ID is already registered.";
            return "Please wait — checking National ID.";
          }
          return null;
        },
        after: (root, data)=>{
          const circle = root.querySelector("#photo-circle");
          const input = root.querySelector("#photo-input");
          const preview = root.querySelector("#photo-preview");
          const ini = root.querySelector("#photo-initials");
          const upd = ()=>{
            const s = [data.firstName, data.lastName].filter(Boolean).join(" ") || "?";
            ini.textContent = initials(s);
          };
          circle.addEventListener("click", ()=>input.click());
          input.addEventListener("change", async ()=>{
            const f = input.files?.[0];
            if (!f) return;
            if (f.size > 3*1024*1024) { toast("Photo must be under 3 MB", "error"); return; }
            try {
              const u = await fileToDataURL(f);
              data._photo = u;
              preview.src = u;
              circle.classList.add("has-img");
            } catch(e) {}
          });
          ["firstName","lastName"].forEach(k=>{
            const el = root.querySelector(`[data-field="${k}"]`);
            el?.addEventListener("input", ()=>{ data[k]=el.value; upd(); });
          });
          upd();
          setupLiveDuplicate(root, "nat-id", "nationalId", "National ID", (t,s)=>{
            duplicateStatus[t]=s;
          });
        }
      },
      {
        label: "Contact",
        title: "Contact details",
        render: (d2) => `
          <div class="field-row">
            <div class="field">
              <label class="field__required">Primary phone</label>
              <input id="phone-primary" data-field="phone" value="${escapeHtml(d2.phone||"")}">
            </div>
            <div class="field">
              <label>Alternate phone</label>
              <input data-field="phoneAlt" value="${escapeHtml(d2.phoneAlt||"")}">
            </div>
          </div>
          <div class="field">
            <label class="field__required">Personal email</label>
            <input data-field="email" type="email" value="${escapeHtml(d2.email||"")}">
          </div>`,
        validate: (d2)=>{
          if (!d2.phone) return "Phone required.";
          if (!/^[0-9+\-\s]{7,20}$/.test(d2.phone)) return "Invalid phone.";
          const st = duplicateStatus.phone;
          if (!st.ok) return "Please wait — checking phone.";
          if (!d2.email || !/^\S+@\S+\.\S+$/.test(d2.email)) return "Valid email required.";
          return null;
        },
        after: (root, data)=>{
          setupLiveDuplicate(root, "phone-primary", "phone", "phone number", (t,s)=>{
            duplicateStatus[t]=s;
          });
        }
      },
      {
        label: "Login",
        title: "Login credentials",
        render: (d2) => `
          <div class="field">
            <label class="field__required">Login email</label>
            <input data-field="loginEmail" type="email" value="${escapeHtml(d2.loginEmail || d2.email || "")}" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__required">Password</label>
            <div class="pw-wrap">
              <input data-field="password" id="pw-new" type="password" autocomplete="new-password">
              <button type="button" class="pw-toggle" data-toggle="pw-new">
                <svg viewBox="0 0 24 24">${ICONS.eye}</svg>
              </button>
            </div>
            <div class="pw-meter" id="pw-meter">
              <div class="pw-meter__bars">
                <div class="pw-meter__bar" data-bar="1"></div>
                <div class="pw-meter__bar" data-bar="2"></div>
                <div class="pw-meter__bar" data-bar="3"></div>
                <div class="pw-meter__bar" data-bar="4"></div>
              </div>
              <div class="pw-meter__text" id="pw-meter-text">Enter a password</div>
            </div>
            <div class="pw-rules" id="pw-rules">
              <div class="pw-rule" data-rule="length"><span class="pw-rule__dot"></span><span>At least 8 characters</span></div>
              <div class="pw-rule" data-rule="upper"><span class="pw-rule__dot"></span><span>One uppercase</span></div>
              <div class="pw-rule" data-rule="lower"><span class="pw-rule__dot"></span><span>One lowercase</span></div>
              <div class="pw-rule" data-rule="number"><span class="pw-rule__dot"></span><span>One number</span></div>
              <div class="pw-rule" data-rule="symbol"><span class="pw-rule__dot"></span><span>One symbol</span></div>
            </div>
          </div>
          <div class="field">
            <label class="field__required">Confirm password</label>
            <input data-field="password2" id="pw-confirm" type="password">
            <p class="field__hint" id="pw-match-hint"></p>
          </div>`,
        validate: (d2)=>{
          if (!d2.loginEmail || !/^\S+@\S+\.\S+$/.test(d2.loginEmail)) return "Valid login email required.";
          if (evaluatePassword(d2.password||"").score < 3) return "Password too weak.";
          if (d2.password !== d2.password2) return "Passwords do not match.";
          return null;
        },
        after: (root, data)=>{
          const pwIn = root.querySelector("#pw-new");
          const cfm = root.querySelector("#pw-confirm");
          const meter = root.querySelector("#pw-meter");
          const mTxt = root.querySelector("#pw-meter-text");
          function renderMeter(){
            const { checks, score, label, klass } = evaluatePassword(pwIn.value);
            meter.querySelectorAll(".pw-meter__bar").forEach(bar => {
              const idx = Number(bar.dataset.bar);
              bar.className = "pw-meter__bar";
              if (idx <= score) bar.classList.add("is-on-" + klass);
            });
            mTxt.textContent = label;
            mTxt.className = "pw-meter__text " + klass;
            root.querySelectorAll(".pw-rule").forEach(rule => {
              rule.classList.toggle("is-ok", !!checks[rule.dataset.rule]);
            });
          }
          function checkMatch(){
            const hint = root.querySelector("#pw-match-hint");
            if (!cfm.value) { hint.textContent = ""; return; }
            if (pwIn.value === cfm.value) { hint.textContent = "✓ Passwords match"; hint.style.color="#067647"; }
            else { hint.textContent = "✗ Passwords do not match"; hint.style.color="#dc2626"; }
          }
          pwIn.addEventListener("input", ()=>{ data.password=pwIn.value; renderMeter(); checkMatch(); });
          cfm.addEventListener("input", ()=>{ data.password2=cfm.value; checkMatch(); });
          root.querySelectorAll(".pw-toggle").forEach(btn=>{
            btn.addEventListener("click", ()=>{
              const input = root.querySelector("#"+btn.dataset.toggle);
              const showing = input.type==="text";
              input.type = showing?"password":"text";
              btn.innerHTML = `<svg viewBox="0 0 24 24">${showing ? ICONS.eye : ICONS.eyeOff}</svg>`;
            });
          });
        }
      },
      {
        label: "Review",
        title: "Confirm and create",
        render: (d2) => `
          <div class="review">
            <div class="review__row"><span class="review__k">Full name</span><span class="review__v">${escapeHtml([d2.firstName, d2.middleName, d2.lastName].filter(Boolean).join(" "))}</span></div>
            <div class="review__row"><span class="review__k">National ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d2.nationalId||"")}</span></div>
            <div class="review__row"><span class="review__k">Phone</span><span class="review__v">${escapeHtml(d2.phone||"")}</span></div>
            <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(c.name)} (${escapeHtml(c.code||"??")})</span></div>
            <div class="review__row"><span class="review__k">Login email</span><span class="review__v">${escapeHtml(d2.loginEmail)}</span></div>
          </div>`
      }
    ],
    onFinish: async (data) => {
      const nameEn = [data.firstName, data.middleName, data.lastName].filter(Boolean).map(s=>s.trim()).join(" ");
      const nameAm = [data.firstNameAm, data.middleNameAm, data.lastNameAm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const nameOm = [data.firstNameOm, data.middleNameOm, data.lastNameOm].filter(Boolean).map(s=>s.trim()).join(" ") || null;
      const natIdNorm = normalizeNationalId(data.nationalId);
      const phoneNorm = normalizePhone(data.phone);

      const dupNat = await findEmployeeByNationalId(data.nationalId);
      if (dupNat) throw new Error(`National ID is already registered.`);
      const dupPhone = await findEmployeeByPhone(data.phone);
      if (dupPhone) throw new Error(`Phone is already registered.`);

      const firstWoreda = normalizeWoredas(c.woredas)[0]?.code || "00";
      const { empId, seq } = await generateEmployeeId({
        regionCode: c.regionCode, clusterCode: c.code,
        woredaCode: firstWoreda, officeCode: "00"
      });

      const secName = "adminCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, data.loginEmail.trim(), data.password);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: nameEn }); } catch(e) {}
        await signOut(secAuth);
      } finally {
        try { await deleteApp(secApp); } catch(e) {}
      }
      if (!uid) throw new Error("Could not create login.");

      let natL=false, phL=false;
      try {
        await reserveUnique("nationalId", data.nationalId, natIdNorm, empId, nameEn); natL=true;
        await reserveUnique("phone", data.phone, phoneNorm, empId, nameEn); phL=true;
      } catch(e){
        if (natL) await releaseUnique("nationalId", natIdNorm);
        if (phL) await releaseUnique("phone", phoneNorm);
        throw e;
      }

      const empRef = doc(collection(db, "employees"));
      try {
        await setDoc(empRef, {
          empId, seq,
          firstName: data.firstName.trim(),
          middleName: data.middleName?.trim() || null,
          lastName: data.lastName.trim(),
          firstNameAm: data.firstNameAm.trim(),
          middleNameAm: data.middleNameAm?.trim() || null,
          lastNameAm: data.lastNameAm.trim(),
          firstNameOm: data.firstNameOm.trim(),
          middleNameOm: data.middleNameOm?.trim() || null,
          lastNameOm: data.lastNameOm.trim(),
          nameEn, nameAm, nameOm, fullName: nameEn,
          photoURL: data._photo,
          nationalId: data.nationalId.trim(), nationalIdNorm: natIdNorm,
          gender: data.gender, dob: data.dob,
          phone: data.phone.trim(), phoneNorm,
          phoneAlt: data.phoneAlt?.trim() || null,
          email: data.email.trim(), loginEmail: data.loginEmail.trim(),
          country: data.country || "ET",
          position: "Cluster Administrator",
          hireDate: new Date().toISOString().slice(0,10),
          employmentType: "permanent", status: "active",
          regionCode: c.regionCode, regionName: regionName(c.regionCode),
          clusterId: c.id, clusterCode: c.code, clusterName: c.name,
          woredaCode: firstWoreda, woredaName: normalizeWoredas(c.woredas)[0]?.name || "",
          officeId: null, officeCode: null, officeName: null,
          departmentId: null, departmentName: null, departmentCode: null,
          uid, active: true,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch(e){
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw e;
      }

      try {
        await setDoc(doc(db, "users", uid), {
          uid,
          email: data.loginEmail.trim(), name: nameEn,
          photoURL: data._photo,
          role: "admin",
          phone: data.phone.trim(), personalEmail: data.email.trim(),
          nationalId: data.nationalId.trim(),
          region: c.regionCode, regionName: regionName(c.regionCode),
          clusterId: c.id, clusterName: c.name,
          employeeId: empRef.id, empId,
          active: true,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      } catch(e){
        try { await deleteDoc(empRef); } catch(_) {}
        await releaseUnique("nationalId", natIdNorm);
        await releaseUnique("phone", phoneNorm);
        throw e;
      }
    }
  });
}

async function confirmRemoveAdmin(uid, clusterId) {
  if (!isSuper()) { toast("Only super admins", "error"); return; }
  const u = users.find(x => x.id === uid);
  if (!u) return;
  const c = clusters.find(x => x.id === clusterId);
  if (!confirm(`Remove "${u.name || u.email}" as admin of "${c?.name}"?\n\nTheir login stays in Firebase Auth but they will lose cluster access.`)) return;
  try {
    await deleteDoc(doc(db, "users", uid));
    toast("Admin removed", "success");
    const modalOpen = document.getElementById("modal-backdrop");
    if (modalOpen) { closeModal(); setTimeout(()=>openClusterAdminsModal(clusterId), 80); }
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}
