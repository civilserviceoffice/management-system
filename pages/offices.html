  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Offices</div>
        <div class="modal__sub">${escapeHtml(c.name)} · ${escapeHtml(regionName(c.regionCode))} · cluster ${escapeHtml(c.code || "??")}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="field">
        <label class="field__required">Woreda / City</label>
        <select id="of-woreda">
          ${woredas.map(w => `
            <option value="${escapeHtml(w.code)}" ${w.code === selectedWoreda ? "selected" : ""}>
              ${escapeHtml(w.code)} — ${escapeHtml(w.name)}
            </option>`).join("")}
        </select>
      </div>

      <div class="alert alert--info" style="margin-top:6px">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          Offices belong to a <strong>woreda</strong>. Each office has a 2-digit code that becomes
          the 5th and 6th digits of employee IDs created for it.
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px">
        <strong style="font-size:13px">Offices in this woreda</strong>
        <span id="of-count" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div class="wm-list" id="of-list" style="max-height:340px"></div>
    </div>

    <div class="modal__foot">
      ${canAdd ? `<button class="btn btn--primary" id="of-add">
        <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Add Office
      </button>` : ""}
      <div class="spacer"></div>
      <button class="btn" data-close>Done</button>
    </div>
  `, { size: "lg" });

  const listEl = document.getElementById("of-list");
  const countEl = document.getElementById("of-count");
  const woredaSel = document.getElementById("of-woreda");

  function drawList() {
    const list = (officesByWoreda[`${c.id}:${selectedWoreda}`] || [])
      .slice().sort((a, b) => String(a.code).localeCompare(String(b.code)));
    countEl.textContent = `${list.length} total`;
    if (!list.length) {
      listEl.innerHTML = `<div class="wm-empty">No offices in this woreda yet.</div>`;
      return;
    }
    listEl.innerHTML = list.map(o => `
      <div class="office-item">
        <span class="office-item__code">${escapeHtml(o.code || "??")}</span>
        <div style="flex:1;min-width:0">
          <div class="office-item__name">${escapeHtml(o.name || "—")}</div>
          <div class="office-item__meta">
            ${(employeesByOffice[o.id] || []).length} employee(s)
          </div>
        </div>
        <div class="office-item__actions">
          ${(isSuper() || (isClusterAdmin() && c.id === myClusterId())) ? `
            <button class="btn btn--sm btn--xs btn--primary" data-emp="${o.id}">
              <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg> Employee
            </button>` : ""}
          ${(isSuper() || (isClusterAdmin() && c.id === myClusterId())) ? `
            <button class="btn btn--sm btn--icon" data-edit="${o.id}" title="Edit">
              <svg viewBox="0 0 24 24">${ICONS.edit}</svg>
            </button>` : ""}
          ${isSuper() ? `
            <button class="btn btn--sm btn--icon btn--danger" data-del="${o.id}" title="Delete">
              <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
            </button>` : ""}
        </div>
      </div>
    `).join("");
    listEl.querySelectorAll("[data-emp]").forEach(b =>
      b.addEventListener("click", () => openEmployeeModal(b.dataset.emp)));
    listEl.querySelectorAll("[data-edit]").forEach(b =>
      b.addEventListener("click", () => openOfficeForm(c.id, selectedWoreda, b.dataset.edit)));
    listEl.querySelectorAll("[data-del]").forEach(b =>
      b.addEventListener("click", () => deleteOfficeConfirm(b.dataset.del)));
  }

  woredaSel.addEventListener("change", () => { selectedWoreda = woredaSel.value; drawList(); });

  document.getElementById("of-add")?.addEventListener("click", () =>
    openOfficeForm(c.id, selectedWoreda, null));

  drawList();
}

/* ============================================================
   OFFICE FORM
   ============================================================ */
function openOfficeForm(clusterId, woredaCode, officeId = null) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  const woredas = normalizeWoredas(c.woredas);
  const w = woredas.find(x => x.code === woredaCode);
  if (!w) { toast("Woreda not found.", "error"); return; }

  const editing = !!officeId;
  const o = editing ? offices.find(x => x.id === officeId) : {};
  const allowed = isSuper() || (isClusterAdmin() && c.id === myClusterId());
  if (!allowed) { toast("Not allowed", "error"); return; }

  openWizard({
    title: editing ? "Edit Office" : "Add Office",
    subtitle: `${escapeHtml(c.name)} → ${escapeHtml(w.name)} (${escapeHtml(w.code)})`,
    finishLabel: editing ? "Save Changes" : "Create Office",
    successMessage: editing ? "Office updated" : "Office created",
    initial: { name: o.name || "", code: o.code || "" },
    steps: [
      {
        label: "Details",
        title: "Office details",
        render: (d) => `
          <div class="field">
            <label class="field__required">Office name</label>
            <input data-field="name" value="${escapeHtml(d.name || "")}" placeholder="e.g. Fitche City Office">
          </div>
          <div class="field">
            <label class="field__required">Office code (2 digits)</label>
            <input data-field="code" maxlength="2" value="${escapeHtml(d.code || "")}"
                   placeholder="08" inputmode="numeric"
                   style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
            <p class="field__hint">Unique inside woreda ${escapeHtml(w.code)} of cluster ${escapeHtml(c.name)}.</p>
          </div>
          <div class="review" style="margin-top:16px">
            <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(c.regionCode))}</span></div>
            <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(c.name)} (${escapeHtml(c.code || "??")})</span></div>
            <div class="review__row"><span class="review__k">Woreda</span><span class="review__v">${escapeHtml(w.name)} (${escapeHtml(w.code)})</span></div>
            <div class="review__row"><span class="review__k">Office</span><span class="review__v">${escapeHtml(d.name || "—")} (${escapeHtml(d.code || "??")})</span></div>
            <div class="review__row"><span class="review__k">ID segment</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(c.regionCode || "??")}-${escapeHtml(c.code || "??")}${escapeHtml(w.code)}<b style="color:#d4a017">${escapeHtml(d.code || "??")}</b>····</span></div>
          </div>`,
        validate: d => {
          if (!d.name || d.name.trim().length < 2) return "Office name must be at least 2 characters.";
          if (!/^\d{2}$/.test(d.code || "")) return "Office code must be exactly 2 digits.";
          const dup = offices.some(x =>
            x.clusterId === c.id && x.woredaCode === w.code &&
            x.code === d.code && x.id !== officeId);
          if (dup) return `Office code ${d.code} already exists in woreda ${w.code}.`;
          return null;
        }
      }
    ],
    onFinish: async (d) => {
      const payload = {
        name: d.name.trim(),
        code: d.code,
        clusterId: c.id,
        clusterCode: c.code,
        clusterName: c.name,
        regionCode: c.regionCode,
        regionName: regionName(c.regionCode),
        woredaCode: w.code,
        woredaName: w.name,
        updatedAt: serverTimestamp()
      };
      if (editing) {
        await updateDoc(doc(db, "offices", officeId), payload);
      } else {
        payload.createdAt = serverTimestamp();
        payload.createdBy = S.uid;
        const ref = doc(collection(db, "offices"));
        await setDoc(ref, { ...payload, officeId: ref.id });
      }
    }
  });
}

async function deleteOfficeConfirm(officeId) {
  if (!isSuper()) { toast("Only super admins can delete offices", "error"); return; }
  const o = offices.find(x => x.id === officeId);
  if (!o) return;
  const empCount = (employeesByOffice[officeId] || []).length;
  if (empCount) { toast(`Cannot delete — ${empCount} employee(s) still belong to this office.`, "error"); return; }
  if (!confirm(`Delete office "${o.name}" (${o.code})?`)) return;
  try {
    await deleteDoc(doc(db, "offices", officeId));
    toast("Office deleted", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

/* ============================================================
   EMPLOYEE MODAL — 4 steps
   ============================================================ */
function openEmployeeModal(preOfficeId = null) {
  const availClusters = visibleClusters();
  if (!availClusters.length) { toast("No clusters available.", "error"); return; }

  const preOffice = preOfficeId ? offices.find(o => o.id === preOfficeId) : null;
  const initial = {};
  if (preOffice) {
    initial.clusterId = preOffice.clusterId;
    initial.woredaCode = preOffice.woredaCode;
    initial.officeId  = preOffice.id;
  } else if (availClusters.length === 1) {
    initial.clusterId = availClusters[0].id;
  }

  openWizard({
    title: "Register Employee",
    subtitle: "Cluster → Woreda → Office → Employee details",
    finishLabel: "Register Employee",
    successMessage: "Employee registered",
    size: "lg",
    initial,
    steps: [
      {
        label: "Cluster",
        title: "Select the cluster",
        render: (d) => `
          <div class="field">
            <label class="field__required">Cluster</label>
            <select data-field="clusterId">
              <option value="">— Choose a cluster —</option>
              ${availClusters.map(c => `
                <option value="${c.id}" ${d.clusterId === c.id ? "selected" : ""}>
                  ${escapeHtml(c.code)} · ${escapeHtml(c.name)} — ${escapeHtml(regionName(c.regionCode))}
                </option>`).join("")}
            </select>
          </div>`,
        validate: d => d.clusterId ? null : "Please select a cluster.",
        after: (root, data, refresh) => {
          root.querySelector('[data-field="clusterId"]')?.addEventListener("change", (e) => {
            data.clusterId = e.target.value;
            delete data.woredaCode; delete data.officeId;
            refresh();
          });
        }
      },
      {
        label: "Woreda",
        title: "Select the woreda / city",
        render: (d) => {
          const c = clusters.find(x => x.id === d.clusterId);
          const list = normalizeWoredas(c?.woredas).slice()
            .sort((a, b) => String(a.code).localeCompare(String(b.code)));
          return `
            <div class="field">
              <label class="field__required">Woreda / City</label>
              <select data-field="woredaCode" ${list.length ? "" : "disabled"}>
                <option value="">${list.length ? "— Choose a woreda —" : "No woredas in this cluster"}</option>
                ${list.map(w => `
                  <option value="${escapeHtml(w.code)}" ${d.woredaCode === w.code ? "selected" : ""}>
                    ${escapeHtml(w.code)} — ${escapeHtml(w.name)}
                  </option>`).join("")}
              </select>
              ${list.length
                ? `<p class="field__hint">Woredas belong to the cluster. Only its administrator can add them.</p>`
                : `<p class="field__hint" style="color:#b45309">Add woredas to this cluster first.</p>`}
            </div>`;
        },
        validate: d => d.woredaCode ? null : "Please select a woreda.",
        after: (root, data, refresh) => {
          root.querySelector('[data-field="woredaCode"]')?.addEventListener("change", (e) => {
            data.woredaCode = e.target.value;
            delete data.officeId;
            refresh();
          });
        }
      },
      {
        label: "Office",
        title: "Select the office",
        render: (d) => {
          const c = clusters.find(x => x.id === d.clusterId);
          const list = (officesByWoreda[`${c?.id}:${d.woredaCode}`] || [])
            .slice().sort((a, b) => String(a.code).localeCompare(String(b.code)));
          return `
            <div class="field">
              <label class="field__required">Office</label>
              <select data-field="officeId" ${list.length ? "" : "disabled"}>
                <option value="">${list.length ? "— Choose an office —" : "No offices in this woreda"}</option>
                ${list.map(o => `
                  <option value="${o.id}" ${d.officeId === o.id ? "selected" : ""}>
                    ${escapeHtml(o.code)} · ${escapeHtml(o.name)}
                  </option>`).join("")}
              </select>
              ${list.length
                ? `<p class="field__hint">Only offices belonging to the selected woreda are listed.</p>`
                : `<p class="field__hint" style="color:#b45309">Create an office inside this woreda first.</p>`}
            </div>`;
        },
        validate: d => d.officeId ? null : "Please select an office.",
        after: (root, data, refresh) => {
          root.querySelector('[data-field="officeId"]')?.addEventListener("change", (e) => {
            data.officeId = e.target.value;
            refresh();
          });
        }
      },
      {
        label: "Details",
        title: "Employee details",
        render: (d) => {
          const c = clusters.find(x => x.id === d.clusterId);
          const o = offices.find(x => x.id === d.officeId);
          const w = normalizeWoredas(c?.woredas).find(x => x.code === d.woredaCode);
          const seq = nextSequence(d.officeId);
          const preview = buildEmpId(c?.regionCode, c?.code, d.woredaCode, o?.code, seq);
          return `
            <div class="field-row">
              <div class="field">
                <label class="field__required">First name</label>
                <input data-field="firstName" value="${escapeHtml(d.firstName || "")}" placeholder="Abebe">
              </div>
              <div class="field">
                <label>Middle name</label>
                <input data-field="middleName" value="${escapeHtml(d.middleName || "")}" placeholder="Tesfaye">
              </div>
            </div>
            <div class="field">
              <label class="field__required">Last name</label>
              <input data-field="lastName" value="${escapeHtml(d.lastName || "")}" placeholder="Bekele">
            </div>
            <div class="field-row">
              <div class="field">
                <label class="field__required">Gender</label>
                <select data-field="gender">
                  <option value="">— Select —</option>
                  <option value="M" ${d.gender === "M" ? "selected" : ""}>Male</option>
                  <option value="F" ${d.gender === "F" ? "selected" : ""}>Female</option>
                </select>
              </div>
              <div class="field">
                <label class="field__required">Phone</label>
                <input data-field="phone" value="${escapeHtml(d.phone || "")}" placeholder="+251 9XX XX XX XX">
              </div>
            </div>
            <div class="field">
              <label class="field__required">Email</label>
              <input data-field="email" type="email" value="${escapeHtml(d.email || "")}" placeholder="name@agency.gov.et">
            </div>
            <div class="field">
              <label class="field__required">Position</label>
              <input data-field="position" value="${escapeHtml(d.position || "")}" placeholder="Accountant">
            </div>
            <div class="field">
              <label class="field__required">Hire date</label>
              <input data-field="hireDate" type="date" value="${escapeHtml(d.hireDate || new Date().toISOString().slice(0,10))}">
            </div>

            <div class="field" style="margin-top:18px">
              <label>Generated employee ID</label>
              <div class="id-preview">
                <div class="id-preview__lbl">Employee ID</div>
                <div class="id-preview__val">${escapeHtml(preview)}</div>
                <div class="id-preview__parts">
                  <b>${escapeHtml(c?.regionCode || "??")}</b> region ·
                  <b>${escapeHtml(c?.code || "??")}</b> cluster ·
                  <b>${escapeHtml(d.woredaCode || "??")}</b> woreda (${escapeHtml(w?.name || "")}) ·
                  <b>${escapeHtml(o?.code || "??")}</b> office ·
                  <b>${String(seq).padStart(4,"0")}</b> sequence
                </div>
              </div>
            </div>`;
        },
        validate: d => {
          if (!d.firstName || d.firstName.trim().length < 2) return "First name is required.";
          if (!d.lastName || d.lastName.trim().length < 2)   return "Last name is required.";
          if (!d.gender)                                     return "Please select a gender.";
          if (!/^[0-9+\-\s]{7,15}$/.test(d.phone || ""))     return "Enter a valid phone number.";
          if (!d.email || !/^\S+@\S+\.\S+$/.test(d.email))   return "Enter a valid email address.";
          if (!d.position || d.position.trim().length < 2)   return "Position is required.";
          if (!d.hireDate)                                   return "Hire date is required.";
          return null;
        }
      }
    ],
    onFinish: async (d) => {
      const c = clusters.find(x => x.id === d.clusterId);
      const o = offices.find(x => x.id === d.officeId);
      const w = normalizeWoredas(c?.woredas).find(x => x.code === d.woredaCode);

      const seq = nextSequence(o.id);
      const empId = await generateEmployeeId({
        regionCode: c.regionCode, clusterCode: c.code,
        woredaCode: d.woredaCode, officeCode: o.code
      });

      const fullNameStr = [d.firstName, d.middleName, d.lastName]
        .map(s => (s || "").trim()).filter(Boolean).join(" ");

      const secName = "empCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      let uid = null;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, d.email.trim(),
          "Temp_" + Math.random().toString(36).slice(2, 10));
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: fullNameStr }); } catch (e) {}
        await signOut(secAuth);
      } catch (e) {
        console.warn("[employee] auth create skipped:", e?.code || e?.message);
      } finally {
        try { await deleteApp(secApp); } catch (e) {}
      }

      const empRef = doc(collection(db, "employees"));
      await setDoc(empRef, {
        empId, seq,
        firstName: d.firstName.trim(),
        middleName: d.middleName?.trim() || null,
        lastName: d.lastName.trim(),
        fullName: fullNameStr, nameEn: fullNameStr,
        gender: d.gender,
        phone: d.phone.trim(),
        email: d.email.trim(),
        position: d.position.trim(),
        hireDate: d.hireDate,
        status: "active", employmentType: "permanent",
        regionCode: c.regionCode, regionName: regionName(c.regionCode),
        clusterId: c.id, clusterCode: c.code, clusterName: c.name,
        woredaCode: d.woredaCode, woredaName: w?.name || "",
        officeId: o.id, officeCode: o.code, officeName: o.name,
        uid, active: true,
        createdAt: serverTimestamp(), createdBy: S.uid
      });

      if (uid) {
        await setDoc(doc(db, "users", uid), {
          email: d.email.trim(), name: fullNameStr, role: "employee",
          officeId: o.id, officeName: o.name,
          clusterId: c.id, clusterName: c.name,
          region: c.regionCode, regionName: regionName(c.regionCode),
          employeeId: empRef.id, empId, active: true,
          createdAt: serverTimestamp(), createdBy: S.uid
        });
      }
    }
  });
}

/* ============================================================
   SUBSCRIPTIONS
   ============================================================ */
function rebuildIndexes() {
  Object.keys(clustersByRegion).forEach(k => delete clustersByRegion[k]);
  Object.keys(officesByCluster).forEach(k => delete officesByCluster[k]);
  Object.keys(officesByWoreda).forEach(k => delete officesByWoreda[k]);
  Object.keys(employeesByOffice).forEach(k => delete employeesByOffice[k]);
  Object.keys(employeesByCluster).forEach(k => delete employeesByCluster[k]);
  Object.keys(adminsByCluster).forEach(k => delete adminsByCluster[k]);

  clusters.forEach(c => {
    if (!clustersByRegion[c.regionCode]) clustersByRegion[c.regionCode] = [];
    clustersByRegion[c.regionCode].push(c);
  });
  offices.forEach(o => {
    if (!officesByCluster[o.clusterId]) officesByCluster[o.clusterId] = [];
    officesByCluster[o.clusterId].push(o);
    if (o.woredaCode) {
      const key = `${o.clusterId}:${o.woredaCode}`;
      if (!officesByWoreda[key]) officesByWoreda[key] = [];
      officesByWoreda[key].push(o);
    }
  });
  employees.forEach(e => {
    if (e.officeId) {
      if (!employeesByOffice[e.officeId]) employeesByOffice[e.officeId] = [];
      employeesByOffice[e.officeId].push(e);
    }
    if (e.clusterId) {
      if (!employeesByCluster[e.clusterId]) employeesByCluster[e.clusterId] = [];
      employeesByCluster[e.clusterId].push(e);
    }
  });
  users.forEach(u => {
    if (u.role === "admin" && u.clusterId) {
      if (!adminsByCluster[u.clusterId]) adminsByCluster[u.clusterId] = [];
      adminsByCluster[u.clusterId].push(u);
    }
  });
}

function subscribeRegions() {
  if (unsubRegions) unsubRegions();
  unsubRegions = onSnapshot(collection(db, "regions"), (snap) => {
    customRegions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => console.warn("[regions]", err.code, err.message));
}
function subscribeClusters() {
  if (unsubClusters) unsubClusters();
  let q = collection(db, "clusters");
  if (!isSuper() && myClusterId()) q = query(q, where("clusterId", "==", myClusterId()));
  unsubClusters = onSnapshot(q, (snap) => {
    clusters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    rebuildIndexes(); render();
  }, (err) => {
    console.warn("[clusters]", err.code, err.message);
    document.getElementById("regions-grid").innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <h3>${escapeHtml(err.code)}</h3>
        <p>${escapeHtml(err.message)}</p>
      </div>`;
  });
}

function subscribeEmployees() {

  }, (err) => console.warn("[employees]", err.code, err.message));
}
function subscribeUsers() {
  if (unsubUsers) unsubUsers();
  let q = collection(db, "users");
  if (!isSuper() && myClusterId()) q = query(q, where("clusterId", "==", myClusterId()));
  unsubUsers = onSnapshot(q, (snap) => {
    users = snap.docs.map(d => ({ id: d.id, ...d.data() }));

}

/* ============================================================
   INTERACTIONS
   ============================================================ */
document.getElementById("collapse-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  const c = !document.body.classList.contains("sidebar-collapsed");
  document.body.classList.toggle("sidebar-collapsed", c);
  try { localStorage.setItem("cs.sidebar", c ? "collapsed" : "expanded"); } catch (err) {}
});
document.getElementById("menu-toggle").addEventListener("click", () =>
  document.body.classList.toggle("sidebar-open"));
document.getElementById("overlay").addEventListener("click", () =>
  document.body.classList.remove("sidebar-open"));
document.querySelectorAll("[data-dropdown-toggle]").forEach((btn) => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const panel = btn.closest(".dropdown").querySelector("[data-dropdown-panel]");
    const open = !panel.classList.contains("hidden");
    document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden"));
    if (!open) panel.classList.remove("hidden");
  });
});
document.addEventListener("click", () =>
  document.querySelectorAll("[data-dropdown-panel]").forEach(p => p.classList.add("hidden")));
try {
  if (localStorage.getItem("cs.sidebar") === "collapsed") document.body.classList.add("sidebar-collapsed");
} catch (e) {}

/* ============================================================
   BOOT
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (kick.done) return;
  if (!user) { kick("no-user"); return; }

  let userDoc = null;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) userDoc = snap.data();
  } catch (e) { console.warn("[user read]", e); }

  if (userDoc && userDoc.active === false) { kick("inactive"); return; }

  S = {
    uid: user.uid,
    role: userDoc?.role || "employee",
    email: user.email || "",
    name: userDoc?.name || user.email?.split("@")[0] || "User",
    officeId: userDoc?.officeId || "",
    clusterId: userDoc?.clusterId || ""
  };

  if (S.role !== "super_admin" && S.role !== "admin") {
    window.location.replace("dashboard.html");
    return;
  }

  renderSidebar();
  renderUser();
  render();

  subscribeRegions();
  subscribeClusters();
  subscribeOffices();
  subscribeEmployees();
  subscribeUsers();
});

console.log("[offices] booted — Region → Cluster → Woreda/City → Office → Employee");
</script>
