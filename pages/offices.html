<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offices &amp; Clusters — Civil Service MIS</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function headGuard() {

      sessionStorage.clear();
      sessionStorage.setItem("__redirectReason", "expired");
      window.location.replace("../index.html");
    }
  } catch (e) { window.location.replace("../index.html"); }
})();
</script>
<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#0b5cab; --primary-dark:#073d75; --secondary:#0e7490;
  --text:#172033; --text-soft:#344054; --muted:#6b7280; --muted-light:#98a2b3;
  --border:#e5e7eb; --border-soft:#eef1f5;
  --danger:#dc2626; --success:#067647; --warning:#b8860b; --bg:#f4f7fb; --bg-soft:#fbfcfe;
  --violet:#5b21b6; --violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px; --r-lg:20px; --r-full:999px;
  --sidebar-w:272px; --topbar-h:76px;
}
html, body { height:100%; }
body {
  font-family:"Inter","Noto Sans Ethiopic",sans-serif;
  background:radial-gradient(circle at 10% 20%, rgba(11,92,171,.09), transparent 35%),
             radial-gradient(circle at 90% 80%, rgba(25,169,116,.09), transparent 35%),
             var(--bg);
  color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img, svg { display:block; max-width:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; text-decoration:none; }
h1,h2,h3,h4 { line-height:1.25; letter-spacing:-0.02em; font-weight:800; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }

.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main"; min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1); }
body.sidebar-collapsed .app { grid-template-columns:88px 1fr; }

.sidebar { grid-area:sidebar; position:sticky; top:0; height:100vh; width:var(--sidebar-w);
  background:linear-gradient(145deg, #073d75 0%, #0b5cab 55%, #0e7490 100%);
  color:#fff; display:flex; flex-direction:column; overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1); z-index:30; }
body.sidebar-collapsed .sidebar { width:88px; }
.sidebar::before { content:""; position:absolute; width:450px; height:450px; border-radius:50%;
  border:1px solid rgba(255,255,255,.10); right:-220px; top:-150px; pointer-events:none; }
.sidebar__brand { position:relative; z-index:2; display:flex; align-items:center; gap:14px;
  padding:22px; border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h); flex-shrink:0; }
.sidebar__logo { width:46px; height:46px; flex-shrink:0; border-radius:14px;
  background:rgba(255,255,255,.97); box-shadow:0 10px 24px rgba(0,0,0,.18);
  display:grid; place-items:center; padding:5px; }
.sidebar__logo img { width:100%; height:100%; object-fit:contain; border-radius:9px; }
.sidebar__identity { min-width:0; flex:1; opacity:1; transition:opacity .18s ease 60ms; white-space:nowrap; overflow:hidden; }
body.sidebar-collapsed .sidebar__identity { opacity:0; pointer-events:none; }
.sidebar__title { font-size:16px; font-weight:800; letter-spacing:-.3px; }
.sidebar__subtitle { font-size:11px; opacity:.72; margin-top:3px; }
.sidebar__collapse { position:absolute; right:-13px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; background:#fff; color:var(--primary-dark);
  border:3px solid var(--bg); display:grid; place-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15); z-index:10; cursor:pointer; }
.sidebar__collapse svg { width:13px; height:13px; stroke:currentColor; stroke-width:2.5;
  fill:none; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s; }
body.sidebar-collapsed .sidebar__collapse svg { transform:rotate(180deg); }
.sidebar__nav { position:relative; z-index:2; flex:1; padding:20px 14px; overflow-y:auto; overflow-x:hidden; }
.sidebar__section { font-size:10.5px; font-weight:800; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.45);
  padding:18px 12px 8px; white-space:nowrap; overflow:hidden; transition:all .2s ease; }
body.sidebar-collapsed .sidebar__section { height:6px; padding:0; opacity:0; margin-top:14px; margin-bottom:6px; }
.nav-item { display:flex; align-items:center; gap:13px; padding:11px 13px; border-radius:12px;
  font-size:14px; font-weight:600; color:rgba(255,255,255,.78);
  margin-bottom:3px; transition:background .15s, color .15s;
  white-space:nowrap; cursor:pointer; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.09); color:#fff; }
.nav-item.is-active { background:rgba(255,255,255,.16); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.nav-item.is-active::before { content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:24px; border-radius:0 4px 4px 0;
  background:#58e6a7; box-shadow:0 0 12px rgba(88,230,167,.6); }
.nav-item svg { width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:1.85; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.nav-item__label { flex:1; overflow:hidden; text-overflow:ellipsis; transition:opacity .15s; }
body.sidebar-collapsed .nav-item__label { opacity:0; pointer-events:none; }
body.sidebar-collapsed .nav-item { justify-content:center; padding:12px; }
.sidebar__footer { position:relative; z-index:2; padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.10);
  font-size:11px; color:rgba(255,255,255,.55);
  text-align:center; line-height:1.5; }

.topbar { grid-area:topbar; background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 28px;
  position:sticky; top:0; z-index:20; }
.topbar__menu { display:none; width:42px; height:42px; border-radius:12px; color:var(--text);
  align-items:center; justify-content:center; cursor:pointer; }
.topbar__spacer { flex:1; }
.user-btn { display:flex; align-items:center; gap:11px;
  padding:4px 14px 4px 4px; border-radius:var(--r-full);
  background:var(--border-soft); cursor:pointer; transition:background .15s; }
.user-btn:hover { background:#e4e9f1; }
.user-btn__avatar { width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; font-weight:800; font-size:13px;
  display:grid; place-items:center; }
.user-btn__name { font-size:13px; font-weight:700; display:block; }
.user-btn__role { font-size:11px; color:var(--muted); font-weight:600; }
.dropdown { position:relative; }
.dropdown__panel { position:absolute; right:0; top:calc(100% + 12px);
  background:#fff; border:1px solid var(--border); border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12); min-width:260px; padding:8px; z-index:50; }
.dropdown__header { padding:12px 14px; border-bottom:1px solid var(--border-soft); margin-bottom:6px; }
.dropdown__header strong { display:block; font-size:14px; font-weight:700; }
.dropdown__header span { font-size:12px; color:var(--muted); }
.dropdown__item { display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 14px; border-radius:10px; font-size:14px; font-weight:500;
  color:var(--text-soft); text-align:left; cursor:pointer; }
.dropdown__item:hover { background:var(--border-soft); color:var(--text); }
.dropdown__item svg { width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none; }
.dropdown__divider { height:1px; background:var(--border-soft); margin:6px 0; }
.dropdown__item--danger { color:var(--danger); }

.main { grid-area:main; padding:32px; overflow-x:hidden; }
.page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
.page-head__title { font-size:32px; font-weight:800; letter-spacing:-1.2px; margin-bottom:6px; }
.page-head__sub { font-size:15px; color:var(--muted); }
.page-head__actions { display:flex; gap:10px; flex-wrap:wrap; }
.scope-badge { display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px; border-radius:var(--r-full);
  background:linear-gradient(135deg, #eaf3fc, #fff);
  border:1px solid #bdd7f2; color:var(--primary-dark);
  font-size:12.5px; font-weight:700; margin-top:8px; }
.scope-badge svg { width:15px; height:15px; stroke:currentColor; stroke-width:2.2; fill:none; }
.scope-badge--super { background:linear-gradient(135deg, #f0eaff, #fff); border-color:#ddd2fb; color:#5b21b6; }
.scope-badge--cluster { background:linear-gradient(135deg, #ecfdf3, #fff); border-color:#abefc6; color:#067647; }

.chain { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:#fff; border:1px solid var(--border); border-radius:var(--r-lg);
  padding:16px 22px; margin-bottom:24px; box-shadow:var(--sh-sm); font-size:13px; font-weight:700; }
.chain__node { padding:6px 14px; border-radius:999px; background:#f1f5f9; color:#334155; }
.chain__node.hi { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff;
  box-shadow:0 6px 16px rgba(11,92,171,.28); }
.chain__arrow { color:#cbd5e1; font-weight:400; font-size:15px; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:9px;
  height:46px; padding:0 20px; border-radius:13px;
  border:1px solid #d9dee7; background:#fff;
  color:var(--text-soft); font-size:14px; font-weight:700;
  white-space:nowrap; cursor:pointer; transition:all .15s; }
.btn:hover { background:var(--bg-soft); border-color:#b9c7d9; }
.btn svg { width:17px; height:17px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.btn--primary { background:linear-gradient(135deg, #0b5cab, #0e7490); border:none; color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22); }
.btn--primary:hover { background:linear-gradient(135deg, #073d75, #0b5cab); transform:translateY(-1px); }
.btn--danger { color:var(--danger); }
.btn--danger:hover { background:#fef3f2; border-color:#f0a5ab; }
.btn--sm { height:38px; padding:0 14px; font-size:13px; border-radius:10px; }
.btn--sm svg { width:15px; height:15px; }
.btn--xs { height:32px; padding:0 10px; font-size:12px; border-radius:8px; gap:6px; }
.btn--xs svg { width:13px; height:13px; }
.btn--icon { width:38px; padding:0; }
.btn:disabled { opacity:.55; pointer-events:none; }

.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:24px; }
.stat { position:relative; background:#fff; border:1px solid var(--border);
  border-radius:var(--r-lg); padding:18px; box-shadow:var(--sh-sm);
  overflow:hidden; transition:box-shadow .2s, transform .2s; }
.stat:hover { box-shadow:var(--sh-lg); transform:translateY(-3px); }
.stat::before { content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--c1, var(--primary)); border-radius:var(--r-lg) var(--r-lg) 0 0; }
.stat--blue   { --c1:linear-gradient(90deg, #0b5cab, #0e7490); --ic:#eaf3fc; --ifc:#0b5cab; }
.stat--green  { --c1:linear-gradient(90deg, #19a974, #34c78e); --ic:#e7f7f0; --ifc:#128a5c; }
.stat--gold   { --c1:linear-gradient(90deg, #d4a017, #e8b84b); --ic:#fdf5e0; --ifc:#b8860b; }
.stat--violet { --c1:linear-gradient(90deg, #6d28d9, #a78bfa); --ic:#f0eaff; --ifc:#5b21b6; }
.stat--pink   { --c1:linear-gradient(90deg, #db2777, #f472b6); --ic:#fdeef5; --ifc:#be185d; }
.stat__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
.stat__label { font-size:12.5px; color:var(--muted); font-weight:600; }
.stat__icon { width:40px; height:40px; border-radius:12px; background:var(--ic); color:var(--ifc);
  display:grid; place-items:center; }
.stat__icon svg { width:19px; height:19px; stroke:currentColor; stroke-width:2.2; fill:none; }
.stat__value { font-size:26px; font-weight:800; letter-spacing:-1px; line-height:1; }

.regions-grid { display:flex; flex-direction:column; gap:20px; }
.region-card { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--sh-sm); transition:box-shadow .2s, border-color .2s; }
.region-card:hover { box-shadow:var(--sh-md); border-color:#c9d8ec; }
.region-card--builtin { border-left:4px solid var(--primary); }
.region-card--custom  { border-left:4px solid var(--violet); }
.region-card__head { display:flex; gap:16px; align-items:flex-start; padding:20px 24px;
  background:linear-gradient(135deg, #f8fbff, #fff); border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.region-card__crest { width:58px; height:58px; flex-shrink:0; border-radius:16px;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff; display:grid; place-items:center;
  font-weight:800; font-size:20px; letter-spacing:-1px;
  box-shadow:0 8px 20px rgba(11,92,171,.28); font-family:ui-monospace,monospace; }
.region-card__crest--custom { background:linear-gradient(135deg, #6d28d9, #8b5cf6);
  box-shadow:0 8px 20px rgba(109,40,217,.28); }
.region-card__identity { flex:1; min-width:0; }
.region-card__name { font-size:19px; font-weight:800; letter-spacing:-.3px; line-height:1.25; margin-bottom:4px; }
.region-card__name-am { font-size:13px; color:var(--muted); margin-bottom:8px; font-family:'Noto Sans Ethiopic',sans-serif; }
.region-card__meta { display:flex; gap:6px; flex-wrap:wrap; }
.region-card__actions { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; }
.region-card__body { padding:8px 12px 14px; }

.cluster-block { border-radius:14px; border:1px solid var(--border-soft); background:var(--bg-soft);
  padding:14px 16px; margin:10px 6px; transition:border-color .15s, background .15s; }
.cluster-block:hover { border-color:#c9d8ec; background:#fff; }
.cluster-block__top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.cluster-block__id { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.cluster-block__code { font-family:ui-monospace,Menlo,monospace; font-weight:800; font-size:13px;
  background:var(--violet-soft); color:var(--violet); padding:6px 10px; border-radius:9px;
  letter-spacing:1.5px; flex-shrink:0; }
.cluster-block__name { font-weight:700; font-size:14.5px; }
.cluster-block__meta { font-size:12px; color:var(--muted); margin-top:2px; }
.cluster-block__actions { display:flex; gap:6px; flex-wrap:wrap; }

.woreda-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.woreda-pill { display:inline-flex; align-items:center; gap:6px;
  padding:4px 11px; border-radius:999px;
  background:#f0eaff; border:1px solid #ddd2fb;
  font-size:11.5px; color:#5b21b6; font-weight:700; }
.woreda-pill__code { font-family:ui-monospace,monospace; opacity:.75; font-size:10.5px; }
.woreda-pill__x { border:0; background:rgba(109,40,217,.14); color:#5b21b6;
  width:15px; height:15px; border-radius:50%; display:grid; place-items:center;
  font-size:10px; line-height:1; padding:0; cursor:pointer; }
.woreda-pill__x:hover { background:var(--danger); color:#fff; }
.no-woredas { font-size:12.5px; color:var(--muted-light); font-style:italic; padding:4px 0; }

.tag { display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--r-full);
  font-size:11px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
.tag--region { background:#f0eaff; color:#5b21b6; }
.tag--custom { background:#fdf5e0; color:#b8860b; }
.tag--office { background:var(--border-soft); color:var(--text-soft); }
.tag--code { background:#0d1520; color:#e4eef9; font-family:ui-monospace,monospace; letter-spacing:1px; }
.tag--gray { background:var(--border-soft); color:var(--text-soft); }
.tag--admin { background:#eaf3fc; color:#0b5cab; }
.tag--manager { background:#ecfdf3; color:#067647; }
.tag--employee { background:#fdf5e0; color:#7a5210; }
.tag--green { background:#ecfdf3; color:#067647; }
.tag--red { background:#fef3f2; color:#b42318; }

.empty { padding:70px 40px; text-align:center; background:#fff;
  border:2px dashed var(--border); border-radius:var(--r-lg); }
.empty svg { width:60px; height:60px; margin:0 auto 18px; stroke:#cbd5e1; stroke-width:1.2; fill:none; }
.empty h3 { font-size:20px; font-weight:800; margin-bottom:8px; }
.empty p { font-size:14.5px; color:var(--muted); margin-bottom:22px; }

.modal-backdrop { position:fixed; inset:0; z-index:200; background:rgba(15,23,42,.55);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:grid; place-items:center; padding:24px; animation:fadeIn .18s ease; overflow-y:auto; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal { background:#fff; border-radius:var(--r-lg); box-shadow:0 30px 60px rgba(20,40,70,.12);
  width:100%; max-width:620px; max-height:92vh; display:flex; flex-direction:column;
  animation:modalUp .22s cubic-bezier(.4,0,.2,1); margin:auto; }
@keyframes modalUp { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.modal--lg { max-width:820px; }
.modal__head { padding:24px 28px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.modal__title { font-size:20px; font-weight:800; letter-spacing:-.4px; }
.modal__sub { font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
.modal__close { width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  color:var(--muted); transition:background .15s; cursor:pointer; flex-shrink:0; }
.modal__close:hover { background:var(--border-soft); color:var(--text); }
.modal__close svg { width:18px; height:18px; stroke:currentColor; stroke-width:2.2; fill:none; }
.modal__body { padding:24px 28px; overflow-y:auto; flex:1; }
.modal__foot { padding:18px 28px; border-top:1px solid var(--border-soft);
  display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; align-items:center; }
.modal__foot .spacer { flex:1; }

.steps { display:flex; align-items:center; padding:16px 28px;
  background:#f8fafc; border-bottom:1px solid var(--border-soft); overflow-x:auto; }
.step { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.step__num { width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  font-size:12.5px; font-weight:800; background:#e2e8f0; color:#94a3b8; flex-shrink:0; transition:.2s; }
.step__label { font-size:12.5px; font-weight:700; color:#94a3b8; white-space:nowrap; }
.step.is-active .step__num { background:var(--primary); color:#fff; box-shadow:0 0 0 4px rgba(11,92,171,.14); }
.step.is-active .step__label { color:var(--text); }
.step.is-done .step__num { background:var(--success); color:#fff; }
.step.is-done .step__label { color:#64748b; }
.step__line { flex:1; height:2px; background:#e2e8f0; margin:0 12px; min-width:16px; border-radius:2px; }
.step-header { display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:800;
  margin-bottom:18px; letter-spacing:-.2px; color:var(--text); }
.step-header__badge { width:26px; height:26px; border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff;
  display:grid; place-items:center; font-size:13px; font-weight:800; flex-shrink:0; }

.field { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; position:relative; }
.field > label { font-size:13px; font-weight:700; color:var(--text-soft); }
.field__required::after { content:" *"; color:var(--danger); }
.field input, .field select, .field textarea {
  width:100%; height:48px; padding:0 14px; border:1px solid #d9dee7; border-radius:11px;
  background:#fbfcfe; font-size:14px; font-family:inherit; color:var(--text); transition:all .15s; }
.field textarea { height:auto; min-height:96px; padding:12px 14px; resize:vertical; }

  background-repeat:no-repeat; background-position:right 14px center; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline:none; background:#fff; border-color:#70a8d9; box-shadow:0 0 0 4px rgba(11,92,171,.08); }
.field input:disabled, .field select:disabled { background:#f1f5f9; color:var(--muted); cursor:not-allowed; }

.admin-item { display:flex; align-items:center; gap:12px; padding:12px 14px;

.office-item { display:flex; align-items:center; gap:12px; padding:12px 14px;

.alert { display:flex; gap:12px; padding:13px 16px; border-radius:11px;

.alert svg { width:16px; height:16px; flex-shrink:0; margin-top:2px; stroke:currentColor; stroke-width:2.2; fill:none; }
.alert--error { background:#fef3f2; color:#b42318; border-color:#fecdca; }
.alert--info { background:#eaf3fc; color:#0b5cab; border-color:#bdd7f2; }
.alert--warning { background:#fdf5e0; color:#7a5210; border-color:#f0dcb0; }

.toast-wrap { position:fixed; top:24px; right:24px; z-index:300;
  display:flex; flex-direction:column; gap:10px; pointer-events:none;
  max-width:calc(100vw - 48px); }
.toast { background:var(--text); color:#fff; padding:13px 18px; border-radius:12px;
  box-shadow:0 12px 32px rgba(20,40,70,.2); font-size:13.5px; font-weight:600;
  display:flex; align-items:center; gap:12px; pointer-events:auto;
  animation:toastIn .22s cubic-bezier(.4,0,.2,1); max-width:400px; }
@keyframes toastIn { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:translateX(0); } }
.toast--success { background:#067647; }
.toast--error { background:#b42318; }
.toast--info { background:#0b5cab; }
.toast svg { width:17px; height:17px; stroke:currentColor; stroke-width:2.5; fill:none; flex-shrink:0; }

.spinner { width:16px; height:16px; border:2px solid currentColor;
  border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }

.skeleton-card { height:220px;

  if (kick.done) return;
  kick.done = true;
  try {
    sessionStorage.clear();

  } catch (e) {}

/* ============================================================
   HELPERS
   ============================================================ */
const escapeHtml = (s) => (s == null ? "" : String(s)).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = (n) => (n || "?").split(/\s+/).slice(0,2).map((s) => s[0]).join("").toUpperCase();
const roleLabel = (r) => (r || "").replace(/_/g," ").replace(/\b\w/g, (c) => c.toUpperCase());
const hasAccess = (item, role) => item.roles.includes("*") || item.roles.includes(role);
const twoDigits = (v, fb = "00") => {
  if (v == null) return fb;
  const s = String(v).replace(/\D/g, "");
  if (!s) return fb;
  return s.length >= 2 ? s.slice(0, 2) : s.padStart(2, "0");
};
const normalizeWoredas = (list) => (list || []).map((w) =>
  typeof w === "string" ? { code: "", name: w } : { code: w.code || "", name: w.name || "" });

function toast(msg, type = "success") {
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast toast--" + type;
  const icon = type === "error" ? ICONS.alert : ICONS.check;
  el.innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 4200);
  setTimeout(() => el.remove(), 4600);
}

/* ============================================================
   EMPLOYEE ID  RR-CCWWOO-NNNN
   ============================================================ */
const buildEmpId = (r, c, w, o, seq) =>
  `${twoDigits(r)}-${twoDigits(c)}${twoDigits(w)}${twoDigits(o)}${String(seq).padStart(4,"0")}`;

async function generateEmployeeId({ regionCode, clusterCode, woredaCode, officeCode }) {
  const RR = twoDigits(regionCode), CC = twoDigits(clusterCode);
  const WW = twoDigits(woredaCode), OO = twoDigits(officeCode);
  const key = `${RR}-${CC}${WW}${OO}`;
  const ref = doc(db, "counters", "employeeIds");
  const next = await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const data = snap.exists() ? snap.data() : {};
    const cur = Number(data[key] || 0);
    const v = cur + 1;
    tx.set(ref, { [key]: v }, { merge: true });
    return v;
  });
  return buildEmpId(RR, CC, WW, OO, next);
}
const nextSequence = (officeId) =>
  employees.filter(e => e.officeId === officeId)
    .reduce((m, e) => Math.max(m, Number(e.seq) || 0), 0) + 1;

/* ============================================================
   PERMISSIONS
   ============================================================ */
const isSuper = () => S?.role === "super_admin";
const isClusterAdmin = () => S?.role === "admin";
const myClusterId = () => S?.clusterId || null;

const visibleClusters = () => isSuper() ? clusters :
  (isClusterAdmin() ? clusters.filter(c => c.id === myClusterId()) : []);
const visibleOffices = () => {
  if (isSuper()) return offices;
  const ids = new Set(visibleClusters().map(c => c.id));
  return offices.filter(o => ids.has(o.clusterId));
};
const visibleEmployees = () => {
  if (isSuper()) return employees;
  const ids = new Set(visibleClusters().map(c => c.id));
  return employees.filter(e => ids.has(e.clusterId));
};
const canCreateRegion  = () => isSuper();
const canCreateCluster = () => isSuper();
const canCreateOffice  = () => isSuper() || isClusterAdmin();
const canManageWoredas = (cluster) => isSuper() || (isClusterAdmin() && cluster.id === myClusterId());
const canManageAdmins  = (cluster) => isSuper() && !!cluster;

/* Users management on a cluster */
function canManageClusterUsers(cluster) {
  if (!cluster) return false;
  if (isSuper()) return true;
  if (isClusterAdmin() && cluster.id === myClusterId()) return true;
  return false;
}
function canEditClusterUser(user, cluster) {
  if (!user || !cluster) return false;
  if (user.role === "super_admin") return false;
  if (user.id === S.uid && !isSuper()) return false; // don't allow self-edit except super
  if (isSuper()) return true;
  if (isClusterAdmin() && cluster.id === myClusterId()) {
    // Cluster admins manage employees & managers in their own cluster
    return user.role === "employee" || user.role === "manager" || !user.role;
  }
  return false;
}
function canDeleteClusterUser(user, cluster) {
  if (!user || !cluster) return false;
  if (user.role === "super_admin") return false;
  if (user.id === S.uid) return false;
  if (isSuper()) return true;
  if (isClusterAdmin() && cluster.id === myClusterId()) {
    return user.role === "employee" || user.role === "manager" || !user.role;
  }
  return false;
}

function renderRegions() {
  const host = document.getElementById("regions-grid");
  const cl = visibleClusters();

  const byRegion = {};
  for (const c of cl) {
    if (!byRegion[c.regionCode]) byRegion[c.regionCode] = [];
    byRegion[c.regionCode].push(c);
  }

  const regionCodes = isSuper()
    ? allRegions().map(r => r.code)
    : Array.from(new Set(cl.map(c => c.regionCode)));

  if (!regionCodes.length) {
    host.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">${ICONS.pin}</svg>
        <h3>No regions yet</h3>
        <p>${isSuper()
          ? "Create your first region to get started."
          : "You are not assigned to any region yet."}</p>
        ${isSuper() ? `<button class="btn btn--primary" id="empty-add-region">
          <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Create first region
        </button>` : ""}
      </div>`;
    document.getElementById("empty-add-region")?.addEventListener("click", () => openRegionModal());
    return;
  }

  host.innerHTML = regionCodes.map(code => renderRegionCard(code, byRegion[code] || [])).join("");

  host.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", () => {
      const { action, cid, wid, uid } = el.dataset;
      if (action === "delete-region")      deleteRegion(el.dataset.region);
      if (action === "add-cluster")        openClusterModal(null, el.dataset.region);
      if (action === "edit-cluster")       openClusterModal(cid);
      if (action === "delete-cluster")     confirmDeleteCluster(cid);
      if (action === "manage-woredas")     openWoredaModal(cid);
      if (action === "remove-woreda")      removeWoredaFromCluster(cid, wid);
      if (action === "manage-offices")     openOfficesModal(cid, wid);
      if (action === "manage-admins")      openClusterAdminsModal(cid);
      if (action === "remove-admin")       confirmRemoveAdmin(uid, cid);
      if (action === "manage-users")       openClusterUsersModal(cid);
    });
  });
}

let escHandler = null;
function openModal(html, { size = "" } = {}) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = `<div class="modal ${size ? "modal--" + size : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bd);
  bd.addEventListener("click", (e) => { if (e.target === bd) closeModal(); });
  bd.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  escHandler = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

/* ============================================================
   WIZARD
   ============================================================ */
function openWizard({ title, subtitle, finishLabel, steps, initial = {}, onFinish, successMessage, size = "lg" }) {
  const data = { ...initial };
  let idx = 0, busy = false;

  const root = document.createElement("div");
  root.className = "modal-backdrop";
  root.id = "modal-backdrop";
  document.body.appendChild(root);
  escHandler = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escHandler);
  root.addEventListener("click", (e) => { if (e.target === root) closeModal(); });

  function collect() {
    root.querySelectorAll("[data-field]").forEach(el => {
      const k = el.dataset.field;
      if (el.type === "checkbox") data[k] = el.checked;
      else data[k] = el.value;
    });
  }
  function showErr(msg) {
    const el = root.querySelector("#wizErr");
    if (!el) return;
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.textContent = msg; el.style.display = "flex";
  }

  function draw() {
    const step = steps[idx];
    root.innerHTML = `
      <div class="modal modal--${size}">
        <div class="modal__head">
          <div>
            <div class="modal__title">${escapeHtml(title)}</div>
            ${subtitle ? `<div class="modal__sub">${escapeHtml(subtitle)}</div>` : ""}
          </div>
          <button class="modal__close" data-close aria-label="Close">
            <svg viewBox="0 0 24 24">${ICONS.x}</svg>
          </button>
        </div>

        <div class="steps">
          ${steps.map((s, i) => `
            <div class="step ${i < idx ? "is-done" : ""} ${i === idx ? "is-active" : ""}">
              <span class="step__num">${i < idx ? "✓" : i + 1}</span>
              <span class="step__label">${escapeHtml(s.label)}</span>
            </div>
            ${i < steps.length - 1 ? `<div class="step__line"></div>` : ""}
          `).join("")}
        </div>

        <div class="modal__body">
          <div class="step-header">
            <span class="step-header__badge">${idx + 1}</span>
            ${escapeHtml(step.title || step.label)}
          </div>
          ${step.render(data)}
          <div class="alert alert--error" id="wizErr" style="display:none;margin-top:14px;margin-bottom:0"></div>
        </div>

        <div class="modal__foot">
          <button class="btn" data-close>Cancel</button>
          <div class="spacer"></div>
          <button class="btn" data-wiz="prev" ${idx === 0 ? "disabled" : ""}>← Back</button>
          <button class="btn btn--primary" data-wiz="next">
            <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
            <span class="btn-label">${idx === steps.length - 1 ? escapeHtml(finishLabel || "Save") : "Next →"}</span>
          </button>
        </div>
      </div>`;

    root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    root.querySelectorAll("[data-field]").forEach(el => {
      const v = data[el.dataset.field];
      if (v === undefined || v === null) return;
      if (el.type === "checkbox") el.checked = !!v;
      else el.value = v;
    });
    root.querySelector('[data-wiz="prev"]').addEventListener("click", () => {
      if (idx > 0) { collect(); idx--; draw(); }
    });
    root.querySelector('[data-wiz="next"]').addEventListener("click", async () => {
      const step = steps[idx];
      collect();
      const err = step.validate ? step.validate(data) : null;
      if (err) { showErr(err); return; }

      if (idx === steps.length - 1) {
        if (busy) return;
        busy = true;
        const btn = root.querySelector('[data-wiz="next"]');
        const sp = btn.querySelector(".spinner");
        const lbl = btn.querySelector(".btn-label");
        btn.disabled = true; sp.classList.remove("hidden"); lbl.textContent = "Saving…";
        try {
          await onFinish(data);
          closeModal();
          toast(successMessage || "Saved successfully", "success");
        } catch (e) {
          console.error(e);
          busy = false;
          btn.disabled = false; sp.classList.add("hidden");
          lbl.textContent = finishLabel || "Save";
          showErr(e?.message || "Something went wrong.");
        }
      } else {
        idx++; draw();
      }
    });

    if (typeof step.after === "function") step.after(root, data, () => { collect(); draw(); });
  }
  draw();
}

function openRegionModal() {

          <div class="field">

                   placeholder="16" inputmode="numeric"
                   style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
            <p class="field__hint">Becomes the first two digits of every employee ID in this region.</p>
          </div>
          <div class="field">
            <label class="field__required">Region name (English)</label>
            <input data-field="en" value="${escapeHtml(d.en || "")}" placeholder="e.g. New Region">
          </div>
          <div class="field">
            <label>Region name (Amharic)</label>
            <input data-field="am" value="${escapeHtml(d.am || "")}" placeholder="e.g. አዲስ ክልል"

          </div>
          <div class="review" style="margin-top:16px">
            <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(d.en || "—")} (${escapeHtml(d.code || "??")})</span></div>
            <div class="review__row"><span class="review__k">ID prefix</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d.code || "??")}-······</span></div>
          </div>`,
        validate: (d) => {
          if (!/^\d{2}$/.test(d.code || "")) return "Region code must be exactly 2 digits.";
          if (!d.en || d.en.trim().length < 2) return "Region name (English) is required.";
          const dup = allRegions().some(r => r.code === d.code);
          if (dup) return `Region code ${d.code} already exists.`;
          return null;
        }
      }
    ],
    onFinish: async (d) => {
      await setDoc(doc(db, "regions", d.code), {
        code: d.code,
        en: d.en.trim(),
        am: d.am?.trim() || "",
        createdAt: serverTimestamp(),
        createdBy: S.uid
      });
    }
  });
}

async function deleteRegion(regionCode) {
  if (!isSuper()) { toast("Only super admins can delete regions", "error"); return; }
  const r = allRegions().find(x => x.code === regionCode);
  if (!r) return;
  if (r.builtin) { toast("Built-in regions cannot be deleted.", "error"); return; }
  const clusterCount = (clustersByRegion[regionCode] || []).length;
  if (clusterCount) {
    toast(`Cannot delete — ${clusterCount} cluster(s) still belong to this region.`, "error");
    return;
  }
  if (!confirm(`Delete region "${r.en}" (${r.code})? This cannot be undone.`)) return;
  try {
    await deleteDoc(doc(db, "regions", regionCode));
    toast("Region deleted", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

/* ============================================================

function openClusterModal(clusterId = null, preRegion = null) {
  const editing = !!clusterId;

  openWizard({
    title: editing ? "Edit Cluster" : "Create Cluster",
    subtitle: editing ? "Update cluster information" : "Pick a region first, then give the cluster a name and 2-digit code.",
    finishLabel: editing ? "Save Changes" : "Create Cluster",
    successMessage: editing ? "Cluster updated" : "Cluster created",
    initial: {
      regionCode: c.regionCode || preRegion || "",
      name: c.name || "",
      code: c.code || ""
    },
    steps: [
      {
        label: "Region",
        title: "Select the region",
        render: (d) => `
          <div class="field">
            <label class="field__required">Region</label>
            <select data-field="regionCode">
              <option value="">— Choose a region —</option>
              ${allRegions().map(r => `
                <option value="${r.code}" ${d.regionCode === r.code ? "selected" : ""}>
                  ${r.code} · ${escapeHtml(r.en)}${r.builtin ? "" : " (custom)"}
                </option>`).join("")}
            </select>
            <p class="field__hint">The region code becomes the first two digits of every employee ID.</p>
          </div>`,
        validate: d => d.regionCode ? null : "Please select a region."
      },
      {
        label: "Details",
        title: "Cluster details",
        render: (d) => `
          <div class="field">
            <label class="field__required">Cluster name</label>
            <input data-field="name" value="${escapeHtml(d.name || "")}" placeholder="e.g. North Shewa Cluster">
          </div>
          <div class="field">
            <label class="field__required">Cluster code (2 digits)</label>
            <input data-field="code" maxlength="2" value="${escapeHtml(d.code || "")}"
                   placeholder="06" inputmode="numeric"
                   style="font-family:ui-monospace,monospace;letter-spacing:3px;font-weight:700">
            <p class="field__hint">Must be unique inside ${escapeHtml(regionName(d.regionCode))}.</p>
          </div>
          <div class="review" style="margin-top:16px">
            <div class="review__row"><span class="review__k">Region</span><span class="review__v">${escapeHtml(regionLabel(d.regionCode))}</span></div>
            <div class="review__row"><span class="review__k">ID prefix</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(d.regionCode || "??")}-${escapeHtml(d.code || "??")}······</span></div>
          </div>`,
        validate: d => {
          if (!d.name || d.name.trim().length < 2) return "Cluster name must be at least 2 characters.";
          if (!/^\d{2}$/.test(d.code || "")) return "Cluster code must be exactly 2 digits.";
          const dup = clusters.some(x =>
            x.regionCode === d.regionCode && x.code === d.code && x.id !== clusterId);
          if (dup) return `Cluster code ${d.code} already exists in ${regionName(d.regionCode)}.`;
          return null;
        }
      }
    ],
    onFinish: async (d) => {
      const payload = {
        name: d.name.trim(),
        code: d.code,
        regionCode: d.regionCode,
        regionName: regionName(d.regionCode),
        updatedAt: serverTimestamp()
      };
      if (editing) {
        await updateDoc(doc(db, "clusters", clusterId), payload);
      } else {
        payload.woredas = [];
        payload.createdAt = serverTimestamp();
        payload.createdBy = S.uid;
        const ref = doc(collection(db, "clusters"));
        await setDoc(ref, { ...payload, clusterId: ref.id });
      }
    }
  });
}

async function confirmDeleteCluster(clusterId) {
  if (!isSuper()) { toast("Only super admins can delete clusters", "error"); return; }
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  const officeCount = (officesByCluster[clusterId] || []).length;
  if (officeCount) {
    toast(`Cannot delete — ${officeCount} office(s) still belong to this cluster.`, "error");
    return;
  }
  const adminCount = (adminsByCluster[clusterId] || []).length;
  if (adminCount) {
    toast(`Cannot delete — ${adminCount} admin(s) still assigned to this cluster. Remove them first.`, "error");
    return;
  }
  if (!confirm(`Delete cluster "${c.name}" (${c.code})?`)) return;
  try {
    await deleteDoc(doc(db, "clusters", clusterId));
    toast("Cluster deleted", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

  document.getElementById("nb-submit").addEventListener("click", async () => {
    const errBox = document.getElementById("nb-error");
    const errMsg = document.getElementById("nb-error-msg");
    const btn = document.getElementById("nb-submit");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");

    errBox.style.display = "none";

    const name  = document.getElementById("nb-name").value.trim();
    const email = document.getElementById("nb-email").value.trim();
    const pw    = document.getElementById("nb-pw").value;

    if (name.length < 2)   { errBox.style.display = "flex"; errMsg.textContent = "Name is required."; return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { errBox.style.display = "flex"; errMsg.textContent = "Enter a valid email."; return; }
    if (!pw || pw.length < 6) { errBox.style.display = "flex"; errMsg.textContent = "Password must be 6+ characters."; return; }

    btn.disabled = true;
    spinner.classList.remove("hidden");
    const oldLabel = label.textContent;
    label.textContent = "Creating…";

    let uid = null;
    try {
      const secName = "adminCreator_" + Date.now();
      const secApp = initializeApp(firebaseConfig, secName);
      const secAuth = getAuth(secApp);
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, email, pw);
        uid = cred.user.uid;
        try { await updateProfile(cred.user, { displayName: name }); } catch (e) {}
        await signOut(secAuth);
      } finally {
        try { await deleteApp(secApp); } catch (e) {}
      }

      await setDoc(doc(db, "users", uid), {
        uid,
        name,
        email,
        role: "admin",
        clusterId: c.id,
        clusterName: c.name || null,
        regionCode: c.regionCode || null,
        regionName: c.regionName || regionName(c.regionCode),
        active: true,
        createdAt: serverTimestamp(),
        createdBy: S.uid
      });

      toast(`Admin "${name}" created — they can now sign in.`, "success");
      closeModal();
      setTimeout(() => openClusterAdminsModal(c.id), 120);
    } catch (err) {
      console.error("[new admin]", err);
      if (uid) { try { await deleteDoc(doc(db, "users", uid)); } catch (e) {} }
      errBox.style.display = "flex";
      errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || "")}`;
      btn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = oldLabel;
    }
  });
}

async function confirmRemoveAdmin(uid, clusterId) {
  if (!isSuper()) { toast("Only super admins can remove cluster admins", "error"); return; }
  const u = users.find(x => x.id === uid);
  if (!u) return;
  const c = clusters.find(x => x.id === clusterId);
  const label = u.name || u.email || uid;
  if (!confirm(`Remove "${label}" as admin of cluster "${c?.name || ""}"?\n\nTheir login account stays in Firebase Auth, but they will lose cluster access immediately.`)) return;
  try {
    await deleteDoc(doc(db, "users", uid));
    toast("Admin removed", "success");
    const modalOpen = document.getElementById("modal-backdrop");
    if (modalOpen) { closeModal(); setTimeout(() => openClusterAdminsModal(clusterId), 80); }
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}

/* ============================================================
   CLUSTER USERS — cluster admin & super admin manage users
   ============================================================ */
function openClusterUsersModal(clusterId) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!canManageClusterUsers(c)) {
    toast("You cannot manage users in this cluster", "error");
    return;
  }

  const clusterUsers = users
    .filter(u => u.clusterId === c.id && u.role !== "super_admin")
    .sort((a, b) => {
      const order = { admin: 0, manager: 1, employee: 2 };
      const ra = order[a.role] ?? 9;
      const rb = order[b.role] ?? 9;
      if (ra !== rb) return ra - rb;
      return String(a.name || a.email || "").localeCompare(String(b.name || b.email || ""));
    });

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Users in ${escapeHtml(c.name)}</div>
        <div class="modal__sub">
          Manage accounts under this cluster — add, edit, or remove.
        </div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div style="flex:1">
          <div style="font-weight:800;margin-bottom:4px">Who is in this list?</div>
          <div>Every login account bound to this cluster: admins, managers and employees.
          ${isClusterAdmin()
            ? "As cluster admin you can <strong>add</strong> new employees, and <strong>edit/delete</strong> employees &amp; managers in this cluster."
            : "As super admin you can manage every account in this cluster."}</div>
        </div>
      </div>

      <div class="field">
        <label>Search</label>
        <input id="cu-search" placeholder="Search by name, email, ID, phone…">
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px">
        <strong style="font-size:13px">Users (${clusterUsers.length})</strong>
        <span id="cu-count" style="font-size:12px;color:var(--muted)"></span>
      </div>

      <div class="wm-list" id="cu-list" style="max-height:420px"></div>
    </div>

    <div class="modal__foot">
      <button class="btn btn--primary" id="cu-add-btn">
        <svg viewBox="0 0 24 24">${ICONS.userPlus}</svg> Add Employee
      </button>
      <div class="spacer"></div>
      <button class="btn" data-close>Done</button>
    </div>
  `, { size: "lg" });

  const listEl = document.getElementById("cu-list");
  const searchEl = document.getElementById("cu-search");
  const countEl = document.getElementById("cu-count");

  function renderList() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q
      ? clusterUsers.filter(u => {
          const hay = [u.name, u.email, u.empId, u.phone, u.position]
            .filter(Boolean).join(" ").toLowerCase();
          return hay.includes(q);
        })
      : clusterUsers;

    countEl.textContent = `${filtered.length} shown`;

    if (!filtered.length) {
      listEl.innerHTML = `<div class="wm-empty">${q ? "No users match your search." : "No users yet in this cluster. Click “Add Employee” to create one."}</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(u => {
      const role = u.role || "employee";
      const roleCls = role === "admin" ? "tag--admin"
                    : role === "manager" ? "tag--manager"
                    : "tag--employee";
      const canEdit = canEditClusterUser(u, c);
      const canDel  = canDeleteClusterUser(u, c);
      const isSelf  = u.id === S.uid;
      return `
        <div class="admin-item">
          <div class="admin-avatar">${escapeHtml(initials(u.name || u.email))}</div>
          <div class="admin-item__main">
            <div class="admin-item__name">
              ${escapeHtml(u.name || "—")}
              ${isSelf ? `<span class="tag tag--gray" style="margin-left:6px">You</span>` : ""}
            </div>
            <div class="admin-item__email">
              ${escapeHtml(u.email || "")}
              ${u.empId ? ` · <span style="font-family:ui-monospace,monospace;font-size:11px">${escapeHtml(u.empId)}</span>` : ""}
            </div>
          </div>
          <div class="admin-item__actions">
            <span class="tag ${roleCls}">${escapeHtml(roleLabel(role))}</span>
            <span class="tag ${u.active === false ? "tag--red" : "tag--green"}">
              ${u.active === false ? "Inactive" : "Active"}
            </span>
            ${canEdit ? `
              <button class="btn btn--sm btn--icon" data-edit="${u.id}" title="Edit">
                <svg viewBox="0 0 24 24">${ICONS.edit}</svg>
              </button>` : ""}
            ${canDel ? `
              <button class="btn btn--sm btn--icon btn--danger" data-del="${u.id}" title="Delete">
                <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
              </button>` : ""}
          </div>
        </div>`;
    }).join("");

    listEl.querySelectorAll("[data-edit]").forEach(b =>
      b.addEventListener("click", () => openEditClusterUser(b.dataset.edit, clusterId)));
    listEl.querySelectorAll("[data-del]").forEach(b =>
      b.addEventListener("click", () => confirmDeleteClusterUser(b.dataset.del, clusterId)));
  }

  searchEl.addEventListener("input", renderList);
  renderList();

  document.getElementById("cu-add-btn").addEventListener("click", () => {
    closeModal();
    setTimeout(() => openEmployeeModal(null), 120);
  });
}

function openEditClusterUser(uid, clusterId) {
  const u = users.find(x => x.id === uid);
  const c = clusters.find(x => x.id === clusterId);
  if (!u || !c) return;
  if (!canEditClusterUser(u, c)) { toast("You cannot edit this user", "error"); return; }

  const assignableRoles = isSuper()
    ? ["admin", "manager", "employee"]
    : ["manager", "employee"];

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Edit user</div>
        <div class="modal__sub">${escapeHtml(u.name || u.email || "")} · ${escapeHtml(c.name)}</div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>

    <div class="modal__body">
      <div id="eu-error" class="alert alert--error" style="display:none">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div id="eu-error-msg" style="flex:1"></div>
      </div>

      <div class="field">
        <label class="field__required">Full name</label>
        <input id="eu-name" value="${escapeHtml(u.name || "")}" autocomplete="off">
      </div>
      <div class="field">
        <label>Email</label>
        <input value="${escapeHtml(u.email || "")}" disabled>
        <p class="field__hint">Email changes must be done in Firebase Authentication.</p>
      </div>
      <div class="field-row">

          <label>Phone</label>
          <input id="eu-phone" value="${escapeHtml(u.phone || "")}">
        </div>
        <div class="field">
          <label>Position</label>
          <input id="eu-position" value="${escapeHtml(u.position || "")}">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Role</label>
          <select id="eu-role">
            ${assignableRoles.map(r =>
              `<option value="${r}" ${(u.role || "employee") === r ? "selected" : ""}>${roleLabel(r)}</option>`
            ).join("")}
          </select>
          <p class="field__hint">
            ${isSuper()
              ? "Super admins can assign Admin, Manager, or Employee."
              : "Cluster admins can assign Manager or Employee."}
          </p>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="eu-active">
            <option value="1" ${u.active !== false ? "selected" : ""}>Active</option>
            <option value="0" ${u.active === false ? "selected" : ""}>Inactive</option>
          </select>
        </div>
      </div>

      ${u.empId ? `
        <div class="review" style="margin-top:8px">
          <div class="review__row"><span class="review__k">Employee ID</span><span class="review__v" style="font-family:ui-monospace,monospace">${escapeHtml(u.empId)}</span></div>
          <div class="review__row"><span class="review__k">Cluster</span><span class="review__v">${escapeHtml(c.name)} (${escapeHtml(c.code || "??")})</span></div>
        </div>` : ""}
    </div>

    <div class="modal__foot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn--primary" id="eu-submit">
        <span class="spinner hidden" style="width:14px;height:14px;border-width:2px"></span>
        <span class="btn-label">Save changes</span>
      </button>
    </div>
  `);

  document.getElementById("eu-submit").addEventListener("click", async () => {
    const errBox = document.getElementById("eu-error");
    const errMsg = document.getElementById("eu-error-msg");
    const btn = document.getElementById("eu-submit");
    const spinner = btn.querySelector(".spinner");
    const label = btn.querySelector(".btn-label");

    errBox.style.display = "none";

    const name     = document.getElementById("eu-name").value.trim();
    const phone    = document.getElementById("eu-phone").value.trim();
    const position = document.getElementById("eu-position").value.trim();
    const role     = document.getElementById("eu-role").value;
    const active   = document.getElementById("eu-active").value === "1";

    if (name.length < 2) {
      errBox.style.display = "flex";
      errMsg.textContent = "Name must be at least 2 characters.";
      return;
    }
    if (!assignableRoles.includes(role)) {
      errBox.style.display = "flex";
      errMsg.textContent = "You cannot assign that role.";
      return;
    }

    btn.disabled = true;
    spinner.classList.remove("hidden");
    const oldLabel = label.textContent;
    label.textContent = "Saving…";

    try {
      const payload = {
        name,
        phone: phone || null,
        position: position || null,
        role,
        active,
        updatedAt: serverTimestamp(),
        updatedBy: S.uid
      };
      await updateDoc(doc(db, "users", uid), payload);

      // Best-effort sync on the linked employee record
      if (u.employeeId) {
        try {
          await updateDoc(doc(db, "employees", u.employeeId), {
            phone: phone || null,
            position: position || null,
            updatedAt: serverTimestamp()
          });

      }

      toast("User updated", "success");
      closeModal();
      setTimeout(() => openClusterUsersModal(clusterId), 120);
    } catch (err) {
      console.error("[cluster user edit]", err);
      errBox.style.display = "flex";
      errMsg.innerHTML = `<strong>${escapeHtml(err.code || "error")}</strong><br>${escapeHtml(err.message || "")}`;
      btn.disabled = false;
      spinner.classList.add("hidden");
      label.textContent = oldLabel;
    }
  });
}

async function confirmDeleteClusterUser(uid, clusterId) {
  const u = users.find(x => x.id === uid);
  const c = clusters.find(x => x.id === clusterId);
  if (!u || !c) return;
  if (!canDeleteClusterUser(u, c)) { toast("You cannot delete this user", "error"); return; }

  const label = u.name || u.email || "this user";

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Delete user?</div>

    <div class="modal__body">
      <div class="alert alert--error" style="margin-bottom:0">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div>
          <div style="font-weight:700;margin-bottom:6px">You are about to delete:</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">${escapeHtml(label)}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${escapeHtml(u.email || "")}</div>
          <div style="margin-top:12px;font-size:12.5px">

      <button class="btn btn--danger" id="cu-del-submit">

        <span class="btn-label">Delete user</span>

  document.getElementById("cu-del-submit").addEventListener("click", async () => {

    const spinner = btn.querySelector(".spinner");
    const label2 = btn.querySelector(".btn-label");

    btn.disabled = true;
    spinner.classList.remove("hidden");
    const oldLabel = label2.textContent;
    label2.textContent = "Deleting…";

    try {
      // Unlink from employee
      if (u.employeeId) {
        try {
          await updateDoc(doc(db, "employees", u.employeeId), {
            uid: null,
            updatedAt: serverTimestamp()
          });
        } catch (e) { /* non-fatal */ }
      }
      await deleteDoc(doc(db, "users", uid));

      toast("User removed", "success");

      console.error("[cluster user delete]", err);

      spinner.classList.add("hidden");
      label2.textContent = oldLabel;

/* ============================================================
   WOREDA MANAGER
   ============================================================ */
function openWoredaModal(clusterId) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c) return;
  if (!canManageWoredas(c)) {
    toast("Only this cluster's administrator can manage woredas.", "error");
    return;
  }

  const woredas = normalizeWoredas(c.woredas);

  openModal(`
    <div class="modal__head">
      <div>
        <div class="modal__title">Woredas / Cities</div>
        <div class="modal__sub">
          ${escapeHtml(c.name)} · cluster code
          <code style="font-family:ui-monospace,monospace;background:var(--border-soft);padding:2px 6px;border-radius:4px">${escapeHtml(c.code || "??")}</code>
          · region ${escapeHtml(c.regionCode || "??")}
        </div>
      </div>
      <button class="modal__close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24">${ICONS.x}</svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="alert alert--info">
        <svg viewBox="0 0 24 24">${ICONS.alert}</svg>
        <div style="flex:1">
          <div style="font-weight:800;margin-bottom:6px">How woreda codes work</div>
          <div>Each woreda/city needs a <strong>2-digit code</strong>. It becomes the 3rd and 4th digits of every employee ID created for an office inside it.</div>
          <div style="margin-top:12px;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid #bdd7f2;
                      font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;
                      color:#0b5cab;letter-spacing:3px;text-align:center">
            ${escapeHtml(c.regionCode || "04")}-${escapeHtml(c.code || "06")}<u style="color:#d4a017;text-decoration-thickness:3px">12</u>08-0001
          </div>
          <div style="margin-top:8px;font-size:12px;color:#5c6b85;text-align:center">
            region · cluster · <strong style="color:#b8860b">woreda</strong> · office · sequence
          </div>
        </div>
      </div>

      <div class="wm-add">
        <input class="wm-add__code" id="wm-code" maxlength="2" placeholder="12" inputmode="numeric">
        <input class="wm-add__name" id="wm-name" placeholder="Woreda / city name">
        <button class="btn btn--primary" id="wm-add-btn">
          <svg viewBox="0 0 24 24">${ICONS.plus}</svg> Add
        </button>
      </div>

      <div class="wm-list" id="wm-list"></div>
    </div>

    <div class="modal__foot">
      <div class="spacer"></div>
      <button class="btn" data-close>Done</button>
    </div>
  `, { size: "lg" });

  const listEl = document.getElementById("wm-list");
  const codeEl = document.getElementById("wm-code");
  const nameEl = document.getElementById("wm-name");

  function drawList() {
    if (!woredas.length) {
      listEl.innerHTML = `<div class="wm-empty">No woredas yet for this cluster.</div>`;
      return;
    }
    listEl.innerHTML = woredas
      .slice().sort((a, b) => String(a.code).localeCompare(String(b.code)))
      .map(w => `
        <div class="wm-item">
          <span class="wm-item__code">${escapeHtml(w.code)}</span>
          <span class="wm-item__name">${escapeHtml(w.name)}</span>
          <button class="btn btn--sm btn--danger" data-wid="${escapeHtml(w.code)}">
            <svg viewBox="0 0 24 24">${ICONS.trash}</svg>
          </button>
        </div>`).join("");
    listEl.querySelectorAll("[data-wid]").forEach(btn => {
      btn.addEventListener("click", () => removeLocal(btn.dataset.wid));
    });
  }

  async function persist() {
    await updateDoc(doc(db, "clusters", c.id), {
      woredas, updatedAt: serverTimestamp(), updatedBy: S.uid
    });
  }

  async function addLocal() {
    const code = codeEl.value.replace(/\D/g, "").slice(0, 2);
    const name = nameEl.value.trim();
    if (!/^\d{2}$/.test(code)) { toast("Woreda code must be exactly 2 digits", "error"); codeEl.focus(); return; }
    if (name.length < 2)       { toast("Woreda name is required", "error"); nameEl.focus(); return; }
    if (woredas.some(w => w.code === code)) { toast(`Woreda code ${code} already exists`, "error"); codeEl.focus(); return; }
    woredas.push({ code, name });
    try {
      await persist();
      toast(`Woreda "${name}" added`, "success");
      codeEl.value = ""; nameEl.value = ""; codeEl.focus();
      drawList();
    } catch (err) {
      woredas.pop();
      toast(err.code + ": " + err.message, "error");
    }
  }

  async function removeLocal(code) {
    const idx = woredas.findIndex(w => w.code === code);
    if (idx < 0) return;
    const officeInWoreda = (officesByWoreda[`${c.id}:${code}`] || []).length;
    if (officeInWoreda) { toast(`Cannot remove — ${officeInWoreda} office(s) still use woreda ${code}.`, "error"); return; }
    if (!confirm(`Remove woreda "${woredas[idx].name}" (${code})?`)) return;
    const removed = woredas.splice(idx, 1)[0];
    try {
      await persist();
      toast("Woreda removed", "success");
      drawList();
    } catch (err) {
      woredas.splice(idx, 0, removed);
      toast(err.code + ": " + err.message, "error");
    }
  }

  document.getElementById("wm-add-btn").addEventListener("click", addLocal);
  nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") addLocal(); });
  codeEl.addEventListener("keydown", (e) => { if (e.key === "Enter") nameEl.focus(); });
  drawList();
}

async function removeWoredaFromCluster(clusterId, code) {
  const c = clusters.find(x => x.id === clusterId);
  if (!c || !canManageWoredas(c)) { toast("Not allowed", "error"); return; }
  const list = normalizeWoredas(c.woredas);
  const idx = list.findIndex(w => w.code === code);
  if (idx < 0) return;
  const officeInWoreda = (officesByWoreda[`${clusterId}:${code}`] || []).length;
  if (officeInWoreda) { toast(`Cannot remove — ${officeInWoreda} office(s) still use woreda ${code}.`, "error"); return; }
  if (!confirm(`Remove woreda "${list[idx].name}" (${code})?`)) return;
  list.splice(idx, 1);
  try {
    await updateDoc(doc(db, "clusters", clusterId), { woredas: list, updatedAt: serverTimestamp() });
    toast("Woreda removed", "success");
  } catch (err) { toast(err.code + ": " + err.message, "error"); }
}
